schema_version: "core.immune.antibody-spec.v1"
antibody_id: "ab_target_fitting_constant_compensation"
canonical_name: "Anti-Target-Fitting Constant Compensation"
failure_class: "target_fitting_constant_compensation"
target_pattern: "(\\bunpinned_additive_residual\\b|\\bcomposite_sum_interval_only\\b|\\bcompensating_two_loop_offset\\b)"
constraint_type: "Restrain"
operatorizability: "repairable"
action: "refuse"
severity: "P0"
pharmacy_status: "candidate"
authority_effect: "None"
description: >
  Inert review candidate for multi-term physical or mathematical derivations that check only
  whether a composite sum falls inside a target interval while leaving an additive or
  multiplicative sub-term unpinned, allowing a downstream residual constant to compensate an
  upstream input error (for example, substituting the single-state Bethe logarithm
  ln k_0(2S) = 2.984128 in place of the 2S - 2P difference 2.8417865 and shifting a two-loop
  residual from +1.654 MHz to +3.66 MHz so the sum still lands in [1057.70, 1057.95] MHz).
  Candidate remains inert until admitted.

governing_invariants:
  - ".agents/rules/math/rl_exact_verification_and_witness_integrity_invariants.md"
  - ".agents/rules/architecture/rl_immune_antibody_and_verification_hygiene.md"

adversarial_mutation_fixture: |
  # Hostile specimen: composite sum passes interval check via compensating unpinned_additive_residual
  from fractions import Fraction

  def evaluate_lamb_shift_composite_only() -> bool:
      # Wrong single-state ln k_0(2S) input compensated by inflated two-loop offset
      ln_k0_input = Fraction(2984128, 1000000)
      unpinned_additive_residual = Fraction(366, 100)
      total_mhz = Fraction(105414, 100) + unpinned_additive_residual
      return Fraction(105770, 100) <= total_mhz <= Fraction(105795, 100)

repaired_invariant_fixture: |
  # Repaired invariant: every sub-channel is independently pinned before additive composition
  from fractions import Fraction
  from dataclasses import dataclass

  @dataclass(frozen=True)
  class PinnedSubchannelBudget:
      ln_k0_2s: Fraction
      ln_k0_2p: Fraction
      ln_k0_2s_minus_2p: Fraction
      two_loop_and_recoil_mhz: Fraction
      free_parameter_count: int = 0

  def verify_pinned_lamb_shift_subchannels() -> PinnedSubchannelBudget:
      ln_2s = Fraction(29841285, 10000000)
      ln_2p = Fraction(-1423420, 10000000)
      diff = ln_2s + ln_2p
      assert diff == Fraction(28417865, 10000000)
      return PinnedSubchannelBudget(
          ln_k0_2s=ln_2s,
          ln_k0_2p=ln_2p,
          ln_k0_2s_minus_2p=diff,
          two_loop_and_recoil_mhz=Fraction(1654, 1000),
          free_parameter_count=0,
      )

benign_control_fixture: |
  # Benign control: exact rational sub-channels verified individually against independent pins
  from fractions import Fraction

  def verify_subchannel_pins() -> bool:
      c_se_vp = Fraction(19, 30)
      c_mag = Fraction(1, 8)
      return c_se_vp + c_mag == Fraction(91, 120)

implementation_binding: "engine/crates_rs/core_quantum_physics/src/atomic_dirac_lamb_hartree_fock.rs"
native_test_binding: "engine/crates_rs/core_quantum_physics/src/atomic_dirac_lamb_hartree_fock.rs"
harmful_control_tests:
  - "qm224_dirac_coulomb_fine_structure_and_lamb_shift_hold_over_q"
benign_control_tests:
  - "qm225_helium_variational_hylleraas_and_exchange_hold_over_q"
qualification_limit: >
  Candidate scope covers unpinned additive or multiplicative residual compensation in multi-term
  interval evaluations. Candidate remains inert until human admission.

detection_mechanisms:
  regex_triggers:
    - "(\\bunpinned_additive_residual\\b|\\bcomposite_sum_interval_only\\b|\\bcompensating_two_loop_offset\\b)"
