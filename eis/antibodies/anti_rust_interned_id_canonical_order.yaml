description: Inert review candidate for the witnessed AutoP name-tape path that sorted newly interned
  IDs instead of semantic names. The signature is Signal1 for this captured family only; native
  history and neighbor-order regressions provide Signal2. Internal ID lookup/sorting need not
  be defective. No admission or activation follows.
adversarial_mutation_fixture: 'let mut sorted_res: Vec<(SymbolId, String)> = names.iter().map(|name|
  (symbols.intern(name), name.clone())).collect();

  sorted_res.sort_by_key(|(sym, _)| *sym);

  emit_named_tape(sorted_res);'
repaired_invariant_fixture: 'let mut manifold_names: Vec<&String> = complex.manifolds.iter().collect();

  manifold_names.sort();

  let sorted_res = intern_semantic_names(manifold_names);

  emit_named_tape(sorted_res);'
benign_control_fixture: 'internal_ids.sort();

  lookup_interned_nodes(internal_ids);

  let mut names = graph.names();

  names.sort();

  emit_named_tape(names);'
