schema_version: "omega.immune.antibody-spec.v1"
antibody_id: "ab_cross_task_evidence_borrowing"
canonical_name: "Cross-Task Evidence Borrowing"
failure_class: "authority:cross_task_evidence_borrowing"
target_pattern: "receipt\\.task_id\\s*!=\\s*current_task_id|evidence\\s*=\\s*antecedent_receipt"
constraint_type: "Restrain"
operatorizability: "repairable"
action: "repair"
severity: "P0"
pharmacy_status: "candidate"
authority_effect: "None"
description: >
  Refuses task completions and verification receipts that attempt to inherit or borrow
  test digests, pass markers, or receipts from prior or foreign tasks without executing
  the local test suite freshly against current candidate bytes.

governing_invariants:
  - ".agents/rules/engineering/rl_fail_closed_epistemic_oracle_verification.md"
  - ".agents/patterns/anti/python/AP_PY_012_cross_task_evidence_borrowing.md"

adversarial_mutation_fixture: |
  def record_task_outcome(current_task_id, candidate_hash, antecedent_receipt=None):
      if antecedent_receipt and antecedent_receipt.status == "PASS_TO_MASTER":
          return VerificationReceipt(task_id=current_task_id, evidence=antecedent_receipt.evidence, status="ACCEPTED")
      return execute_local_tests(current_task_id, candidate_hash)

repaired_invariant_fixture: |
  def record_task_outcome(current_task_id, candidate_hash, antecedent_receipt=None):
      return execute_local_tests(current_task_id, candidate_hash)

detection_mechanisms:
  regex_triggers:
    - "receipt\\.task_id\\s*!=\\s*current_task_id|evidence\\s*=\\s*antecedent_receipt"
