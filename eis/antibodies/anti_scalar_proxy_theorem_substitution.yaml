schema_version: "omega.immune.antibody-spec.v1"
antibody_id: "ab_scalar_proxy_theorem_substitution"
canonical_name: "Anti-Scalar-Proxy Theorem Substitution"
failure_class: "scalar_proxy_theorem_substitution"
target_pattern: "(\\bthree_ray_positivity_proxy\\b|\\bparameter_count_equality_proxy\\b|\\bsingle_nc_point_sample\\b|\\bone_skeleton_euler_proxy\\b)"
constraint_type: "Restrain"
operatorizability: "repairable"
action: "refuse"
severity: "P0"
pharmacy_status: "candidate"
authority_effect: "None"
description: >
  Inert review candidate for formal or computational derivations where a theorem or control is
  named after a structural cone, group, polynomial family, or 2-complex property while its
  predicate evaluates only a weak scalar proxy (such as equality of parameter counts 2^2 + 2^2 = 8,
  positivity on three fixed rays without PSD cone boundary witnesses, single-point evaluation at
  N_c = 3 instead of general N_c polynomial factorization, or 1-skeleton Betti count E - V + 1
  without commuting square 2-cells). Candidate remains inert until admitted.

governing_invariants:
  - ".agents/rules/claims/rl_claim_disciplined_compaction.md"
  - ".agents/rules/math/rl_exact_verification_and_witness_integrity_invariants.md"
  - ".agents/rules/architecture/rl_immune_antibody_and_verification_hygiene.md"

adversarial_mutation_fixture: |
  # Hostile specimen: checks positivity on 3 fixed rays while claiming full PSD Born cone admission
  from fractions import Fraction

  def check_psd_born_cone(matrix_trace: Fraction, ray_0: Fraction, ray_1: Fraction, ray_2: Fraction) -> bool:
      # three_ray_positivity_proxy: ignores fourth ray (2, 1, 0, 0) where quadratic form is -1/2 < 0
      return matrix_trace == Fraction(1, 1) and ray_0 >= 0 and ray_1 >= 0 and ray_2 >= 0

repaired_invariant_fixture: |
  # Repaired invariant: separates 3-ray proxy predicate from PSD cone membership with explicit 4th-ray falsifier
  from fractions import Fraction
  from dataclasses import dataclass

  @dataclass(frozen=True)
  class ConeSeparationWitness:
      three_ray_proxy_passes: bool
      fourth_ray_quadratic_value: Fraction
      is_psd_on_all_rays: bool

  def verify_three_ray_vs_psd_gap() -> ConeSeparationWitness:
      fourth_ray_val = Fraction(-1, 2)
      return ConeSeparationWitness(
          three_ray_proxy_passes=True,
          fourth_ray_quadratic_value=fourth_ray_val,
          is_psd_on_all_rays=(fourth_ray_val >= 0),
      )

benign_control_fixture: |
  # Benign control: explicitly scoped 5-predicate diagnostic matrix accompanied by boundary witness
  from fractions import Fraction

  def evaluate_scoped_predicate_and_boundary_witness() -> tuple[bool, Fraction]:
      diag_ok = True
      fourth_ray_witness = Fraction(-1, 2)
      return (diag_ok, fourth_ray_witness)

implementation_binding: "omega_engine/crates_rs/omega_quantum_physics/src/quantum_import_finite_maps/foundational_derivation_closure.rs"
native_test_binding: "omega_engine/crates_rs/omega_quantum_physics/src/quantum_import_finite_maps/foundational_derivation_closure.rs"
harmful_control_tests:
  - "test_qm219_foundational_derivation_closure_control"
benign_control_tests:
  - "test_qm219_foundational_derivation_closure_control"
qualification_limit: >
  Candidate scope covers scalar-proxy substitution in cone, group, polynomial, and 2-complex
  theorem bindings. Candidate remains inert until human admission.

detection_mechanisms:
  regex_triggers:
    - "(\\bthree_ray_positivity_proxy\\b|\\bparameter_count_equality_proxy\\b|\\bsingle_nc_point_sample\\b|\\bone_skeleton_euler_proxy\\b)"
