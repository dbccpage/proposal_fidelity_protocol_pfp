schema_version: "core.immune.antibody-spec.v1"
antibody_id: "anti-floating-point-tolerance-leak"
canonical_name: "Anti-Floating-Point Tolerance Leak"
failure_class: "numerical:float_tolerance_leak"
target_pattern: "(\\bfloat\\b|\\bf64\\b|abs\\([^)]+\\)\\s*<\\s*1e-\\d+|\\b1e-[3-9]\\b)"
constraint_type: "ProjectOut"
operatorizability: "repairable"
action: "repair"
severity: "P0"
pharmacy_status: "candidate"
authority_effect: "None"
description: >
  Rejects the use of IEEE 754 floating-point numbers (float, f64), arbitrary epsilon
  tolerances (e.g. abs(a - b) < 1e-6), and heuristic float conversions within exact
  algebraic carriers, topological winding certifiers, and cochain projections. Mandates
  exact decimal rational constructors (Fraction in Python, Rational64 in Rust) to
  guarantee zero-gap equality and prevent tolerance decay across composition cycles.

governing_invariants:
  - ".agents/rules/math/rl_mathematical_solvers_and_exact_verification.md"
  - ".agents/rules/math/rl_relational_contract_and_exact_math_discipline.md"

adversarial_mutation_fixture: |
  # Hostile specimen: floating-point tolerance decay in algebraic carrier detector
  def verify_topological_winding(winding_sum: float) -> bool:
      expected_winding: float = 1.0
      # Flawed float comparison allowing numerical drift
      return abs(winding_sum - expected_winding) < 1e-7

  def compute_detector_adequacy(carrier_norm: float) -> bool:
      tolerance: float = 1e-5
      return abs(carrier_norm) < tolerance

repaired_invariant_fixture: |
  # Repaired invariant: exact decimal rational constructor with zero gap
  from fractions import Fraction

  def verify_topological_winding(winding_sum: Fraction) -> bool:
      expected_winding = Fraction(1, 1)
      # Exact rational equality check: zero tolerance gap allowed
      return winding_sum == expected_winding

  def compute_detector_adequacy(carrier_norm: Fraction) -> bool:
      return carrier_norm == Fraction(0, 1)

detection_mechanisms:
  ast_visitors:
    - "reject_float_literals_in_exact_algebra"
    - "reject_inequality_epsilon_comparisons"
  regex_triggers:
    - "abs\\([^)]+\\)\\s*<\\s*1e-\\d+"
    - "\\b(float|f64)\\b"
