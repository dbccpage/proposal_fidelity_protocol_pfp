schema_version: "omega.immune.antibody-spec.v1"
antibody_id: "anti-implicit-credential-discovery"
canonical_name: "Anti-Implicit Credential Discovery"
failure_class: "boundary:implicit_credential_discovery"
target_pattern: "(\\bload_dotenv\\b|\\bfind_dotenv\\b|os\\.getenv\\([^)]*KEY[^)]*\\)\\s*or\\s*load_dotenv|\\.\\./\\.env)"
constraint_type: "Restrain"
operatorizability: "fatal"
action: "abort"
severity: "P0"
pharmacy_status: "candidate"
authority_effect: "None"
description: >
  Enforces the Worktree Configuration & Credential Boundary Invariant. Forbids provider
  adapters, runners, and background processes from searching parent directories, reading
  unconfigured .env files, traversing checkouts for credentials, or falling back to live
  provider calls when credentials are omitted. Missing credentials must immediately trigger
  a fail-closed typed refusal, never an ungrounded search or ambient key discovery.

governing_invariants:
  - "GEMINI.md#worktree-configuration--credential-boundary-invariant"
  - ".agents/rules/architecture/rl_clean_architecture_and_subsystem_governance.md"

adversarial_mutation_fixture: |
  # Hostile specimen: implicit credential traversal and unconfigured parent search
  import os
  from pathlib import Path
  from dotenv import load_dotenv

  def discover_provider_api_key(configured_key: str | None = None) -> str:
      if configured_key:
          return configured_key
      # Boundary violation: searching parent checkouts for ambient credentials
      parent_env = Path("..") / ".env"
      if parent_env.exists():
          load_dotenv(parent_env)
      discovered = os.getenv("OPENROUTER_API_KEY") or os.getenv("OPENAI_API_KEY")
      if discovered:
          return discovered
      raise RuntimeError("Key not found in checkout tree")

repaired_invariant_fixture: |
  # Repaired invariant: strict fail-closed typed refusal without ambient traversal
  from dataclasses import dataclass
  from omega_engine_operations.domain.rop.result import Err, Ok, Refusal, Result

  @dataclass(frozen=True)
  class ProviderConfig:
      api_key: str | None = None

  def resolve_provider_credentials(config: ProviderConfig) -> Result[str, Refusal]:
      if not config.api_key or not config.api_key.strip():
          return Err(
              Refusal(
                  code="CREDENTIAL_NOT_CONFIGURED",
                  message="No explicit provider API key configured; implicit parent search prohibited.",
                  locus="omega_engine_providers.adapters",
              )
          )
      return Ok(config.api_key)

detection_mechanisms:
  ast_visitors:
    - "reject_dotenv_parent_traversal"
    - "reject_implicit_ambient_credential_scans"
  regex_triggers:
    - "(\\bload_dotenv\\b|\\bfind_dotenv\\b)"
    - "\\.\\./\\.env"
