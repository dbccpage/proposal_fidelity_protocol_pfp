schema_version: "core.immune.antibody-spec.v1"
antibody_id: "ab_limit_honesty_unhedged_claim"
canonical_name: "Anti-Limit-Honesty Unhedged Claim"
failure_class: "limit_honesty_violation"
target_pattern: "(\\bthermodynamic\\s+limit\\b|\\basymptotic\\s+convergence\\b|\\binfinite-volume\\s+limit\\b|\\bN\\s*->\\s*infinity\\b)"
constraint_type: "Restrain"
operatorizability: "repairable"
action: "repair"
severity: "P0"
pharmacy_status: "candidate"
authority_effect: "None"
description: >
  Rejects unhedged thermodynamic limit or asymptotic convergence claims without explicit
  finite realization proof, discrete difference carrier, or non-zero residual ledger. Mandates
  that any thermodynamic or asymptotic scaling assertion in papers, proofs, and solvers must
  be hedged by finite difference bounds or certified by a discrete boundary witness.

governing_invariants:
  - ".agents/rules/claims/rl_claim_disciplined_compaction.md"
  - ".agents/rules/architecture/rl_multi_source_intelligence_metabolism.md"

adversarial_mutation_fixture: |
  # Hostile specimen: unhedged thermodynamic limit assertion without finite boundary
  def assert_system_phase_transition(energy_spectrum: list[float]) -> str:
      # Unhedged claim violating Claim Hygiene and Limit Honesty
      return "The system proves exact asymptotic convergence in the thermodynamic limit N -> infinity."

repaired_invariant_fixture: |
  # Repaired invariant: finite difference envelope with explicit bounded state transitions
  from fractions import Fraction
  from dataclasses import dataclass

  @dataclass(frozen=True)
  class FiniteDifferenceBound:
      carrier_size: int
      residual_norm: Fraction
      hedged: bool = True

  def assert_system_phase_transition(carrier_size: int, residual_norm: Fraction) -> FiniteDifferenceBound:
      # Finite realization: bound holds only for explicit carrier_size under declared assumptions
      return FiniteDifferenceBound(carrier_size=carrier_size, residual_norm=residual_norm, hedged=True)

detection_mechanisms:
  regex_triggers:
    - "\\bthermodynamic\\s+limit\\b"
    - "\\basymptotic\\s+convergence\\b"
    - "\\bN\\s*->\\s*infinity\\b"
