schema_version: "omega.immune.antibody-spec.v1"
antibody_id: "ab_fail_open_absent_gates"
canonical_name: "Fail-Open Absent Gates"
failure_class: "authority:absent_gates_admitted"
target_pattern: "if gates is None:[\\s\\S]{0,300}?status\\s*=\\s*TerminalStatus\\.AUTHORITY\\b"
constraint_type: "Restrain"
operatorizability: "repairable"
action: "repair"
severity: "P0"
pharmacy_status: "candidate"
authority_effect: "None"
description: >
  Rejects a zero-residual branch that reports TerminalStatus.AUTHORITY when
  gates is None. The live repair returns TerminalStatus.NON_AUTHORITY_HALT
  with RefusalReason.NON_AUTHORITY_TERMINAL. AUTHORITY requires a passing
  gate stack and a matching terminal witness.

governing_invariants:
  - ".agents/rules/math/rl_exact_verification_and_witness_integrity_invariants.md"
  - ".agents/patterns/anti/python/AP_PY_011_fail_open_absent_gates.md"

adversarial_mutation_fixture: |
  def detect_counterfeit_descent(trace, residual_defect_mass, gates=None, terminal_witness=None):
      if gates is None:
          return False, TerminalOutcome(
              status=TerminalStatus.AUTHORITY,
              details="Valid descent.",
          )
      return False, TerminalOutcome(status=TerminalStatus.NON_AUTHORITY_HALT)

repaired_invariant_fixture: |
  def detect_counterfeit_descent(trace, residual_defect_mass, gates=None, terminal_witness=None):
      if gates is None:
          return False, TerminalOutcome(
              status=TerminalStatus.NON_AUTHORITY_HALT,
              refusal_reason=RefusalReason.NON_AUTHORITY_TERMINAL,
              details="Zero residual defect alone without verified gate stack does not confer authority.",
          )
      return False, TerminalOutcome(status=TerminalStatus.CHECKLIST_CERTIFIED)

detection_mechanisms:
  regex_triggers:
    - "if gates is None:[\\s\\S]{0,300}?status\\s*=\\s*TerminalStatus\\.AUTHORITY\\b"
