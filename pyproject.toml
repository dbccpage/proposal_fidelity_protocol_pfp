[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "pfp-lab"
version = "0.2.0"
description = "PFP Lab: run Proposal Fidelity Protocol scenarios and check their receipts."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic==2.13.5",
]

[project.optional-dependencies]
workflows = ["jsonschema==4.26.0", "PyYAML==6.0.3"]
web = [
    "fastapi==0.128.0",
    "uvicorn==0.38.0",
]
dev = [
    "complexipy==8.2.0",
    "fastapi==0.128.0",
    "httpx==0.28.1",
    "hypothesis==6.170.12",
    "import-linter==2.15",
    "lizard==1.24.3",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
    "uvicorn==0.38.0",
]

[project.scripts]
pfp-lab = "pfp_lab.cli.main:entry"
pfp-lab-web = "pfp_lab.web.app:entry"
pfp-wf1 = "pfp.workflows.wf0001.runner:main"
pfp-wf2 = "pfp.workflows.wf0002.runner:main"
pfp-wf3 = "pfp.workflows.wf0003.runner:main"
pfp-wf4 = "pfp.workflows.wf0004.runner:main"
pfp-wf5 = "pfp.workflows.wf0005.runner:main"

