[tool.setuptools.package-dir]
adversary = "ops/adversary"
operations = "ops/operations"
"governance.domain" = "ops/governance/domain"

[tool.setuptools.package-data]
"pfp.infrastructure" = ["yaml/prompts/templates/template_standard_base.yaml"]
"pfp.workflows" = ["wf0001/*.json", "wf0001/examples/*.json", "wf0002/*.json", "wf0002/examples/*.json", "wf0002/reference/*.txt", "wf0003/*.json", "wf0003/*.yaml", "wf0003/examples/*.json", "wf0004/*.json", "wf0004/examples/*.json", "wf0005/*.json", "wf0005/*.ebnf", "wf0005/examples/*.json"]
"operations.domain.cicd" = ["*.yaml"]
"pfp_lab.web" = ["static/*"]
"pfp_lab.core" = ["packs/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["*.contract.score.json", "*/*.contract.score.json"]

[tool.pytest.ini_options]
testpaths = ["pfp_lab/tests", "governance/tools/tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["pfp_lab", "governance/tools"]

[[tool.mypy.overrides]]
module = ["pfp_lab.tests.*", "governance.tools.tests.*"]
# Tests compare Fraction results with int literals on purpose (Fraction(3) == 3).
disable_error_code = ["comparison-overlap"]

[[tool.mypy.overrides]]
module = ["lizard"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "BLE", "UP", "SIM", "RET", "PL", "I", "N"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607", "S104", "S105", "S106", "PLC0415", "PLR0402"]
# Inherited modules fail the release lint for reasons that predate this branch.
# Import order in several of them is load-bearing: a package import extends sys.path
# before the next import. The new release modules are not listed here.
"pfp_core/fidelity.py" = ["I001", "UP037"]
"pfp_core/legacy_importer.py" = ["I001"]
"pfp_core/normalize.py" = ["I001"]
"pfp_core/operad_pipe.py" = ["B018", "I001"]
"pfp_core/tests/test_hardening_20261111.py" = ["I001"]
"pfp_core/tests/test_pfp_core.py" = ["I001", "PLE2515"]
"pfp_core/tests/test_llm_mechanisms.py" = ["E402"]
"pfp_core/workflow_families/base.py" = ["PLW2901", "S105"]
"pfp_core/workflow_families/learning.py" = ["PLR0911"]
"pfp_core/workflow_families/tests/test_repair.py" = ["F401"]
"tests/test_note001_duality.py" = ["F841", "I001", "PLR1730"]
"tests/test_note001_exactness_and_laplacian.py" = ["B007", "B905", "E501", "F401", "I001", "N803", "N806"]
"tests/test_note002_capacities.py" = ["F841", "I001", "W293"]
"tests/test_note003_degree_separation.py" = ["E501", "I001", "UP006", "UP035"]
"tests/test_note004_wave1.py" = ["E741", "F841", "I001", "UP006", "UP035"]
"tests/test_note_001_quotient_norm.py" = ["I001", "PLR1730"]
"tests/test_paper001_reference_governor_review.py" = ["E402", "I001"]
"tests/test_paper001_weighted_nullspace_uniqueness.py" = ["F841", "I001"]
"tests/test_paper002_stoquastic_thermal_nonnegativity.py" = ["I001", "N803", "N806"]
"tests/test_paper_002_native_and_convergence.py" = ["E402", "E501", "F401", "I001"]
"tests/test_paper_002_search_trace.py" = ["E402", "E501", "F401", "I001", "PLR0133", "PLR0911"]
"tests/test_paper_003_receipts.py" = ["E402", "F401", "I001"]
"tests/test_paper_003_substantive.py" = ["E402", "F401", "F841", "I001"]
"tests/test_paper_003_verifiers_and_exhaustion.py" = ["E402", "E501", "I001", "N802", "PLR0912", "PLR0915", "PLR5501"]
"tests/test_paper_004_wave4.py" = ["E402", "E501", "F401", "I001", "SIM108", "UP006", "UP035"]
