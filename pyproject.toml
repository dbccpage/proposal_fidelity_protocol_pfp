[tool.setuptools.package-dir]
adversary = "ops/adversary"
operations = "ops/operations"
"governance.domain" = "ops/governance/domain"

[tool.setuptools.package-data]
"pfp.infrastructure" = ["yaml/prompts/templates/template_standard_base.yaml"]
"pfp.workflows" = ["wf0001/*.json", "wf0001/examples/*.json", "wf0002/*.json", "wf0002/examples/*.json", "wf0002/reference/*.txt", "wf0003/*.json", "wf0003/*.yaml", "wf0003/examples/*.json", "wf0004/*.json", "wf0004/examples/*.json", "wf0005/*.json", "wf0005/*.ebnf", "wf0005/examples/*.json"]
"operations.domain.cicd" = ["*.yaml"]
"pfp_lab.web" = ["static/*"]
"pfp_lab.core" = ["packs/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["*.contract.score.json", "*/*.contract.score.json"]

[tool.pytest.ini_options]
testpaths = ["pfp_lab/tests", "governance/tools/tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["pfp_lab", "governance/tools"]

[[tool.mypy.overrides]]
module = ["pfp_lab.tests.*", "governance.tools.tests.*"]
# Tests compare Fraction results with int literals on purpose (Fraction(3) == 3).
disable_error_code = ["comparison-overlap"]

[[tool.mypy.overrides]]
module = ["lizard"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "BLE", "UP", "SIM", "RET", "PL", "I", "N"]
ignore = ["PLR2004", "PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "S607", "S104", "S105", "S106", "PLC0415", "PLR0402"]

[tool.importlinter]
root_packages = ["pfp_lab"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core depends on nothing outside the standard library and Pydantic"
type = "forbidden"
source_modules = ["pfp_lab.core"]
forbidden_modules = ["pfp_lab.cli", "pfp_lab.web", "pfp_lab.packs", "fastapi", "uvicorn"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "Front ends do not import each other"
type = "independence"
modules = ["pfp_lab.cli", "pfp_lab.web"]
