# outer_layers applies to every Python package directory named domain.
# bounded_contexts is the single-root roster. One entry per context.
# AuthorityEffect: None.

outer_layers:
  - use_cases
  - infrastructure
  - controllers
  - frontend

bounded_contexts:
  - canonical_root: operations
    single_root_enforced: true
    description: Repository CI/CD, packaging, and operational tooling
  - canonical_root: pfp
    single_root_enforced: true
    description: Symbol Game runtime, PFP levels, and discrete manifold engine
  - canonical_root: adversary
    single_root_enforced: true
    description: Dialectical prosecution engine and Socratic verification swarm
  - canonical_root: research_papers
    single_root_enforced: true
    description: CODA and mathematical paper companion modules
  - canonical_root: education
    single_root_enforced: false
    description: Education estate. Uses the core/realizations/applications/verification documentation layout.
  - canonical_root: governance
    single_root_enforced: true
    description: Governance contracts, councils, and the actor corpus
  - canonical_root: operads
    single_root_enforced: true
    description: Skill lifecycle, learning, development office, and DDC execution
  - canonical_root: pciv
    single_root_enforced: true
    description: Prompt civilization and intelligence metabolism
