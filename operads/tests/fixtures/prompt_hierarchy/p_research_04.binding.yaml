# Negative-governance attachment binding for PFP Research Stage 4 (Candidate Generation)
schema_version: omega.prompt_hierarchy.binding.v1
prompt_uri: "prompt://education/pfp/workflows/research/stage_04/P_RESEARCH_04"
title: "PFP Research Loop Stage 4 Candidate Generation Binding"
description: "Binds OEWAS Anti-Ops and OEEIS Admitted Antibodies to P_RESEARCH_04."

oewas_anti_ops:
  - op_id: "glossa.refuse_missing_claim_envelope"
    inspects_slot: "candidate_text"
    refusal_code: "UNRESOLVED_VIOLATIONS"
    description: "Refuses candidates lacking claim-discipline envelope."
  - op_id: "sfh.refuse_bare_except"
    inspects_slot: "candidate_code"
    refusal_code: "SFH-PY-001"
    description: "Refuses code blocks containing bare except clauses."

oeeis_antibodies:
  - antibody_id: "ab_q40_bitmask_assignment_inversion"
    signal1_epitope: "bitmask assignment inversion"
    signal2_required_danger: "HOST_EVALUATOR_ALERT"
    minimum_status: "admitted"
    description: "Guards against challenge bitmask convention inversion."
  - antibody_id: "ab_adversarial_refusal_bypass_leakage"
    signal1_epitope: "adversarial refusal bypass"
    signal2_required_danger: "HOST_TEST_FAILURE"
    minimum_status: "admitted"
    description: "Guards against ungrounded refusal bypasses evaluating to PASS."
  - antibody_id: "ab_scalar_proxy_theorem_substitution"
    signal1_epitope: "three_ray_positivity_proxy"
    signal2_required_danger: "PROXY_COUNTEREXAMPLE_SURVIVES"
    minimum_status: "admitted"
    description: "Guards against substituting scalar parameter-count or 3-ray proxies for full cone/group/2-complex theorems."
  - antibody_id: "ab_target_fitting_constant_compensation"
    signal1_epitope: "unpinned_additive_residual"
    signal2_required_danger: "COMPONENT_PIN_MISMATCH"
    minimum_status: "admitted"
    description: "Guards against unpinned additive residual terms compensating upstream input errors inside composite interval checks."
  - antibody_id: "ab_witness_certificate_desynchronization"
    signal1_epitope: "prose_certificate_witness_mismatch"
    signal2_required_danger: "PROSE_WITNESS_FALSIFIED"
    minimum_status: "admitted"
    description: "Guards against prose manuscript witness literals drifting from Lean/Rust/Python certificate witnesses."


