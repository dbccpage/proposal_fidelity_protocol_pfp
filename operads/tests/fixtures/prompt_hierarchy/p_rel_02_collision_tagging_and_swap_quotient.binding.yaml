schema_version: core.prompt_hierarchy.binding.v1
prompt_uri: "prompt://genesis/relational/derivation/stage_02/P_REL_02_COLLISION_TAGGING_SWAP_QUOTIENT"
title: "PFP Pure Relational Stage 2: S(2)->S(3) Collision Tagging and Swap Projector Lock"
description: "Pre-declared operad lock for Stage 2 of the pure relational derivation workflow (before candidate generation)."

oewas_anti_ops:
  - op_id: "pfp.refuse_unmapped_continuum_import"
    inspects_slot: "candidate_text"
    refusal_code: "ANTI_UNMAPPED_CONTINUUM_IMPORT"
  - op_id: "pfp.refuse_scalar_proxy_theorem_substitution"
    inspects_slot: "candidate_text"
    refusal_code: "ANTI_SCALAR_PROXY"
  - op_id: "pfp.refuse_target_fitting_constant_compensation"
    inspects_slot: "candidate_text"
    refusal_code: "ANTI_TARGET_FITTING"
  - op_id: "pfp.refuse_witness_certificate_desynchronization"
    inspects_slot: "candidate_text"
    refusal_code: "ANTI_WITNESS_DRIFT"

oeeis_antibodies:
  - antibody_id: "ab_scalar_proxy_theorem_substitution"
    signal1_epitope: "three_ray_positivity_proxy"
    signal2_required_danger: "PROXY_COUNTEREXAMPLE_SURVIVES"
  - antibody_id: "ab_target_fitting_constant_compensation"
    signal1_epitope: "unpinned_additive_residual"
    signal2_required_danger: "COMPONENT_PIN_MISMATCH"
  - antibody_id: "ab_witness_certificate_desynchronization"
    signal1_epitope: "prose_certificate_witness_mismatch"
    signal2_required_danger: "PROSE_WITNESS_FALSIFIED"

operad_binding:
  operation_id: "pfp.rel02_collision_tagging_and_swap_projectors"
  source_colours: ["State", "Code", "Proof"]
  target_colour: "Contract"
  slot_to_colour:
    tower_state: "State"
    code_witness: "Code"
    proof_witness: "Proof"
  required_slot_pins:
    - "projector_idempotence_defect"
    - "projector_orthogonality_defect"
    - "difference_kernel_trace"
  cross_slot_equality_groups:
    - ["contract_witness", "code_witness", "proof_witness"]
  required_boundary_witness_slots:
    - "char2_collapse_boundary_witness"
  equivariant: true
  residual_effect: "contractive"
