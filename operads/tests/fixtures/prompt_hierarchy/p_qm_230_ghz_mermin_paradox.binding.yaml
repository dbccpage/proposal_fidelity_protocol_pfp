schema_version: omega.prompt_hierarchy.binding.v1
prompt_uri: "prompt://physics/finite_qm/derivation/stage_08/P_QM_230_GHZ_PARADOX"
title: "PFP Finite QM Goal 8 (QM-230) Three-Qubit GHZ Mermin Parity Paradox Binding"
description: "Binds operad signature, GHZ parity pins, cross-layer witness equality, and antibodies to QM-230."

oewas_anti_ops:
