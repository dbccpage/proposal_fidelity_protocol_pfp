  source_colours: ["Diagram", "Code", "Proof"]
  target_colour: "Audit"
  slot_to_colour:
    parity_diagram: "Diagram"
    code_witness: "Code"
    proof_witness: "Proof"
  required_slot_pins:
    - "ghz_quantum_product_eigenvalue"
    - "ghz_classical_parity_product"
  cross_slot_equality_groups:
    - ["paper_witness", "code_witness", "proof_witness"]
  required_boundary_witness_slots:
    - "mermin_4_vs_2_contradiction_witness"
  equivariant: true
  residual_effect: "contractive"
