# OEOP operad type registry, family 1 of 6: capability kinds and lifecycle.
# Where each operad type is declared or used. The canonical values are not written here: they
# live once in code/rust/core_operad_canon and are read from operads/canon/operad_canon.json.
# operad_type_registry.py fails when a source drifts from the canon or from what is recorded here.
# Roles: declares (must equal canonical), uses (subset), part (union of parts must equal it).
# external: why some of a type's sources cannot be checked: they were not copied into this repository.
# AuthorityEffect: None.
schema_version: core.oeop.operad-types.v1
family: capabilities_and_lifecycle
authority_effect: None
types:
- id: capability_kind
  sources:
  - data: operads/catalog/contracts/v1/typed_capability.schema.json
    select: discriminator.mapping
    mode: keys
    values: [anti_pattern, anti_skill, antibody, helpful_pattern, rule, skill]
- id: invocation_mode
  sources:
  - data: operads/skill_operad/json/capability_catalog.v1.json
    select: skills.*.invocation
    mode: distinct
    role: uses
    values: [discipline, entry, on-demand]
- id: lifecycle_declaration
  sources:
  - python: operads.domain.value_objects.lifecycle_facets:DeclarationFacet
    values: [Declared, Abstract, Synthesized]
- id: lifecycle_schema_binding
  sources:
  - python: operads.domain.value_objects.lifecycle_facets:SchemaBindingFacet
    values: [Unbound, Bound, AnySchema]
- id: lifecycle_executor_binding
  sources:
  - python: operads.domain.value_objects.lifecycle_facets:ExecutorBindingFacet
    values: [Unbound, Bound, ExternalService]
- id: lifecycle_validation
  sources:
  - python: operads.domain.value_objects.lifecycle_facets:ValidationFacet
    values: [Unchecked, Validated, Failed]
- id: lifecycle_admission
  sources:
  - python: operads.domain.value_objects.lifecycle_facets:AdmissionFacet
    values: [Unadmitted, Admitted, Retired]
- id: lifecycle_stage_legacy
  sources:
  - python: operads.infrastructure.legacy.catalog_v2:LIFECYCLE_STATES
    values: [ADMITTED, BOUND, COMPOSABLE, DRAFT, TESTED, TYPED]
  - data: operads/registry/lifecycle.yaml
    select: packages.*.stage
    mode: distinct
    role: uses
    values: [BOUND, TESTED, TYPED]
- id: meta_skill_status
  external: the operand registry and operad data-type schema (.agents/skill_operads/) were not copied into this
    repository
  sources: []
