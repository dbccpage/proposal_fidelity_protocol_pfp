# OEOP operad type registry, family 6 of 6: immune and negative types (OEEIS and anti-skills).
# Where each operad type is declared or used. The canonical values are not written here: they
# live once in code/rust/core_operad_canon and are read from operads/canon/operad_canon.json.
# operad_type_registry.py fails when a source drifts from the canon or from what is recorded here.
# Roles: declares (must equal canonical), uses (subset), part (union of parts must equal it).
# external: why some of a type's sources cannot be checked: they were not copied into this repository.
# AuthorityEffect: None.
schema_version: core.oeop.operad-types.v1
family: immune_and_negative
authority_effect: None
types:
- id: constraint_type
  sources:
  - python: eis.domain.pharmacy_models:ConstraintType
    values: [ProjectOut, Restrain, Enforce]
- id: operatorizability
  sources:
  - python: eis.domain.pharmacy_models:Operatorizability
    values: [repairable, fatal]
- id: runtime_action
  sources:
  - python: eis.domain.pharmacy_models:RuntimeAction
    values: [repair, abort]
  - data: eis/antibodies/anti_*.yaml
    select: action
    mode: distinct
    role: uses
    values: [abort, refuse, repair]
- id: severity
  sources:
  - python: eis.domain.pharmacy_models:Severity
    values: [P0, P1, P2, P3]
- id: antibody_pharmacy_status
  sources:
  - python: eis.domain.pharmacy_models:PharmacyStatus
    values: [candidate, admitted, rejected, retired]
  - python: operads.contracts.typed_capabilities_v1:AntibodyWireV1.model_fields[pharmacy_status]
    role: uses
    values: [candidate]
- id: anti_skill_status
  sources:
  - rust_enum: code/rust/core_epistemic_immune_system/src/anti_skill.rs#AntiSkillStatus
    values: [Proposed, Candidate, Admitted, Suspended, Retired]
- id: pharmacy_failure_class
  sources:
  - python: eis.infrastructure.mssn_pharmacy:FailureClass
    field: name
    values: [SELF_CERTIFICATION, FAKE_RECEIPT, CONCLUSION_PRELOAD, SCHEMA_SEMANTIC_LAUNDERING, THEOREM_NAME_LAUNDERING,
      OPTIMALITY_HALLUCINATION, COMPLEXITY_HALLUCINATION, BRANCH_DROP_EXHAUSTION, PERSONA_AUTHORITY_LEAK, PRIVATE_COT_DEPENDENCY,
      VERSION_DUPLICATION, DETECT_REPAIR_COUPLING]
- id: anti_skill_failure_class
  sources:
  - rust_enum: code/rust/core_epistemic_immune_system/src/anti_skill.rs#FailureClass
    values: [SemanticHallucination, ApproximateContradiction, ToyPromotion, UnmechanizedProofClaim, SelfContradiction,
      DualityGapNonZero, BoundaryLeakage, UnboundPortAssumption, CounterfeitExactness, SycophanticAgreement, StructuralNonFit,
      StaleCensusReference]
- id: hit_disposition
  sources:
  - python: eis.infrastructure.mssn_pharmacy:Disposition
    field: name
    values: [FINDING, HOLD, REFUSE]
  - python: operads.domain.anti_skills.anti_skill_v2:HIT_DISPOSITIONS
    values: [FINDING, HOLD, REFUSE]
- id: guard_disposition
  sources:
  - python: eis.domain.danger_gate:GuardDisposition
    values: [NO_ACTIVATION, FINDING, HOLD, REFUSE, DEFENSIVE_LOCKDOWN, TWO_SIGNAL_COLLAPSE]
- id: danger_decision
  sources:
  - python: eis.domain.value_objects:DangerDecision
    values: [TOLERATED, DIAGNOSTIC_ONLY, DEFENSIVE_LOCKDOWN, QUARANTINED]
- id: authority_level
  sources:
  - python: eis.domain.treg:AuthorityLevel
    values: [BLOCKING_GATE, DIAGNOSTIC_ONLY]
- id: anti_skill_claim_mode
  sources:
  - python: operads.domain.anti_skills.anti_skill_v2:CLAIM_MODES
    values: [BOUNDED, PROPOSAL, SELF_CERTIFIED, UNRESTRICTED]
- id: anti_skill_predicate_mode
  sources:
  - python: operads.domain.anti_skills.anti_skill_v2:PREDICATE_MODES
    values: [ALL, ANY]
