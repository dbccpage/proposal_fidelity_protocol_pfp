# OEOP operad type registry, family 2 of 6: colours, ports and wire types.
# Where each operad type is declared or used. The canonical values are not written here: they
# live once in code/rust/core_operad_canon and are read from operads/canon/operad_canon.json.
# operad_type_registry.py fails when a source drifts from the canon or from what is recorded here.
# Roles: declares (must equal canonical), uses (subset), part (union of parts must equal it).
# external: why some of a type's sources cannot be checked: they were not copied into this repository.
# AuthorityEffect: None.
schema_version: core.oeop.operad-types.v1
family: colours_and_wires
authority_effect: None
types:
- id: operad_colour
  external: the operand registry and operad data-type schema (.agents/skill_operads/) were not copied into this
    repository
  sources:
  - python: operads.domain.operad.colours:ADMITTED_FINITE_COLOURS
    values: [State, Proof, Paper, Code, Contract, Receipt, Ledger, Diagram, Audit, Post]
  - python: operads.skill_operad.domain.colours:ADMITTED_FINITE_COLOURS
    values: [Audit, Code, Contract, Diagram, Ledger, Paper, Post, Proof, Receipt, State]
  - python: operads.infrastructure.legacy.models:ADMITTED_COLOURS
    values: [Audit, Code, Contract, Diagram, Ledger, Paper, Post, Proof, Receipt, State]
  - python: operads.domain.ddc_execution.enums:OperadColour
    values: [Audit, Code, Contract, Diagram, Ledger, Paper, Post, Proof, Receipt, State]
  - python: operads.contracts.typed_capabilities_v1:Colour
    values: [Audit, Code, Contract, Diagram, Ledger, Paper, Post, Proof, Receipt, State]
  - data: operads/skill_operad/json/operad_signature.json
    select: colours
    mode: keys
    values: [Audit, Code, Contract, Diagram, Ledger, Paper, Post, Proof, Receipt, State]
  - rust_struct: code/rust/core_operad_theory/src/foundation/colour.rs#OperadColour
    values: []
- id: operad_subcolour
  sources:
  - data: operads/skill_operad/yaml/op_inventory.yaml
    select: subcolours
    mode: qualified
    values: [Audit.hype_hits, Audit.lint_diff, Audit.sfh_findings, Audit.shadow_violations, Audit.layout_findings,
      Audit.verdict, Code.purged, Ledger.source_hashes]
- id: operand_colour
  external: the operand registry and operad data-type schema (.agents/skill_operads/) were not copied into this
    repository
  sources: []
- id: prompt_colour
  sources:
  - python: pfp.domain.operad.prompt:PromptColour
    values: [RawTextSpan, Equation, IsolatedVariable, SubstitutionStep, RationalValue, InvariantWitness, TargetResult]
- id: capability_wire_type
  sources:
  - python: operads.contracts.typed_capabilities_v1:WireType
    values: [anti_skill_subject, anti_skill_hits, typed_audit_receipt, code_text]
- id: adversary_port
  sources:
  - rust_enum: code/rust/core_adversary/src/specialization.rs#PortName
    values: [AdversaryRuntime, NativeBout, SeatTransport, SgtEmission, ImmuneAntibodies, OeopLearning, OeopAntiSkill,
      PromptGenealogy, CodaEvaluation, LggrGluing, EnvelopeStore]
- id: adversary_wire_type
  external: ops/adversary/infrastructure/typed_operad.py declares these as the keys of _COLOURS, but it imports
    adversary.infrastructure.operad_contracts, which was not copied into this repository
  sources: []
