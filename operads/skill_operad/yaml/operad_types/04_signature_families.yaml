# OEOP operad type registry, family 4 of 6: signature families, polarity and routes.
# Where each operad type is declared or used. The canonical values are not written here: they
# live once in code/rust/core_operad_canon and are read from operads/canon/operad_canon.json.
# operad_type_registry.py fails when a source drifts from the canon or from what is recorded here.
# Roles: declares (must equal canonical), uses (subset), part (union of parts must equal it).
# external: why some of a type's sources cannot be checked: they were not copied into this repository.
# AuthorityEffect: None.
schema_version: core.oeop.operad-types.v1
family: signature_families
authority_effect: None
types:
- id: contractive_meta_operad
  sources:
  - skills: ^meta-.*--contractive$
    values: [meta-code-audit--code--contractive, meta-contract-audit--contract--contractive, meta-contract-code--audit--contractive,
      meta-paper--audit--contractive, meta-paper--receipt--contractive, meta-proof-code--proof--contractive, meta-state--receipt--contractive,
      meta-state--state--contractive]
- id: contractive_meta_operad_residual
  sources:
  - skills: ^meta-.*--contractive$
    field: operad_residual
    values: [unknown]
- id: x_to_y_verifier
  sources:
  - skills: ^meta-.*-to-.*-verifier$
    values: [meta-atlas-state-to-state-verifier, meta-auto-paper-to-paper-verifier, meta-auto-state-to-receipt-verifier,
      meta-blackrod-contract-to-audit-verifier, meta-glossa-proof-to-proof-verifier, meta-goo-ledger-to-ledger-verifier,
      meta-goo-paper-to-paper-verifier, meta-goo-proof-to-audit-verifier, meta-kybernesis-paper-to-post-verifier,
      meta-proof-to-paper-verifier, meta-techne-code-to-audit-verifier, meta-techne-code-to-code-verifier]
- id: pfp_polarity
  sources:
  - python: pfp.domain.operad.polarity:Polarity
    values: [CONSTRUCTIVE, INTERROGATIVE, CORRECTIVE, GATE]
- id: polarity_pair_provenance
  sources:
  - data: operads/skill_operad/yaml/polarity_pairs.yaml
    select: pairs.*.provenance
    mode: distinct
    values: [declared, inferred]
- id: resolver_route
  sources:
  - data: operads/skill_operad/yaml/routes.yaml
    select: shared_contracts.*.id
    role: part
    values: [historical_pr_immunity, oe010_dda, six_host_parity, coda_gtla_paper, test_quality, canonical_value_validation,
      append_only_log_integrity, pipeline_exit_code, formal_lean]
  - data: operads/skill_operad/yaml/routes.yaml
    select: code_gates.*.id
    role: part
    values: [skill_budget, knowledge_parity_gate, skill_name_verify, rule_gate]
