# Polarized Pairing Law -- declared O+ / O- pairs.
#
# `EPIC-OE-OEWAS-006`: "Every constructive skill generator (O^+) is paired with
# an adversarial canary detector (O^-)."
#
# Before this file the law existed only in prose -- in the epic, and in the stage
# list of `auto-oe-autop`. Nothing could check it, because there was nothing to
# check against. This is the representation, and it is **human-authored data**,
# not the output of a classifier.
#
# That distinction is deliberate. A heuristic that guessed polarity from a
# skill's name or description would produce a number nobody could falsify, which
# is the failure this estate has spent ten sprints naming. A skill absent from
# this file is `UNCLASSIFIED`, never `compliant`.
#
# provenance:
#   declared  -- the pairing is stated in the epic or in a skill's own text
#   inferred  -- a reviewer read both skills and judged them a pair; weaker,
#                and marked so a reader can discount it
#
# AuthorityEffect: None. Declaring a pair does not certify either skill.

schema_version: "omega.oewas.polarity_pairs.v1"

pairs:
  - constructive: auto-skill
    adversarial: auto-anti-skill-search
    provenance: declared
    cite: >-
      EPIC-OE-OEWAS-006 names both by slash-command. `auto-oe-autop` stage 1 is
      "/auto-skill + skill_compiler (Constructive O^+)" and stage 2 is
      "/auto-anti-skill-search (Adversarial O^- & Canary Fixtures)".

  - constructive: auto-suggest-new-skills
    adversarial: auto-review-skills
    provenance: inferred
    cite: >-
      `auto-suggest-new-skills` discovers and scaffolds candidates into the
      garden (auto-oe-autop stage 7); `auto-review-skills` audits the garden and
      flags candidates for archival (stage 6). Constructive and selective halves
      of garden natural selection. Inferred: neither skill names the other as its
      polar partner.
