# Structured Prompt Representation Specification
# Governing Standard: Proposal Fidelity Protocol (PFP)
# AuthorityEffect: None.

schema_version: pfp.prompt_representation.v1
representation_kind: structured
authority_effect: None

classification:
  family: prompt_wire_encoding
  encoding_posture: role_segmented_json_partition
  token_overhead_posture: metadata_envelope_overhead
  carrier_type: application/json

description: >
  Canonical JSON segment partition with explicit role/slot boundaries.
  Encapsulates the raw source alongside ordered slot bindings ('s0', 's1', ...)
  typed by role ('task', 'constraint', 'context', 'output', 'unresolved').

empirical_performance_baseline:
  evidence_status: cited_source_not_in_clone
  general_efficacy_established: false
  source_study: pilots/pilot_output/results.md
  measured_rate_recorded: false

invariants:
  - id: STRUCT-INV-001
    name: CanonicalJsonSerialization
    rule: Wire output must follow RFC 8785 canonical JSON formatting (sorted keys, compact delimiters, no trailing commas).
  - id: STRUCT-INV-002
    name: SlotMonotonicity
    rule: Slot identifiers must strictly follow zero-indexed sequential notation s0, s1, ..., sN.
  - id: STRUCT-INV-003
    name: MandatoryTaskSegment
    rule: At least one segment in the partition must carry role='task'.
  - id: STRUCT-INV-004
    name: SourceByteFidelity
    rule: Concatenation of segment text must faithfully reconstitute the declared source string.

specification:
  fields:
    source_id:
      type: string
      required: true
      pattern: "^[a-zA-Z0-9_-]+$"
    source_sha256:
      type: string
      required: true
      pattern: "^[0-9a-f]{64}$"
    proposal_sha256:
      type: string
      required: true
      pattern: "^[0-9a-f]{64}$"
    representation_kind:
      type: string
      required: true
      const: structured
    authority_effect:
      type: string
      required: true
      const: None
    payload:
      type: object
      required: true
      properties:
        source:
          type: string
          required: true
        segments:
          type: array
          required: true
          items:
            type: object
            required:
              - slot
              - role
              - text
            properties:
              slot:
                type: string
                pattern: "^s[0-9]+$"
              role:
                type: string
                enum: [task, constraint, context, output, unresolved]
              text:
                type: string
              start_byte:
                type: integer
                minimum: 0
              end_byte:
                type: integer
                minimum: 1

canonical_example:
  trial_id: "case0:structured"
  source_id: "bench-001-primes"
  source_sha256: "89be119ca687ad1a05b27c709519dda9657e7e19f0b23740d1dc2e1c83ef686f"
  proposal_sha256: "32997b0c0586eb003453a2ba08adf0dcc4c44e2b4327f5c445cbbb8f0c50f8da"
  prompt_sha256: "e988852db0fd18419dedc5991f9e3534cb855d1c0e8456644743afb09efebac0"
  prompt: '{"segments":[{"role":"task","slot":"s0","text":"Task: Extract all primes less than 20. "},{"role":"constraint","slot":"s1","text":"Constraint: Output must be a JSON array of integers strictly ordered ascending with key \"primes\". "},{"role":"output","slot":"s2","text":"Output: JSON only without code fences."}],"source":"Task: Extract all primes less than 20. Constraint: Output must be a JSON array of integers strictly ordered ascending with key \"primes\". Output: JSON only without code fences."}'
