# Raw Prompt Representation Specification
# Governing Standard: Proposal Fidelity Protocol (PFP)
# AuthorityEffect: None.

schema_version: pfp.prompt_representation.v1
representation_kind: raw
authority_effect: None

classification:
  family: prompt_wire_encoding
  encoding_posture: unpartitioned_source_prose
  token_overhead_posture: zero_framing_baseline
  carrier_type: text/plain

description: >
  Baseline plain source text without role framing, metadata tags, or schema envelopes.
  No validation rate from pilots/pilot_output/results.md is recorded here; that file is not in this clone.

empirical_performance_baseline:
  evidence_status: cited_source_not_in_clone
  general_efficacy_established: false
  source_study: pilots/pilot_output/results.md
  measured_rate_recorded: false

invariants:
  - id: RAW-INV-001
    name: LosslessByteIdentity
    rule: rendered_prompt byte sequence must be identical to the original UTF-8 source_text bytes.
  - id: RAW-INV-002
    name: NoRoleFraming
    rule: No explicit role delimiters, slot markers, SQL statements, or symbolic dialects are injected.
  - id: RAW-INV-003
    name: StrictDigestEquivalence
    rule: source_sha256 must strictly equal prompt_sha256.
  - id: RAW-INV-004
    name: FiniteByteCeiling
    rule: Total UTF-8 encoded bytes must not exceed MAX_PROMPT_BYTES (65,536 bytes).

specification:
  fields:
    source_id:
      type: string
      required: true
      pattern: "^[a-zA-Z0-9_-]+$"
      description: Originating source/task identifier.
    source_text:
      type: string
      required: true
      min_length: 1
      description: The unpartitioned prompt text presented to the model.
    source_sha256:
      type: string
      required: true
      pattern: "^[0-9a-f]{64}$"
      description: Lowercase hex SHA-256 digest of source_text.
    representation_kind:
      type: string
      required: true
      const: raw
    standard_id:
      type: string
      required: false
      const: SPK-001
      description: Proposal Fidelity Protocol Single Prompt Standard identifier.
    authority_effect:
      type: string
      required: true
      const: None

canonical_example:
  trial_id: "case0:raw"
  source_id: "bench-001-primes"
  standard_id: "SPK-001"
  source_sha256: "89be119ca687ad1a05b27c709519dda9657e7e19f0b23740d1dc2e1c83ef686f"
  prompt_sha256: "89be119ca687ad1a05b27c709519dda9657e7e19f0b23740d1dc2e1c83ef686f"
  prompt: 'Task: Extract all primes less than 20. Constraint: Output must be a JSON array of integers strictly ordered ascending with key "primes". Output: JSON only without code fences.'
