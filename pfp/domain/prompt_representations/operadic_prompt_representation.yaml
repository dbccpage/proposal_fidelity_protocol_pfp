  historical_pilot003_byte_comparison: "18432/1038 bytes, approximately 17.8x; a different unit and pilot"
  historical_pilot003_comparison_scope: "Attributed to the master narrative only; byte-source custody not rechecked here"
  float_drift_mitigation: "Design goal; no guaranteed model arithmetic or zero-drift claim"
  authority_firewall: "Proposal declaration; independent host checks must enforce admission and authority boundaries"

invariants:
  - id: OPR-INV-001
    name: ExplicitEnvironmentRing
    rule: Layer 0 must explicitly declare the environment ring (defaults to exact rational 'Q' without unhedged float).
  - id: OPR-INV-002
    name: TypedOperatorSignatures
    rule: Layer 1 must declare at least one typed operation signature.
  - id: OPR-INV-003
    name: MandatoryTaskSpan
    rule: Layer 2 SpanTable must contain at least one span carrying role='task'.
  - id: OPR-INV-004
    name: CongruenceIdealDeclaration
    rule: Layer 2 SpanTable must declare at least one congruence ideal or safety fence invariant.

specification:
  fields:
    source_id:
      type: string
      required: true
      pattern: "^[a-zA-Z0-9_-]+$"
    source_sha256:
      type: string
      required: true
      pattern: "^[0-9a-f]{64}$"
    proposal_sha256:
      type: string
      required: true
      pattern: "^[0-9a-f]{64}$"
    representation_kind:
      type: string
      required: true
      const: operadic
    authority_effect:
      type: string
      required: true
      const: None
    environment:
      type: object
      required:
        - ring
      properties:
        ring:
          type: string
        region:
          type: string
        constants:
          type: object
    skeleton:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            type: string
    span_table:
      type: object
      required:
        - spans
        - ideals
      properties:
        spans:
          type: array
          items:
            type: object
            required:
              - slot
              - role
              - text
            properties:
              slot:
                type: string
                pattern: "^s[0-9]+$"
              role:
                type: string
                enum: [task, constraint, context, output, unresolved]
              text:
                type: string
        ideals:
          type: array
          items:
            type: string
        antibodies:
          type: array
          items:
            type: string

canonical_example:
  source_id: "pilot_004:operadic"
  source_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  proposal_sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
  representation_kind: "operadic"
  authority_effect: "None"
  environment:
    ring: "Q[x, y]"
    region: "[-3, 3] x [-3, 3] over Q^2"
    constants:
      deltoid_poly: "(x^2+y^2)^2 + 18*(x^2+y^2) - 8*(x^3 - 3*x*y^2) - 27"
  skeleton:
    operations:
      - "Op_subdivide(B) -> {B_00, B_10, B_01, B_11}"
      - "Op_collar(B, cusps) -> CuspCollarReceipt"
  span_table:
    spans:
      - slot: "s0"
        role: "task"
        text: "Isolate deltoid cusps and verify collar box boundary."
    ideals:
      - "RULE_DELTOID_SINGULARITY_COLLAR_FENCE"
      - "IDEAL_EXACT_RATIONAL_DOMAIN"
    antibodies:
      - "AB_DELTOID_SINGULARITY_LEAK"
