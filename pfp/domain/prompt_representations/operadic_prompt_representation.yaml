# Operadic Prompt Representation Specification
# Governing Standard: Proposal Fidelity Protocol (PFP)
# AuthorityEffect: None.

schema_version: pfp.prompt_representation.v1
representation_kind: operadic
authority_effect: None

classification:
  family: prompt_wire_encoding
  encoding_posture: 3_layer_compact_operad
  token_overhead_posture: minimal_typed_algebraic_scaffolding
  carrier_type: application/x-operad-yaml

description: >
  3-Layer compact operad prompt representation partitioning prompt instructions into
  Layer 0 (Environment / algebraic ring), Layer 1 (TreeSkeleton / typed operator signatures),
  and Layer 2 (SpanTable / bound spans, congruence ideals, and epistemic antibodies).
  A design used by historical MUB(6) and PFP pilot examples; benchmark coverage
  and general prompting benefit are not established by this specification.

