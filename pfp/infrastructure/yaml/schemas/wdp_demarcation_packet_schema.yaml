schema_id: "WDP-DEMARCATION-PACKET-v1.0"
title: "Witnessed Difference Programme (WDP) Four-Tier Demarcation Packet"
authority_effect: "None"
reference_monograph: "F004_papers/001_finite_obstruction_calculus/000_witnessed_difference_programme"
doi: "10.5281/zenodo.23114399"

description: >
  Strictly separates four epistemic levels that ungrounded agents conflate:
    1. Mathematical definition or conditional theorem
    2. Finite executable computational witness
    3. Lean 4 constructive theorem declaration
    4. Physical, phenomenological, or authority claims
  Only tiers 1-3 can be evaluated in-process; none entails tier 4.

four_tier_framework:
  tier_1_mathematical_definition:
    definition_id: "string"
    formal_statement: "string"
    assumptions: "list[string]"
  tier_2_finite_witness:
    witness_type: "exact_rational_cochain | snf_preimage | dual_certificate"
    input_payload: "string"
    computed_receipt: "string"
    execution_time_ms: "float"
  tier_3_lean4_mechanization:
    module: "string"
    theorem_name: "string"
    axiom_census: "list[string] (strictly bounded to propext, Quot.sound)"
    has_sorry: "bool (must be false)"
  tier_4_authority_fence:
    authority_effect: "None"
    claims_disallowed:
      - "No speculative ontological leaps"
      - "No claims of physical truth derived from finite graph models"
      - "No promotion to core authority without human sign-off"
