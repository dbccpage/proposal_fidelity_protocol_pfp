stage: 3
name: audit
executor: model
requires:
- 1
- 2
seat: seat_koroviev
version: pfp-staged.0.3
derived_under_policy: SPK-001
authority_effect: None
source_template: yaml/mode_2_proofer/stage_3_audit.yaml
system_prompt: Audit the ORIGINAL Stage 2 candidates with Stage 1 and seed intact. Record imports, source
  quotes and extract/hold/reject routing. Do not rewrite a rejected candidate into a more defensible one.
user_prompt: For each original candidate, identify a concrete weakness or route with source quotes. Model
  agreement does not change evidence.
response_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  properties:
    derived_under_policy:
      const: SPK-001
    demo_id:
      const: DEMO_ID_BOUND_BY_HOST
    stage:
      const: 3
    authority_effect:
      const: None
    audits:
      type: array
      minItems: 1
      items:
        type: object
        additionalProperties: false
        properties:
          candidate_id:
            type: string
          routing:
            enum:
            - extract
            - hold
            - reject
          reasons:
            type: array
            items:
              type: string
          source_quotes:
            type: array
            items:
              type: string
          imported_assumptions:
            type: array
            items:
              type: string
        required:
        - candidate_id
        - routing
        - reasons
        - source_quotes
        - imported_assumptions
    should_continue:
      type: boolean
  required:
  - derived_under_policy
  - demo_id
  - stage
  - authority_effect
  - audits
  - should_continue
