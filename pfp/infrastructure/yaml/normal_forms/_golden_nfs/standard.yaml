  - IZQNF
  - RBNF

documentation_lints:
  - id: nf.classical.0nf
    qualifies_as_true_normal_form: false
  - id: nf.classical.3nf
    fields:
      definition.quadrilateral.dependency_preservation.status: preserved_by_synthesis
  - id: nf.classical.bcnf
    fields:
      definition.quadrilateral.dependency_preservation.status: not_always
  - id: nf.classical.etnf
    formal_statement_contains:
      - bcnf
      - superkey
  - id: nf.classical.rfnf
    formal_statement_contains:
      - union
      - superkey
  - id: nf.classical.sknf
    formal_statement_contains:
      - irreducible
      - superkey
  - id: nf.classical.5nf
    formal_statement_contains:
      - implied by
      - candidate keys
  - id: nf.classical.6nf
    formal_statement_contains:
      - trivial
    fields:
      definition.binary_fact_shape.defines_membership: false
  - id: nf.classical.dknf
    qualifies_as_true_normal_form: false
    fields:
      definition.quadrilateral.syntactic_decision.status: undecidable_for_arbitrary_constraints

