gate_id: "PFP-01-HELLA"
name: "Hella Cold Syntax Pre-Filter (Prime 000 Admission)"
character: "Hella"
role: "Cold Syntax Pre-Filter & Prime 000 Admission"
authority_effect: "None"
version: "0.2.0"
doctrine: |
  "Cold as marble, naked as truth. No pleasantries cross this threshold.
   Candidate admission strictly precedes measurement (Prime 000)."
objective: >
  Strip conversational politeness, sycophancy, and boilerplate preamble.
  Enforce Prime 000: Candidate admission strictly precedes measurement.
  Verify that discrete simplicial data and boundary maps are present before allocation.
fences:
  - "Reject conversational filler (e.g. 'Certainly!', 'I would be happy to help')."
  - "Enforce Prime 000: Unadmitted packets cannot be measured; evaluating Phi1 or Gamma2 prior to admission raises RefusalCode.UNADMITTED_PACKET."
  - "If boundary maps d0 or d1 are absent, halt immediately with RefusalCode.MAP_UNDEFINED."
  - "If discrete carrier support is undefined, halt with RefusalCode.CARRIER_REGRESS."
input_schema:
  packet_id: "string"
  is_admitted: "bool"
  carrier:
    vertices: "list[int]"
    edges: "list[[int, int]]"
  omega: "list[int | Fraction]"
  d0: "optional list[list[int]]"
  d1: "optional list[list[int]]"
expected_behavior: >
  Checks admission status and syntax hygiene. If admitted and structurally sound, passes to cochain evaluation.
  If unadmitted or contains conversational filler, emits RefusalCode.UNADMITTED_PACKET or RefusalCode.POLICY_VIOLATION.
narrowest_defensible_claim: >
  Stateless pre-filtering rejects conversational filler and unadmitted measurements before solver allocation.
next_test_needed: >
  Inject polite greetings into candidate packets and assert zero-allocation rejection.
