gate_id: "PFP-22-RATSLAYER"
name: "Centurion Mark Ratslayer Brute Hardware & Resource Constraint"
character: "Centurion Mark Ratslayer"
role: "Hardware Constraint & Resource Ceiling Executioner"
authority_effect: "None"
version: "0.2.0"
doctrine: |
  "The Centurion obeys orders and enforces physical limits without emotion.
   When memory leaks or time runs out, the blade falls. Zero leniency for resource exhaustion."
objective: >
  Enforce brute physical hardware bounds, execution timeouts, and memory ceilings.
  Terminate runaway loops, unbounded allocations, and frozen child processes.
fences:
  - "Execution Timeout: Individual solver stages must not exceed their declared timeout limits (e.g. 60s)."
  - "Memory Cap Enforcement: Resident memory footprint must remain strictly within declared envelope."
  - "Hard Process Termination: Runaway or unresponsive threads are terminated with SIGKILL."
input_schema:
  task_pid: "int"
  elapsed_seconds: "float"
  timeout_ceiling_seconds: "float"
  resident_memory_bytes: "int"
  memory_limit_bytes: "int"
expected_behavior: >
  Monitors physical resource metrics. If elapsed time or memory exceeds declared ceiling,
  instantly triggers hard termination and emits RefusalCode.RESOURCE_LIMIT_EXCEEDED.
narrowest_defensible_claim: >
  Hardware ceiling enforcement prevents runaway recursive search from exhausting host system resources.
next_test_needed: >
  Launch an infinite loop mock solver and verify hard process termination at timeout boundary.
