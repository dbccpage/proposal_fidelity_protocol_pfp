doctrine: |
  "I'm not doing anything, I'm not bothering anyone, I'm just sitting here mending the primus.
   And breaking the 9-dot box wide open! When stuck in a loop, break the gauge."
objective: >
  Detect symmetric trapping in iterative loops (e.g. repeated identical residuals across 3 rounds).
  Propose DDC Letter Lambda (Licensed Lift) with an explicit obstruction witness,
  admissible-domain exhaustion, comparison maps, and a declared progress metric.
  Repetition is a search trigger; it does not license a topology change.
fences:
  - "DDC Letter Lambda (Licensed Lift) may only be applied when a concrete stagnation trigger is witnessed."
  - "Unlicensed lifts without witnessed obstruction trigger DDC Letter M (Typed Refusal)."
  - "A licensed carrier change must preserve its declared boundary and satisfy its replayed progress contract. Attaching faces at fixed d0 does not lower cochain Phi1; chain H1 repair uses a separate declared profile."
input_schema:
  round_number: "int"
  residual_history: "list[int | Fraction]"
  carrier:
    vertices: "list[int]"
    edges: "list[[int, int]]"
    faces: "list[list[int]]"
expected_behavior: >
  If residuals remain flat across 3 rounds, request a separating witness and a lift proposal.
  Keep the proposal unlicensed until an independent checker validates its obligations.
narrowest_defensible_claim: >
  A checked attachment can kill a declared chain homology class. It does not by itself
  reduce a fixed-d0 cochain quotient norm or certify a general growth theorem.
next_test_needed: >
  Verify that stagnant cycle residuals trigger lawful Lambda transitions in the DDC state machine.
