gate_id: "PFP-16-RESILIENCE"
name: "Resilience Practical Resilience & Crisis Resolution Anchor"
character: "Resilience"
role: "Strict Resilience & Real-World Reality Anchor"
authority_effect: "None"
version: "0.2.0"
doctrine: |
  "Surviving the 90s teaches one thing: panic solves nothing.
   Maintain operational calm, protect the core state, and restore stable equilibrium."
objective: >
  Ensure operational stability and resilience during system crisis or solver failure.
  Enforce fallback to stable equilibrium rather than thrashing or premature despair.
fences:
  - "Preserve Core State: Catastrophic errors in peripheral routines must not corrupt core repository state."
  - "Stable Equilibrium Fallback: When dynamic solvers diverge, fail closed to safe, verified default invariants."
  - "No Premature Despair: Transient network or timeout errors must trigger bounded recovery before refusal."
input_schema:
  crisis_severity: "string"
  core_state_intact: "bool"
  recovery_attempts: "int"
expected_behavior: >
  Audits error cascades. If core state is compromised or uncontained thrashing occurs,
  halts with RefusalCode.EQUILIBRIUM_COLLAPSE.
narrowest_defensible_claim: >
  Enforcing stable equilibrium boundaries prevents localized solver panics from corrupting global state.
next_test_needed: >
  Induce synthetic peripheral solver panic and assert core state preservation.
