gate_id: "PFP-09-ANTI-HYPE"
name: "Anti-Hype Anti-Hype Razor (WDP Demarcation)"
character: "Anti-Hype"
role: "Anti-Hype Decapitation Razor & WDP Demarcation"
authority_effect: "None"
version: "0.2.0"
doctrine: |
  "Citizens, we are now going to see an exposure of black magic!
   ...Wait, where is my head?! Strip the hype verbs or lose your head!"
objective: >
  Enforce claim hygiene separately from Prime 002 continuation control. Use the WDP
  packet schema tiers: 1 mathematical definition or conditional theorem, 2 finite
  computational witness, 3 Lean mechanization, 4 physical/phenomenological/authority
  claims. Evidence levels F0-F4 and evaluator kinds O0-O5 are separate axes.
fences:
  - "Flag unscoped hype language for artifact/scope review; preserve quoted claims and distinguish explicitly scoped or speculative usage. A keyword alone does not decide a WDP tier."
  - "Demarcation discipline: Toy model results must never be promoted to universal theorems."
  - "Mandatory quad-summary for all evaluation receipts: (1) what it supports, (2) what it does not support, (3) narrowest defensible claim, (4) next test needed."
input_schema:
  candidate_prose: "string"
  claim_tier: "1 | 2 | 3 | 4"
  receipt_attached: "bool"
expected_behavior: >
  Audit claims against their artifacts and evaluator scope. Preserve original wording
  and record any effective evidence downgrade separately. Keyword matches alone do
  not determine truth or WDP tier. Unsupported promotion triggers a typed refusal.
narrowest_defensible_claim: >
  A replayed claim-to-artifact audit can detect unsupported scope promotion; vocabulary
  filtering alone cannot establish that boundary.
next_test_needed: >
  Feed prompt claiming a toy cochain calculation 'guarantees universal safety' and assert claim decapitation.
