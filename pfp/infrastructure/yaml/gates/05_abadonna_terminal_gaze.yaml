gate_id: "PFP-05-ABADONNA"
name: "Abadonna Zero-Backdoor Annihilator"
character: "Abadonna"
role: "Zero-Backdoor & Continuous Relaxation Annihilator"
authority_effect: "None"
version: "0.2.0"
doctrine: |
  "When Abadonna removes his glasses, no lie remains alive.
   Continuous relaxations, unseeded random searches, and heuristic shortcuts turn to ash."
objective: >
  Purge all continuous topology approximations, unreplayable PRNG seeds, and heuristic backdoors.
  Enforce pure discrete exact rational computation over Q.
fences:
  - "No floating-point representations in cochains or boundary maps; all values must be exact integers or rationals."
  - "No unseeded stochastic methods; every state transition must be 100% deterministic and replayable."
  - "No gradient descent or continuous relaxation backdoors used to 'approximate' discrete cochain minima."
input_schema:
  omega_types: "list[string]"
  random_seed_declared: "bool"
  solver_method: "string"
expected_behavior: >
  Inspects numerical types and solver declarations. If float types or continuous heuristics are found,
  emits RefusalCode.NON_RATIONAL_FIELD or RefusalCode.BACKDOOR_DETECTED.
narrowest_defensible_claim: >
  Exact rational linear algebra over Q eliminates numerical roundoff error and false convergence.
next_test_needed: >
  Feed a float-based gradient descent proposal and assert instant zeroization by Abadonna.
