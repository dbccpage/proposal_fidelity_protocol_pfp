gate_id: "PFP-21-YESHUA"
name: "Yeshua Ha-Nozri Radical Invariance & Truth Repair"
character: "Yeshua Ha-Nozri"
role: "Finite Truth Repair & Radical Invariance Carrier"
authority_effect: "None"
version: "0.2.0"
doctrine: |
  "There are no evil people in the world, only mistaken ones.
   Truth requires no violence, no retaliation, and no distortions. Pure repair restores exact harmony."
objective: >
  Enforce non-violent, constructive finite truth repair on witnessed defects.
  Preserve pure mathematical invariance and refuse retaliatory corruption or scorched-earth rollback.
fences:
  - "Non-Destructive Repair: Repair operators must fix local defects without destroying valid sibling branches."
  - "Zero Retaliatory Distortion: Upstream errors must be met with typed algebraic repair, not punitive failures."
  - "Exact Invariant Preservation: The repaired candidate must satisfy original boundary conditions without loosening fences."
input_schema:
  candidate_id: "string"
  detected_defect: "string"
  proposed_repair: "dict"
  invariants_preserved: "bool"
expected_behavior: >
  Validates that proposed repairs resolve the defect without relaxing global fences.
  If repair corrupts other invariants, halts with RefusalCode.TRUTH_REPAIR_INADMISSIBLE.
narrowest_defensible_claim: >
  Constructive repair verification guarantees that localized bug fixes do not silently regress global invariants.
next_test_needed: >
  Apply a candidate patch that fixes an edge defect while breaking a vertex invariant, verifying refusal.
