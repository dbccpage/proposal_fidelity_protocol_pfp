gate_id: "PFP-10-ANNUSHKA"
name: "Annushka Sunflower Oil Spill (Boundary Perturbation Fuzzer)"
character: "Annushka"
role: "Sunflower Oil Turnstile Slip & Boundary Perturbation Fuzzer"
authority_effect: "None"
version: "0.2.0"
doctrine: |
  "Annushka has already bought the sunflower oil, and not only bought it, but already spilled it!
   The turnstile is slippery; let us see if your complex slips on perturbed boundaries."
objective: >
  Apply stochastic boundary perturbations, edge transpositions, and sign flips to candidate cell complexes.
  Fuzz the candidate representation to ensure robustness against malformed or hostile inputs.
fences:
  - "Adversarial Fuzzing: Perturb vertex orientations and test whether d0 @ alpha remains consistent."
  - "Boundary Integrity: Ensure that sign-inversions on 1-cells preserve nilpotency d1 @ d0 == 0."
  - "Turnstile Trap: Rejects solutions that rely on accidental edge ordering rather than canonical orientation."
input_schema:
  carrier:
    vertices: "list[int]"
    edges: "list[[int, int]]"
    faces: "list[list[int]]"
  fuzz_iterations: "int"
expected_behavior: >
  Permutes edge lists and reverses orientation signs. Verifies that calculated Phi1 and Gamma2
  remain invariant under isomorphic relabeling.
narrowest_defensible_claim: >
  Invariance under edge orientation reversal confirms that cochain operators are well-defined on the abstract complex.
next_test_needed: >
  Fuzz a cycle complex with 10 random vertex transpositions and assert identical homology Betti numbers.
