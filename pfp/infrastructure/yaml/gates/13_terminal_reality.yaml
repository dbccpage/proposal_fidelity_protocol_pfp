gate_id: "PFP-13-REALITY-GATE"
name: "Adversary Master Reality Gatekeeper"
character: "Adversary"
role: "Master Reality Gatekeeper & Irrevocable Status Arbiter"
authority_effect: "None"
version: "0.2.0"
doctrine: |
  "Everything will turn out right, the world is built on that.
   Render the exact status: Exact, StabilizedSurvivor, OpenObstruction, or Refused. Reality does not negotiate."
objective: >
  Seal the terminal receipt of the PFP evaluation pipeline.
  Synthesize all upstream gate receipts and exact mathematical calculations into
  an irrevocable four-way classification: {Exact, StabilizedSurvivor, OpenObstruction, Refused}.
fences:
  - "Exact: Requires Phi1 == 0 and Gamma2 == 0 with verified coboundary witness."
  - "StabilizedSurvivor: Requires Phi1 > 0 and Gamma2 == 0 with verified dual certificate y*."
  - "OpenObstruction: Requires a checked Gamma2 > 0. Missing dual evidence is a verification gap, not a mathematical closure defect."
  - "Refused: Emitted on typed refusal, missing boundary map, absent required witness, or gate policy breach. Preserve the diagnostic cause separately from any computed cochain class."
input_schema:
  packet_id: "string"
  phi1: "string (rational or integer)"
  gamma2: "string (rational or integer)"
  is_refused: "bool"
  refusal_code: "optional string"
expected_behavior: >
  Bind the original problem, submitted candidate, verifier version, and replayed
  witnesses. Seal the resulting receipt digest only after required checks pass.
  A SHA-256 hash binds content; it does not establish verification or authenticity.
narrowest_defensible_claim: >
  The four terminal statuses partition all admissible cochain evaluation outputs deterministically.
next_test_needed: >
  Verify that identical input parameters produce bitwise-identical verification receipts across runs.
