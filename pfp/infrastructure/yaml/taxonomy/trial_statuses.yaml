categories:
- id: PLANNED
  is_terminal: false
  description: A materialized prompt capsule without a completed provider observation.
- id: HOST_ACCEPTED
  is_terminal: true
  description: The exact finite witness and complete typed response passed the declared host checker.
- id: TYPED_REFUSAL
  is_terminal: true
  description: The host rejected a malformed or mathematically invalid candidate; provider completion alone is not acceptance.
- id: INFRASTRUCTURE_ERROR
  is_terminal: true
  description: Provider, transport, custody or billing failure; not a mathematical failure or a free run.
- id: NOT_RUN
  is_terminal: false
  description: Trial has not yet started
- id: RUNNING
  is_terminal: false
  description: Trial is actively executing
- id: COMPLETED
  is_terminal: true
  description: Trial completed execution
- id: FAILED
  is_terminal: true
  description: Trial execution encountered an error
- id: REFUSED
  is_terminal: true
  description: Trial terminated with verified refusal
- id: PASS
  is_terminal: true
  description: Trial passed all verification gates
- id: FAIL
  is_terminal: true
  description: Trial failed one or more verification gates
