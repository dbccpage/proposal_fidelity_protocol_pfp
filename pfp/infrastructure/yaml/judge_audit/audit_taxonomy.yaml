$schema: "https://json-schema.org/draft/2020-12/schema"
schema: pfp.judge-audit-taxonomy.v1
authority_effect: None
title: "PFP Judge Audit Classification Taxonomy"
description: "Authoritative enumeration of judge packet audit outcome codes, refusal status identifiers, and leakage detection verdict tokens."

outcome_codes:
  ACCEPT: "A"
  REJECT: "R"
  EXCEPTION: "E"
  TIMEOUT: "T"
  UNINTERPRETABLE: "U"
  HARD_TIMEOUT: "W"
  WORKER_CRASH: "W"
  MISSING: "M"
  NOT_RUN: "M"

