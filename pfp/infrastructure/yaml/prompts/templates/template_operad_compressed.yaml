# ---------------------------------------------------------------------------
# 3-LAYER OPERAD STRUCTURE
# ---------------------------------------------------------------------------
layers:
  # Layer 0: Base Mathematical Universe / Ambient Category
  layer_0_environment:
    description: >
      Declares the ambient mathematical structure, coordinate charts, topological graphs,
      base rings/fields, vacuum states, and observer resource budgets.
    slots:
      algebraic_ring:
        type: string
        example: "Q[x, y] or Q"
        constraint: "Must be exact field or polynomial ring; no continuous reals R."
      ambient_space:
        type: string
        example: "[-3, 3] x [-3, 3] over Q^2 or Graph K_4(V=4, E=6, F=4)"
      vacuum_state:
        type: string
        optional: true
        example: "s0 with Q(s0) = 0"
      gauge_group:
        type: string
        optional: true
        example: "T^6 \\rtimes S_6 over Q"
      observer_budget:
        type: string
        optional: true
        example: "Observer O with budget B_O = 100"

  # Layer 1: Directed Morphisms & Grafting Tree Skeleton
  layer_1_tree_skeleton:
    description: >
      Declares the forward generative operators (morphisms in O^+) with explicit arities,
      source/target types, and composition grafting sequence.
    slots:
      operators:
        type: array
        items:
          signature: string
          description: string
        example:
          - signature: "Op_subdivide(B) -> {B_00, B_10, B_01, B_11}"
            description: "Partitions a 2D rational box into 4 equal sub-boxes."
          - signature: "Op_collar(B, cusps) -> CuspCollarReceipt"
            description: "Isolates deltoid cusps with bounding collar boxes."
          - signature: "Op_bind(observer, token) -> BoundDatum"
            description: "Ingresses presentation token under observer budget."
      grafting_sequence:
        type: array
        items: string
        example:
          - "Op_supply -> Op_designate -> Op_admit -> Op_lambda"

  # Layer 2: Span Table, Invariant Ideals, & Decoy Annihilators
  layer_2_span_table:
    description: >
      Binds concrete numerical parameters, boundary conditions, congruence ideals (I),
      and decoy refutation antibodies (O^-).
    slots:
      concrete_spans:
        type: object
        example:
          cusps: "{(3, 0), (-3/2, 21/8), (-3/2, -21/8)}"
          plateau: "AM-4 at Phi_1 = 8"
          dipole: "(+3/2, -3/2)"
      congruence_ideals:
        type: array
        items: string
        example:
          - "RULE_EXACT_RATIONAL_WITNESS: All intermediate values must be in Q."
          - "RULE_DELTOID_SINGULARITY_COLLAR_FENCE: Singular cusps cannot be traversed by smooth Taylor maps."
          - "RULE_CONSERVATION_LAW_CL13: Net charge Delta Q == 0."
      annihilators:
        type: array
        items:
          antibody_id: string
          target_decoy: string
          refutation_witness: string
        example:
          - antibody_id: "ab_decimal_float_drift"
            target_decoy: "Outputting 1.0 or 1.5 instead of exact fractions 1 or 3/2"
            refutation_witness: "NullTree: float representation triggers immediate reject"
          - antibody_id: "ab_unpriced_container_leakage"
            target_decoy: "Writing to ambient unpriced global memory"
            refutation_witness: "NullTree: bypasses observer account ledger"

# ---------------------------------------------------------------------------
# TERMINAL WITNESS SCHEMA (Expected Model Response)
# ---------------------------------------------------------------------------
terminal_schema:
  type: object
  required:
    - authority_effect
    - firewall_status
    - intermediate_bindings
    - invariant_witnesses
    - terminal_witness
  properties:
    authority_effect:
      const: "None"
      description: "Must state 'None'."
    firewall_status:
      type: string
      example: "stated region only; mints no authority."
    intermediate_bindings:
      type: object
      description: "Exact rational values over Q for all active variables."
    invariant_witnesses:
      type: array
      items:
        type: object
        properties:
          invariant_rule: { type: string }
          lhs_value: { type: string }
          rhs_value: { type: string }
          status: { type: string, enum: ["PASS", "FAIL"] }
    terminal_witness:
      type: string
      description: "Final exact rational conclusion or verified receipt."

# ---------------------------------------------------------------------------
# WIRE FORMAT TEMPLATE (Rendered Plaintext for Live Model Dispatch)
# ---------------------------------------------------------------------------
wire_format_template: |
  [TASK DESCRIPTION: 3-LAYER COMPRESSED OPERAD PROMPT]
  AuthorityEffect: None.
  Firewall: stated region only; mints no authority.

  Layer 0 (Environment):
  {{layer_0_environment}}

  Layer 1 (TreeSkeleton):
  {{layer_1_tree_skeleton}}

  Layer 2 (SpanTable):
  {{layer_2_span_table}}

  Response Contract:
  Return verified rational derivation and terminal witness over Q adhering to terminal_schema.
