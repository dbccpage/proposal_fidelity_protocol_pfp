  summary:
    narrowest_defensible_thesis: The narrowest defensible claim.
    evidence_scope: What the current evidence supports, and what it does not support.
    next_concrete_test: The next test needed to advance the evidence level.
  seed_sections: []
  process_integrity:
    seed_allows_theory_refutation: true|false
    detected_prompt_biases: []
    should_continue: true|false
