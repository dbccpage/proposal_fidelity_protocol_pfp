          title: Rows
          type: array
          x-slot: data
      required:
      - name
      - rows
      title: ResponseSectionValue
      type: object
    ResponseSummaryValue:
      additionalProperties: false
      properties:
        narrowest_defensible_thesis:
          minLength: 1
          pattern: \S
          title: Narrowest Defensible Thesis
          type: string
          x-slot: data
        evidence_scope:
          minLength: 1
          pattern: \S
          title: Evidence Scope
          type: string
          x-slot: data
        next_concrete_test:
          minLength: 1
          pattern: \S
          title: Next Concrete Test
