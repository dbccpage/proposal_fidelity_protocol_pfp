  additionalProperties: false
  description: Actual model response. Descriptive strings and true|false placeholders
    belong only to the template.
  properties:
    derived_under_policy:
      const: SPK-001
      title: Derived Under Policy
      type: string
      x-slot: data
    summary:
      $ref: '#/$defs/ResponseSummaryValue'
      x-slot: data
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name:
            const: po035_derivation
          rows:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                prompt_id: &id002
                  type: string
                  minLength: 1
                  maxLength: 900
                status:
                  enum:
                  - PROPOSAL
                  - TYPED_REFUSAL
                derivation:
                  type: object
                  additionalProperties: false
                  properties:
                    claim: *id002
                    assumptions:
                      type: array
                      items: *id002
                      minItems: 1
                      maxItems: 12
                    steps:
                      type: array
                      items: *id002
                      minItems: 1
                      maxItems: 12
                    open_obligations:
                      type: array
                      items: *id002
                      minItems: 1
                      maxItems: 12
                    limitations:
                      type: array
                      items: *id002
                      minItems: 1
                      maxItems: 12
                  required:
                  - claim
                  - assumptions
                  - steps
                  - open_obligations
                  - limitations
                certificate:
                  anyOf:
                  - type: object
                    additionalProperties: false
                    properties:
                      cosine_before: &id003
                        type: string
                        maxLength: 100
                        pattern: ^-?(0|[1-9][0-9]*)(/[1-9][0-9]*)?$
                      cosine_after: *id003
                      curvature_before: *id003
                      curvature_after: *id003
                      d1d0:
                        type: array
                        items: *id003
                        minItems: 3
                        maxItems: 3
                      quotient_domain_degree: &id004
                        type: integer
                      curvature_codomain_degree: *id004
                    required:
                    - cosine_before
                    - cosine_after
                    - curvature_before
                    - curvature_after
                    - d1d0
                    - quotient_domain_degree
                    - curvature_codomain_degree
                  - type: 'null'
                requested_lifts:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id: *id002
                      reason: *id002
                    required:
                    - id
                    - reason
                learning:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      kind:
                        enum:
                        - skill
                        - antiskill
                        - rule
                        - pattern
                        - antibody
                      text: *id002
                      failure_or_gain: *id002
                    required:
                    - kind
                    - text
                    - failure_or_gain
                  minItems: 1
                  maxItems: 15
              required:
              - prompt_id
              - status
              - derivation
              - certificate
              - requested_lifts
              - learning
            minItems: 1
            maxItems: 1
        required:
        - name
        - rows
      minItems: 1
      maxItems: 1
    process_integrity:
      $ref: '#/$defs/ProcessIntegrityValue'
      x-slot: data
  required:
  - derived_under_policy
  - summary
  - process_integrity
  - sections
