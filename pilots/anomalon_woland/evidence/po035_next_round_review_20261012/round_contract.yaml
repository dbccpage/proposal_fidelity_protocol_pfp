schema: pfp.po035-next-round-plan.v1
authority_effect: None
date: '2026-10-12'
status: PLANNED
dispatch_performed: false
new_provider_calls: 0
source_revision: 5452a476dd88d05d19de60c3ea7e6607ac14ede0
historical_reference: ../po035_derivations_20261012_v2/reviewed_final_prompts
experimental_question: Does filtered procedural guidance improve one-shot results on a common corrected PFP scaffold?
evidence_ceiling: Five matched tasks are a discovery screen, not a general reliability estimate or mathematical proof.
design:
  task_count: 5
  pilot_run_count: 5
  arms: [neutral, guided]
  proposed_provider_calls: 10
  provider_calls_per_run_max: 2
  provider_calls_per_task: 2
  max_output_tokens: 2500
  output_instruction: One consistent completion ceiling; remove the separate historical 2200-token instruction.
  temperature: 0
  reasoning_enabled: false
  paired_seed: identical_within_task
  request_state: fresh_stateless
  fixed_within_pair:
    - original_seed_bytes
    - versioned_system_scope
    - source_context_and_authoritative_clarifications
    - task_scoped_license_manifest
    - strict_response_schema_and_placement
    - original_fixture_and_independent_judge
    - model_and_provider_route
    - decoding_and_output_ceiling
  variable_within_pair: filtered_procedural_guidance_bundle
  necessary_identity_difference: unique_prompt_id_bound_to_each_request
  forbidden:
    - old_model_reply_or_feedback_in_either_arm
    - retry_or_fallback
    - json_repair
    - followup_correction_or_adaptive_lift_turn
    - cross_arm_output_reuse
    - hidden_second_model_call_for_learning
    - output_answer_examples_or_fixture_conclusions_in_guidance
  historical_v4_role: audit_reference_only
  causal_scope: Guidance bundle on the revised common scaffold; no attribution to individual items or comparison with historical adaptive loops.
budget:
  per_run:
    max_cost_microusd: 50000
    max_total_provider_tokens: 120000
    max_elapsed_seconds: 180
    interval: dispatch_and_host_stages
  initial_round_worst_case:
    cost_microusd: 250000
    total_provider_tokens: 600000
    serial_elapsed_seconds: 900
  catalog_discovery:
    separate_reported_interval: true
    max_seconds: 20
  reservation_required_before_dispatch: true
  reserve_both_arms_before_first_dispatch: true
  budget_scope: shared_across_both_arms_and_host_stages_with_no_reset_or_pooling
  arm_deadlines: symmetric_allowances_within_shared_180_seconds_including_host_overhead
  incomplete_pair: CAP_CENSORED_not_a_model_failure_or_guidance_loss
  censored_pair_fields: [observed_arm_order, remaining_budget, missing_arm_reason]
  missing_cost_or_usage: STOP_UNRECONCILED
  any_cap_failure: STOP
  cap_escalation: requires_user_instruction
  automatic_repeats: 0
  automatic_model_escalation: false
model_selection:
  policy: One verified eligible cheap route for the first paired screen; prefer verified zero price.
  historical_candidate_only: nvidia/nemotron-3.5-lightning:free
  current_availability_and_price: NOT_VERIFIED_FOR_NEXT_ROUND
  verify_catalog_and_supported_decoding_before_dispatch: true
  suffix_is_not_cost_evidence: true
  structured_output_enforcement: host_validation_only_unless_route_support_is_verified
preflight:
  implemented_this_review: false
  required:
    - Version and hash the system-scope conditional-import variant and its base template.
    - Map declared finite carriers without asserting analytical premises derive from symbol primitives.
    - Preserve verbatim seeds; version and hash common authoritative notation clarifications.
    - Supply a pinned eight-stage section-5 excerpt for pilot_0000201, with disputed assertions labeled.
    - Correct pilot_0000202 complex-identity terminology outside untrusted guidance.
    - Supply identical task-scoped licenses in both arms and omit irrelevant historical grants.
    - Remove stale loop instructions; bind every new prompt ID exactly.
    - Keep full strict schemas, original fixtures and independent judges unchanged.
    - Filter qualitative and numerical outcome disclosure from guidance.
    - Keep fresh guidance alias, kind, text and authorship in wire; bind aliases to full historical provenance in sidecars.
    - Request one useful learning item; reserve all other learning extraction for offline review.
    - Verify neutral/guided normalized payload equality outside guidance and identity fields.
    - Freeze and hash raw requests, renderer, source excerpt, clarifications, licenses, guidance and decoding.
    - Verify original finite controls and decisive negative controls offline before dispatch.
    - Freeze analytical checklists and blind arm labels for independent review; classify central open constructions as partial rather than full success.
    - Verify route prices, reserve worst-case cost and tokens, and bound the transport deadline.
run_matrix:
  - pilot_id: pilot_0000199
    order: [neutral, guided]
    licenses: [EXACT_RATIONAL, REFINEMENT_HYPOTHESES, TYPED_REFUSAL]
    goal: Correct scaling, outside-cone and null-boundary reasoning with separate order, metric and isotropy claims.
  - pilot_id: pilot_0000200
    order: [guided, neutral]
    licenses: [EXACT_RATIONAL, COMMUTING_PROJECTOR, REFINEMENT_HYPOTHESES, TYPED_REFUSAL]
    goal: Derive projected local balance with correctly typed flux and source; distinguish fixture behavior from conditional conservation.
    fixture_must_remain_noncommuting: true
    excluded_guidance_source: pilot_0000200:v2:loop03:antiskill:04
    exclusion_reason: Contains a qualitative fixture conclusion; retain only in historical evidence.
  - pilot_id: pilot_0000201
    order: [neutral, guided]
    licenses: [EXACT_RATIONAL, FIBER_CONNECTION, TYPED_REFUSAL]
    goal: Repair all eight categorical stages with typed transport, relations, covariant curvature and separate identity control.
  - pilot_id: pilot_0000202
    order: [guided, neutral]
    licenses: [EXACT_RATIONAL, FIBER_CONNECTION, INTRINSIC_METRIC, TYPED_REFUSAL]
    goal: Type the quotient map and kernel; separate additive cochains from a conditional intrinsic Levi-Civita metric bridge.
  - pilot_id: pilot_0000203
    order: [neutral, guided]
    licenses: [EXACT_RATIONAL, OPERATIONAL_POLICY, TYPED_REFUSAL]
    goal: Certify the exact quotient objective and separate continuing dynamics from an explicit certificate-based terminal policy.
scoring:
  schema: strict_JSON_SPK_envelope_types_placement_and_exact_identity
  finite_witness: unchanged_independent_predicates
  typed_refusal: separate_outcome_never_task_success
  analytical:
    reviewers: 2
    independent: true
    arm_blinded: true
    disagreement: UNRESOLVED
    acceptance: Every essential per-task obligation in README addressed correctly with explicit premises and no critical false claim.
    status_ceiling: independent_review_not_formal_certification
  full_task_success: schema_valid_and_finite_accepted_and_all_essential_analytical_obligations_satisfied
  record_failure_types:
    - infrastructure_or_unknown_usage_cost
    - invalid_JSON
    - schema_or_placement_violation
    - wrong_prompt_identity
    - typed_refusal_or_missing_license
    - incorrect_finite_witness
    - incomplete_analytical_derivation
    - critical_analytical_error
    - observed_truncation
  record_resources: [prompt_tokens, completion_tokens, reasoning_tokens_if_reported, total_tokens, reported_cost, elapsed_seconds, finish_reason]
  deterministic_host_checks_are_model_trials: false
decision_after_ten:
  mandatory_stop: true
  desired_guidance_signal:
    additional_joint_schema_and_witness_successes_min: 2
    losses_on_neutral_solved_tasks_max: 0
    new_critical_analytical_errors_max: 0
  analytical_gains_reported_separately: true
  threshold_is_statistical_evidence: false
  positive_signal: Propose one further matched seed block; do not dispatch automatically.
  format_failure_in_both: Simplify shared contract without changing task or judge.
  mathematical_failure_after_valid_format: Improve representation or procedural lessons without weakening predicates.
  no_guidance_gain: Preserve the negative result; no hint or loop escalation in a scored single shot.
  learning_admission: None automatic; later new-instance controls required for promotion.
validation_scope:
  targeted_local_only: true
  checks: [YAML_parse, source_hashes, referenced_paths, budget_arithmetic, Markdown_lint]
  full_canonical_ci: false
