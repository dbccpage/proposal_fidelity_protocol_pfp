original_seed: 'Repair the PO035 §5 eight-stage relational spine by defining actual
  categories, objects, morphisms, identity and composition laws, representation/fiber
  transport, and covariant difference operators. A vocabulary ordering is not a functor.
  Identify which transitions are constructions and which add independent assumptions.
  Show the identity-transport zero-obstruction control and explain why a positive
  obstruction does not follow from stages 1-6. Derive the connection-curvature correction
  to a naive d_T²=0 assertion.

  For an exact witness use three one-dimensional rational fibers with T01=2,T12=3,T02=5
  and σ=(1,2,4). Define δ_ij=σ_j-Tij σ_i, oriented 01,12,02; the 2-cell path relation
  is 02=12∘01. Return certificate composite_transport, direct_transport, covariant_delta
  (3 rationals), flat_relation_holds (boolean), identity_delta and identity_repair
  (3 rationals). For the identity control δ_ij=σ_j-σ_i and repair means α with δ+d0
  α=0. Propose a sound categorical/covariant construction, or explicitly identify
  its remaining obligations; checking these numbers alone is not the derivation. Mine
  useful learning and request missing lifts.'
