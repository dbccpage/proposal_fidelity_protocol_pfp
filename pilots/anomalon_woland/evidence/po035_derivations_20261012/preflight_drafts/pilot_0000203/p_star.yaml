original_seed: 'Repair PO035 §7. Derive finite l1 quotient dual certification and
  distinguish static non-repairability from dynamical halting. Give one transition
  system that continues despite positive obstruction and a different explicit terminal
  policy that halts on a certified obstruction; show which implication depends on
  that policy. Classify physical/human-experience consequences as interpretations
  pending a measurement model. Explain how exact witnesses avoid tolerance-induced
  false zero authorization.

  For an exact tiny nonzero class use d0=[[-1,1,0],[0,-1,1],[1,0,-1]], δ=(1/100000000,1/100000000,1/100000000).
  Return certificate α and dual as 3 rational-string vectors, primal_norm and dual_value
  as rational strings, continuing_transition as two integers [state,next_state] for
  your explicit unbounded counter-system, and policy_halts as boolean for your separately
  declared certificate-based policy. The host checks finite primal/dual feasibility
  and equality, not any assertion that arbitrary systems or physics halt. Give the
  general weak-duality argument and all assumptions needed to attain the finite optimum.
  Mine reusable learning and request missing lifts.'
