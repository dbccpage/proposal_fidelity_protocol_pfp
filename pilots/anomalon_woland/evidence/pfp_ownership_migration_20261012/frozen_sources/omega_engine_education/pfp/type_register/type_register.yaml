  - python/domain/mode.py::ModeFile
  kind: projection
- type: python/domain/mode.py::ManifestMode
  of:
  - python/domain/mode.py::ModeFile
  kind: projection
  checked_by: python/tests/test_modes_and_stages_types.py::test_manifest_consistent_with_modes_and_doc07
- type: python/domain/pilot.py::PilotInstance
  of:
  - python/domain/pilot.py::NoLlmPilotFamily
  - python/domain/pilot.py::LlmPilotFamily
  kind: computed
  checked_by: python/tests/test_pilot_types.py::test_instance_and_result_invariants
- type: python/domain/provider_records.py::BillingSummary
  of:
  - python/domain/provider_records.py::LedgerRequest
  kind: aggregate
