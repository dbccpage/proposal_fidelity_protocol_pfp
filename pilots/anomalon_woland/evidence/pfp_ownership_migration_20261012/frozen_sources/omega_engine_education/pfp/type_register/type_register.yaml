name_collisions:
- name: AuthorityEffect
  modules:
  - python/domain/mode.py
  - python/domain/stage.py
  disposition: Both generated from *_types.yaml; one shared enum needs a generator
    change.
- name: ByteSpan
  modules:
  - python/domain/prompt_templates/models.py
  - rewriting/rewriting_types.py
  disposition: Part of the byte_span overlap below.
- name: ClaimHygiene
  modules:
  - cycle_balance/pfp_cycle_balance_quartet.py
  - python/domain/prompt_templates/models.py
  disposition: Different fields under one name. Rename one, or make one versioned
    record.
- name: ComparisonOperator
  modules:
  - _canonical_types/pfp_data_types.py
  - gates/gate_types.py
  disposition: Gate comparison operator enum.
- name: EmpiricalGate
  modules:
  - _canonical_types/pfp_data_types.py
  - gates/gate_types.py
  disposition: Empirical gate definition.
- name: GateRegister
  modules:
  - _canonical_types/pfp_data_types.py
  - gates/gate_types.py
  disposition: Gate register aggregate.
- name: Intergate
  modules:
  - _canonical_types/pfp_data_types.py
  - gates/gate_types.py
  disposition: Intergate definition.
- name: ModeCluster
  modules:
  - modes/mode_catalog.py
  - python/domain/mode.py
  disposition: Same five clusters twice. Keep the generated one; awaits the owner.
- name: PrimaryGate
  modules:
  - _canonical_types/pfp_data_types.py
  - gates/gate_types.py
  disposition: Primary gate definition.
- name: SpanRole
  modules:
  - python/domain/pfp/packet.py
  - rewriting/rewriting_types.py
  disposition: Part of the byte_span overlap below.
overlaps:
- fact: byte_span
  types:
  - prompts/prompt_representations/relational_prompt_representation.py::RelationalSpanRow
  - python/domain/pfp/packet.py::Span
  - python/domain/prompt_templates/models.py::ByteSpan
  - python/domain/prompt_templates/models.py::ProtectedSpan
  - rewriting/rewriting_types.py::ByteSpan
  disposition: One span of UTF-8 bytes with a role. spans/pfp_span.py is the candidate
    base.
- fact: mode
  types:
  - modes/mode_catalog.py::ManifestModeRef
  - modes/mode_catalog.py::ModeCatalogEntry
  - modes/mode_catalog.py::ModeContractHeader
  - python/domain/mode.py::ManifestMode
  - python/domain/mode.py::ModeFile
  disposition: ModeFile is the base; the other four are projections of it.
- fact: one_model_call
  types:
  - python/domain/provider_records.py::LedgerRequest
  - python/domain/provider_records.py::LiveRunReceipt
  - python/domain/provider_records.py::ProviderCallResult
  - python/domain/rewrite.py::TrialObservation
  disposition: ProviderCallResult is the candidate base; a ledger row and a receipt
    add custody.
- fact: prompt_packet
  types:
  - prompts/pfp_prompt.py::PfpPrompt
  - python/domain/prompt_templates/models.py::PromptPacket
  disposition: python/domain/prompt.py has a fourth (a dataclass, outside this census).
    The owner picks the base.
- fact: trial
  types:
  - python/domain/pilot.py::PilotInstance
  - python/domain/rewrite.py::ComparisonTrial
  disposition: PilotTrial and ComparisonTrial have the same attributes. A PFP-PILOT-001
    trial is one PilotInstance of an LLM pilot family.
derived:
- type: cycle_balance/pfp_cycle_balance_quartet.py::BoundaryMatrices
  of:
  - cycle_balance/pfp_cycle_balance_quartet.py::Carrier
