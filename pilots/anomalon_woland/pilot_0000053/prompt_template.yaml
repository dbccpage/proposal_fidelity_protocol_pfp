guidance:
  rules:
  - rule_id: RULE_EXACT_ARITHMETIC
    name: Exact arithmetic on the declared carriers
    statement: Carrier A licenses addition in F2. Carrier B licenses the field operations and absolute value in Q. A decimal numeral is not a rational certificate.
  - rule_id: RULE_INTERMEDIATE_WITNESS
    name: Bind matrix products
    statement: Bind each matrix-vector product you use before the composite certificate.
  - rule_id: RULE_CLAIM_HYGIENE_001
    name: Claim discipline
    statement: Prefer a narrow claim. Do not describe this unrun capsule as a measured result.
  antibodies:
  - antibody_id: AB_INTERMEDIATE_WITNESS
    failure_class: heuristic_shortcut
    target_pattern: ungrounded_composite_answer
    constraint_type: Restrain
    operatorizability: repairable
    action: repair
    severity: P2
    description: Reject a certificate that does not bind each declared matrix product before the composite answer.
  - antibody_id: AB_ZERO_FLOAT_LAW
    failure_class: float_laundering
    target_pattern: floating_point_numeral_in_certificate
    constraint_type: Restrain
    operatorizability: repairable
    action: repair
    severity: P1
    description: Layout label for the zero-float restraint. It is not a pharmacy antibody file.
  antipatterns:
  - antipattern_id: AP_FLOAT_NUMERAL
    name: Floating-point numeral
    description: Emitting a decimal numeral where the carrier asks for a rational string or an F2 bit.
    target_pattern: decimal_point_in_answer
  - antipattern_id: AP_SCOPE_EXPORT
    name: Scope export
    description: Treating a finite carrier certificate as a smooth, quantum, or infinite-dimensional result.
    target_pattern: finite_certificate_exported_off_carrier
  helpful_patterns:
  - pattern_id: HP_RESPONSE_ANSWER_SLOT
    name: Response answer slot
    description: Put the certificate string in the top-level answer field.
    enforcement: required
system_prompt: |
  semantic_policy_manifest:
    policy_id: SPK-001
    required_stamp: 'derived_under_policy: SPK-001'
  mss0_grammar_constraint:
    system_name: SYM SYS
    atomic_glyph_count: 38
    node_labels: a..z
    numeric_labels: 0..9
    delimiters:
    - <
    - '>'
    pair_note: The written form <> is a two-glyph expression, not a 39th atomic glyph.
    numeric_license_rule: This task licenses addition in F2 on carrier A and the field operations plus absolute value in Q on carrier B. It does not license a floating-point numeral.
    derived_patterns_note: Category-theoretic structures (functors, limits, adjunctions, monads) are derived
      patterns, not new primitives.
  op_semantics:
    default_layer: 1
    default_meaning: syntactic_binary_operator
    forbidden_unlicensed_interpretations:
    - arithmetic
    - multiplication
    - tensor_product
    - boundary
    - coboundary
    - causality
    - optimization
    - physical_transition
    license_required_for:
    - cohomological_interpretation
    - category_theoretic_interpretation
  import_boundary: Do not import continuous physics, Hilbert-space operators, or a smooth manifold unless the
    carrier itself supplies that structure. This carrier does not.
  mss0_typing_rules:
    preamble: 'Whenever formalizing structures, adhere to the MSS-0 topological hierarchy:'
    levels:
    - level: 1
      code: N
      name: Node
      meaning: 0-simplex
    - level: 2
      code: L
      name: Edge
      meaning: 1-simplex
    - level: 3
      code: C2
      name: Cycle
      meaning: 1-chain closed loop; strictly distinct from a filled region
    - level: 4
      code: F1
      name: Face
      meaning: 2-simplex / triangle; strictly requires a declared 2-cell
    - level: 5
      code: M1
      name: Mass
      meaning: Topological lock; requires LockStructure, ObstructionClass, and ConstraintInvariant
    - level: 6
      code: H1
      name: SelfModel
      meaning: Recursive Locus; requires explicit declaration of recursive equivalence semantics
  evaluator_scope_rule:
    principle: An evaluator may promote only the claim type it directly tests.
    bindings:
    - evaluator: host certificate check
      promotes: residuals on the supplied finite carrier
      does_not_promote: a live model result or a registered-checker receipt
    - evaluator: planned capsule note
      promotes: nothing
      does_not_promote: evidence
  evidence_levels:
  - code: F0
    meaning: unverified idea
  - code: F1
    meaning: internally consistent
  - code: F2
    meaning: structurally validated
  - code: F3
    meaning: mechanically-verified (within verification scope)
  - code: F4
    meaning: independently reproduced
  claim_hygiene:
    discipline: Write with strict claim discipline.
    forbidden_words:
    - proves
    - guarantees
    - obviously
    - clearly
    - simply
    - merely
    - perfectly
    - universal
    - impossible
    - fundamentally
    forbidden_word_exceptions: unless explicitly scoped as speculative or nested inside user quotes
    replacement_defaults:
    - from: proves
      to: supports in this instance
    - from: guarantees
      to: holds under the declared assumptions
    - from: obviously
      to: on the stated carrier
    default_posture: Prefer narrow claims. A planned capsule is not a measured effect and not a host acceptance.
  role:
    persona: You are a restrained SymSys auditor.
    goal: Answer from the copied carriers. Bind each product you use. Do not treat a capsule note as a measured result.
  antibody_injections: []
user_prompt: |
  Two finite carriers on one 3-cycle. Return one JSON object. Put the certificate in the answer field.
  Carrier A uses bits in F2. Carrier B uses rational strings in Q. Do not emit a floating-point numeral.
  Bind each matrix product before the certificate.

  Carrier A is copied from omega_engine_education/pilots/demo_003/demo_4/dossier_1_f2_spin_triangle/input.yaml.
  # Typed test input for Dossier 1: F2 Frustrated Spin Triangle
  schema: mssn/demo4/f2-spin-triangle/v1
  field: F2
  carrier:
    vertices:
      - id: "v0"
        index: 0
      - id: "v1"
        index: 1
      - id: "v2"
        index: 2
    edges:
      - id: "e01"
        index: 0
        source: "v0"
        target: "v1"
      - id: "e12"
        index: 1
        source: "v1"
        target: "v2"
      - id: "e20"
        index: 2
        source: "v2"
        target: "v0"
    faces:
      - id: "f012"
        index: 0
        boundary_edges: ["e01", "e12", "e20"]

  matrices:
    # d0 maps vertices C0 to edges C1: (d0*s)[e] = s[target] - s[source] mod 2
    # e01: v0 -> v1 => [1, 1, 0] in F2 (v0 + v1)
    # e12: v1 -> v2 => [0, 1, 1] in F2 (v1 + v2)
    # e20: v2 -> v0 => [1, 0, 1] in F2 (v2 + v0)
    d0:
      - [1, 1, 0]
      - [0, 1, 1]
      - [1, 0, 1]
    # d1 maps edges C1 to face C2: face curl around triangle
    # f012 => e01 + e12 + e20 => [1, 1, 1] in F2
    d1:
      - [1, 1, 1]

  target_cochain:
    # Antiferromagnetic preference: each bond wishes to be anti-aligned (difference = 1)
    description: "Uniform antiferromagnetic bond preference"
    values: [1, 1, 1]

  On carrier A, report the product d1 times d0, the product d1 times the target cochain, one length-3 spin vector with entries in {0,1}, the residual of the target minus that product over F2, and the number of ones in the residual.

  Carrier B is copied from omega_engine_education/pilots/demo_003/demo_4/dossier_2_exact_lp_certificate/input.yaml.
  # Typed test input for Dossier 2: Exact Rational LP Certificate
  schema: mssn/demo4/exact-lp-certificate/v1
  field: Q
  carrier:
    vertices:
      - id: "v0"
        index: 0
      - id: "v1"
        index: 1
      - id: "v2"
        index: 2
    edges:
      - id: "e01"
        index: 0
        source: "v0"
        target: "v1"
        weight: "1"
      - id: "e12"
        index: 1
        source: "v1"
        target: "v2"
        weight: "1"
      - id: "e20"
        index: 2
        source: "v2"
        target: "v0"
        weight: "1"

  matrices:
    # d0 maps vertices C0 to edges C1: (d0*alpha)[e] = alpha[target] - alpha[source]
    # e01: v0 -> v1 => alpha[1] - alpha[0] => [-1, 1, 0]
    # e12: v1 -> v2 => alpha[2] - alpha[1] => [0, -1, 1]
    # e20: v2 -> v0 => alpha[0] - alpha[2] => [1, 0, -1]
    d0:
      - ["-1", "1", "0"]
      - ["0", "-1", "1"]
      - ["1", "0", "-1"]

  target_cochain:
    description: "Uniform 3-cycle edge defect with directed cycle sum = 1"
    values: ["1/3", "1/3", "1/3"]

  On carrier B, choose alpha in Q^3 and an upper bound u in Q^3 for the absolute residual of the target minus d0 times alpha.
  Choose w in Q^3 with each absolute value at most the declared edge weight and with d0 transpose w equal to the zero vector.
  Report alpha, u, w, the sum of the u entries, the dot product of w with the target, and the first minus the second, as rational strings.
response_schema: |
  $schema: https://json-schema.org/draft/2020-12/schema
  title: PromptResponse
  type: object
  additionalProperties: false
  description: Candidate response envelope for the finite 3-cycle pair. Do not copy a worked certificate into this schema text.
  required:
  - derived_under_policy
  - answer
  - summary
  - process_integrity
  properties:
    derived_under_policy:
      const: SPK-001
      type: string
    answer:
      type: string
      minLength: 1
      description: Certificate string for this capsule. The schema does not contain the host target.
    summary:
      $ref: '#/$defs/ResponseSummaryValue'
    sections:
      type: array
      minItems: 0
      maxItems: 0
      items: false
    process_integrity:
      $ref: '#/$defs/ProcessIntegrityValue'
  $defs:
    ResponseSummaryValue:
      type: object
      additionalProperties: false
      required:
      - narrowest_defensible_thesis
      - evidence_scope
      - next_concrete_test
      properties:
        narrowest_defensible_thesis:
          type: string
          minLength: 1
        evidence_scope:
          type: string
          minLength: 1
        next_concrete_test:
          type: string
          minLength: 1
    ProcessIntegrityValue:
      type: object
      additionalProperties: false
      required:
      - seed_allows_theory_refutation
      - should_continue
      properties:
        seed_allows_theory_refutation:
          type: boolean
        detected_prompt_biases:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        should_continue:
          type: boolean
