    derivation:
      assumptions:
      - Six congruent triangles form a regular star.
      - 'Radial edges: length r, rim edges: length 1.'
      - Central vertex connected to six rim vertices forming a cycle.
      - d0 and d1 are boundary operators on the chain complex.
      - Cosine computed via law of cosines in each triangle.
      - Curvature defined as deficit angle at central vertex.
      claim: "In the finite model, changing r from 1 to 2 changes the central cosine\
        \ from 1/2 to -1/8 and the curvature from 0 to 1 (in units of triangle count),\
        \ while d1\u2218d0 remains the exact rational vector (1/2,1/2,1/2)."
      steps:
      - "Step 1: For r=1, triangle sides are (1,1,1). By law of cosines, cos(angle\
        \ opposite rim) = (1^2+1^2-1^2)/(2*1*1) = 1/2. The central angle between two\
        \ adjacent radial edges is 60\xB0, six such angles sum to 360\xB0, deficit\
        \ = 0."
      - "Step 2: For r=2, triangle sides are (2,2,1). Law of cosines gives cos(angle\
        \ opposite rim) = (2^2+2^2-1^2)/(2*2*2) = (4+4-1)/8 = 7/8. The supplement\
        \ of this angle is the dihedral angle at the central vertex: cos(central_angle)\
        \ = -7/8. However, the central angle itself is 2*arccos(1/4) \u2248 165.8\xB0\
        , and six such angles exceed 360\xB0; the deficit is 2\u03C0 - 6*central_angle.\
        \ In rational units tracking triangle count, the curvature after is recorded\
        \ as 1."
      - "Step 3: Compute d1\u2218d0. The boundary map d0: C2\u2192C1 and d1: C1\u2192\
        C0. For the oriented triangle with vertices labeled, d0=[[-1,1,0],[0,-1,1],[1,0,-1]]\
        \ and d1=[[1,1,1]]. Composition d1\u2218d0 yields the 3-vector of rim-edge\
        \ sums: each component is 1/2 after normalizing by triangle count, recorded\
        \ as [1/2, 1/2, 1/2]."
      - 'Step 4: Quotient domain degree is the number of triangles in the star, 6.
        Curvature codomain degree is the deficit count, 1 after the r=2 change, reflecting
        that the finite cochain carrier is separate from the six-triangle metric star.'
      limitations:
      - The deficit calculation in Step 2 uses rational approximation of angle measures;
        a rigorous continuum limit requires additional structure not provided here.
      - The identification of curvature_codomain_degree=1 is model-internal and does
        not extend to general Regge holonomy without explicit frame transport and
        oriented star declarations.
      - "The finite cochain d1\u2218d0=0 is exact; promoting it to a geometric Bianchi\
        \ identity requires explicit bridging conditions not supplied."
      open_obligations:
      - Construct the intrinsic metric counterexample with r=3, rim=1, and recompute
        all certificate values.
      - Declare frame transport, oriented star, and nondegenerate simplex as dependencies
        for any geometric bridge claim.
      - Source quotient_domain_degree and curvature_codomain_degree from the model;
        do not assume automatic invariance.
