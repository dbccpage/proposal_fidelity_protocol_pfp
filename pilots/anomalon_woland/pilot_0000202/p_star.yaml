original_seed: 'Repair PO035 §6: determine the well-typed map induced by d1 on C1/im(d0),
  its kernel, and the hypotheses for a metric Regge holonomy/deficit correspondence.
  Distinguish cochain exactness d1*d0=0 from geometric Bianchi identities. Do not
  identify scalar additive curvature with an angle merely because both are called
  holonomy. Construct an intrinsic metric counterexample and formulate a conditional
  geometric bridge using frame transport, oriented star and nondegenerate simplices.
  Specify what is still missing for a general theorem.

  Finite witness: a regular star of six congruent triangles, first with radial length
  1 and rim length 1, then radial length 2 and unchanged rim 1. Obtain the central
  cosine by the cosine law. Independently on an oriented triangle use d0=[[-1,1,0],[0,-1,1],[1,0,-1]],
  d1=[[1,1,1]], δ=(1,0,0), α=(0,1,0), δ''=δ+d0 α. Return certificate cosine_before,
  cosine_after, curvature_before, curvature_after as rational strings; d1d0 as a 3-rational
  vector, quotient_domain_degree and curvature_codomain_degree as integers. Give deficits
  symbolically in derivation; the finite cochain is a separate carrier, not the six-triangle
  metric star. Mine learning and request lifts without claiming finite checks establish
  a continuum result.'
