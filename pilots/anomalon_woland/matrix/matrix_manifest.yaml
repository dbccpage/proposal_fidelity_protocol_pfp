schema: pfp.matrix-manifest.v1
authority_effect: None
title: PFP Pilot Matrix Estate Manifest
description: >-
  Index of retained task records, reusable seeds, and schemas in
  omega_engine_education/pilots/matrix/. Catalog membership does not schedule a run.
  Select bounded experiments to answer a concrete question; there is no run quota.
governing_rule: RULE_PILOT_ESTATE_DECOUPLING_001

files:
  - filename: max_pilot_matrix.yaml
    role: active_operational_matrix
    schema: pfp.pilot-matrix.v1
    description: >-
      Sovereign active pilot matrix governing the 75 foundational pilots (pilot_0000000 to pilot_00074),
      migration registers (migration_register, legacy_foundational_register, legacy_demo_pilots_register),
      and active dossier replay campaign.
    governing_test: omega_engine_pfp/tests/test_pilot_scoured_types.py

  - filename: pilot_models.yaml
    role: json_schema_models
    schema: https://json-schema.org/draft/2020-12/schema
    id: pfp.pilot-models.v1
    description: >-
      Machine-readable JSON Schema generated from PFP domain models governing pilot instances,
      catalogs, budgets, and billing summaries.

  - filename: seeds.yaml
    role: seed_prompts_catalog
    schema: pfp.seeds.v1
    total_seeds: 74
    counts:
      review_seeds: 24
      mssn50_seeds: 50
    description: >-
      Composed seed prompt catalog defining initial task prompts, boundaries, and expected outcomes
      for foundational review and MSS-N demonstration pilots.
