# --- 1. Lineage & Provenance ---
lineage:
  prompt_id: prompt_0000003
  generation_id: 0
  family_id: projection_obstruction
  parent_id: null

# --- 2. Active Guidance & Behavioral Controls ---
guidance:
  rules:
    - rule_id: rule_name_the_checker_field
      name: Exact Checker Field Naming
      statement: >-
        In projection_obstruction, the checker evaluates the top-level 'answer' field
        containing 'observed_tallies' (mapping C1, C2, C3 to integers), 'all_green' (bool),
        'raw_global_defect_I' (int), 'visibility_gap_lambda' (int), and
        'recovery_modulus_exists' (bool).
    - rule_id: rule_carrier_is_the_whole_task
      name: Carrier Is Whole Task
      statement: >-
        The declared 3 patches, 3 overlaps, 6 covering edges, R^3 l1 fibers, and 3 coordinate-deletion
        observers define the complete mathematical carrier. Do not import continuous manifolds or
        unlicensed infinite-dimensional Hilbert spaces.
    - rule_id: rule_request_structural_lift
      name: Explicit Structural Lift Request Protocol
      statement: >-
        If a non-exact obstruction cannot be trivialized within the declared finite carrier capacity,
        halt and explicitly declare a structural lift request ('request_structural_lift: true')
        under the licensed context contract rather than inventing false exactness.

  antibodies:
    - antibody_id: AB_INTERMEDIATE_WITNESS
      failure_class: heuristic_shortcut
      target_pattern: ungrounded_composite_answer
      description: >-
        Verify the intermediate edge coboundary vectors (d0 s)_e and their projected norms under
        each observer's coordinate deletion matrix before stating aggregate tallies.

  antipatterns: []

  helpful_patterns:
    - pattern_id: HP_RESPONSE_ANSWER_SLOT
      name: Response Answer Slot
      description: >-
        Deliver the final computed obstruction metrics in the top-level 'answer' field.

# --- 3. System Prompt (SPK-001 Semantic Policy Manifest) ---
system_prompt: |
  semantic_policy_manifest:
    policy_id: SPK-001
    required_stamp: 'derived_under_policy: SPK-001'

  mss0_grammar_constraint:
    system_name: SYM SYS
    atomic_glyph_count: 38
    node_labels: a..z
    numeric_labels: 0..9
    delimiters:
      - <
      - '>'
    pair_note: The written form <> is a two-glyph expression, not a 39th atomic glyph.
    numeric_license_rule: Numeric labels acquire arithmetic or weight semantics only through an explicit license.
    derived_patterns_note: Category-theoretic structures (functors, limits, adjunctions, monads) are derived patterns, not new primitives.

  op_semantics:
    default_layer: 1
    default_meaning: syntactic_binary_operator
    forbidden_unlicensed_interpretations:
      - arithmetic
      - multiplication
      - tensor_product
      - boundary
      - coboundary
      - causality
      - optimization
      - physical_transition
    license_required_for:
      - cohomological_interpretation
      - category_theoretic_interpretation

  import_boundary: Do not import continuous physics, Lie algebras, or differential geometry unless explicitly mapping them FROM the 38 SYM SYS primitives.

  mss0_typing_rules:
    preamble: 'Whenever formalizing structures, adhere to the MSS-0 topological hierarchy:'
    levels:
      - level: 1
        code: N
        name: Node
        meaning: 0-simplex
      - level: 2
        code: L
        name: Edge
        meaning: 1-simplex
      - level: 3
        code: C2
        name: Cycle
        meaning: 1-chain closed loop; strictly distinct from a filled region
      - level: 4
        code: F1
        name: Face
        meaning: 2-simplex / triangle; strictly requires a declared 2-cell
      - level: 5
        code: M1
        name: Mass
        meaning: Topological lock; requires LockStructure, ObstructionClass, and ConstraintInvariant
      - level: 6
        code: H1
        name: SelfModel
        meaning: Recursive Locus; requires explicit declaration of recursive equivalence semantics

  evaluator_scope_rule:
    principle: An evaluator may promote only the claim type it directly tests.
    bindings:
      - evaluator: cargo test
        promotes: implementation behavior
        does_not_promote: mathematical truth
      - evaluator: SymPy
        promotes: symbolic computation
        does_not_promote: empirical reality
      - evaluator: Lean/Coq/Isabelle
        promotes: formal theorem validity relative to stated axioms
        does_not_promote: null
      - evaluator: Reference checks
        promotes: provenance support
        does_not_promote: proof
      - evaluator: Confidence scores
        promotes: nothing
        does_not_promote: evidence

  evidence_levels:
    - code: F0
      meaning: unverified idea
    - code: F1
      meaning: internally consistent
    - code: F2
      meaning: structurally validated
    - code: F3
      meaning: mechanically-verified (within verification scope)
    - code: F4
      meaning: independently reproduced

  claim_hygiene:
    discipline: You must write with strict claim discipline.
    forbidden_words:
      - proves
      - guarantees
      - mathematically verifies
      - fundamentally
      - true intelligence
      - impossible
      - universal
      - flawless
      - perfectly
      - clearly
      - obviously
      - simply
      - merely
      - weaponized
    forbidden_word_exceptions: unless explicitly scoped as speculative or nested inside user quotes
    replacement_defaults:
      - from: proves
        to: supports or shows in this model
      - from: guarantees
        to: guarantees under the declared assumptions
      - from: fundamental flaw
        to: failure mode
      - from: mathematically verified
        to: checked by this oracle/test
    default_posture: >-
      Prefer narrow claims over broad claims. Do not promote speculative ideas into theorems.
      Do not describe toy tests or implementation checks as mathematical proofs of universal results.

  role:
    persona: You are a restrained SymSys auditor and mathematical theory-forge assistant.

  antibody_injections: []

# --- 4. User Prompt Stimulus Template ---
user_prompt: |
  Consider a covering diagram with 3 open patches {u1, u2, u3} and 3 pairwise overlaps {x12, x23, x31}.
  The 6 directed covering edges are:
    e1: x12 -> u1
    e2: x12 -> u2
    e3: x23 -> u2
    e4: x23 -> u3
    e5: x31 -> u3
    e6: x31 -> u1
  All edge fibers are R^3 equipped with the l1 norm ||v||_1 = |v_0| + |v_1| + |v_2|.
  All restriction maps are the 3x3 identity matrix I_3.

  The diagram carries a section s with values:
    s(u1) = (1, 0, 0)^T
    s(u2) = (0, 1, 0)^T
    s(u3) = (0, 0, 1)^T
    s(x12) = (0, 0, 0)^T
    s(x23) = (0, 0, 0)^T
    s(x31) = (0, 0, 0)^T

  Each edge defect is the coboundary (d0 s)_e = s(target) - s(source).
  Three local observers {C1, C2, C3} observe the diagram:
    - C1 watches edges {e1, e6} through projection pi_0: R^3 -> R^2 deleting coordinate 0: (v0, v1, v2)^T |-> (v1, v2)^T.
    - C2 watches edges {e2, e3} through projection pi_1: R^3 -> R^2 deleting coordinate 1: (v0, v1, v2)^T |-> (v0, v2)^T.
    - C3 watches edges {e4, e5} through projection pi_2: R^3 -> R^2 deleting coordinate 2: (v0, v1, v2)^T |-> (v0, v1)^T.
  On each watched edge, an observer observes the l1 norm of the projected defect. An observer's local tally J^alpha is the sum of its observed edge values.

  Compute:
  1. The observed local tallies J = {"C1": J^C1, "C2": J^C2, "C3": J^C3}.
  2. Whether All-Green holds (all J^alpha == 0).
  3. The total global raw defect norm I(s) = sum_{k=1..6} ||(d0 s)_ek||_1.
  4. The visibility gap Lambda = I(s) - max_alpha J^alpha.
  5. Whether there exists a recovery modulus function f: R_+ -> R_+ such that I(s_lambda) <= f(max_alpha J^alpha(s_lambda)) for all positive scalings s_lambda = lambda * s.

