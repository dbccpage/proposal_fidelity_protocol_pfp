messages:
- role: user
  content: "Let J be the finite poset/diagram category representing the covering nerve\
    \ of a 3-patch cover:\nObjects: {u1, u2, u3, x12, x23, x31}.\nNon-identity morphisms:\
    \ x12 -> u1, x12 -> u2, x23 -> u2, x23 -> u3, x31 -> u3, x31 -> u1.\nLet F: J\
    \ -> Ban_1 be the diagram functor assigning the Banach space (R^3, ||\xB7||_1)\
    \ to all objects and the identity isometry id_{R^3} to all morphisms.\n\nA candidate\
    \ section is a cone element s \u2208 prod_{j \u2208 J} F(j):\ns_{u1} = (1, 0,\
    \ 0)^T, s_{u2} = (0, 1, 0)^T, s_{u3} = (0, 0, 1)^T,\ns_{x12} = s_{x23} = s_{x31}\
    \ = (0, 0, 0)^T.\n\nThe limit obstruction cocycle delta(s) assigns to each morphism\
    \ f: x -> u the discrepancy f(s_x) - s_u = 0 - s_u = -s_u (with norm ||-s_u||_1\
    \ = ||s_u||_1).\nThree subdiagram observers {C1, C2, C3} factor through quotient\
    \ Banach spaces R^3 / ker(pi_k):\nC1 observes morphisms from x12 to u1 and x31\
    \ to u1 via projection modulo the first coordinate axis span(e1).\nC2 observes\
    \ morphisms into u2 modulo span(e2).\nC3 observes morphisms into u3 modulo span(e3).\n\
    \nCompute:\n1. The quotient semi-norm tallies observed by C1, C2, C3.\n2. Whether\
    \ the observed defect vanishes globally for all three observers (all_green).\n\
    3. The total unprojected cocycle norm I(s).\n4. The visibility gap Lambda.\n5.\
    \ Whether the cone defect admits a uniform recovery modulus under positive homotheties\
    \ s |-> lambda * s.\n\nReturn JSON:\n{\n  \"answer\": {\n    \"observed_tallies\"\
    : {\"C1\": integer, \"C2\": integer, \"C3\": integer},\n    \"all_green\": boolean,\n\
    \    \"raw_global_defect_I\": integer,\n    \"visibility_gap_lambda\": integer,\n\
    \    \"recovery_modulus_exists\": boolean\n  }\n}"
