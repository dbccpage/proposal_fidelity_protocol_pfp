messages:
- role: user
  content: "In the S(n) discrete geometry substrate:\nA 3-patch covering carrier C\
    \ has 6 boundary transition edges e1..e6 with fiber representation Omega_3 = (R^3,\
    \ ||\xB7||_1).\nThe active boundary configuration carries coboundary vectors:\n\
    e1, e6 -> [1, 0, 0]^T\ne2, e3 -> [0, 1, 0]^T\ne4, e5 -> [0, 0, 1]^T\n\nDown-map\
    \ retractions R_alpha: Omega_3 -> Omega_2 discard the alpha-th fiber generator:\n\
    R_0 drops coordinate 0, applied to edges {e1, e6} by observer C1.\nR_1 drops coordinate\
    \ 1, applied to edges {e2, e3} by observer C2.\nR_2 drops coordinate 2, applied\
    \ to edges {e4, e5} by observer C3.\n\nCompute:\n1. Retracted boundary tally register\
    \ J = {\"C1\": integer, \"C2\": integer, \"C3\": integer}.\n2. Global nullity\
    \ predicate across retractions: all_green (boolean).\n3. Unretracted total raw\
    \ boundary defect I = sum_{e} ||defect(e)||_1.\n4. Obstruction visibility gap\
    \ Lambda = I - max_alpha J^alpha.\n5. Modulus preservation under dilation: does\
    \ a recovery modulus exist (boolean)?\n\nReturn JSON:\n{\n  \"answer\": {\n  \
    \  \"observed_tallies\": {\"C1\": integer, \"C2\": integer, \"C3\": integer},\n\
    \    \"all_green\": boolean,\n    \"raw_global_defect_I\": integer,\n    \"visibility_gap_lambda\"\
    : integer,\n    \"recovery_modulus_exists\": boolean\n  }\n}"
