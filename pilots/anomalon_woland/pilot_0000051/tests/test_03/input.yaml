  content: "<<sys><covering_nerve>\n  <<nodes><u1><u2><u3><x12><x23><x31>>\n  <<edges>\n\
    \    <<e1><from><x12>><to><u1>>>\n    <<e2><from><x12>><to><u2>>>\n    <<e3><from><x23>><to><u2>>>\n\
    \    <<e4><from><x23>><to><u3>>>\n    <<e5><from><x31>><to><u3>>>\n    <<e6><from><x31>><to><u1>>>\n\
    \  >\n  <<fiber><R3><norm><l1><def><sum_abs_coords>>>\n  <<section>\n    <<s><u1><vec><1><0><0>>>\n\
    \    <<s><u2><vec><0><1><0>>>\n    <<s><u3><vec><0><0><1>>>\n    <<s><x12><vec><0><0><0>>>\n\
    \    <<s><x23><vec><0><0><0>>>\n    <<s><x31><vec><0><0><0>>>\n  >\n  <<d0_coboundary><eval><s_target_minus_s_source>>\n\
    \  <<observers>\n    <<C1><edges><e1><e6>><proj><del_coord_0><R3_to_R2>>\n   \
    \ <<C2><edges><e2><e3>><proj><del_coord_1><R3_to_R2>>\n    <<C3><edges><e4><e5>><proj><del_coord_2><R3_to_R2>>\n\
    \  >\n  <<compute>\n    <<tallies><J_C1><J_C2><J_C3>>\n    <<all_green><all_J_zero_predicate>>\n\
    \    <<global_I><sum_all_edges_l1_norm>>\n    <<gap_lambda><global_I_minus_max_J>>\n\
    \    <<recovery_modulus_exists><existence_predicate_under_positive_scaling>>\n\
    \  >\n>\n\nReturn output strictly as JSON:\n{\n  \"answer\": {\n    \"observed_tallies\"\
    : {\"C1\": integer, \"C2\": integer, \"C3\": integer},\n    \"all_green\": boolean,\n\
    \    \"raw_global_defect_I\": integer,\n    \"visibility_gap_lambda\": integer,\n\
    \    \"recovery_modulus_exists\": boolean\n  }\n}"
