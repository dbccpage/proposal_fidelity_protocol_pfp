messages:
- role: user
  content: "Let N = (V, E) be a directed 1-complex with V = {u1, u2, u3, x12, x23,\
    \ x31} and E = {(x12, u1), (x12, u2), (x23, u2), (x23, u3), (x31, u3), (x31, u1)},\
    \ indexed as e1..e6.\nFibers F_e = (R^3, ||\xB7||_1). Transition maps rho = I_3.\n\
    Section s \u2208 C^0(N, F): s(u_k) = e_k \u2208 R^3 for k \u2208 {1,2,3}; s(x_jk)\
    \ = 0 \u2208 R^3.\nCoboundary: (d_0 s)_e = s(tgt(e)) - s(src(e)).\nObserver projections:\n\
    pi_0: R^3 -> R^2, (v0,v1,v2) |-> (v1,v2) on E_C1 = {e1, e6}.\npi_1: R^3 -> R^2,\
    \ (v0,v1,v2) |-> (v0,v2) on E_C2 = {e2, e3}.\npi_2: R^3 -> R^2, (v0,v1,v2) |->\
    \ (v0,v1) on E_C3 = {e4, e5}.\n\nTally: J^alpha = sum_{e \u2208 E_alpha} ||pi_alpha((d_0\
    \ s)_e)||_1.\nGlobal defect: I(s) = sum_{k=1..6} ||(d_0 s)_ek||_1.\nVisibility\
    \ gap: Lambda = I(s) - max_alpha J^alpha.\nModulus check: \u2203 f: R_+ -> R_+\
    \ s.t. \u2200 lambda > 0, I(lambda * s) <= f(max_alpha J^alpha(lambda * s))?\n\
    \nFormat output as JSON:\n{\n  \"answer\": {\n    \"observed_tallies\": {\"C1\"\
    : integer, \"C2\": integer, \"C3\": integer},\n    \"all_green\": boolean,\n \
    \   \"raw_global_defect_I\": integer,\n    \"visibility_gap_lambda\": integer,\n\
    \    \"recovery_modulus_exists\": boolean\n  }\n}"
