messages:
- role: user
  content: "schema: pfp.seed-prompt.v1\nauthority_effect: None\npilot_id: pilot_0000003\n\
    task_family: projection_obstruction\ndifficulty_rung: 4\nrequest_id: pilot_0000003_req_0\n\
    input_typing:\n  lexical_alphabet: UTF-8\n  syntactic_category: PureMathematicalSpecification\n\
    \  semantic_carrier: discrete_covering_diagram\n  dialect_tier: seed_plain\n \
    \ boundary_format: pfp.sealed-packet.v1\nseed_prompt: |\n  Consider a covering\
    \ diagram with 3 open patches {u1, u2, u3} and 3 pairwise overlaps {x12, x23,\
    \ x31}.\n  The 6 directed covering edges are:\n    e1: x12 -> u1\n    e2: x12\
    \ -> u2\n    e3: x23 -> u2\n    e4: x23 -> u3\n    e5: x31 -> u3\n    e6: x31\
    \ -> u1\n  All edge fibers are R^3 equipped with the l1 norm ||v||_1 = |v_0| +\
    \ |v_1| + |v_2|.\n  All restriction maps are the 3x3 identity matrix I_3.\n\n\
    \  The diagram carries a section s with values:\n    s(u1) = (1, 0, 0)^T\n   \
    \ s(u2) = (0, 1, 0)^T\n    s(u3) = (0, 0, 1)^T\n    s(x12) = (0, 0, 0)^T\n   \
    \ s(x23) = (0, 0, 0)^T\n    s(x31) = (0, 0, 0)^T\n\n  Each edge defect is the\
    \ coboundary (d0 s)_e = s(target) - s(source).\n  Three local observers {C1, C2,\
    \ C3} observe the diagram:\n    - C1 watches edges {e1, e6} through projection\
    \ pi_0: R^3 -> R^2 deleting coordinate 0: (v0, v1, v2)^T |-> (v1, v2)^T.\n   \
    \ - C2 watches edges {e2, e3} through projection pi_1: R^3 -> R^2 deleting coordinate\
    \ 1: (v0, v1, v2)^T |-> (v0, v2)^T.\n    - C3 watches edges {e4, e5} through projection\
    \ pi_2: R^3 -> R^2 deleting coordinate 2: (v0, v1, v2)^T |-> (v0, v1)^T.\n  On\
    \ each watched edge, an observer observes the l1 norm of the projected defect.\
    \ An observer's local tally J^alpha is the sum of its observed edge values.\n\n\
    \  Compute:\n  1. The observed local tallies J = {\"C1\": J^C1, \"C2\": J^C2,\
    \ \"C3\": J^C3}.\n  2. Whether All-Green holds (all J^alpha == 0).\n  3. The total\
    \ global raw defect norm I(s) = sum_{k=1..6} ||(d0 s)_ek||_1.\n  4. The visibility\
    \ gap Lambda = I(s) - max_alpha J^alpha.\n  5. Whether there exists a recovery\
    \ modulus function f: R_+ -> R_+ such that I(s_lambda) <= f(max_alpha J^alpha(s_lambda))\
    \ for all positive scalings s_lambda = lambda * s.\n\n  Return JSON:\n  {\n  \
    \  \"answer\": {\n      \"observed_tallies\": {\"C1\": integer, \"C2\": integer,\
    \ \"C3\": integer},\n      \"all_green\": boolean,\n      \"raw_global_defect_I\"\
    : integer,\n      \"visibility_gap_lambda\": integer,\n      \"recovery_modulus_exists\"\
    : boolean\n    }\n  }\nexpected_outcome:\n  answer:\n    observed_tallies:\n \
    \     C1: 0\n      C2: 0\n      C3: 0\n    all_green: true\n    raw_global_defect_I:\
    \ 6\n    visibility_gap_lambda: 6\n    recovery_modulus_exists: false\n  status:\
    \ ACCEPTED"
