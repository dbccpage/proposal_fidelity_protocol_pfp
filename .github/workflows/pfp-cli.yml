name: pfp-cli

on:
  push:
    branches: [main]
    paths:
      - "code/rust/pfp_cli/**"
      - "code/rust/core_prompt_civilization/**"
      - ".github/workflows/pfp-cli.yml"
  pull_request:
    paths:
      - "code/rust/pfp_cli/**"
      - "code/rust/core_prompt_civilization/**"
      - ".github/workflows/pfp-cli.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: code/rust/pfp_cli

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --quiet -- demo

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --locked --lib --target wasm32-unknown-unknown
