name: pfp-operads

on:
  push:
    branches: [main]
    paths:
      - "code/rust/pfp_operads/**"
      - "code/rust/core_operad_canon/**"
      - "code/rust/Cargo.toml"
      - "code/rust/Cargo.lock"
      - ".github/workflows/pfp_operads.yml"
  pull_request:
    paths:
      - "code/rust/pfp_operads/**"
      - "code/rust/core_operad_canon/**"
      - "code/rust/Cargo.toml"
      - "code/rust/Cargo.lock"
      - ".github/workflows/pfp_operads.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: code/rust

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt -p pfp_operads -p core_operad_canon --check
      - run: cargo clippy --locked -p pfp_operads -p core_operad_canon --all-targets --no-deps -- -D warnings
      - run: cargo test --locked -p pfp_operads -p core_operad_canon
      - run: cargo run --locked -p pfp_operads -- check pfp_operads/examples/check.json
      - run: cargo run --locked -p pfp_operads -- laws pfp_operads/examples/laws.json
      - run: cargo run --locked -p pfp_operads -- envelope pfp_operads/examples/envelope.json
      - run: cargo run --locked -p pfp_operads -- judge pfp_operads/examples/judge.json
      - run: cargo run --locked -p pfp_operads -- mining pfp_operads/examples/mining.json
      - run: cargo run --locked -p pfp_operads -- grounding pfp_operads/examples/grounding.json
      - run: cargo run --locked -p pfp_operads -- witness pfp_operads/examples/witness.json
      - run: cargo run --locked -p pfp_operads -- trial pfp_operads/examples/trial.json
      - run: cargo run --locked -p pfp_operads -- run pfp_operads/examples/run.json
      - run: cargo run --locked -p pfp_operads -- witness-turn pfp_operads/examples/witness_turn.json
      - run: cargo run --locked -p pfp_operads -- ledger load ../../workflows/wf55_failure_ledger_with_trial_gated_rules/examples/ledger_after_first_run.jsonl pfp_operads/examples/load.json
      - run: cargo run --locked -p pfp_operads -- ledger loaded ../../workflows/wf55_failure_ledger_with_trial_gated_rules/examples/ledger_after_first_run.jsonl pfp_operads/examples/loaded.json
      - run: cargo run --locked -p pfp_operads -- ledger verify ../../workflows/wf55_failure_ledger_with_trial_gated_rules/examples/ledger_after_first_run.jsonl
      - run: cargo build --locked --release -p pfp_operads
      - run: PATH="$PWD/target/release:$PATH" pfp_operad repair pfp_operads/examples/repair/request.json pfp_operads/examples/repair/source "$RUNNER_TEMP/repair-run"
