name: operad-gates

on:
  push:
    branches: [main]
    paths:
      - "operads/**"
      - ".github/workflows/operad-gates.yml"
  pull_request:
    paths:
      - "operads/**"
      - ".github/workflows/operad-gates.yml"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml pytest
      # Rules: every ENFORCED or PARTIAL invariant names a check that exists, and hooks.json is generated from the register.
      - run: python -m operads.skill_operad.skill_compiler.rule_gate --repo-root .
      - run: python -m pytest -q operads/skill_operad/skill_compiler/tests/test_rule_gate.py operads/skill_operad/skill_compiler/tests/test_hook_compiler.py
      - run: python -m pip install pydantic
      # Catalogue: the committed projection equals a fresh compile, and every BOUND executor starts.
      - run: python -m operads.infrastructure.capability_catalog_compiler --check --repo-root .
        env:
          PYTHONPATH: ops:.
      - run: python -m operads.infrastructure.anti_skill_catalog_compiler --check
      - run: python -m pytest -q operads/tests/unit/test_executor_bindings.py operads/tests/unit/test_role_agents.py operads/tests/unit/test_anti_skill_catalog.py operads/tests/unit/test_bound_residuals.py operads/skill_operad/resolver/tests/test_subcolour_schema.py
        env:
          PYTHONPATH: ops:.
