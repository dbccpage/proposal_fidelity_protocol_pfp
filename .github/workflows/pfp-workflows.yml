name: Standalone PFP workflows

on:
  pull_request:
    paths:
      - 'pfp/**'
      - 'ops/adversary/**'
      - 'ops/operations/**'
      - 'ops/governance/domain/**'
      - 'pyproject.toml'
      - 'docs/workflows/**'
      - '.github/workflows/pfp-workflows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-workflows:
    runs-on: ubuntu-latest
    env:
      CORE_CREDENTIAL_DISCOVERY: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[workflows]' pytest==9.1.1
      - run: python -m pytest pfp/workflows -q --basetemp '${{ runner.temp }}/pfp-workflow-tests'
      - run: python -m pip wheel --no-deps --wheel-dir '${{ runner.temp }}/pfp-wheels' .
      - run: python -m venv '${{ runner.temp }}/pfp-installed'
      - run: '${{ runner.temp }}/pfp-installed/bin/python -m pip install "${{ runner.temp }}/pfp-wheels/pfp_lab-0.2.0-py3-none-any.whl[workflows]"'
      - run: '${{ runner.temp }}/pfp-installed/bin/python "${{ github.workspace }}/docs/workflows/check_install.py" --artifact-dir "${{ runner.temp }}" --checkout "${{ github.workspace }}"'
        working-directory: '${{ runner.temp }}'
