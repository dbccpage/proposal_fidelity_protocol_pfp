name: v1rc gates

on:
  pull_request:
  push:
    branches: [main, release/omegaengine-pfp-v1.0rc]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CORE_CREDENTIAL_DISCOVERY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e ".[dev,workflows]"
      - run: python -B -X utf8 -m ruff check pfp_core/ tests/
      - run: python -B -X utf8 -m pytest pfp_lab/tests/test_boundaries.py -q
      # Section-3 suite. Collecting all of operads/, eis/, and pciv also imports
      # optional hosts and historical receipt scripts, which abort collection.
      - run: python -B -X utf8 -m pytest tests/ pfp_lab/tests pfp_core/tests pfp_core/workflow_families/tests governance/tools/tests -q
      # pfp-cli is a separate workspace (package name pfp-cli). The engine manifest has no pfp_cli member.
      - run: cargo test --manifest-path code/rust/Cargo.toml -p pfp -p pfp_runtime -p pfp_operads -p pfp_immune -p core_operad_canon
      - run: cargo test --manifest-path code/rust/pfp_cli/Cargo.toml
      - run: python -B -X utf8 dag/build_atlas.py --check
