name: v1rc gates

on:
  pull_request:
  push:
    branches: [main, release/omegaengine-pfp-v1.0rc]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CORE_CREDENTIAL_DISCOVERY: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Elan so pytest can call lake
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e ".[dev,workflows]"
      - run: cargo build --release --manifest-path code/rust/Cargo.toml -p pfp_operads
      - run: python -B -X utf8 -m ruff check pfp_core/ tests/
      - run: python -B -X utf8 -m pytest pfp_lab/tests/test_boundaries.py -q
      # Section-3 suite plus the two-signal EIS file. The rest of eis/ and the
      # operads/ and pciv trees import optional hosts and historical receipt scripts.
      - run: python -B -X utf8 -m pytest tests/ pfp_lab/tests pfp_core/tests pfp_core/workflow_families/tests governance/tools/tests eis/tests/unit/test_two_signal_regulation.py -q
      # pfp-cli is a separate workspace (package name pfp-cli). The engine manifest has no pfp_cli member.
      - run: cargo test --manifest-path code/rust/Cargo.toml -p pfp -p pfp_runtime -p pfp_operads -p pfp_immune -p core_operad_canon
      - run: cargo test --manifest-path code/rust/pfp_cli/Cargo.toml
      - run: python -B -X utf8 dag/build_atlas.py --check
