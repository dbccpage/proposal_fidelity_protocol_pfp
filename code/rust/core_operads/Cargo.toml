[package]
autotests = false
name = "core_operads"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Validated workflow and skill domain slices over sovereign operad kernels"

[dependencies]
core_operad_canon = { path = "../core_operad_canon" }
core_types = { path = "../core_types" }
core_operad_theory = { path = "../core_operad_theory" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
sha2 = "0.10"
hex = "0.4"

