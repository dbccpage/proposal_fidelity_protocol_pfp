[package]
autotests = false
name = "pfp"
version.workspace = true
edition = "2021"
description = "Native Symbol Game crate for exact OESOS, evidence, packets, and campaign execution"
authors = ["Sentinel Contributors"]
license.workspace = true
build = "build.rs"

[dependencies]
core_policy = { path = "../core_policy" }
engines = { path = "../engines" }
core_kernel = { path = "../core_kernel" }
core_solvers = { path = "../core_solvers" }
core_wdp = { path = "../core_wdp" }
core_functional = { path = "../core_functional" }
core_quantum_physics = { path = "../core_quantum_physics" }
core_category_theory = { path = "../core_category_theory" }
core_pipelines = { path = "../core_pipelines" }
core_types = { path = "../core_types" }
core_epk = { path = "../core_local_green_global_red_lggr" }
linear_algebra = { path = "../core_linear_algebra" }
core_homology = { path = "../core_homology" }
core_holonomy = { path = "../core_holonomy" }
core_intelligence = { path = "../core_intelligence" }
core_number_theory = { path = "../core_number_theory" }
core_majorana = { path = "../core_majorana" }
pfp_runtime = { path = "../pfp_runtime" }
core_prompt_civilization = { path = "../core_prompt_civilization" }
core_certifiers = { path = "../core_certifiers" }
core_replay = { path = "../core_replay" }
core_sandbox = { path = "../core_sandbox" }
core_adversary = { path = "../core_adversary" }
core_epistemic_immune_system = { path = "../core_epistemic_immune_system" }
core_operads = { path = "../core_operads" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
serde_yaml = "0.9"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
blake3 = "1.8"
tempfile = "3"

[[bin]]
name = "pfp"
path = "src/main.rs"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

