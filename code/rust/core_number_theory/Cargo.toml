[package]
autotests = false
name = "core_number_theory"
version.workspace = true
edition = "2021"
description = "Foundational exact number theory: rationals, polynomials, quadratic and cyclotomic fields, real-embedding signs, finite fields, GF(2) linear algebra, character sums (AuthorityEffect None)"
license.workspace = true

[dependencies]
# The scalar tower (`Semiring`/`Ring`/`Field`/`ExactRing`) is owned by linear algebra;
# every exact scalar here implements it so `BasicMatrix<T>` and the generic exact
# algorithms apply to it.
linear_algebra = { path = "../core_linear_algebra" }
# Tier 0: the exact rational `Interval` used for isolating intervals and enclosures.
core_kernel = { path = "../core_kernel" }
core_combinatorics = { path = "../core_combinatorics" }
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
# Wire round-trips of the serialisable exact types.
serde_json = "1.0"

# Shared integration-test targets. Sources and fixtures live in `../tests/core_number_theory`.

