[package]
autotests = false
name = "core_lie_theory"
version.workspace = true
edition = "2021"
description = "Exact finite groups, Lie groups and Lie algebras over number fields: Cayley charts, SU(2)/SO(3), Lorentz boosts, su(N), Clifford algebras, Pauli/symplectic groups, Weyl-Heisenberg (AuthorityEffect None)"
license.workspace = true

[dependencies]
core_category_theory = { path = "../core_category_theory" }
# Exact scalars (rationals, cyclotomic and quadratic fields, GF(2)) are owned by number theory;
# exact matrices and elimination are owned by linear algebra. This crate builds group and
# Lie-algebra structure on top of them and carries no private copy of either.
core_number_theory = { path = "../core_number_theory" }
linear_algebra = { path = "../core_linear_algebra" }
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
thiserror = "2"

