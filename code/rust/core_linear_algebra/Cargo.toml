[package]
autotests = false
name = "linear_algebra"
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]

core_category_theory = { path = "../core_category_theory" }
core_combinatorics = { path = "../core_combinatorics" }

nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-rational = { version = "0.4.2", features = ["serde"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
num-complex = "0.4.6"
thiserror = "2"


serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

