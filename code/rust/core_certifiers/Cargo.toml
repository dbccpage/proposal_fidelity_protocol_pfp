[package]
autotests = false
name = "core_certifiers"
version.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
core_kernel = { path = "../core_kernel" }
core_policy = { path = "../core_policy" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
nalgebra = "0.33"
core_contracts = { path = "../core_contracts" }
core_functional = { path = "../core_functional" }
core_types = { path = "../core_types" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

# Shared integration-test targets. Sources and fixtures live in `../tests/core_certifiers`.

[[test]]
name = "negative_tests"
path = "../tests/core_certifiers/negative_tests.rs"

[[test]]
name = "paper_claim_traceability"
path = "../tests/core_certifiers/paper_claim_traceability.rs"

[[test]]
name = "phi1_conformance"
path = "../tests/core_certifiers/phi1_conformance.rs"

[[test]]
name = "phi1_form_lean_parity"
path = "../tests/core_certifiers/phi1_form_lean_parity.rs"
