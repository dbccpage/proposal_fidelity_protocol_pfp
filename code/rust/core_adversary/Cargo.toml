[package]
autotests = false
name = "core_adversary"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Adversary routing, exact admission and seat gateway behind Arena ports"

[dependencies]
core_operad_canon = { path = "../core_operad_canon" }
core_types = { path = "../core_types" }
core_wdp = { path = "../core_wdp" }
pfp_runtime = { path = "../pfp_runtime" }
core_epistemic_immune_system = { path = "../core_epistemic_immune_system" }
core_operads = { path = "../core_operads" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
indexmap = { version = "2", features = ["serde"] }
serde_yaml = "0.9"
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["serde"] }
num-integer = "0.1"
num-traits = "0.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
unicode-normalization = "0.1"
regex = "1.10"
ryu = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
core_epk = { path = "../core_local_green_global_red_lggr" }
core_linear_algebra = { package = "linear_algebra", path = "../core_linear_algebra" }

[dev-dependencies]
ed25519-dalek = "2.2"
core_epk = { path = "../core_local_green_global_red_lggr" }
core_linear_algebra = { package = "linear_algebra", path = "../core_linear_algebra" }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

