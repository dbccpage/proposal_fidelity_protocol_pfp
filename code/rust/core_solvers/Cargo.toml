[package]
autotests = false
name = "core_solvers"
version.workspace = true
license.workspace = true
edition = "2021"
description = "Canonical solver/certifier set for the engine"

[dependencies]
core_category_theory = { path = "../core_category_theory" }
core_policy = { path = "../core_policy" }

core_types = { path = "../core_types" }
linear_algebra = { path = "../core_linear_algebra" }
core_homology = { path = "../core_homology" }
core_functional = { path = "../core_functional" }
core_kernel = { path = "../core_kernel" }
core_combinatorics = { path = "../core_combinatorics" }
core_holonomy = { path = "../core_holonomy" }
core_number_theory = { path = "../core_number_theory" }
core_homotopy_type_theory = { path = "../core_homotopy_type_theory" }
# hodge_global_evaluator implements core_epk::v2::GlobalEvaluatorReplay in the lib
# target. core_epk must never depend on core_solvers (that WOULD cycle).
core_epk = { path = "../core_local_green_global_red_lggr" }
nalgebra = "0.33"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.8"
blake3 = "1.5"
num-complex = { version = "0.4.6", features = ["serde"] }
sprs = "0.11"
rand_distr = "0.4"
hex = "0.4"

[dev-dependencies]
core_replay = { path = "../core_replay" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

