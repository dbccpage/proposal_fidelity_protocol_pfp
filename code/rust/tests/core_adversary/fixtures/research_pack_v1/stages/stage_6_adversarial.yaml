stage: 6
name: adversarial
executor: model
requires:
- 1
- 2
- 3
- 4
- 5
version: 0.2.0
derived_under_policy: SPK-001
authority_effect: None
claim_hygiene_profile: claim_hygiene_strict_v1
description: Research role 6. PromptResponse and numbered StageNResponse require the
  declared runtime adapter.
input_contract: null
response_schema:
  additionalProperties: false
  description: Actual model response. Descriptive strings and true|false placeholders
    belong only to the template.
  properties:
    derived_under_policy:
      const: SPK-001
      title: Derived Under Policy
      type: string
      x-slot: data
    summary:
      $ref: '#/$defs/ResponseSummaryValue'
      x-slot: data
    sections:
      type: array
      minItems: 1
      maxItems: 1
      prefixItems:
      - type: object
        additionalProperties: false
        properties:
          name:
            const: objections
          rows:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                objection_id:
                  type: string
                claim_id:
                  type: string
                candidate_sha256:
                  type: string
                attack:
                  type: string
                evidence_refs:
                  type: array
                  items:
                    type: string
                result:
                  type: string
                repair_test:
                  type: string
              required:
              - objection_id
              - claim_id
              - candidate_sha256
              - attack
              - evidence_refs
              - result
              - repair_test
        required:
        - name
        - rows
      items: false
    process_integrity:
      $ref: '#/$defs/ProcessIntegrityValue'
      x-slot: data
  required:
  - derived_under_policy
  - summary
  - process_integrity
  - sections
  title: PromptResponse
  type: object
  $schema: https://json-schema.org/draft/2020-12/schema
  $defs:
    ProcessIntegrityValue:
      additionalProperties: false
      properties:
        seed_allows_theory_refutation:
          title: Seed Allows Theory Refutation
          type: boolean
          x-slot: data
        detected_prompt_biases:
          default: []
          items:
            minLength: 1
            pattern: \S
            type: string
          title: Detected Prompt Biases
          type: array
          x-slot: data
        should_continue:
          title: Should Continue
          type: boolean
          x-slot: data
      required:
      - seed_allows_theory_refutation
      - should_continue
      title: ProcessIntegrityValue
      type: object
    ResponseSummaryValue:
      additionalProperties: false
      properties:
        narrowest_defensible_thesis:
          minLength: 1
          pattern: \S
          title: Narrowest Defensible Thesis
          type: string
          x-slot: data
        evidence_scope:
          minLength: 1
          pattern: \S
          title: Evidence Scope
          type: string
          x-slot: data
        next_concrete_test:
          minLength: 1
          pattern: \S
          title: Next Concrete Test
          type: string
          x-slot: data
      required:
      - narrowest_defensible_thesis
      - evidence_scope
      - next_concrete_test
      title: ResponseSummaryValue
      type: object
