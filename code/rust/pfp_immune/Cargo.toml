[package]
name = "pfp_immune"
version.workspace = true
edition = "2021"
description = "Host immune CLI binary for PFP: screen, decide, taint, select, exclusion"
license.workspace = true

[dependencies]
core_epistemic_immune_system = { path = "../core_epistemic_immune_system" }
core_prompt_civilization = { path = "../core_prompt_civilization" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"

[[bin]]
name = "pfp_immune"
path = "src/main.rs"
