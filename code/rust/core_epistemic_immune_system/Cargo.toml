[package]
autotests = false
name = "core_epistemic_immune_system"
version.workspace = true
edition = "2021"
description = "Sovereign Rust Epistemic Immune System (EIS): anti-skill motifs, central tolerance thymus gate, two-signal danger gating, and formulary admission fences"
authors = ["Sentinel Contributors"]
license.workspace = true

[dependencies]
core_types = { path = "../core_types" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
unicode-normalization = "0.1"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
ed25519-dalek = "2.2"

