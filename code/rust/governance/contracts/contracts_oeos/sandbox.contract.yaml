schema_version: core.contract.v1
contract_id: urn:core:oeos:sandbox:v1.0.0
title: Platform-Scoped Execution Sandbox
kind: host_contract
status: proposed
layer: 09_host
role: Sandbox
descriptor:
  authority_effect: none
  evidence_ceiling: RequirementsOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts:
      - urn:core:oeos:capability_guard:v1.0.0
      - urn:core:oeos:filesystem_adapter:v1.0.0
    proof_obligations:
      - id: SBX-INV-001
        statement: Windows, POSIX, and container isolation requirements are separate named profiles.
        verification_status: open
      - id: SBX-INV-002
        statement: Environment, credential, workspace, filesystem, and network rules are explicit for each profile.
        verification_status: open
      - id: SBX-INV-003
        statement: Cleanup and redirect checks report their static and TOCTOU ceilings without claiming universal breakout prevention.
        verification_status: open
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit:
      - SANDBOX_CLEANUP_REFUSED
      - SANDBOX_NETWORK_REFUSED
      - SANDBOX_PROFILE_REFUSED
      - SANDBOX_REDIRECT_REFUSED
  operator_classes:
    may_support: []
    must_not_self_assign: true
relationships:
  abstract: false
  extends:
    - urn:core:constitution:base_host_contract:v1.0.0
requirements:
  inputs:
    - name: sandbox_profile_request
      type: urn:core:oeos:type:sandbox_profile_request:v1.0.0
      required: true
  outputs:
    - name: sandbox_handle
      type: urn:core:oeos:type:sandbox_handle:v1.0.0
      required: true
  typed_refusals:
    - SANDBOX_CLEANUP_REFUSED
    - SANDBOX_NETWORK_REFUSED
    - SANDBOX_PROFILE_REFUSED
    - SANDBOX_REDIRECT_REFUSED
  platform_requirements:
    - profile: windows_job_object
      requirements:
        - job_object_limits
        - restricted_token_profile
        - junction_and_reparse_point_static_checks
      verification_status: requirements_only
    - profile: posix_namespace
      requirements:
        - namespace_or_equivalent_isolation
        - privilege_drop_profile
        - symlink_static_checks
      verification_status: requirements_only
    - profile: container_runtime
      requirements:
        - pinned_runtime_profile
        - network_and_mount_policy
        - credential_scrubbing
      verification_status: requirements_only
  evidence_ceiling: RequirementsOnly
doctrine:
  summary: >-
    Declares platform-specific containment requirements without claiming one universal sandbox guarantee.
  non_role:
    - payload_safety_certification
    - process_policy_authorship
    - network_admission
  nonclaims:
    - does_not_create_mathematical_facts_or_witnesses
    - does_not_issue_action_licenses
    - does_not_authorize_engine_state_transitions
    - no_profile_claims_absolute_process_or_sandbox_escape_impossibility
    - static_redirect_checks_do_not_establish_general_toctou_safety
  invariants:
    - requested_profile_must_name_one_verified_implementation
    - undeclared_host_access_fails_closed
  allowed_operations:
    - create_profile_scoped_workspace
    - bind_declared_process_containment
    - destroy_scoped_workspace
  forbidden_operations:
    - claim_cross_platform_equivalence_without_evidence
    - inherit_undeclared_host_credentials
    - follow_undeclared_redirect
