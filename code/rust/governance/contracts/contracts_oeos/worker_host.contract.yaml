schema_version: core.contract.v1
contract_id: urn:core:oeos:worker_host:v1.0.0
title: Bounded Worker Host
kind: host_contract
status: proposed
layer: 09_host
role: WorkerHost
descriptor:
  authority_effect: none
  evidence_ceiling: RequirementsOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts:
      - urn:core:oeos:process_manager:v1.0.0
      - urn:core:oeos:resource_quota:v1.0.0
    proof_obligations:
      - id: WRK-INV-001
        statement: Active workers and queued tasks remain within declared finite bounds.
        verification_status: open
      - id: WRK-INV-002
        statement: Backpressure refuses excess work rather than silently dropping or accumulating it.
        verification_status: open
      - id: WRK-INV-003
        statement: Thread and process worker profiles state their different memory and fault-isolation ceilings.
        verification_status: open
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit:
      - WORKER_BACKPRESSURE_REFUSED
      - WORKER_POOL_REFUSED
      - WORKER_PROFILE_REFUSED
      - WORKER_TASK_REFUSED
  operator_classes:
    may_support: []
    must_not_self_assign: true
relationships:
  abstract: false
  extends:
    - urn:core:constitution:base_host_contract:v1.0.0
requirements:
  inputs:
    - name: frozen_host_task_request
      type: urn:core:oeos:type:host_task_request:v1.0.0
      required: true
  outputs:
    - name: bounded_worker_result
      type: urn:core:oeos:type:bounded_worker_result:v1.0.0
      required: true
  typed_refusals:
    - WORKER_BACKPRESSURE_REFUSED
    - WORKER_POOL_REFUSED
    - WORKER_PROFILE_REFUSED
    - WORKER_TASK_REFUSED
  platform_requirements:
    - profile: thread_worker
      requirements:
        - bounded_queue
        - shared_memory_is_explicitly_possible
        - cooperative_cancellation
      verification_status: requirements_only
    - profile: process_worker
      requirements:
        - bounded_queue
        - process_manager_delegation
        - serialized_task_boundary
      verification_status: requirements_only
  evidence_ceiling: RequirementsOnly
doctrine:
  summary: >-
    Declares bounded dispatch and backpressure without conflating thread workers with process isolation.
  non_role:
    - task_registration
    - candidate_ranking
    - functional_aggregation
  nonclaims:
    - does_not_create_mathematical_facts_or_witnesses
    - does_not_issue_action_licenses
    - does_not_authorize_engine_state_transitions
    - thread_workers_do_not_claim_absence_of_shared_memory
  invariants:
    - queue_and_active_worker_counts_are_bounded
    - task_failures_are_explicit_results_or_refusals
  allowed_operations:
    - dispatch_frozen_task
    - apply_queue_backpressure
    - drain_bounded_worker_pool
  forbidden_operations:
    - accept_arbitrary_callable
    - unbounded_queue_growth
    - claim_thread_process_equivalence
