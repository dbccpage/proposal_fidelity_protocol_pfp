schema_version: core.contract.v1
contract_id: urn:core:oeos:database_adapter:v1.0.0
title: Database Host Adapter
kind: host_contract
status: proposed
layer: 09_host
role: DatabaseAdapter
descriptor:
  authority_effect: none
  evidence_ceiling: RequirementsOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts:
      - urn:core:oeos:capability_guard:v1.0.0
    proof_obligations:
      - id: DB-INV-001
        statement: Database operations require exact read or write host permissions scoped to a named resource.
        verification_status: open
      - id: DB-INV-002
        statement: Parameter binding, transaction, isolation, timeout, and connection ceilings are explicit per adapter profile.
        verification_status: open
      - id: DB-INV-003
        statement: A failed write transaction rolls back or returns a typed refusal without claiming universal cross-database atomicity.
        verification_status: open
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit:
      - DATABASE_CAPABILITY_REFUSED
      - DATABASE_QUERY_REFUSED
      - DATABASE_TIMEOUT_REFUSED
      - DATABASE_TRANSACTION_REFUSED
  operator_classes:
    may_support: []
    must_not_self_assign: true
relationships:
  abstract: false
  extends:
    - urn:core:constitution:base_host_contract:v1.0.0
requirements:
  inputs:
    - name: typed_database_request
      type: urn:core:oeos:type:typed_database_request:v1.0.0
      required: true
  outputs:
    - name: bounded_database_result
      type: urn:core:oeos:type:bounded_database_result:v1.0.0
      required: true
  typed_refusals:
    - DATABASE_CAPABILITY_REFUSED
    - DATABASE_QUERY_REFUSED
    - DATABASE_TIMEOUT_REFUSED
    - DATABASE_TRANSACTION_REFUSED
  platform_requirements:
    - profile: transactional_database
      requirements:
        - parameterized_queries
        - bounded_connection_pool
        - declared_isolation_level
      verification_status: requirements_only
  evidence_ceiling: RequirementsOnly
doctrine:
  summary: >-
    Declares bounded database effects through typed requests and named transactional profiles.
  non_role:
    - domain_schema_meaning
    - query_result_truth
    - migration_authority
  nonclaims:
    - does_not_create_mathematical_facts_or_witnesses
    - does_not_issue_action_licenses
    - does_not_authorize_engine_state_transitions
    - no_cross_database_atomicity_or_isolation_equivalence_is_claimed
  invariants:
    - query_text_and_parameters_are_separate
    - connection_and_result_counts_are_bounded
  allowed_operations:
    - execute_typed_read
    - execute_scoped_transaction
    - rollback_failed_transaction
  forbidden_operations:
    - interpolate_untrusted_query_text
    - bypass_declared_transaction_profile
    - promote_query_result_to_fact
