      - forgetful_requires_loss_ledger
      - forgetful_requires_loss_evidence
      - forgetful_records_source_and_target_hash
      - forgetful_declares_preserved_invariants
      - forgetful_rejects_hidden_loss
      - forgetful_does_not_claim_equivalence
      - forgetful_output_defaults_to_evidence_only
      - checked_forgetful_may_be_factonly_after_verification
      - forgetful_does_not_emit_action_fact_envelope
      - same_forgetful_input_same_result_hash
      - forgetful_result_does_not_create_certificate
      - forgetful_checked_result_uses_certificate_boundary
      - forgetful_does_not_self_declare_effect_class_r
      - forgetful_induced_residual_requires_tie_policy
      - forgetful_does_not_emit_action_license
      - forgetful_does_not_authorize_transition
      - forgetful_does_not_execute
      - forgetful_evidence_envelope_is_canonical_import

    negative_capability_test_example:
      python_code: |
        def test_forgetful_requires_loss_ledger():
            op = {"source": "metric_space", "target": "topological_space", "loss_ledger": None}
            with pytest.raises(ValueError):
                validate_forgetful_action(op)

    canonical_invariant: >
      ForgetfulAction is an EvidenceOnly action candidate that lawfully forgets declared
      structure with explicit loss ledger, preserved-invariant declarations, source/target
      hashes, and replayable evidence. It emits loss evidence, not equivalence, authority,
      license, action, or execution. Checked loss facts require a declared checking or
      certificate boundary. If it induces residual projection, R classification requires
      the fixed-layer checker and deterministic TiePolicy. Candidates propose
      transformations; Evaluators judge; LicensingBoundary authorizes; Engine executes;
      Trace records; MetaLift changes carrier/schema expressivity only through license.

