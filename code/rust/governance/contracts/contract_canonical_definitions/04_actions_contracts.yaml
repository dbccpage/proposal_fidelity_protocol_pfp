    source_file: forgetful_action_contract.md
    frontmatter:
      name: ForgetfulAction
      role: "Lawful information forgetting with explicit loss ledger"
      classification: candidate
      effect_class: "none; may support R classification after fixed-layer checker"
      authority_effect: EvidenceOnly
      depends_on:
