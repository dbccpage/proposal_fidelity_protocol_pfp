  # ---------------------------------------------------------------------------
  component_shared_boundary:
  # ---------------------------------------------------------------------------
    source_file: component_shared_boundary_contract.md
    frontmatter:
      name: ComponentSharedBoundary
      role: "Defines shared boundary law for all non-operator component families"
      classification: boundary
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ContractConstitution
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - "claiming operator status for non-E/I/C/R/M entities"
        - "using Op suffix or Operator name for non-effect-class components"
        - "authorizing transitions without ActionLicense authority"
        - "executing without Engine boundary"
        - "mutating global state without licensed Engine transition"
        - "ranking candidates outside Evaluator/Search policy boundary"
        - "searching outside SearchGenerator boundary"
        - "scheduling execution outside declared orchestration boundary"
        - "collapsing evidence, fact, decision, license, action, and record"
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - FactEnvelope
        - DecisionEnvelope
        - ActionLicense
        - Action
        - Record
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, or upgrade evidence authority.
      LLM output may propose component definitions, mappings, or patches, but those proposals
      are EvidenceOnly until checked by the relevant component boundary.

    shared_component_law: >
      Component-family members emit artifacts under their declared artifact family.
      Most component outputs are EvidenceOnly by default. They may become FactOnly,
      DecisionEnvelope, ActionLicense, Action, or Record only through the declared
      boundary that owns that authority. A component-family member may not authorize,
      execute, certify, terminalize, search, rank, mutate global state, or change
      carrier expressivity unless its specific contract declares that role and authority.

    canonical_separation:
      Constructor: "declares or builds structured intake artifacts; Validator checks them"
      Adapter: "changes representation without changing meaning"
      Encoder: "embeds into constrained representation"
      Decoder: "reconstructs only what the encoding evidence permits"
      Generator_Search: "proposes detached candidates"
      Lambda: "proposes local transformation"
      Reducer: "proposes same-carrier deflation"
      Transform: "proposes same-carrier rearrangement"
      Projector: "proposes explicit-loss projection"
      Reflector: "quotes or reflects; it does not execute"
      Normalizer: "proposes canonical form"
      Solver: "computes"
      Functional: "composes measurements"
      Observable: "extracts primitive quantities"
      Analysis: "checks factual evidence"
      Certifier: "binds claims to evidence"
      Evaluator: "judges"
      Policy: "decides policy"
      Terminalizer: "seals terminal outcomes or licenses"
      LicensingBoundary: "emits ActionLicense"
      Engine: "executes licensed transitions"
      Trace: "records"
      Replay: "verifies reconstruction"
      MetaJudgment: "judges lift admissibility"
      LiftLicense: "authorizes carrier/schema extension"

