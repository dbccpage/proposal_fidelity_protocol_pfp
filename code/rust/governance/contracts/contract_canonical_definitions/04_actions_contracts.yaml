  intake_constructor:
  # ---------------------------------------------------------------------------
    source_file: intake_constructor_contract.md
    frontmatter:
      name: IntakeConstructor
      role: "Deterministic intake boundary converting raw input to typed construction evidence"
      version: "2.0"
      classification: boundary
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation_override
        - terminalization
        - execution
        - authority_upgrade
        - repair
        - solving
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - FactEnvelope
        - Record
      referenced_domain_kinds:
        - WitnessEnvelope
        - CertificateEnvelope
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      This contract is a governance artifact. LLM-generated content carries no authority
      within this contract. LLM output may propose candidates, contract edits, or tests, but those proposals are EvidenceOnly until checked by the declared boundary.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      Constructor is a BOUNDARY (intake boundary), not a fixed-layer operator. A Constructor
      sits at the intake boundary of the engine. It validates and converts raw input
      into typed internal structures. It does not compute, evaluate, repair, or execute.

    core_definition: >
      A Constructor is a deterministic boundary unit that converts raw or heterogeneous
      input into a validated internal BaseType. It may parse, decode, type-check, and
      validate. It may not repair, solve, optimize, search, register with the engine, or
      mutate runtime state. Constructor outputs are EvidenceOnly by default. A checked
      construction result may become FactOnly only after validation certificate
      verification, schema conformance checking, and replay verification.

    tower_placement:
      description: >
        Constructors are the intake boundary of the engine. They sit at the outermost
        edge, accepting untrusted data and producing validated mathematical objects.
      flow: "Untrusted external data -> Constructor -> validated BaseType -> Engine pipeline"
      critical_note: >
        Constructors are NOT Adapters. Constructors ingest untrusted/raw data and create
        lawful internal objects. Adapters convert between already-declared,
        already-validated representations.

    known_implementation_locations:
      - location: "engines/quantum/core/density_matrix.rs"
        constructs: "DensityMatrix::new(), DensityMatrix::pure()"
      - location: "engines/quantum/adapters/quantum_density_engine.rs"
        constructs: "from_prompt_embedding_checked(), from_states_checked()"
      - location: "engines/quantum/adapters/text_density_encoder.rs"
        constructs: "TextDensityEncoder::encode()"
      - location: "engines/quantum/adapters/graph_density.rs"
        constructs: "GraphDensityMatrix construction"
      - location: "engines/quantum/channels/quantum_channel.rs"
        constructs: "QuantumChannel::try_new()"
      - location: "engines/prompt_intake_engine.rs"
        constructs: "PromptIntakeEngine::parse_cot_record(), parse_jsonl_record()"
      - location: "types/trace_step.rs"
        constructs: "TraceStep::new_validated()"
      - location: "types/trace_dependency.rs"
        constructs: "TraceDependency::new_validated()"
      - location: "types/section.rs"
        constructs: "Section::new_validated()"
      - location: "trace/replay_ledger.rs"
        constructs: "ReplayLedger::from_payloads()"
      - location: "trace/witness.rs"
        constructs: "ExecutionWitness::from_execution()"

    architectural_mandate:
      mandatory_validation:
        section_number: 1
        description: "Constructor output MUST be impossible without validation"
        invariant: "Ok(T) => T.validate().is_ok()"
        example_rust_code: |
          pub fn new(dim: usize, data: Vec<C64>) -> Result<Self, DensityMatrixError> {
              if dim == 0 { return Err(DensityMatrixError::ZeroDimension); }
              if data.len() != dim * dim {
                  return Err(DensityMatrixError::ShapeMismatch { ... });
              }
              // ... additional validation
              Ok(Self { dim, data })
          }
      separate_parsing_from_construction:
        section_number: 2
        description: >
          Parser: bytes/text -> intermediate syntax. Constructor: intermediate/raw structure
          -> validated BaseType. Parsing errors and invariant violations MUST remain distinct
          error types.
      zero_mathematical_solving_or_repair:
        section_number: 3
        forbidden:
          - no filling missing fields
          - no guessing defaults
          - no normalizing invalid topology
          - no deleting bad nodes/edges
          - no solving constraints to make input valid
        allowed:
          - canonical decoding
          - type conversion
          - invariant checking
          - explicit default only if schema declares it
      pure_owned_instantiation:
        section_number: 4
        must_not:
          - "take &mut Engine"
          - "maintain own state"
          - "register, schedule, attach, or mutate global state"

    evidence_integration:
      description: "When a constructor creates an object within a traced execution"
      steps:
        - "The constructed object's state hash is recorded in the ReplayLedger"
        - "If the constructor is the first step, its output hash becomes the genesis_hash"
        - "The EvidencePacket records initial_state, constructor_morphism, hypothesis_invariant"
      rust_code: |
        // trace/evidence.rs
        pub struct EvidencePacket {
            pub claim_id: Uuid,
            pub initial_state: String,
            pub constructor_morphism: String,
            pub hypothesis_invariant: String,
            pub formal_translation: String,
            pub oracle_execution_trace: Option<String>,
            pub proof: Option<OracleProof>,
        }

    symsys_integration:
      description: "Constructors can be proposed by the SymSys pipeline"
      stages:
        - "Stage 1 (Ideation): Propose a new constructor for a raw data format"
        - "Stage 2 (Audit): Red-team the constructor for repair smuggling"
        - "Stage 3 (L2 Extraction): Generate the Rust skeleton with validation checks"
        - "Stage 4 (Countermodel): Find inputs that bypass validation"
        - "Stage 5 (Evidence Plan): Write #[test] functions verifying all rejection paths"

    required_boundary_flow:
      lawful: "Raw input -> Constructor -> validated BaseType"
      forbidden: "Raw input -> Constructor -> repaired candidate"

    rust_types:
      constructor_output:
        code: |
          pub struct ConstructorOutput<T> {
              pub value: T,
              pub constructor_id: ConstructorId,
              pub input_hash: Hash256,
              pub value_hash: Hash256,
              pub validation_report_ref: Option<ValidationReportRef>,
              pub certificate_refs: Vec<CertificateId>,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
      constructor_trait:
        code: |
          pub trait Constructor<Raw, T> {
              fn constructor_id(&self) -> ConstructorId;
              fn parse(&self, raw: &Raw) -> Result<IntermediateSyntax, ParseError>;
              fn construct(&self, syntax: IntermediateSyntax) -> Result<ConstructorOutput<T>, ConstructorError>;
          }
      constructor_error:
        code: |
          pub enum ConstructorError {
              Parse(ParseError),
              MissingRequiredField { field: &'static str },
              InvariantViolation { invariant: InvariantId },
              RepairRequiredButForbidden,
          }
        note: "Constructors must reject incomplete input rather than fill it. A constructor MUST fail closed when required input is absent, ambiguous, or structurally incomplete."

    canonical_invariant: >
      Constructor may perform intake precondition checks and schema-directed parsing. Validator owns validation. CertificateKernel owns certificates. Encoder encodes. LambdaAction bridges. ReducerAction deflates.
      TransformAction rearranges. Generator proposes. Engine executes licensed transitions. Boundaries shape
      and validate; only Evaluators accept; only Engines execute; only MetaLift changes
      carrier expressivity. No boundary is allowed to become an Engine in disguise.

    upgrade_v02:
      constructor_output_contract:
        description: "A constructor MUST emit a validated object plus a validation certificate, not just T"
      repair_smuggling_guard:
        description: "Constructors must reject incomplete input rather than fill it"
      python_poc: |
        from dataclasses import dataclass
        from typing import Any
        import hashlib, json

        @dataclass(frozen=True)
        class ConstructorOutput:
            value: Any
            constructor_id: str
            input_hash: str
            value_hash: str
            validation_certificate_ref: str


        def stable_hash(obj: Any) -> str:
            raw = json.dumps(obj, sort_keys=True, default=str).encode()
            return hashlib.sha256(raw).hexdigest()


        def construct_required_record(raw: dict) -> ConstructorOutput:
            required = ["id", "prompt"]
            for field in required:
                if field not in raw:
                    raise ValueError(f"MissingRequiredField:{field}")

            # No default filling. No repair.
            value = {"id": raw["id"], "prompt": raw["prompt"]}
            return ConstructorOutput(
                value=value,
                constructor_id="prompt_record_constructor_v1",
                input_hash=stable_hash(raw),
                value_hash=stable_hash(value),
                validation_certificate_ref="cert_prompt_record_schema_v1",
            )

