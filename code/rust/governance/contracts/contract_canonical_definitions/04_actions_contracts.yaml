      classification: candidate
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation
        - terminalization
        - execution
        - authority_upgrade
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - EvidenceEnvelope
        - FactEnvelope
        - WitnessEnvelope
        - CertificateEnvelope
        - ReplayReport
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, assign effect classes, or
      upgrade evidence authority. LLM output may propose TransformAction candidates,
      TransformLaw descriptors, migration patches, or tests, but those proposals are
      EvidenceOnly until checked by the declared TransformAction, Replay, Evaluator, and
      component-boundary checks.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is an ACTION CANDIDATE, not a fixed-layer operator. A TransformAction rearranges
      structure within the same carrier. It makes no default Phi monotonicity claim. The
      Evaluator judges admissibility. A LicensingBoundary may authorize execution when
      required. The Engine executes only licensed transitions.

    status_warning: >
      STATUS: DISABLED. The operators/transforms/ module is currently commented out in
      operators/mod.rs (line 15: // pub mod transforms;). The 19 transform implementations
      exist on disk but do not compile into the binary. This document describes the
      architectural intent for when the module is resurrected or its contents are migrated.

    core_definition: >
      A TransformAction is a deterministic, stateless, unary same-carrier action candidate
      S -> S that rearranges or modifies admitted state within the same carrier, without Phi
      guarantees, search, ranking, orchestration, repair, representation conversion, or
      hidden lift.

    tower_placement: >
      A TransformAction is the tower kind for same-carrier rearrangement. It may change
      arrangement, parameterization, or internal structure, but it stays inside the declared
      carrier. A TransformAction may not resolve an inadmissible request by reinterpreting
      the carrier. Converting a discrete support into a continuous interval, or otherwise
      switching geometry so the operation type-checks, is hidden lift/coercion and is
      forbidden. That boundary belongs to explicit Meta lift.

    rust_types:
      transform_action_trait_current:
        description: "Current working implementation (operators/transforms/mod.rs)"
        code: |
          pub trait TransformAction: Send + Sync {
              fn name(&self) -> &'static str;
              fn apply(&self, input: &NemotronValue) -> Result<NemotronValue, TransformFailure>;
              fn is_invertible(&self) -> bool { true }
              fn preserves_dimension(&self) -> bool { true }
          }
        note: "This is the active definition (when the module is enabled). It operates on NemotronValue and has no generic type parameters. Law witnesses are self-reported booleans."
      transform_action_trait_deprecated:
        description: "Deprecated contract-layer definition"
        code: |
          pub trait TransformAction<S: BaseType>: ComponentIdentity {
              fn propose_transform(&self, input: &S) -> Result<TransformOutput<S>, TransformFailure>;
              fn law(&self) -> &'static TransformLaw;
          }
        note: "This is the design target. It is generic over BaseType, requires ComponentIdentity, and demands a TransformLaw descriptor. Neither ComponentIdentity nor TransformLaw are used by any transform implementation."
      transform_action_trait_migration_target:
        description: "Migration target"
        code: |
          pub trait TransformAction<S: BaseType>: BoundContract {
              fn propose_transform(&self, input: &S) -> Result<TransformOutput<S>, TransformFailure>;
              fn law(&self) -> &'static TransformLaw;
          }
        note: "apply is a legacy implementation name. Contract-canonical APIs should use propose_transform or transform_candidate to avoid implying execution authority. Uses BoundContract from contracts::base_contracts::binding."
      transform_output:
        code: |
          pub struct TransformOutput<S> {
              pub transform_id: ComponentId,
              pub transform_version: ComponentVersion,
              pub input_hash: Hash256,
              pub output_hash: Hash256,
              pub carrier_ref: CarrierRef,
              pub law_ref: LawId,
              pub witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
              pub output: S,
          }

          pub struct CheckedTransformOutput {
              pub output_ref: TransformOutputRef,
              pub same_carrier_certificate: CertificateId,
              pub law_check_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly or RequiresEvaluator depending contract
          }
      phi_claim:
        code: |
          pub enum PhiClaim {
              Unrestricted,         // default
              Preserved,            // Phi(T(s)) = Phi(s)
              NonIncreasing,        // Phi(T(s)) <= Phi(s)
              Bounded { factor: f64 }, // Phi(T(s)) <= factor * Phi(s)
          }

    existing_implementations:
      description: "19 files, all disabled"
      reclassification_candidates:
        - file: "transform_base2_to10.rs"
          concern: "Decoder / representation conversion"
        - file: "transform_roman_to_int.rs"
          concern: "Decoder / parser boundary"
        - file: "transform_complex_numbers.rs"
          concern: "domain-specific computation or representation boundary"
        - file: "transform_op_remap_plus_is_mult.rs"
          concern: "semantic reinterpretation; likely forbidden or lift/evaluator-governed"
        - file: "transform_op_remap_mult_is_pow.rs"
          concern: "semantic reinterpretation; likely forbidden or lift/evaluator-governed"
      note: "Before re-enabling operators/transforms, each file must be classified as TransformAction, Adapter, Decoder, Functional, Solver, or forbidden."

    same_carrier_law:
      preserves:
        - carrier identity
        - carrier type
        - carrier rank
        - schema reference
        - universe reference
        - coefficient semantics
        - carrier schema hash
        - admissible domain
      note: >
        Any schema change, carrier identity change, universe change, coefficient-domain
        change, or expressivity expansion is not TransformAction. Transformations must declare
        a TransformLaw preventing hidden adapters/lifts (e.g., kappa-preserving, kappa-bounded,
        or same-carrier).
      may_change:
        - "arrangement, labels, parameters"
        - "internal edge/weight/data layout"
      must_not_change: "cardinality or introduce/remove structure unless explicitly declared in its TransformLaw"
      failure_rule: "A TransformAction MUST fail if the operation requires a representation change, carrier lift, schema change, or policy-dependent reinterpretation."

    phi_behavior: >
      TransformAction makes no default Phi monotonicity claim. Any Phi claim is a declaration
      only and must be verified by the Evaluator layer.

    measurement_evaluation_integration: >
      TransformAction does not compute Phi1, Gamma2, Xi, closure defect, quotient mass, or
      cohomological status. If a transform result is later evaluated, the Evaluator may
      consume checked MeasurementEnvelope references produced by the Functional / Measurement
      boundary. Any monotonicity, non-increase, or admissibility claim is outside
      TransformAction and must be verified by the declared Evaluator or Measurement boundary.

    forbidden_tokens:
      - ActionFactEnvelope
      - OperatorFactEnvelope
      - TransformOp
      - apply_lift
      - hidden_lift
      - reinterpret_carrier
      - change_schema
      - change_universe
      - compute_phi
      - compute_gamma
      - compute_xi
      - rank_candidates
      - score_candidate
      - PolicyDecision
      - EngineDecision
      - TerminalEnvelope
      - ActionLicense
      - authorize_transition
      - license_transition
      - "execute("
      - "terminalize("
      - mutate_runtime
      - self_declare_effect_class

    required_tests:
      - transform_output_defaults_to_evidence_only
      - checked_transform_output_may_be_factonly_after_same_carrier_law_and_replay_checks
      - transform_does_not_emit_action_license
      - transform_does_not_authorize_transition
      - transform_does_not_execute
      - transform_does_not_compute_measurements
      - transform_does_not_self_declare_effect_class
