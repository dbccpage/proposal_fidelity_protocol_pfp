        - FactEnvelope
        - CertificateEnvelope
        - WitnessEnvelope
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, or upgrade evidence authority.
      LLM output may propose ForgetfulAction candidates, loss ledgers, or contract edits,
      but those proposals are EvidenceOnly until checked by the declared ForgetfulAction,
      Witness, Certificate, Replay, and Evaluator boundaries.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is a CANDIDATE, not a fixed-layer operator. A ForgetfulAction lawfully forgets
      declared structure and emits explicit loss evidence. A checked forgetful result may
      support FactOnly loss claims only after loss verification, certificate binding, and
      replay checking. It may support later classification as R = residual projection only
      if the fixed-layer operator classifier/checker verifies deterministic TiePolicy,
      residual target, invariant preservation, discarded-information evidence, and replay
      support. The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. Engine executes only licensed transitions.
      ForgetfulAction lawfully forgets declared structure. ForgetfulAction emits explicit
      loss evidence. ForgetfulAction does not compress silently, claim equivalence,
      terminalize, mutate runtime state, or execute engine actions.

    subsystem_classification:
      subsystem: "representation / projection / forgetting candidate"
      signature: "RichStructure -> PoorerStructure"
      role: "lawfully forgets declared structure with explicit loss ledger"

    core_definition: >
      A ForgetfulAction maps a richer declared structure to a poorer declared structure by
      forgetting explicitly named fields, invariants, or structure.

    obligations:
      must:
        - "Forget structure lawfully"
        - "Issue a loss ledger and evidence sufficient for later certificate binding"
        - "Declare source and target schemas"
        - "Emit a loss ledger"
        - "Preserve declared surviving invariants"
        - "Record source and target hashes"
        - "Validate that target is a subset of source projection"
      must_not:
        - "Destroy structure without producing a cryptographic/traceable certificate of what was forgotten"
        - "Claim the source and target are equivalent"
        - "Hide non-recoverable loss"
        - "Act as a Projector unless registered under projector law"
        - "Act as a ReducerAction unless reduction law is separately declared"
        - "Act as an Adapter unless representation conversion is separately declared"

    kernel_authority_matrix_note: >
      This contract does not duplicate the shared authority matrix. ForgetfulAction follows
      kernel_authority_matrix_contract.md and component_shared_boundary_contract.md.
      Component-specific authority here may narrow the shared matrix but MUST NOT exceed it.

    rust_types:
      forgetful_request:
        code: |
          pub struct ForgetfulRequest {
              pub request_id: ForgetfulRequestId,
              pub source_structure: StructureRef,
              pub target_structure: StructureRef,
              pub source_schema: SchemaRef,
              pub target_schema: SchemaRef,
              pub forgotten_fields: Vec<StructureField>,
              pub preserved_invariants: Vec<InvariantId>,
              pub source_replay_ref: Option<ReplayRef>,
              pub request_hash: Hash256,
          }
      forgetful_result:
        code: |
          pub struct ForgetfulResult {
              pub forgetful_action_id: ForgetfulActionId,
              pub forgetful_action_version: ComponentVersion,
              pub source_hash: Hash256,
              pub target_hash: Hash256,
              pub loss_ledger: LossLedger,
              pub witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub result_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
      checked_forgetful_result:
        code: |
          pub struct CheckedForgetfulResult {
              pub result_ref: ForgetfulResultRef,
              pub loss_verification_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly
          }
      loss_ledger:
        code: |
          pub struct LossLedger {
              pub source_hash: Hash256,
              pub target_hash: Hash256,
              pub forgotten: Vec<LostStructure>,
              pub preserved: Vec<InvariantId>,
              pub non_recoverable: bool,
              pub ledger_hash: Hash256,
          }
        note: "A checked forgetful result may become FactOnly only after loss verification, certificate binding, and replay checking."
      forgetful_action_trait:
        code: |
          pub trait ForgetfulAction {
              fn forgetful_action_id(&self) -> ForgetfulActionId;
              fn forgetful_action_version(&self) -> ComponentVersion;

              fn forget(
                  &self,
                  request: ForgetfulRequest,
              ) -> Result<EvidenceEnvelope<ForgetfulResult>, ForgetfulError>;
          }
        note: "EvidenceEnvelope MUST be imported from the canonical artifact taxonomy. This contract MUST NOT define a local EvidenceEnvelope type."

    default_authority_effect: "AuthorityEffect::EvidenceOnly"
    compression_rule: "ForgetfulAction must never be used as compression unless the loss_certificate proves which invariants survived."

    forgetful_vs_projector:
      description: >
        ForgetfulAction is not automatically Projector. ForgetfulAction forgets declared
        structure. Projector projects to a declared quotient, subspace, support, or
        coordinate subset. If a ForgetfulAction induces a quotient, it MUST also satisfy
        projector_candidate_contract.md. If a ForgetfulAction induces a residual projection,
        it MUST declare a deterministic TiePolicy and satisfy the ResidualProjection
        contract. Without TiePolicy, it cannot support R classification.

    forbidden_tokens:
      - silent_compress
      - equivalent_after_forget
      - lossless
      - PolicyDecision
      - EngineDecision
      - TerminalEnvelope
      - ActionLicense
      - ALLOW_OUTPUT
      - BLOCK_OUTPUT
      - "terminalize("
      - "execute("
      - mutate_runtime
      - rank_candidates
      - score_candidate
      - authorize_transition
      - license_transition
      - self_declare_effect_class
      - EncodingEvidence

    required_tests:
