      - semantic_reinterpretation_transform_is_forbidden_or_reclassified

    differentiators_table:
      - kind: TransformAction
        domain: "S -> S"
        guarantee: "Prevents hidden lifts (declared TransformLaw)"
        phi: "Unrestricted (unless declared)"
      - kind: ReducerAction
        domain: "S -> S"
        guarantee: "Idempotent + kappa-monotone: kappa(R(s)) <= kappa(s)"
        phi: Reducing
      - kind: LambdaAction
        domain: "admitted carrier morphism"
        guarantee: "local declared law, no hidden lift"
        phi: "declared Phi behavior"
      - kind: Encoder
        domain: "S -> DensityMatrix"
        guarantee: "PSD, trace-one postcondition"
        phi: "Representation boundary"
      - kind: Generator
        domain: "S -> Vec<Candidate<S>>"
        guarantee: "Blind proposal, zero evaluation"
        phi: "N/A"
      - kind: Constructor
        domain: "Raw -> BaseType"
        guarantee: "Validation-gated instantiation"
        phi: "N/A"

    canonical_invariant: >
      TransformAction is an EvidenceOnly same-carrier action candidate. It proposes
      deterministic structural rearrangement under a declared TransformLaw. It does not
      repair, reduce, encode, adapt, search, rank, measure, evaluate, license, mutate,
      authorize, or execute. Checked transform facts require same-carrier, law, and replay
      verification. LicensingBoundary authorizes execution when required; Engine executes
      licensed transitions only.

    upgrade_v02:
      transform_law:
        description: "TransformActions are same-carrier rearrangements. They make no default Phi claim."
        rust_code: |
          pub struct TransformLaw {
              pub law_id: LawId,
              pub same_carrier_required: bool,
              pub invertibility: InvertibilityClaim,
              pub phi_claim: PhiClaim,
              pub carrier_invariants: Vec<InvariantId>,
              pub authority_effect: AuthorityEffect,
          }

          pub enum InvertibilityClaim {
              Invertible { inverse: ComponentId },
              NotInvertibleDeclared,
              Unknown,
          }
        note: >
          Default: authority_effect: AuthorityEffect::EvidenceOnly. A raw TransformOutput is
          EvidenceOnly. A checked same-carrier TransformOutput may become FactOnly only for
          the claim that the transform satisfied its declared structural law. If later
          admissibility judgment is needed, consumers may route the checked output to an
          Evaluator. The TransformAction itself does not emit RequiresEvaluator unless its
          specific contract declares that boundary. If invertibility is Unknown, no theorem
          may depend on invertibility for that TransformAction.
      disabled_module_rule: >
        Since transforms are disabled in the binary, mark every theorem depending on them as
        conditional: Transform theorem applies only when operators/transforms is compiled,
        registered, and admitted by the component registry.
      python_poc: |
        def validate_transform_same_carrier(before: dict, after: dict) -> None:
            if before.get("carrier_id") != after.get("carrier_id"):
                raise ValueError("Transform changed carrier identity.")
            keys = ["carrier_type", "carrier_rank", "schema_ref", "universe_ref"]
            for key in keys:
                if before.get(key) != after.get(key):
                    raise ValueError(f"Transform changed carrier field: {key}")

