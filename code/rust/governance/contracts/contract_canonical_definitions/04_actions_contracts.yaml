    frontmatter:
      name: LambdaActionCandidate
      role: "Pure local endomorphism proposing same-carrier transformation"
      version: "2.0"
      classification: candidate
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
