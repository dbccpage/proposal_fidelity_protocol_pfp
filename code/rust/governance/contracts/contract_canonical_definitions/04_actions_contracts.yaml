    operator_exclusion_note: >
      None of these entities are operators. Only E (exact repair), I (quotient isometry),
      C (context embedding), R (residual projection), and M (refused mutation) are operators.
      See fixed_layer_operator_algebra_contract.md.

    role_separation_matrix_note: >
      This contract does not duplicate the full matrix.
      Use kernel_authority_matrix_contract.md as the canonical shared reference.
      Component-specific contracts MAY narrow authority further, but MUST NOT exceed the shared matrix.

    shared_envelope_pattern:
      authority_effect_enum:
        source: "GlobalContractTaxonomy / core-contracts"
        note: "Component contracts MUST NOT define local authority-effect enums"
        values:
          - None
          - EvidenceOnly
          - FactOnly
          - RequiresEvaluator
          - RequestsDecision
          - AuthorizesTransition
          - StateTransition
      component_evidence_envelope:
        rust_code: |
          pub struct ComponentEvidenceEnvelope<R> {
              pub component_id: ComponentId,
              pub component_version: ComponentVersion,
              pub input_hash: Hash256,
              pub output_hash: Hash256,
              pub result: R,
              pub law_refs: Vec<LawId>,
              pub witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        note: >
          ComponentEvidenceEnvelope is not a fact by name. Fact, decision, license, action,
          and record envelopes must use their own canonical artifact families and owning boundaries.

    default_authority_effect: "AuthorityEffect::EvidenceOnly"
    default_authority_note: >
      Only components whose contracts explicitly own judgment or decision boundaries may emit
      RequiresEvaluator or RequestsDecision. Only licensing boundaries emit AuthorizesTransition.
      Only Engine emits StateTransition.

    negative_capability_tests:
      forbidden_component_tokens:
        - EngineDecision
        - PipelineEvent
        - PolicyDecision
        - TerminalEnvelope
        - ActionLicense
        - "accepted = true"
        - "rejected = true"
        - "verdict: Accept"
        - "verdict: Reject"
        - quality_score
        - reward_score
        - should_apply
        - authorize_transition
        - license_transition
        - execute_transition
        - mutate_global_state
        - solve_cnf
        - solve_l1_hodge
        - "phi1("
        - "gamma2("
      forbidden_naming_tokens:
        - LambdaOp
        - ReducerOp
        - TransformOp
        - ForgetfulOp
        - AdapterOp
        - GaugeOp
        - ReflectorOp
        - OperatorFactEnvelope
        - BasisOperator
        - ActionFactEnvelope
      python_guard: |
        from pathlib import Path

        FORBIDDEN_COMPONENT_TOKENS = [
            "EngineDecision", "PipelineEvent", "PolicyDecision", "TerminalEnvelope",
            "ActionLicense", "accepted = true", "rejected = true", "verdict: Accept",
            "verdict: Reject", "quality_score", "reward_score", "should_apply",
            "authorize_transition", "license_transition", "execute_transition",
            "mutate_global_state", "solve_cnf", "solve_l1_hodge", "phi1(", "gamma2(",
        ]

        FORBIDDEN_NAMING_TOKENS = [
            "LambdaOp", "ReducerOp", "TransformOp", "ForgetfulOp",
            "AdapterOp", "GaugeOp", "ReflectorOp",
            "OperatorFactEnvelope", "BasisOperator", "ActionFactEnvelope",
        ]

        def assert_no_forbidden_tokens(root: str):
            violations = []
            for path in Path(root).rglob("*.rs"):
                text = path.read_text(encoding="utf-8")
                for token in FORBIDDEN_COMPONENT_TOKENS + FORBIDDEN_NAMING_TOKENS:
                    if token in text:
                        violations.append((str(path), token))
            assert not violations, violations

    required_tests:
      - shared_boundary_uses_canonical_authority_effect_enum
      - shared_boundary_removes_action_fact_envelope
      - component_outputs_default_to_evidence_only
      - search_and_solver_are_not_execution
      - pipeline_is_orchestration_not_execution
      - only_engine_emits_action
      - only_licensing_boundary_emits_action_license
      - component_evidence_envelope_is_not_fact_by_name
      - adapter_outputs_evidence_not_fact
      - no_component_self_declares_operator_status
      - no_legacy_op_suffix_tokens
      - component_specific_contract_cannot_exceed_kernel_authority_matrix

    canonical_invariant: >
      ComponentSharedBoundary defines evidence-first boundaries for non-operator components.
      Only E/I/C/R/M are fixed-layer operator classes. Components emit artifacts under declared
      families; most outputs are EvidenceOnly until checked. Components do not gain authority from
      names, envelopes, or placement. Only licensing boundaries authorize transitions, only Engine
      executes, Trace records, and no shared component envelope is a fact by default.

    file_naming_law: "All component-family implementation files MUST obey operator_file_naming_contract.md"

  # ---------------------------------------------------------------------------
  fixed_layer_operator_algebra:
  # ---------------------------------------------------------------------------
    source_file: fixed_layer_operator_algebra_contract.md
    frontmatter:
      name: FixedLayerOperatorAlgebra
      role: "defines the five and only five fixed-layer effect classes in the obstruction algebra"
      version: "2.0"
      classification: operator-taxonomy
      effect_class: all
      authority_effect: EvidenceOnly
      depends_on:
        - ContractConstitution
        - GlobalContractTaxonomy
        - KernelAuthorityMatrix
      forbidden_authority:
        - "creating new effect-classes beyond E/I/C/R/M"
        - "calling non-operator entities operators"
        - "candidate self-declaring effect class"
        - "operator artifact emitting Action directly"
        - "operator artifact emitting ActionLicense directly"
        - "composition without RewriteLaw or certificate"
        - "authority upgrade without checker boundary"
      primary_output_family: StructureArtifact
      domain_output_kind: TaxonomyRule
      referenced_output_families:
        - EvidenceEnvelope
        - FactEnvelope
        - ActionLicense
        - Action
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, assign effect classes,
      prove operator composition, or upgrade evidence authority. LLM output may propose
      operator candidates or algebra patches, but those proposals are EvidenceOnly until
      checked by the fixed-layer operator classifier/checker.

    core_doctrine: >
      The strict fixed-layer obstruction algebra has exactly five effect-classes.
      No more may be added without constitutional amendment.

    operator_authority_boundary:
      candidate_authority: EvidenceOnly
      checked_classification_authority: "FactOnly if checker/certifier verifies"
      licensing_authority: "AuthorizesTransition, emitted only by LicensingBoundary"
      execution_authority: "StateTransition, emitted only by Engine"
      notes:
        - "E/I/C/R/M are effect classes, not execution authority"
        - "An operator candidate is EvidenceOnly"
        - "An operator artifact does not emit ActionLicense, Action, StateTransition, or EngineResult"
        - "A licensed operator application requires a separate ActionLicense"
        - "Engine execution of a licensed operator application is the Action"

    effect_classes:
      E_exact_repair:
        definition: >
          A same-carrier local displacement that restores a broken invariant to its canonical form.
          The repair is exact: the post-state satisfies the invariant that the pre-state violated.
        rust_candidate: |
          pub struct ExactRepairCandidate {
              pub candidate_id: OperatorCandidateId,
              pub obstruction_ref: ObstructionId,
              pub carrier_ref: CarrierRef,
              pub pre_state_hash: Hash256,
              pub post_state_hash: Hash256,
              pub invariant_restored: InvariantId,
              pub witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub candidate_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        rust_checked: |
          pub struct CheckedExactRepair {
              pub checked_id: CheckedOperatorId,
              pub candidate_ref: OperatorCandidateId,
              pub same_carrier_certificate: CertificateId,
              pub invariant_restoration_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly
          }
        composition_law: "E . E may normalize to E only when same-carrier preservation, invariant restoration, replayability, and an explicit RewriteLaw or certificate justify compression"
        admissibility: "Pre-state must violate the declared invariant; post-state must satisfy it"
        refusal: "If no invariant is violated, E is inadmissible (repair without breakage is identity, not E)"

      I_quotient_isometry:
        definition: >
          A representation-preserving equivalence map that identifies states differing only by gauge freedom.
          The quotient isometry collapses a gauge orbit to its canonical representative without information
          loss relevant to the declared invariants.
        rust_candidate: |
          pub struct QuotientIsometryCandidate {
              pub candidate_id: OperatorCandidateId,
              pub source_carrier: CarrierRef,
              pub target_carrier: CarrierRef,
              pub source_hash: Hash256,
              pub target_hash: Hash256,
              pub equivalence_class: GaugeOrbitId,
              pub isometry_witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub candidate_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        rust_checked: |
          pub struct CheckedQuotientIsometry {
              pub checked_id: CheckedOperatorId,
              pub candidate_ref: OperatorCandidateId,
              pub quotient_preservation_certificate: CertificateId,
              pub invariant_preservation_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly
          }
        identity_note: "Identity may be classified as I only when a declared identity or quotient-equivalence law applies. Identity by naming alone is not an operator fact."
        composition_law: "I . I = I (quotient isometries compose)"
        admissibility: "Source and target must be in the same gauge orbit"
        refusal: "If source and target differ in invariant-relevant structure, I is inadmissible"

      C_context_embedding:
        definition: >
          A context embedding maps a local structure into a declared admissible context within
          the current fixed layer, preserving declared local invariants and recording the context
          relation. It does not perform carrier/schema expansion unless a separate LiftLicense exists.
        rust_candidate: |
          pub struct ContextEmbeddingCandidate {
              pub candidate_id: OperatorCandidateId,
              pub source_carrier: CarrierRef,
              pub context_family_ref: ContextFamilyRef,
              pub target_context_ref: ContextRef,
              pub embedding_witness_refs: Vec<WitnessId>,
              pub preservation_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub candidate_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        rust_checked: |
          pub struct CheckedContextEmbedding {
              pub checked_id: CheckedOperatorId,
              pub candidate_ref: OperatorCandidateId,
              pub injectivity_certificate: CertificateId,
              pub invariant_preservation_certificate: CertificateId,
              pub context_admissibility_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly
          }
        carrier_note: "C does not create new carrier expressivity by itself. If carrier/schema expressivity changes, the operation requires Lift machinery and a LiftLicense."
        composition_law: "C . C may normalize to C only when declared context composition exists and the composed embedding has replay/certificate support"
        admissibility: "Embedding must be injective; source invariants must be preserved in target"
        refusal: "If embedding is not injective or destroys source invariants"

      R_residual_projection:
        definition: >
          A residual projection maps a structure to a deterministic residual representative
          under a declared TiePolicy, preserving required invariants and recording discarded
          information. R is irreversible unless a separate checked witness proves otherwise.
        rust_candidate: |
          pub struct ResidualProjectionCandidate {
              pub candidate_id: OperatorCandidateId,
              pub source_carrier: CarrierRef,
              pub target_carrier_schema: CarrierSchemaRef,
              pub projection_map_ref: ProjectionWitnessId,
              pub tie_policy: TiePolicyId,
              pub discarded_dimensions: Vec<DimensionId>,
              pub invariants_preserved: Vec<InvariantId>,
              pub invariants_discarded: Vec<InvariantId>,
              pub evidence_refs: Vec<EvidenceRef>,
              pub witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub candidate_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        rust_checked: |
          pub struct CheckedResidualProjection {
              pub checked_id: CheckedOperatorId,
              pub candidate_ref: OperatorCandidateId,
              pub surjectivity_certificate: CertificateId,
              pub tie_policy_certificate: CertificateId,
              pub preservation_certificate: CertificateId,
              pub discarded_information_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly
          }
        tie_policy_note: "R requires deterministic TiePolicy. Without TiePolicy, R is invalid."
        composition_law: "R . R may normalize to R only when source/target compatibility, deterministic TiePolicy composition, invariant preservation, discarded-information evidence, replay support, and explicit RewriteLaw or certificate are present."
        admissibility: "Projection must be surjective; target invariants must hold"
        refusal: "If projection destroys required invariants in the target"

      M_refused_mutation:
        definition: >
          M is an absorbing refusal class for invalid, unlicensed, authority-insufficient,
          or inadmissible attempted mutations. M is valid only when it records the proposed
          mutation, refusal reason, refusing boundary, and evidence.
        rust_candidate: |
          pub struct RefusedMutationCandidate {
              pub refusal_id: RefusalId,
              pub attempted_mutation_ref: EvidenceRef,
              pub current_state_hash: Hash256,
              pub proposed_state_hash: Hash256,
              pub refusal_reason: RefusalReason,
              pub refusing_boundary: BoundaryId,
              pub evidence_refs: Vec<EvidenceRef>,
              pub replay_refs: Vec<ReplayRef>,
              pub refusal_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        rust_checked: |
          pub struct CheckedRefusedMutation {
              pub checked_id: CheckedOperatorId,
              pub refusal_ref: RefusalId,
              pub refusal_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly
          }
        composition_law: "M . X = M for any X (refusal absorbs subsequent operations)"
        admissibility: "Always admissible (any proposed mutation may be refused)"
        refusal: "A checked M is absorbing under declared composition. A malformed or unsupported refusal record is rejected as invalid evidence, not classified as another M."

    conditional_composition_table:
      description: >
        Type-level target for checked composition. Not automatic rewrite authority.
        A composition result is valid only when: (1) both operands are checked;
        (2) source/target boundaries match; (3) required carrier/context compatibility holds;
        (4) no authority is upgraded; (5) required RewriteLaw or certificate exists;
        (6) replay trace can be emitted.
      matrix:
        #     E  I  C  R  M
        E:  [ E, E, C, R, M ]
        I:  [ E, I, C, R, M ]
        C:  [ C, C, C, R, M ]
        R:  [ R, R, R, R, M ]
        M:  [ M, M, M, M, M ]
      notes:
        - "M is absorbing: any composition with M yields M"
        - "E and I are 'light' effects that preserve carrier structure"
        - "C and R change context or residual representation within the declared fixed layer. Carrier/schema expressivity changes require Lift machinery and a valid LiftLicense."
        - "C . R != identity in general (information loss in R is irreversible)"

    algebraic_closure_properties:
      closure: "The set {E, I, C, R, M} is closed under composition"
      associativity: "Associativity is a law obligation for checked composition, not an assumed implementation property. Any implementation that relies on associativity must provide a RewriteLaw, finite checker, or certificate."
      identity: "Identity may be represented as a quotient isometry only when a declared identity/equivalence witness exists. Otherwise it is an inert no-change relation, not an operator fact."
      absorption: "M is the zero element: M . X = X . M = M"
      no_inverse_for_R: "Residual projection is not invertible. Lost information cannot be recovered."

    non_operator_entities:
      - entity: Lambda
        correct_classification: Action candidate
        role: "Pure local endomorphism proposing transformation"
      - entity: Reducer
        correct_classification: Action candidate
        role: "Same-carrier deflation proposing reduction"
      - entity: Normalizer
        correct_classification: Action candidate
        role: "Canonical-form mapping proposing normalization"
      - entity: Transform
        correct_classification: Action candidate
        role: "Same-carrier rearrangement proposing transformation"
      - entity: Constructor
        correct_classification: "Boundary (intake)"
        role: "Converts raw input to validated BaseType"
      - entity: Adapter
        correct_classification: "Boundary (representation)"
        role: "Changes representation without changing meaning"
      - entity: Encoder
        correct_classification: "Boundary (representation)"
        role: "Maps to compressed/canonical representation"
      - entity: Decoder
        correct_classification: "Boundary (representation)"
        role: "Inverse of encoder"
      - entity: Projector
        correct_classification: Action candidate
        role: "Projects carrier to lower-dimensional subspace"
      - entity: Reflector
        correct_classification: Action candidate
        role: "Quotation/reflection boundary"
      - entity: Forgetful
        correct_classification: Action candidate
        role: "Discards structure while preserving invariants"
      - entity: Generator
        correct_classification: "Candidate (proposal)"
        role: "Pure proposal morphism"
      - entity: Evaluator
        correct_classification: "Governance (judgment)"
        role: "Admissibility judgment gate"
      - entity: Validator
        correct_classification: "Governance (well-formedness)"
        role: "Structural conformance checker"
      - entity: Terminalizer
        correct_classification: "Governance / terminal mapping"
        role: "Seals terminal outcomes or licenses; does not execute"
      - entity: MetaLift
        correct_classification: Lift machinery
        role: "Licensed carrier extension"
      - entity: Engine
        correct_classification: Execution
        role: "Executes licensed transitions only"
      - entity: Pipeline
        correct_classification: Orchestration
        role: "Routes declared stages; does not execute"
      - entity: Search
        correct_classification: Proposal system
        role: "Generates/traverses candidate frontier only"
      - entity: Solver
        correct_classification: Computation
        role: "Computes declared mathematical results; does not authorize transitions"
    candidate_note: >
        Action candidates may GENERATE proposals for E, I, C, R, or M effects.
        The Evaluator judges admissibility. A LicensingBoundary may authorize execution when required. Engine executes only licensed transitions.
        The candidate itself is never an operator.

    forbidden_tokens:
      naming:
        - LambdaOp
        - ReducerOp
        - TransformOp
        - ForgetfulOp
        - AdapterOp
        - GaugeOp
        - ReflectorOp
        - OperatorFactEnvelope
        - ActionFactEnvelope
        - BasisOperator
      behavior:
        - self_declare_effect_class
        - emit_action
        - emit_action_license
        - execute_transition
        - authorize_transition
        - license_transition
        - compose_without_rewrite_law
        - normalize_without_certificate
        - commute_without_certificate
      notes:
        - "Any *Op suffix or *Operator name on non-E/I/C/R/M entities is forbidden"
        - "OperatorFactEnvelope is forbidden. Use ComponentEvidenceEnvelope or the role-specific canonical envelope"
        - "ActionFactEnvelope is forbidden because it collapses action and fact authority"

    required_tests:
      - only_five_effect_classes_exist
      - effect_class_composition_is_closed
      - effect_class_composition_is_associative
      - refused_mutation_is_absorbing
      - exact_repair_requires_broken_invariant
      - quotient_isometry_preserves_invariants
      - context_embedding_is_injective
      - residual_projection_is_surjective
      - no_op_suffix_on_non_effect_class
      - no_operator_name_on_non_effect_class
      - operator_candidates_default_to_evidence_only
      - checked_operator_classification_may_be_factonly
      - operator_candidate_cannot_self_declare_effect_class
      - operator_artifact_does_not_emit_action
      - operator_artifact_does_not_emit_action_license
      - operator_execution_requires_action_license
      - composition_requires_rewrite_law_or_certificate
      - context_embedding_does_not_extend_carrier_without_lift_license
      - residual_projection_requires_tie_policy
      - malformed_refusal_record_is_not_checked_m
      - action_fact_envelope_forbidden
      - search_and_solver_not_classified_as_execution

    canonical_invariant: >
      The fixed-layer obstruction algebra has exactly five effect classes:
      E = exact repair, I = quotient isometry, C = context embedding,
      R = residual projection, and M = refused mutation. Operator candidates are EvidenceOnly.
      Checked operator classifications may become FactOnly only through classifier/checker evidence.
      Operator artifacts do not authorize or execute transitions. LicensingBoundary authorizes;
      Engine executes. Everything else is a candidate, boundary, computation, governance gate,
      orchestration layer, record, replay, or lift machinery -- never an operator.

  # ---------------------------------------------------------------------------
  adapter_boundary:
  # ---------------------------------------------------------------------------
    source_file: adapter_boundary_contract.md
    frontmatter:
      name: AdapterBoundary
      role: "Pure representation morphism crossing schema boundaries"
      classification: boundary
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation
        - terminalization
        - execution
        - authority_upgrade
        - semantic creation
        - hidden inference
        - policy interpretation
        - search
        - solver invocation
        - state mutation
        - lift licensing
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - FactEnvelope
        - Record
      referenced_domain_kinds:
        - WitnessEnvelope
        - CertificateEnvelope
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, adapt schemas, or upgrade
      evidence authority. LLM output may propose adapter definitions or migration mappings,
      but those proposals are EvidenceOnly until checked by the Adapter / Schema / InvariantTransport boundary.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is a BOUNDARY, not a fixed-layer operator. An Adapter is a pure representation
      morphism. It crosses schema boundaries without semantic computation, solver invocation,
      evaluation, or authority promotion. Adapters change representation, not meaning.
      Adapter artifacts are EvidenceOnly by default. A checked adaptation result may become
      FactOnly only after schema-bound totality, deterministic hashing, invariant transport,
      loss declaration, and replay checks pass. Adapter never emits ActionLicense, Action,
      DecisionEnvelope, or StateTransition.

    core_definition: >
      An Adapter is a pure, total, non-executive transformation that maps one BaseType to
      another BaseType with a different SchemaRef, preserving declared invariants up to an
      explicitly stated correspondence, and performing no orchestration, search, policy, or
      side-effectful computation. An Adapter is the lawful representation-boundary mechanism
      for schema-changing representation conversion. Carrier/schema expressivity changes are
      lifts, not adaptations.

    architectural_role:
      description: "Adapters exist to cross representation boundaries safely and explicitly."
      is: "representation boundaries"
      is_not:
        - computational components
        - evaluators
        - engines
        - pipelines
        - policies
        - solvers
        - search components
      summary: "They are representation morphisms, nothing more."

    rules:
      explicit_schema_boundary:
        section_number: 1
        requirements:
          - "Every Adapter MUST declare a source schema SchemaRef_src"
          - "Every Adapter MUST declare a target schema SchemaRef_dst"
          - "If SchemaRef_src == SchemaRef_dst, an Adapter is forbidden. Identity is handled by the BaseType itself."

      totality_and_determinism:
        section_number: 2
        must_be:
          - "Total over admissible source domain -- defined for all valid instances of the source BaseType that meet the explicitly declared admissibility conditions"
          - "Deterministic -- identical inputs produce identical outputs"
          - "Pure -- no side effects, no IO, no external state"
        must_not:
          - "branch on runtime policy"
          - "consult external registries"
          - "depend on time, randomness, or environment"
        allowed: "Bounded structural field mapping, renaming, canonical serialization, and declared loss accounting"
        forbidden: "Search, optimization, inference, solver calls, policy branching, and semantic repair"

      invariant_transport_law:
        section_number: 3
        description: "Adapters must explicitly declare how invariants are transported via a dedicated InvariantTransportKernel"
        rust_code: |
          struct InvariantTransport {
              source: InvariantId,
              target: Vec<InvariantId>,
              mode: TransportMode,
          }

          enum TransportMode {
              Preserved,
              Refined,
              Weakened,
              ForgottenExplicitly,
          }
        invariant_correspondence: "For each invariant I_src of the source schema, the Adapter MUST specify the TransportMode. Dropping an invariant without explicit declaration is forbidden."
        no_invariant_repair:
          - "An Adapter MUST NOT silently repair invariant violations"
          - "An Adapter MUST NOT coerce invalid source data into valid target data"
          - "If an invariant cannot be transported, the Adapter MUST fail explicitly"

      no_new_information_law:
        section_number: 4
        formal: "Info(Dst) <= Closure(Info(Src)) under declared transport semantics"
        allowed:
          - "renaming fields"
          - "regrouping structure"
          - "changing coordinate systems (ONLY IF invertibility, invariant transport, and quotient preservation are explicitly declared)"
          - "forgetting fields (with explicit loss declaration)"
        forbidden:
          - inference
          - estimation
          - optimization
          - "default filling of missing data"

      loss_declaration:
        section_number: 5
        rust_code: |
          pub enum LossClass {
              Structural,
              Semantic,
              QuotientRelevant,
          }

          pub enum LossMode {
              None,
              Explicit {
                  lost_fields: &'static [&'static str],
                  loss_class: LossClass,
              },
          }
        requirements:
          - "Loss MUST be explicit"
          - "Loss MUST be auditable"
          - "Loss MUST be invariant-compatible"
          - "Silent loss is forbidden"
          - "Every adaptation must produce AdaptationEvidence detailing transported invariants, lost invariants, quotient impact, and support mapping"

      phi_and_quotient_geometry:
        section_number: 6
        requirements:
          - "Adapter may change representation-level quotient references only through declared invariant transport and explicit loss"
          - "MUST NOT compute or recompute canonical Phi1, Gamma2, Xi, quotient mass, closure defect, or cohomological status"
          - "MUST NOT mix supports or introduce Phi-coupling between previously independent components"
        formal: "If [a] perp [b] in source, then Adapter(a) perp Adapter(b) in target, unless loss is explicitly declared"
        note: "Strictly distinguish between representation-preserving adapters and quotient-altering projection adapters. They are different categories."

    rust_types:
      adaptation_output:
        code: |
          pub struct AdaptationOutput<Dst> {
              pub adapter_id: AdapterId,
              pub source_schema: SchemaRef,
              pub target_schema: SchemaRef,
              pub source_hash: Hash256,
              pub target_hash: Hash256,
              pub output: Dst,
              pub evidence: AdaptationEvidence,
              pub replay_refs: Vec<ReplayRef>,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
      adapter_trait:
        code: |
          pub trait Adapter<Src: BaseType, Dst: BaseType> {
              fn source_schema(&self) -> SchemaRef;
              fn target_schema(&self) -> SchemaRef;
              fn adapt(&self, src: &Src) -> Result<AdaptationOutput<Dst>, AdaptationError>;
          }
        note: "AdaptationError MUST be structural (never policy- or execution-based). Adapter output is evidence, not an action fact."
      checked_adaptation_output:
        code: |
          pub struct CheckedAdaptationOutput<Dst> {
              pub output_ref: AdaptationOutputRef,
              pub checked_target_hash: Hash256,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub authority_effect: AuthorityEffect, // FactOnly
          }
        note: "Only a checking boundary may produce CheckedAdaptationOutput. Adapter itself emits AdaptationOutput."

    forbidden_behaviors_hard_errors:
      - "call computational components, engines, evaluators, policies, searches, or solvers"
      - "perform search or branching over alternatives"
      - "mutate global or external state"
      - "depend on policy, budgets, or runtime context"
      - "cache results that affect observable behavior"
    forbidden_behaviors_note: "If any of these occur, the component is not an Adapter."

    pipeline_engine_relationship:
      - "Pipeline or declared orchestration selects when an adapter boundary is invoked"
      - "Adapter defines how representation fields map"
      - "Engine does not adapt implicitly and does not execute adapters as state transitions unless a separate licensed transition applies"

    admissibility_checklist:
      - "Source and target schemas differ"
      - "Transformation is total over the admissible domain and deterministic"
      - "No new information is introduced"
      - "All invariant transport is explicit"
      - "Any information loss is declared"
      - "Phi-separability is preserved"
      - "No execution, search, or policy logic exists"
      - "No external dependencies or side effects"
    admissibility_note: "If any condition fails, the Adapter is invalid."

    required_tests:
      purity:
        - adapter_has_no_io
        - adapter_has_no_external_dependencies
        - adapter_has_no_policy_branching
        - adapter_has_no_runtime_context
      transport:
        - all_source_invariants_accounted_for
        - undeclared_invariant_drop_rejected
        - loss_mode_required_for_forgetting
      quotient:
        - adapter_preserves_support_separability
        - adapter_does_not_merge_independent_components
        - quotient_collapse_requires_explicit_loss
      replay:
        - same_input_same_output
        - same_input_same_loss_certificate
        - canonical_serialization_stable_under_adaptation
      composition:
        - adapter_chain_preserves_transport_laws
        - loss_accumulates_explicitly
      authority:
        - adapter_output_defaults_to_evidence_only
        - checked_adaptation_output_may_be_factonly_after_checks
        - adapter_does_not_emit_action_fact_envelope
        - adapter_does_not_create_adaptation_certificate
        - adapter_evidence_is_not_certificate
        - adapter_does_not_compute_canonical_cohomological_values
        - adapter_does_not_infer_missing_fields
        - adapter_does_not_default_fill_missing_data
        - adapter_does_not_call_solver_or_search
        - adapter_does_not_authorize_transition
        - adapter_same_schema_forbidden
        - adapter_schema_change_requires_explicit_invariant_transport

    target_architecture:
      kernels:
        - SchemaKernel
        - BaseTypeKernel
        - InvariantTransportKernel
        - AdapterKernel
        - SerializationKernel
        - ReplayKernel
      note: "Adapters should remain tiny: map representation, transport invariants, declare loss, and stop."

    theorem_level_infrastructure:
      - NoSemanticCreationInsideAdapter
      - InvariantTransportCompleteness
      - ExplicitLossLaw
      - QuotientSeparabilityPreservation
      - AdapterDeterminism
      - NoImplicitAdaptationInsideEngine
      - SchemaBoundaryIntegrity
      - ReplayStableAdaptation

    canonical_invariant: >
      Adapter is an EvidenceOnly representation boundary. It maps between different schema-bound
      BaseTypes through total, deterministic, pure structural transformation with explicit invariant
      transport and explicit loss. It changes representation, not meaning. It does not certify,
      validate, infer, repair, compute canonical measurements, terminalize, authorize, mutate,
      execute, or emit action facts. If meaning or carrier expressivity changes, the boundary is
      not Adapter; it is lift or another declared authority boundary.

    upgrade_v02:
      adaptation_evidence:
        description: "Adapters need an explicit loss and invariant transport evidence record"
        rust_code: |
          pub struct AdaptationEvidence {
              pub adapter_id: AdapterId,
              pub source_schema: SchemaRef,
              pub target_schema: SchemaRef,
              pub source_hash: Hash256,
              pub target_hash: Hash256,
              pub invariant_transport: Vec<InvariantTransport>,
              pub loss_ledger: LossLedger,
              pub quotient_impact: QuotientImpact,
              pub evidence_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }

          pub enum QuotientImpact {
              Preserved,
              Weakened { reason: &'static str },
              Collapsed { loss_certificate: CertificateId },
          }

          pub struct LossLedger {
              pub lost_fields: Vec<FieldId>,
              pub loss_class: LossClass,
              pub semantic_loss_declared: bool,
          }
        note: "If certification is required, CertificateKernel may seal a certificate over AdaptationEvidence. Adapter itself does not create certificates."
      python_poc: |
        from dataclasses import dataclass

        @dataclass(frozen=True)
        class Handoff:
            source_schema: str
            target_schema: str
            adapter_id: str | None

        def validate_adapter_boundary(h: Handoff) -> None:
            if h.source_schema == h.target_schema and h.adapter_id is not None:
                raise ValueError("Adapter forbidden when schemas are identical.")
            if h.source_schema != h.target_schema and h.adapter_id is None:
                raise ValueError("Adapter required for schema-changing handoff.")

    paired_boundary:
      decoder: >
        Decoder is the inverse or partial-inverse representation boundary paired with Encoder.
        Its governing contract is decoder_boundary_contract.md. Adapter does not define Decoder authority.

  # ---------------------------------------------------------------------------
  encoder_boundary:
  # ---------------------------------------------------------------------------
    source_file: encoder_boundary_contract.md
    frontmatter:
      name: EncoderBoundary
      role: "Typed representation functor mapping structured domain to admissible density representation"
      classification: boundary
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation
        - terminalization
        - execution
        - authority_upgrade
        - evaluation
        - ranking
        - policy interpretation
        - search
        - solver invocation unless declared
        - physical interpretation without license
        - semantic creation
        - state mutation
        - action licensing
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - FactEnvelope
        - Record
      referenced_domain_kinds:
        - WitnessEnvelope
        - CertificateEnvelope
        - MeasurementEnvelope
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, encode authoritative
      representations, or upgrade evidence authority. LLM output may propose Encoder
      definitions or tests, but those proposals are EvidenceOnly until checked by the
      Encoder / Representation / Certificate boundary.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is a BOUNDARY, not a fixed-layer operator. An Encoder is a typed representation
      functor at the representation boundary. It shapes the representation space but does not
      decide candidate acceptance, evaluate, or execute. Encoder output is EvidenceOnly by
      default. A checked encoded representation may become FactOnly only after codomain
      invariants, deterministic hashing, schema identity, replayability, and required
      certificate references are checked. Encoder does not emit DecisionEnvelope,
      ActionLicense, Action, or StateTransition.

    core_definition: >
      An Encoder is a typed representation functor mapping a structured domain to an
      admissible density representation under strict codomain invariants. Encoders shape
      the representation space but do not decide candidate acceptance.

    subsystem_classification:
      subsystem: "representation boundary / admissible embedding morphism"
      not:
        - adapter
        - decoder
        - evaluator
        - physics engine
        - solver
        - policy
        - terminalizer
        - engine

    encoding_domain: >
      Encoders map structured domain to admissible density representation under strict
      codomain invariants: PSD, trace-one, Hermitian, and finite.

    tower_placement: >
      Encoders sit at the representation boundary between the structural domain (graphs,
      text, embeddings) and the density-representation layer. They are closely related to
      Adapters but distinguished by their postcondition: every encoder output MUST be a
      valid density matrix. An Encoder is distinct from an Adapter. An Adapter converts
      between already-declared representations. An Encoder crosses the representation
      boundary from an unstructured/heterogeneous domain into a strictly constrained
      physical representation.

    actual_implementation_note: >
      The TextDensityEncoder is the canonical example of an encoder that maps raw text ->
      Bigram Gram matrix -> PSD trace-one density matrix. It was deliberately named
      "encoder" rather than "quantum" to enforce the epistemic firewall: text does not
      become quantum by being encoded as a density matrix. The density matrix is a
      diagnostic formalism, not a physical ontology.

    rust_types:
      encoding_evidence:
        code: |
          pub struct EncodingEvidence {
              pub encoder_id: EncoderId,
              pub source_schema: SchemaRef,
              pub target_schema: SchemaRef,
              pub source_hash: Hash256,
              pub encoded_hash: Hash256,
              pub basis_construction: BasisId,
              pub normalization_rule: RuleId,
              pub psd_witness_ref: Option<WitnessId>,
              pub trace_one_witness_ref: Option<WitnessId>,
              pub hermitian_witness_ref: Option<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub semantics: RepresentationSemantics,
              pub physical_interpretation_license: PhysicalInterpretationLicense,
              pub evidence_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
      encoding_output:
        code: |
          pub struct EncodingOutput<Encoded> {
              pub encoded: Encoded,
              pub evidence: EncodingEvidence,
              pub replay_refs: Vec<ReplayRef>,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
      encoder_trait:
        code: |
          pub trait Encoder<S, Encoded> {
              fn source_schema(&self) -> SchemaRef;
              fn target_schema(&self) -> SchemaRef;

              fn encode(&self, input: &S) -> Result<EncodingOutput<Encoded>, EncoderError>;
          }
        note: "Encoder produces EncodingEvidence. CertificateKernel may seal a certificate over that evidence. Encoder itself does not create certificates."
      checked_encoding_output:
        code: |
          pub struct CheckedEncodingOutput<Encoded> {
              pub output_ref: EncodingOutputRef,
              pub checked_encoded_hash: Hash256,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub authority_effect: AuthorityEffect, // FactOnly
          }
        note: "Only a RepresentationLawKernel, CertificateKernel, or declared checking boundary may produce CheckedEncodingOutput."
      encoder_error:
        code: |
          pub enum EncoderError {
              EmptyInput,
              NonFiniteInput { index: usize },
              DegenerateInput { reason: &'static str },
              DimensionMismatch { expected: usize, actual: usize },
              EncodingFailed { reason: String },
              PsdViolation,
              MissingPsdEvidence,
              MissingTraceOneEvidence,
              MissingHermitianEvidence,
              PhysicalInterpretationUnlicensed,
              ForbiddenEvaluationLogic,
              ForbiddenRankingLogic,
          }
      representation_semantics:
        code: |
          pub struct RepresentationSemantics {
              pub basis_meaning: BasisMeaning,
              pub admissible_metrics: Vec<MetricId>,
          }

    postconditions:
      description: "Every Ok output from an encoder MUST provide evidence references for codomain validity"
      requirements:
        - "PSD: witness or certificate reference"
        - "Trace-one: witness or certificate reference"
        - "Hermitian: witness or certificate reference"
        - "Finite: checked by representation boundary"
      note: "If certificates are absent, the output remains EvidenceOnly and must not be treated as a checked density representation."

    preconditions:
      description: "An encoder MUST reject inputs that cannot be mapped to a valid density matrix"
      rejections:
        - "Empty inputs (zero-length text, empty graph)"
        - "Non-finite inputs (NaN embeddings)"
        - "Degenerate inputs (all-zero vectors that would produce a zero matrix)"

    constraints_and_exclusions:
      - "Deterministic -- same input always produces identical output"
      - "Stateless -- no mutable state, no caches, no external bindings"
      - "No evaluation -- encoders do not score, rank, or accept/reject"
      - "Epistemic Firewall -- encoding data as a density matrix does not make it quantum"
      - "No repair -- if the input cannot be encoded, return EncoderError, do not fix the input"
      - "No Hidden Weights -- Encoders must not smuggle ranking or feature selection via EncodingEvidence"

    evaluation_integration:
      description: >
        Encoders produce encoded representation evidence. Diagnostics such as entropy,
        purity, coherence, or SBE telemetry are produced by declared Measurement /
        Observable / Functional / Analysis boundaries over the encoded representation.
      flow: |
        Raw domain state
        -> Encoder
        -> EncodingOutput / EncodingEvidence
        -> RepresentationLawKernel / CertificateKernel
        -> Measurement or Analysis boundary
        -> telemetry or evaluator input
      note: "The encoder itself is not evaluated by the evaluation layer. Its output (the density matrix) is what the evaluator measures."

    epistemic_firewall: >
      Encoding a representation as a density matrix does not promote the representation to
      physical quantum mechanics. The density matrix formalism provides useful mathematical
      properties (PSD, trace-one, eigendecomposition, entropy) that serve as diagnostic
      tools. The encoder contract does not license claims about quantum entanglement,
      quantum coherence, or quantum computation over the encoded data.

    forbidden_tokens:
      - ActionFactEnvelope
      - EncodingCertificate
      - "certify("
      - "validate("
      - "terminalize("
      - "execute("
      - "accepted = true"
      - "rejected = true"
      - rank_candidates
      - score_candidate
      - PolicyDecision
      - EngineDecision
      - TerminalEnvelope
      - ActionLicense
      - quantum_claim
      - physical_quantum
      - entanglement_claim
      - authority_upgrade

    required_tests:
      - encoder_psd_verified
      - encoder_trace_one_verified
      - encoder_hermitian_verified
      - encoder_deterministic_replay
      - encoder_rejects_empty_input
      - encoder_has_no_evaluation_logic
      - encoder_cannot_rank_candidates
      - representation_semantics_declared
      - encoder_output_defaults_to_evidence_only
      - checked_encoding_output_may_be_factonly_after_checks
      - encoder_does_not_emit_action_fact_envelope
      - encoder_produces_encoding_evidence_not_certificate
      - encoder_does_not_create_certificates
      - encoder_does_not_emit_measurements_or_diagnostics
      - encoder_does_not_rank_or_score_candidates
      - physical_interpretation_license_is_not_action_license
      - density_encoding_does_not_create_quantum_physical_claim
      - missing_psd_evidence_keeps_output_evidence_only

    target_architecture:
      kernels:
        - EncoderKernel
        - RepresentationKernel
        - RepresentationLawKernel
        - MetricExtractionKernel

    theorem_level_infrastructure:
      - EncoderCodomainValidity
      - RepresentationBoundaryIntegrity
      - NoPhysicsFromEncoding

    canonical_invariant: >
      Encoder is an EvidenceOnly representation boundary. It maps structured input into a
      constrained encoded representation and emits EncodingEvidence. It does not certify,
      validate, measure, evaluate, rank, terminalize, authorize, mutate, execute, or create
      physical ontology. Checked encoded representations require a declared checking or
      Certificate boundary.

    upgrade_v02:
      basis_meaning:
        description: "Encoding into density form must produce codomain validity evidence, not physical claims"
        rust_code: |
          pub enum BasisMeaning {
              TokenBigram,
              GraphAdjacency,
              EmbeddingGram,
              DeclaredDomain(BasisId),
          }
      no_physics_field:
        description: "Add an explicit field to prevent ontology laundering"
        rust_code: |
          pub enum PhysicalInterpretationLicense {
              None,
              Licensed { license_id: LicenseId },
          }
        note: >
          A PhysicalInterpretationLicense permits interpretation claims only. It does not
          authorize Engine transitions and is not an ActionLicense. Default value:
          PhysicalInterpretationLicense::None
      python_poc: |
        import numpy as np


        def validate_density_matrix(rho: np.ndarray, tol: float = 1e-9) -> None:
            if rho.shape[0] != rho.shape[1]:
                raise ValueError("Density matrix must be square.")
            if not np.allclose(rho, rho.conj().T, atol=tol):
                raise ValueError("Hermitian violation.")
            if not np.isclose(np.trace(rho).real, 1.0, atol=tol):
                raise ValueError("Trace-one violation.")
            eigvals = np.linalg.eigvalsh(rho)
            if np.min(eigvals) < -tol:
                raise ValueError("PSD violation.")

