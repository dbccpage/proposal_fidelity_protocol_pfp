      forbidden_candidate_fields:
        description: "Add a schema test forbidding these fields"
        fields: "score, fitness, quality, rank, accepted, rejected, should_keep, confidence, priority, reward"
      python_poc: |
        FORBIDDEN_CANDIDATE_KEYS = {
            "score", "fitness", "quality", "rank", "accepted", "rejected",
            "should_keep", "confidence", "priority", "reward",
        }


        def validate_candidate_payload(candidate: dict) -> None:
            leaked = FORBIDDEN_CANDIDATE_KEYS.intersection(candidate.keys())
            if leaked:
                raise ValueError(f"Generator leaked evaluation fields: {sorted(leaked)}")
            for required in ["candidate_id", "source_state_hash", "proposed_state", "component_id", "proposal_evidence"]:
                if required not in candidate:
                    raise ValueError(f"Missing candidate field: {required}")

  # ---------------------------------------------------------------------------
  reducer_action_candidate:
  # ---------------------------------------------------------------------------
    source_file: reducer_action_candidate_contract.md
    frontmatter:
      name: ReducerActionCandidate
      role: "Pure idempotent same-carrier deflation proposing structural reduction"
      version: "2.0"
      classification: candidate
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation
        - terminalization
        - execution
        - authority_upgrade
        - effect_class_self_assignment
        - measurement_computation
        - evaluator_acceptance
        - action_licensing
        - hidden_carrier_change
        - search
        - ranking
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - FactEnvelope
        - DecisionEnvelope
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, assign effect classes, or
      upgrade evidence authority. LLM output may propose ReducerAction candidates,
      ReducerLaw descriptors, migration patches, or tests, but those proposals are
      EvidenceOnly until checked by the declared ReducerAction, Measurement, Replay,
      Evaluator, and component-boundary checks.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is an ACTION CANDIDATE, not a fixed-layer operator. A ReducerAction may produce
      evidence that later supports E = exact repair or R = residual projection classification.
      It MUST NOT self-declare E or R. Only the fixed-layer operator classifier/checker may
      classify an effect. The Evaluator judges admissibility. A LicensingBoundary may
      authorize execution when required. The Engine executes only licensed transitions.

    core_definition: >
      A ReducerAction is a pure, deterministic, unary, idempotent same-carrier action
      candidate S -> S that removes declared structural redundancy or normalizes admitted
      state without increasing the declared reduction measure.

    tower_placement: >
      A ReducerAction is same-carrier canonicalization inside internal repair. It may remove
      redundancy, project to canonical form, or collapse noise, but it may not add basis
      elements, vertices, dimensions, or carrier structure. If obstruction survives every
      admissible reducer, exhaustion has been reached on the current carrier. The next lawful
      move is explicit Meta lift, not a stronger reducer with hidden carrier growth.

    rust_types:
      reducer_action_trait:
        description: "Canonical contract shape"
        code: |
          pub trait ReducerAction<S: BaseType>: BoundContract {
              fn propose_reduction(
                  &self,
                  input: &S,
              ) -> Result<ReducerOutput<S>, ReducerFailure>;

              fn law(&self) -> &'static ReducerLaw;
          }
        note: "apply is a legacy implementation name. Contract-canonical APIs should use propose_reduction to avoid implying execution authority."
      reducer_output:
        code: |
          pub struct ReducerOutput<S> {
              pub reducer_id: ComponentId,
              pub reducer_version: ComponentVersion,
              pub input_hash: Hash256,
              pub output_hash: Hash256,
              pub carrier_ref: CarrierRef,
              pub law_ref: LawId,
              pub kappa_measure_ref: MeasurementId,
              pub witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
              pub output: S,
          }

          pub struct CheckedReducerOutput {
              pub output_ref: ReducerOutputRef,
              pub same_carrier_certificate: CertificateId,
              pub kappa_monotonicity_certificate: CertificateId,
              pub idempotence_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly for checked structural claims
          }
        note: >
          A raw ReducerOutput is EvidenceOnly. A checked ReducerOutput may become FactOnly
          only for the claim that the reducer satisfied same-carrier, kappa-monotonicity,
          idempotence, and replay requirements. If later admissibility judgment is needed,
          consumers may route the checked output to an Evaluator. ReducerAction itself does
          not emit RequiresEvaluator unless a specific reducer contract explicitly owns that boundary.
      reducer_failure:
        code: |
          pub enum ReducerFailure {
              OutsideAdmissibleDomain,
              InvariantViolation { invariant: InvariantId },
              ReductionUndefined { reason: &'static str },
              NonFiniteInput,
              InternalLoopForbidden,
              HiddenCarrierChange,
          }

    existing_implementations:
      - file: "reducer.rs"
        status: Active
        kappa_measure: "--"
        description: "Base reducer infrastructure"
      - file: "reducer_clip_dual.rs"
        status: Active
        kappa_measure: "Magnitude exceeding bounds"
        description: "Clips edge weights to declared bounds"
      - file: "reducer_h1.rs"
        status: Active
        kappa_measure: "H1 cohomology rank"
        description: "Projects to H1-reduced representative"
      - file: "reducer_partial_trace.rs"
        status: Active
        kappa_measure: "Subsystem dimension"
        description: "Traces out declared subsystem"
      - file: "reducer_support_predicates.rs"
        status: Active
        kappa_measure: "Support cardinality"
        description: "Removes edges failing declared predicates"
      - file: "reducer_l1_projector.rs"
        status: Disabled
        kappa_measure: "L1 norm"
        description: "Projects to L1-minimal representative"
      - file: "reducer_observables.rs"
        status: Disabled
        kappa_measure: "Observable count"
        description: "Reduces to essential observable set"
      - file: "reducer_series_truncate.rs"
        status: Disabled
        kappa_measure: "Series length"
        description: "Truncates power series to finite order"
      - file: "reducer_synthesis_generate.rs"
        status: Disabled
        kappa_measure: "Synthesis complexity"
        description: "Generates reduced synthesis candidates"
      - file: "reducer_threshold.rs"
        status: Disabled
        kappa_measure: "Values below threshold"
        description: "Zero-out small values"
      - file: "reducer_tqc_optimization.rs"
        status: Disabled
        kappa_measure: "TQC circuit depth"
        description: "Optimizes topological quantum circuits"

    reclassification_warning:
      description: "Some reducer files may require reclassification before admission"
      files:
        - file: "reducer_partial_trace.rs"
          concern: "likely ResidualProjection / explicit-loss projection, not ordinary same-carrier reducer unless the carrier identity and schema remain unchanged"
        - file: "reducer_synthesis_generate.rs"
          concern: "Generator/Search, not ReducerAction"
        - file: "reducer_tqc_optimization.rs"
          concern: "Solver/Optimizer or domain-specific computation, not ReducerAction unless bounded, deterministic, same-carrier, and non-search"
        - file: "reducer_observables.rs"
          concern: "Measurement/Observable selection boundary, not ReducerAction unless it only reduces an already-declared same-carrier structure"
        - file: "reducer_threshold.rs"
          concern: "may be ReducerAction only with declared kappa, deterministic threshold, invariant preservation, and replay evidence"
      note: "Before registry admission, every reducer file must be classified as ReducerAction, ResidualProjection, Generator, Solver, Functional, Observable, or forbidden."

    registry_admission_warning: >
      Implemented reducer does not equal admitted reducer. Only reducers explicitly admitted
      by the reducer registry count toward exhaustion, area-lock claims, or current-carrier closure.

    algebraic_contract:
      declared_law: "kappa(R(s)) <= kappa(s)"
      note: "This declaration is not accepted until verified by the Evaluator layer. If R(s) = s, then s is reduced with respect to this ReducerAction's declared kappa."
      constraints:
        - "Unary & Endomorphic -- S -> S only"
        - "Pure & Deterministic -- no random side-effects"
        - "Idempotent -- propose_reduction(propose_reduction(x)) == Ok(propose_reduction(x))"
        - "Structure-Reducing -- kappa-monotone"
        - "Single Application -- repeated application until stability is Engine orchestration, not reducer semantics"
        - "No Hidden Normalization -- normalization belongs to NormalizerAction unless explicitly declared as part of the reducer law"
        - "No Hidden Carrier Change -- carrier type, rank, schema, and universe must remain unchanged"
      preserves:
        - carrier identity
        - carrier type
        - carrier rank
        - schema reference
        - universe reference
        - coefficient semantics
        - carrier schema hash
        - admissible domain
      note_schema: >
        Any schema change, carrier identity change, universe change, coefficient-domain
        change, or expressivity expansion is not ReducerAction.
      engine_isolation_limit: >
        If a ReducerAction performs search, iterative convergence, ranking, or external IO,
        it is an Engine, not a reducer.

    measurement_evaluation_integration: >
      ReducerAction does not compute Phi1, Gamma2, Xi, quotient mass, closure defect,
      closure regime, cohomological status, or evaluation diagnostics. ReducerAction may
      reference a declared kappa_measure_ref produced by the Functional / Measurement boundary.
      Any monotonicity, non-increase, budget, acceptance, or admissibility claim is outside
      ReducerAction and must be verified by the declared Measurement, Replay, Evaluator, or
      Certificate boundary.

    witness_integration:
      description: "When a ReducerAction proposal is executed by Engine through a licensed transition"
      records:
        - "reducer output reference"
        - "state hash before and after"
        - "license reference, if execution occurred"
        - "replay binding"
        - "exactly one declared reduction proposal for the candidate step"
      note: "If a reducer introduces hidden branching (attempting multiple reduction strategies internally), the witness will fail at NonDeterministicReplay."

    forbidden_tokens:
      - ActionFactEnvelope
      - OperatorFactEnvelope
      - ReducerOp
      - self_declare_effect_class
      - emit_action
      - emit_action_license
      - execute_transition
      - authorize_transition
      - license_transition
      - compute_phi
      - compute_gamma
      - compute_xi
      - evaluator_accepts
      - rank_candidates
      - score_candidate
      - PolicyDecision
      - EngineDecision
      - TerminalEnvelope
      - ActionLicense
      - "execute("
      - "terminalize("
      - mutate_runtime

    required_tests:
      - reducer_output_defaults_to_evidence_only
      - checked_reducer_output_may_be_factonly_after_same_carrier_kappa_idempotence_and_replay_checks
      - reducer_does_not_emit_action_license
      - reducer_does_not_authorize_transition
      - reducer_does_not_execute
      - reducer_does_not_compute_measurements
      - reducer_does_not_call_evaluator_accepts
      - reducer_does_not_self_declare_effect_class_e_or_r
      - reducer_preserves_schema_ref
      - reducer_preserves_universe_ref
      - reducer_preserves_coefficient_semantics
      - legacy_apply_name_is_not_execution
      - disabled_or_legacy_reducer_files_require_reclassification_before_admission
      - synthesis_generate_reducer_reclassified_as_generator_or_forbidden
      - partial_trace_reducer_requires_residual_projection_contract_if_lossy

    canonical_invariant: >
      ReducerAction is an EvidenceOnly same-carrier action candidate. It proposes one
      deterministic, idempotent reduction step under a declared ReducerLaw and kappa
      measurement reference. It does not compute measurements, evaluate acceptance, search,
      rank, certify, license, authorize, mutate, or execute. Checked reducer facts require
      same-carrier, kappa-monotonicity, idempotence, law, and replay verification.
      LicensingBoundary authorizes execution when required; Engine executes licensed
      transitions only. Candidates propose transformations; Evaluators judge;
      LicensingBoundary authorizes; Engine executes licensed transitions only; MetaLift
      changes carrier/schema expressivity only through license.

    upgrade_v02:
      registry_admission_warning:
        description: "The current registry returns an empty reducer set. Any theorem using reducers must be conditional on registry admission."
        text: |
          Implemented reducer does not equal admitted reducer.
          Only admitted reducers count toward exhaustion or area-lock claims.
      reducer_law:
        rust_code: |
          pub struct ReducerLaw {
              pub law_id: LawId,
              pub kappa_measure_ref: MeasurementId,
              pub same_carrier_required: bool,
              pub idempotence_required: bool,
              pub support_reduction_claim: SupportReductionClaim,
              pub invariant_refs: Vec<InvariantId>,
              pub replay_required: bool,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }

          pub enum SupportReductionClaim {
              StrictlyReduces,
              NonIncreasing,
              CanonicalizesOnly,
          }
        note: "Default: authority_effect: AuthorityEffect::EvidenceOnly. A checked reducer result may become RequiresEvaluator or FactOnly after kappa-measure verification, idempotence checking, and replay verification."
      no_internal_loop_rule: >
        ReducerAction applies once. Repeated application until stable belongs to Engine
        orchestration. A ReducerAction MUST perform one declared reduction step. Fixed-point
        iteration is Engine orchestration.
      python_poc: |
        def assert_reducer_idempotent(reducer, value):
            once = reducer.propose_reduction(value)
            twice = reducer.propose_reduction(once)
            assert once == twice, "Reducer must be idempotent: R(R(x)) == R(x)"

  # ---------------------------------------------------------------------------
  reflector_candidate:
  # ---------------------------------------------------------------------------
    source_file: reflector_candidate_contract.md
    frontmatter:
      name: ReflectorCandidate
      role: "Quotation and reflection creating quote-level structure without execution"
      version: "2.0"
      classification: candidate
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation
        - terminalization
        - execution
        - authority_upgrade
        - quote_execution
        - authority_inheritance_from_quoted_object
        - hidden_recursion
        - runtime_mutation
        - scheduling_quoted_content
        - decoding_without_declared_boundary
        - decoding_without_required_license
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - EvidenceEnvelope
        - FactEnvelope
        - WitnessEnvelope
        - CertificateEnvelope
        - ReplayReport
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, execute quoted objects, or
      upgrade evidence authority. LLM output may propose Reflector candidates, quote schemas,
      recursion guards, or tests, but those proposals are EvidenceOnly until checked by the
      declared Reflector, Schema, Replay, and Evaluator boundaries.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is a CANDIDATE, not a fixed-layer operator. A Reflector reifies the structure
      of a state into quote-level structure that can be inspected or reasoned about by later
      layers. It does not execute quoted objects. The Evaluator judges admissibility.

    core_definition: >
      A Reflector reifies the structure of a state into quote-level structure that can be
      inspected or reasoned about by later layers.

    subsystem_classification:
      subsystem: "quotation / reflection candidate"
      signature: "S -> Quote(S) | Reflection(S)"
      role: "creates quote-level structure or internal representation without execution"

    obligations:
      must:
        - "Declare reflection scope"
        - "Declare quote schema"
        - "Declare source schema"
        - "Provide recursion guard"
        - "Provide execution-forbidden declaration"
        - "Provide decode boundary reference, if decoding is supported"
        - "Provide decode license reference, only if decode is attempted"
      must_not:
        - "Execute quoted objects"
        - "Grant authority"
        - "Create hidden recursion"
        - "Evaluate quoted content"
        - "Schedule quoted content"
        - "Mutate runtime state through reflection"
        - "Exceed declared quote depth"

    quote_non_execution_law: >
      Quoted structure is inert. A quote may be inspected, hashed, replayed, decoded through
      a declared decode boundary, or evaluated by a later layer. A quote MUST NOT execute,
      schedule itself, authorize execution, mutate runtime state, or inherit the authority of
      the quoted object.

    no_authority_inheritance_law: >
      Reflecting an object does not copy that object's authority. A quoted ActionLicense is
      not an ActionLicense. A quoted Action is not an Action. A quoted DecisionEnvelope is
      not a live decision. A quoted certificate is quote evidence unless dereferenced and
      verified through the declared certificate boundary.

    rust_types:
      reflection_evidence:
        code: |
          pub struct ReflectionEvidence {
              pub reflector_id: ReflectorId,
              pub source_schema: SchemaRef,
              pub quote_schema: SchemaRef,
              pub reflection_scope: ReflectionScope,
              pub decode_boundary_ref: Option<DecodeBoundaryId>,
              pub decode_license_ref: Option<LicenseId>,
              pub recursion_guard: RecursionGuard,
              pub source_hash: Hash256,
              pub quote_hash: Hash256,
              pub witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub evidence_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        note: "If certification is required, CertificateKernel may seal a certificate over ReflectionEvidence. Reflector itself does not create certificates."
      recursion_guard:
        code: |
          pub struct RecursionGuard {
              pub max_quote_depth: usize,
              pub execution_forbidden: bool,
              pub decode_forbidden_without_license: bool,
          }
        note: >
          Default: authority_effect: AuthorityEffect::EvidenceOnly. A raw ReflectionOutput
          is EvidenceOnly. A checked reflection result may become FactOnly only for the claim
          that quote construction satisfied the declared quote schema, recursion guard, and
          replay requirements. If later interpretation or admissibility judgment is needed,
          consumers may route the checked result to an Evaluator. Reflector itself does not
          emit RequiresEvaluator unless a specific reflector contract explicitly owns that boundary.
      reflection_output:
        code: |
          pub struct ReflectionOutput<Q> {
              pub quote: Q,
              pub evidence: ReflectionEvidence,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
      reflector_trait:
        code: |
          pub trait Reflector<S, Q> {
              fn reflect(
                  &self,
                  input: &S,
              ) -> Result<EvidenceEnvelope<ReflectionOutput<Q>>, ReflectorError>;
          }
        note: "EvidenceEnvelope MUST be imported from the canonical artifact taxonomy. This contract MUST NOT define a local EvidenceEnvelope type."

    forbidden_tokens:
      - ReflectionEvidence
      - execute_quote
      - run_quote
      - eval_quote
      - schedule_quote
      - quote_authority
      - inherit_authority
      - copy_authority
      - ActionLicense
      - StateTransition
      - EngineDecision
      - PolicyDecision
      - TerminalEnvelope
      - authorize_transition
      - license_transition
      - "execute("
      - "terminalize("
      - mutate_runtime
      - self_certify

    required_tests:
      - reflector_output_defaults_to_evidence_only
      - checked_reflection_may_be_factonly_after_quote_schema_recursion_and_replay_checks
      - reflector_produces_reflection_evidence_not_certificate
      - reflector_does_not_execute_quote
      - reflector_does_not_schedule_quote
      - reflector_does_not_inherit_authority_from_quoted_object
      - quoted_action_license_is_not_live_action_license
      - quoted_action_is_not_live_action
      - quoted_decision_is_not_live_decision
      - reflector_requires_recursion_guard
      - reflector_rejects_quote_depth_overflow
      - reflector_decode_requires_declared_decode_boundary
      - reflector_decode_requires_license_when_required
      - reflector_does_not_emit_action_license
      - reflector_does_not_authorize_transition

    canonical_invariant: >
      Reflector is an EvidenceOnly quotation candidate. It creates inert quote-level structure
      under declared source schema, quote schema, recursion guard, and replay evidence. It
      does not certify, validate, decode without boundary, inherit authority from quoted
      objects, schedule quoted content, terminalize, authorize, mutate, or execute. Checked
      reflection facts require a declared checking or certificate boundary. Candidates propose
      transformations; Evaluators judge; LicensingBoundary authorizes; Engine executes
      licensed transitions only; MetaLift changes carrier/schema expressivity only through license.

    upgrade_v02:
      reflection_evidence:
        description: "Reflection creates quote-level structure. It must not execute the quote."
      reflector_trait:
        description: "Reflector trait with explicit EvidenceEnvelope wrapping"
      recursion_guard:
        description: "RecursionGuard struct with max_quote_depth, execution_forbidden, and decode_forbidden_without_license"
      python_poc: |
        def validate_reflection_output(reflection: dict) -> None:
            if reflection.get("executed") is True:
                raise ValueError("Reflector may quote but must not execute quoted objects.")
            if reflection.get("quote_depth", 0) > reflection.get("max_quote_depth", 1):
                raise ValueError("Reflection recursion guard violated.")
            if reflection.get("authority_effect") != "EvidenceOnly":
                raise ValueError("Reflector output must be EvidenceOnly before checking.")
            if reflection.get("decode_attempted") is True and not reflection.get("decode_license"):
                raise ValueError("Reflector decode attempted without license.")

