      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      This contract is a governance artifact. LLM-generated content carries no authority
      within this contract. LLM output may propose candidates, contract edits, or tests, but those proposals are EvidenceOnly until checked by the declared boundary.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is an ACTION CANDIDATE, not a fixed-layer operator. A LambdaAction may generate
      proposals for E (exact repair) or I (quotient isometry) effects. The Evaluator judges
      admissibility. A LicensingBoundary may authorize execution when required. Engine executes only licensed transitions. LambdaAction outputs are
      EvidenceOnly by default. A raw LambdaOutput is EvidenceOnly.

      A checked LambdaOutput may become FactOnly only for checked structural claims.

      If admissibility judgment is needed, consumers may route the checked output to Evaluator. LambdaAction itself does not emit RequiresEvaluator.

    core_definition: >
      A LambdaAction is a pure local endomorphism over an admitted carrier. It is a
      deterministic, stateless, unary morphism that preserves declared structure and
      may declare claims about diagnostic constraints over its admitted domain, subject to
      evaluator verification. It performs no search, candidate exploration, ranking,
      orchestration, hidden lift, or repair.

    subsystem_classification:
      subsystem: "action candidate / deterministic transformation layer"
      not:
        - generator
        - search
        - evaluator
        - solver
        - policy
        - terminalizer
        - engine
        - pipeline
        - MetaLift

    internal_descent_requirements:
      - "Must not enlarge the carrier"
      - "Must not silently reinterpret the carrier"
      - "Must return typed failure rather than hide a lift"
      - "Must not change carrier rank, universe, or admissible execution geometry"

    rust_types:
      lambda_action_trait_current:
        description: "Current working implementation (operators/lambdas/mod.rs)"
        code: |
          pub trait LambdaAction<S: BaseType, T: BaseType>: Send + Sync {
              fn name(&self) -> &'static str;
              fn apply(&self, input: &S) -> Result<T, LambdaFailure>;
              fn preserved_structure(&self) -> Vec<PreservedStructure>;
              fn law_declaration(&self) -> LawDeclarationId;
          }

          pub enum PreservedStructure {
              Topology,
              Cohomology,
              Typing,
              QuotientClass,
              GaugeClass,
          }

          pub struct DeclaredLaw {
              pub law_id: LawId,
              pub expected_behavior: ExpectedBehavior,
          }
        note: >
          This is the active definition. All 53 lambda implementations use NemotronValue as
          both input and output (endomorphic). Law witnesses are self-reported booleans.
          These booleans are declarations only; the Evaluator must verify the actual
          before/after diagnostics. The runtime law is: declared law != accepted law.
      lambda_action_trait_deprecated:
        description: "Deprecated contract-layer definition"
        code: |
          pub trait LambdaAction<S: BaseType, T: BaseType>: ComponentIdentity {
              fn apply(&self, input: &S) -> Result<T, LambdaFailure>;
              fn law(&self) -> &'static LambdaLaw;
          }
        note: "This generic S -> T shape with ComponentIdentity and LambdaLaw is the design target but is not used by any implementation."
      lambda_action_trait_migration_target:
        description: "Migration target (base_contracts)"
        code: |
          pub trait LambdaAction<S: BaseType, T: BaseType>: BoundContract {
              fn apply(&self, input: &S) -> Result<T, LambdaFailure>;
              fn law(&self) -> &'static LambdaLaw;
          }
      lambda_failure:
        code: |
          pub enum LambdaFailure {
              OutsideAdmissibleDomain(AdmissibleDomainCertificate),
              InvariantViolation { invariant: InvariantId },
              UndefinedTransformation { reason: &'static str },
              NonFiniteInput,
          }

    algebraic_contract:
      declared_law: "Phi(apply(s)) <= Phi(s)"
      note: "This is a declaration by the LambdaAction. It is not accepted until verified by the Evaluator layer."
      admissible_noise_gating: >
        Where numerical precision is an issue, action candidates must provide a Typed
        Admissible Numerical Tolerance Certificate rather than using naked floating-point
        epsilon. Replay equivalence must be hardware-independent via exact symbolic regime
        comparison.
      composability: >
        LambdaActions compose when the codomain of one matches the admitted domain of the
        next. Since the current implementation is endomorphic (NemotronValue -> NemotronValue),
        all lambdas are naively composable. The codensity.rs and transport.rs modules in
        operators/ provide the algebraic infrastructure for lawful composition.
      composition_example: |
        f: NemotronValue -> NemotronValue
        g: NemotronValue -> NemotronValue
        g . f: NemotronValue -> NemotronValue (lawful if both are structure-preserving)
      forbidden: "candidate-space search, adaptive traversal, convergence-driven exploration, ranking, runtime orchestration, hidden normalization, hidden carrier extension, policy branching, terminal action"
      allowed: "finite deterministic traversal over input structure, fixed-iteration algebraic computation"
      static_bound_rule: "Action candidate branching factor must be statically bounded, and the execution path must be independent of evaluation outcomes."

    evaluation_integration:
      description: "Lambda steps produce EvaluationDiagnostics snapshots that the evaluator bridge checks"
      check: "evaluator_accepts(before, after, r_cl_max)"
      note: "The Phi non-increase claim is enforced structurally: the evaluator rejects any step where after.phi > before.phi."

    witness_integration:
      description: "When a LambdaAction is applied within a traced execution"
      records:
        - "Exactly one attempt per step"
        - "State hash before and after application"
        - "The LambdaAction's component identity in the ReplayLedger payload"
      note: "If a LambdaAction internally retries or branches, the witness will fail with NonDeterministicReplay."

    required_tests:
      action_purity:
        - lambda_has_single_execution_path
        - lambda_has_no_retry_logic
        - lambda_has_no_hidden_cache
        - lambda_has_no_candidate_generation
      replay:
        - same_input_same_output_hash
        - same_input_same_trace
        - no_branching_under_replay
      structural_preservation:
        - preserved_structure_declared
        - preserved_structure_verified_by_evaluator
      admissibility:
        - outside_domain_returns_typed_failure
        - invalid_carrier_rejected
      composition:
        - typed_composition_required
        - illegal_codomain_composition_rejected

    target_architecture:
      kernels:
        - ActionKernel
        - ActionLawKernel
        - CompositionKernel
        - ReplayKernel
      note: "The action candidate itself remains a tiny deterministic bridge between states."

    theorem_level_infrastructure:
      - ActionDeterminism
      - NoHiddenSearchInsideAction
      - ReplayDeterminism
      - TypedCompositionLaw
      - NoImplicitCarrierExtension
      - EvaluatorSeparatesDeclaredFromAcceptedLaw
      - AdmissibilityPreservation

    canonical_invariant: >
      LambdaAction bridges. ReducerAction deflates. TransformAction rearranges. Encoder
      encodes. Generator proposes. Constructor builds/intakes; Validator validates. Engine executes licensed transitions. Action
      candidates propose transformations; only Evaluators accept; only Engines execute;
      only MetaLift changes carrier expressivity. No action candidate is allowed to become
      an Engine in disguise.

    upgrade_v02:
      declared_law_not_accepted_law:
        description: >
          The current document correctly notes that law witnesses may be self-reported
          booleans and must be verified by the Evaluator. Make this mechanical.
        rust_code: |
          pub struct LambdaLawDeclaration {
              pub law_id: LawId,
              pub preserves: Vec<PreservedStructure>,
              pub phi_claim: PhiClaim,
              pub carrier_change: CarrierChange,
          }

          pub enum CarrierChange {
              SameCarrier,
              DeclaredHomomorphism { source: SchemaRef, target: SchemaRef },
              HiddenLiftDetected,
          }

          pub enum PhiClaim {
              NonIncreasing,
              Preserved,
              Unclaimed,
          }
      lambda_output:
        rust_code: |
          pub struct LambdaResult<T> {
              pub output: T,
              pub law_declaration: LambdaLawDeclaration,
              pub replay_witness: WitnessId,
              pub authority_effect: AuthorityEffect,
          }
        note: "Default: authority_effect: AuthorityEffect::EvidenceOnly. A checked lambda result may escalate to RequiresEvaluator or FactOnly depending on verification completeness."
      python_poc: |
        def validate_lambda_no_hidden_lift(before_schema: str, after_schema: str, declared_target: str) -> None:
            if after_schema != declared_target:
                raise ValueError("HiddenLiftDetected: undeclared target schema.")
            if before_schema != after_schema and declared_target == before_schema:
                raise ValueError("HiddenLiftDetected: carrier changed without declared target.")

  # ---------------------------------------------------------------------------
  normalizer_action_candidate:
  # ---------------------------------------------------------------------------
    source_file: normalizer_action_candidate_contract.md
    frontmatter:
      name: NormalizerActionCandidate
      role: "Canonical-form action mapping admitted state to declared normal form"
      version: "2.0"
      classification: candidate
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation
        - terminalization
        - execution
        - authority_upgrade
        - effect_class_self_assignment
        - action_licensing
        - evaluator_acceptance
        - hidden_projection
        - hidden_carrier_change
        - hidden_semantic_loss
        - search
        - ranking
        - measurement_computation
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - FactEnvelope
        - CertificateEnvelope
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, assign effect classes, or
      upgrade evidence authority. LLM output may propose NormalizerAction candidates,
      NormalizerLaw descriptors, normal-form predicates, migration patches, or tests, but
      those proposals are EvidenceOnly until checked by the declared NormalizerAction,
      Replay, Certificate, Evaluator, and component-boundary checks.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is an ACTION CANDIDATE, not a fixed-layer operator. A NormalizerAction maps
      admitted state to its declared unique normal form. It may be treated as a strict
      subtype of ReducerAction only when uniqueness, idempotence, and termination are
      certified. The Evaluator judges admissibility. A LicensingBoundary may authorize
      execution when required. The Engine executes only licensed transitions.

    subsystem_classification:
      subsystem: "canonical-form action candidate"
      signature: "S -> Canonical(S)"
      role: "maps admitted state to declared normal form"

    core_definition: >
      A NormalizerAction transforms an admitted state into its declared unique normal form.
      A NormalizerAction may be treated as a strict subtype of ReducerAction only when
      uniqueness, idempotence, termination, same-carrier preservation, and replay evidence
      are checked by the declared boundary. This subtype relation is a checked structural
      claim, not execution authority.

    obligations:
      must:
        - "Be strongly normalizing (always terminates at a unique normal form)"
        - "Be idempotent"
        - "Declare the normal-form predicate"
        - "Emit normal-form evidence"
        - "Preserve source semantics unless explicit projection loss is declared"
      must_not:
        - "Hallucinate normal forms that lose semantic meaning unless governed by a projection license"
        - "Hide projection or quotient loss"
        - "Repair malformed input"
        - "Act as an evaluator"
        - "Claim semantic equivalence without verification support"

    same_carrier_law:
      description: "NormalizerAction MUST preserve"
      preserves:
        - carrier identity
        - carrier type
        - carrier rank
        - schema reference
        - universe reference
        - coefficient semantics
        - carrier schema hash
        - admissible domain
      note: >
        Any schema change, carrier identity change, universe change, coefficient-domain
        change, projection loss, or expressivity expansion is not NormalizerAction unless
        separately governed by Adapter, Projector, ResidualProjection, or Lift.

    rust_types:
      normal_form_evidence:
        code: |
          pub struct NormalFormEvidence {
              pub normalizer_id: NormalizerId,
              pub source_schema: SchemaRef,
              pub normal_form_schema: SchemaRef,
              pub uniqueness_witness_ref: WitnessId,
              pub idempotence_witness_ref: WitnessId,
              pub termination_argument_ref: TerminationArgumentId,
              pub source_hash: Hash256,
              pub normal_form_hash: Hash256,
              pub normal_form_predicate: PredicateId,
              pub witness_refs: Vec<WitnessId>,
              pub certificate_refs: Vec<CertificateId>,
              pub replay_refs: Vec<ReplayRef>,
              pub evidence_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        note: "If certification is required, CertificateKernel may seal a certificate over NormalFormEvidence. NormalizerAction itself does not create certificates."
      normalizer_output:
        code: |
          pub struct NormalizerOutput<S> {
              pub normalizer_id: NormalizerId,
              pub normalizer_version: ComponentVersion,
              pub input_hash: Hash256,
              pub output_hash: Hash256,
              pub carrier_ref: CarrierRef,
              pub normal_form_evidence: NormalFormEvidence,
              pub output: S,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
      normalizer_action_trait:
        code: |
          pub trait NormalizerAction<S: BaseType>: BoundContract {
              fn propose_normal_form(
                  &self,
                  input: &S,
              ) -> Result<EvidenceEnvelope<NormalizerOutput<S>>, NormalizerError>;

              fn normalizer_law(&self) -> &'static NormalizerLaw;
          }
        note: "Avoid is_normal_form(&self, input) -> bool as a contract method. That is a local validator/evaluator-style claim. Use a declared predicate reference instead."
      checked_normalizer_output:
        code: |
          pub struct CheckedNormalizerOutput {
              pub output_ref: NormalizerOutputRef,
              pub uniqueness_certificate: CertificateId,
              pub idempotence_certificate: CertificateId,
              pub termination_certificate: CertificateId,
              pub normal_form_predicate_certificate: CertificateId,
              pub replay_ref: ReplayRef,
              pub checked_hash: Hash256,
              pub authority_effect: AuthorityEffect, // FactOnly for checked structural claims
          }
        note: >
          A raw NormalizerOutput is EvidenceOnly. A checked NormalizerOutput may become
          FactOnly only for the claim that the output satisfies declared normal-form,
          uniqueness, idempotence, termination, and replay requirements. NormalizerAction
          itself does not emit RequiresEvaluator. If later admissibility judgment is
          required, consumers may route the checked output to an Evaluator.

    default_authority_effect: "AuthorityEffect::EvidenceOnly"
    checked_authority_note: >
      A checked normalizer result may become FactOnly for checked structural claims. It
      does not become RequiresEvaluator merely by being checked.

    forbidden_tokens:
      - NormalFormEvidence
      - ActionFactEnvelope
      - OperatorFactEnvelope
      - NormalizerOp
      - self_declare_effect_class
      - emit_action
      - emit_action_license
      - execute_transition
      - authorize_transition
      - license_transition
      - compute_phi
      - compute_gamma
      - compute_xi
      - rank_candidates
      - score_candidate
      - PolicyDecision
      - EngineDecision
      - TerminalEnvelope
      - ActionLicense
      - "execute("
      - "terminalize("
      - mutate_runtime
      - hidden_projection
      - hidden_lift

    required_tests:
      - normalizer_output_defaults_to_evidence_only
      - normalizer_produces_normal_form_evidence_not_certificate
      - checked_normalizer_output_may_be_factonly_after_uniqueness_idempotence_termination_and_replay_checks
      - normalizer_does_not_emit_requires_evaluator_by_default
      - normalizer_does_not_create_certificates
      - normalizer_does_not_emit_action_license
      - normalizer_does_not_authorize_transition
      - normalizer_does_not_execute
      - normalizer_does_not_self_declare_effect_class
      - normalizer_preserves_schema_ref
      - normalizer_preserves_universe_ref
      - normalizer_preserves_coefficient_semantics
      - normalizer_rejects_hidden_projection_loss
      - normalizer_rejects_hidden_carrier_change
      - normalizer_is_reducer_subtype_only_after_checked_laws

    canonical_invariant: >
      NormalizerAction is an EvidenceOnly same-carrier action candidate. It proposes a
      deterministic mapping to a declared normal form under explicit normal-form predicate,
      uniqueness, idempotence, termination, and replay evidence. It does not certify,
      validate, evaluate, license, authorize, mutate, execute, hide projection loss, or
      change carrier/schema expressivity. Checked normalizer facts require a declared
      checking or certificate boundary. Candidates propose transformations; Evaluators
      judge; LicensingBoundary authorizes; Engine executes licensed transitions only;
      MetaLift changes carrier/schema expressivity only through license.

    upgrade_v02:
      normal_form_evidence:
        description: "A NormalizerAction is a strict subtype of ReducerAction only when it proves unique normal form and idempotence"
      normalizer_action_trait:
        description: "NormalizerAction trait with explicit EvidenceEnvelope wrapping"
      checked_wrapper:
        description: "CheckedNormalizerOutput with full certificate suite for uniqueness, idempotence, termination, and normal-form predicate"
      python_poc: |
        def assert_normalizer_laws(normalizer, value):
            n1 = normalizer.propose_normal_form(value)
            assert getattr(n1, "authority_effect", "EvidenceOnly") == "EvidenceOnly"
            n2 = normalizer.propose_normal_form(n1.output if hasattr(n1, "output") else n1)
            assert n1.output == n2.output, "Normalizer must be idempotent."

        def assert_checked_normalizer_result(checked):
            assert checked.authority_effect == "FactOnly"
            assert checked.uniqueness_certificate is not None
            assert checked.idempotence_certificate is not None
            assert checked.termination_certificate is not None

  # ---------------------------------------------------------------------------
  projector_candidate:
  # ---------------------------------------------------------------------------
    source_file: projector_candidate_contract.md
    frontmatter:
      name: ProjectorCandidate
      role: "Lawful forgetting via projection onto declared subspace or quotient"
      version: "2.0"
      classification: candidate
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation
        - terminalization
        - execution
        - authority_upgrade
        - equivalence_claim
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
        - FactEnvelope
        - CertificateEnvelope
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"

    llm_boundary_law: >
      This contract is a governance artifact. LLM-generated content carries no authority
      within this contract. LLM output may propose candidates, contract edits, or tests, but those proposals are EvidenceOnly until checked by the declared boundary.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      This is a CANDIDATE, not a fixed-layer operator. A Projector explicitly maps a rich
      structure into a declared quotient, subspace, support, or substructure. It is a
      candidate for lawful forgetting, not a certified authority. The Evaluator judges
      admissibility.

    core_definition: >
      A Projector explicitly maps a rich structure into a declared quotient, subspace,
      support, or substructure.

    subsystem_classification:
      subsystem: "projection / lawful forgetting candidate"
      signature: "S -> Substructure(S) | Quotient(S)"
      role: "projects onto declared subspace, quotient, basis, support, or coordinate subset with explicit loss"

    obligations:
      must:
        - "Declare projection target"
        - "Declare kernel declaration"
        - "Emit loss ledger"
        - "Declare quotient impact"
        - "Reference source and target schemas"
      must_not:
        - "Hide information loss"
        - "Pretend projection is equivalence"
        - "Use projection as acceptance"
        - "Act as an evaluator"
        - "Treat quotient equality as source equality"
        - "Erase quotient-relevant information without explicit loss"

    rust_types:
      projection_certificate:
        code: |
          pub struct ProjectionCertificate {
              pub projector_id: ProjectorId,
              pub source_schema: SchemaRef,
              pub target_schema: SchemaRef,
              pub projection_target: ProjectionTarget,
              pub kernel_declaration: KernelDeclaration,
              pub loss_ledger: LossLedger,
              pub quotient_impact: QuotientImpact,
              pub source_hash: Hash256,
              pub projected_hash: Hash256,
              pub authority_effect: AuthorityEffect,
          }

          pub enum ProjectionTarget {
              Subspace(BasisId),
              Quotient(EquivalenceRef),
              Support(SupportRef),
              CoordinateSubset(Vec<CoordinateId>),
              NormalForm(NormalFormId),
          }
        note: "Default: authority_effect: AuthorityEffect::EvidenceOnly. A checked projector result may become RequiresEvaluator or FactOnly after projection target verification, kernel checking, loss ledger validation, and quotient impact assessment."
      projector_trait:
        code: |
          pub trait Projector<S, P> {
              fn project(
                  &self,
                  input: &S,
              ) -> Result<EvidenceEnvelope<(P, ProjectionCertificate)>, ProjectorError>;
          }

    forbidden_tokens: []

    required_tests: []

    canonical_invariant: >
      Projector projects with explicit loss. It never pretends projection is equivalence.
      Candidates propose transformations; only Evaluators accept; only Engines execute;
      only MetaLift changes carrier expressivity.

    upgrade_v02:
      projection_certificate:
        description: "Projection is lawful forgetting. It must never pretend lossless equivalence."
      python_poc: |
        def validate_projection_certificate(cert: dict) -> None:
            for required in [
                "projection_target",
                "kernel_declaration",
                "loss_ledger",
                "quotient_impact",
                "source_schema",
                "target_schema",
                "source_hash",
                "projected_hash",
            ]:
                if required not in cert:
                    raise ValueError(f"Projection missing {required}")
            if cert["quotient_impact"] == "Collapsed" and not cert.get("loss_ledger"):
                raise ValueError("Quotient collapse requires explicit loss ledger.")

  # ---------------------------------------------------------------------------
  proposal_generator:
  # ---------------------------------------------------------------------------
    source_file: proposal_generator_contract.md
    frontmatter:
      name: ProposalGenerator
      role: "Pure proposal morphism producing detached candidate states with transition metadata"
      version: "2.0"
      classification: candidate
      effect_class: none
      authority_effect: EvidenceOnly
      depends_on:
        - ComponentSharedBoundary
        - FixedLayerOperatorAlgebra
      forbidden_authority:
        - certification
        - validation
        - terminalization
        - execution
        - authority_upgrade
        - evaluation
        - ranking
        - scoring
      primary_output_family: EvidenceEnvelope
      referenced_output_families:
        - StructureArtifact
      llm_boundary: "LLM is candidate generator only. LLM output carries no authority."
      doctrine_version: "2026-05"
      doctrine_5_reference: "Doctrine 5 (Action/Candidate/Boundary Classification) governs this contract. Generators are candidates that produce sub-candidates."

    llm_boundary_law: >
      The LLM is a candidate generator only. It MUST NOT certify, validate, evaluate,
      terminalize, authorize transitions, execute transitions, rank candidates, schedule
      search, or upgrade evidence authority. LLM output may propose Generator implementations,
      candidate schemas, generation rules, or tests, but those proposals are EvidenceOnly
      until checked by the declared Generator, Search, Replay, and component-boundary checks.
    inherits: component_shared_boundary_contract.md

    classification_statement: >
      Generator is a CANDIDATE, not a fixed-layer operator. A Generator applies
      domain-specific transformation schemas to produce detached candidate states. It does
      not evaluate, schedule, or execute. The Evaluator may judge candidate admissibility.
      A LicensingBoundary may authorize execution when required. The Engine executes only
      licensed transitions.

    core_definition: >
      A Generator is a pure proposal morphism. It is a mechanism that applies domain-specific
      transformation schemas to an immutable input state and returns detached candidate states
      with transition metadata. Generators propose transitions. They do not evaluate, schedule,
      or execute them.

    subsystem_classification:
      subsystem: "proposal kernel / candidate synthesis layer"
      not:
        - evaluator
        - search kernel
        - solver
        - policy
        - terminalizer
        - engine
        - pipeline

    architectural_distinction:
      Generator: "proposes transitions"
      Evaluator: "accepts/rejects transitions"
      SearchKernel: "orders, bounds, or explores candidate proposals under declared search policy"
      Engine: "executes transitions"

    tower_placement:
      description: >
        Generators sit at the proposal layer, below Engines (which orchestrate) and the
        Evaluator (which accepts/rejects). They produce raw material for the search pipeline.
      flow: |
        Generator
        -> detached Candidate artifacts
        -> SearchKernel / Search policy
        -> Evaluator
        -> Terminalizer / LicensingBoundary
        -> Engine
        -> Trace

    actual_trait_shape:
      note: >
        There is no unified Generator trait in the working codebase. Generators are
        implemented as standalone functions or structs with ad-hoc generate() methods.
        The contract-layer definition exists only in this document.

    rust_types:
      proposal_generator_trait:
        description: "Historical design target"
        code: |
          pub trait ProposalGenerator<State, Metadata> {
              fn propose(
                  &self,
                  state: &State,
                  ctx: &GeneratorContext,
              ) -> Result<Vec<Candidate<State, Metadata>>, GeneratorError>;
          }

          pub struct GeneratorContext {
              pub grammar_ref: GrammarId,
              pub admissible_components: Vec<ComponentId>,
              pub deterministic_seed: Option<u64>,
              pub branch_limit: Option<usize>,
              pub proposal_depth_bound: Option<usize>,
              pub context_hash: Hash256,
          }
        note: >
          generate is accepted as a legacy implementation name. Contract-canonical APIs should
          use propose to emphasize detached candidate creation rather than search or execution.
          GeneratorContext is configuration evidence only. It MUST NOT contain evaluator metrics,
          policy verdicts, live Engine handles, terminal outcomes, or raw cohomological measurements.
      candidate:
        code: |
          pub struct Candidate<State, Metadata> {
              pub candidate_id: CandidateId,
              pub source_state_hash: Hash256,
              pub proposed_state: State,
              pub component_id: ComponentId,
              pub metadata: Metadata,
              pub proposal_evidence: ProposalEvidence,
              pub replay_refs: Vec<ReplayRef>,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
      actual_patterns:
        pattern_a: |
          pub fn generate(input: &NemotronValue) -> Vec<NemotronValue> { ... }
        pattern_b: |
          pub struct GraphTopologyGenerator;
          impl GraphTopologyGenerator {
              pub fn generate(&self, graph: &FiniteDirectedGraph) -> Vec<FiniteDirectedGraph> { ... }
          }
      proposal_evidence:
        code: |
          pub struct ProposalEvidence {
              pub generator_id: GeneratorId,
              pub generation_rule: RuleId,
              pub deterministic_seed: Option<u64>,
              pub enumeration_policy: EnumerationPolicy,
              pub branch_index: usize,
              pub evidence_hash: Hash256,
              pub authority_effect: AuthorityEffect, // EvidenceOnly
          }
        note: "If certification is required, CertificateKernel may seal a certificate over ProposalEvidence. Generator itself does not create certificates."
      generator_error:
        code: |
          pub enum GeneratorError {
              InvalidDomain(String),
              DimensionMismatch { expected: usize, got: usize },
              UndefinedOperation(String),
              NonFiniteInput,
              InternalInvariantViolation(String),
              GenerationLimitExceeded,
          }

    rules:
      blind_proposal_generation:
        section_number: 1
        description: "A Generator MUST apply a specific transformation rule to an immutable input state."
        may_return:
          - "zero candidates (defined but no applicable transitions)"
          - "one or more candidates"
          - "a typed error (input violated generator's domain)"

      zero_evaluation:
        section_number: 2
        description: "Generators MUST NOT: score, rank, accept, reject, prune for quality, compare by expected usefulness, inspect evaluator metrics, or call functionals/observables for decision-making."
        forbidden_fields: "score, fitness, quality, rank, accepted, rejected, should_keep, confidence, priority"
        allowed_fields: "component_id, source_state_id, parameters, preconditions, postconditions, semantic_tags"
        strict_metadata_rule: "semantic_tags must be descriptive only. They must not encode ranking hints or hidden evaluation metrics."

      pure_state_immutability:
        section_number: 3
        description: "Generators MUST receive state by immutable reference and return new owned candidates."

      mandatory_transition_metadata:
        section_number: 4
        description: "Every candidate MUST contain TransitionMetadata identifying the component, source, parameters, and pre/postconditions."

      no_measurement_access:
        section_number: 5
        description: >
          Generator MUST NOT compute, read, or reconstruct canonical Phi1, Gamma2, Xi,
          quotient mass, closure defect, closure regime, cohomological status, evaluator
          scores, policy scores, or terminal outcomes. If generation needs bounded structural
          context, it may consume opaque non-semantic configuration or grammar refs only.

    search_coupling:
      description: >
        The SearchCatalog aggregates multiple generators. However, the catalog's implementation
        is currently underdefined and risks hiding search policy.
      missing_subsystem: >
        The Generator subsystem must delegate all scheduling, breadth control, and exploration
        bias to a formal SearchKernel. Current Search logic leaks across Generator (proposing
        too many/few candidates), Engine (deciding which path to take), and SearchCatalog
        (ordering generators). Without a dedicated SearchKernel contract, search remains
        ambient behavior rather than a governed subsystem.

    trace_integration:
      description: "When generators produce candidates within a traced execution"
      rules:
        - "Only candidates selected by SearchKernel and accepted by Evaluator may become TraceGraph edges"
        - "Each accepted transition is recorded in the ReplayLedger with a payload hash"
        - "The generator's component identity is preserved for auditability"
        - "Non-selected or refused candidates do not become state-transition edges. They may be recorded as proposal/evaluation evidence when required by audit policy."
      flow: |
        Generator.propose(state) -> Candidate artifacts
          -> SearchKernel orders/bounds proposals
          -> Evaluator judges candidate evidence
          -> LicensingBoundary emits ActionLicense when permitted
          -> Engine executes licensed transition
          -> Trace records executed action and relevant proposal/evaluation/license refs

    evaluation_integration: >
      Generators do not directly interact with the evaluation layer. Evaluator may consume
      detached Candidate artifacts and checked proposal evidence through declared interfaces.
      Generator MUST NOT call evaluator functions, inspect evaluator metrics, encode
      acceptance hints, or emit accepted/rejected fields.

    bounded_description_complexity:
      description: >
        Generators are bounded transformation systems acting over an existing grammar and carrier.
      synthesis_modes:
        - "LLM-mediated synthesis: Proposes new generator implementations (external to Generator semantics)"
        - "Solver-mediated synthesis: Evolves generator parameters"
        - "Complexity Reduction: A generator that produces candidates with lower description complexity under a declared encoding contributes to the system's compression objective"
      warning: >
        Kolmogorov complexity is not computable. Self-compression must be operationalized as
        bounded description complexity or compression heuristics, and must never reintroduce
        hidden evaluation inside the generator. Generators remain epistemically blind to the
        productivity of their output. Bounded description complexity may be recorded as
        descriptive proposal metadata only if computed by a declared non-governance encoding
        rule and not used by Generator to rank, prune, accept, or reject candidates. Any
        compression objective used for selection belongs to Search/Evaluator/Policy, not Generator.

    generator_governance:
      description: "To prevent search explosion, Generators must receive externally declared bounds"
      bounds:
        - "GeneratorBudget: CPU/Memory limits"
        - "GeneratorBranchLimit: Max candidates per state"
        - "ProposalDepthBound: Max recursive generation depth"
      note: "SearchKernel owns scheduling, exploration bias, and global budget policy."

    reclassification_warning:
      description: "Several listed files may not be valid ProposalGenerator implementations under this contract"
      files:
        - file: "operator_evolution_generator.rs"
          concern: "must not evolve operator authority or self-classify effect classes"
        - file: "immune_projector.rs"
          concern: "likely Projector / ResidualProjection candidate if it performs projection"
        - file: "semantic_dag_planner.rs"
          concern: "likely SearchKernel / Planner, not blind Generator, if it orders or plans by goal"
