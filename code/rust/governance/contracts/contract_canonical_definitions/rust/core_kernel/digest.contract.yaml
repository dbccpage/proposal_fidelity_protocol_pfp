schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:rust:core_kernel:digest:v1.0.0
title: Digest
status: active
crate: core_kernel
file: crates_rs/core_kernel/src/digest.rs
role: substrate
authority_effect: none
evidence_ceiling: LocalReplay
customer_claim_allowed: false
runtime_enforcement: false
owns:
- the canonical content digest and its grammar
- domain separation for minted digests
does_not_own:
- the canonical JSON encoding profile
- what a digest attests to
- any authority carried by the bytes it names
may_call: []
must_not:
- fold a second spelling of a digest into the canonical one
- expose a field that bypasses parse
- mint a digest whose domain boundary can shift
exactness:
  mode: not_applicable
  exact_constructor_required: false
  approximate_modes_allowed: false
laws:
- 'Grammar law: a digest is sha256: followed by exactly 64 lowercase hex digits.'
- 'Single spelling law: uppercase hex is refused rather than folded; admitting a
  second spelling is the shape of the defect this newtype prevents.'
- 'Construction law: the field is private and Deserialize routes through parse, so
  an unnormalised digest cannot be constructed by a caller or from JSON.'
- 'Domain separation law: the domain is length-delimited, so ("ab","c") and
  ("a","bc") cannot collide.'
- 'Authority law: a digest names bytes. It attests to nothing on its own.'
forbidden_substrings:
- 'pub struct Digest(pub'
- 'to_uppercase'
- 'to_ascii_uppercase'
- 'f64'
required_substrings:
- 'pub fn parse'
- 'serde(try_from = "String", into = "String")'
required_tests:
- a_well_formed_digest_parses_and_round_trips
- a_bare_hex_string_is_not_a_digest
- uppercase_hex_is_refused_rather_than_folded
- a_wrong_length_is_refused
- a_non_hex_character_is_refused
- deserialize_refuses_what_parse_refuses
- of_bytes_is_the_known_sha256_of_the_empty_string
- of_bytes_always_produces_something_parse_accepts
- the_domain_is_length_delimited_so_a_boundary_cannot_shift
- the_same_payload_under_different_domains_cannot_be_replayed
lean_obligations: []
