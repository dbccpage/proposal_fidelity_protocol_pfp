schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:rust:core_kernel:exact:v1.0.0
title: Exact
status: active
crate: core_kernel
file: crates_rs/core_kernel/src/exact.rs
role: substrate
authority_effect: none
evidence_ceiling: LocalReplay
customer_claim_allowed: false
runtime_enforcement: false
owns:
- the exact rational scalar type
- the canonical string wire form of an exact value
- the serde adapters that keep exact values off the JSON number rail
does_not_own:
- linear algebra over the exact scalar
- certificates built from exact values
- any decision, diagnostic, or terminal
may_call: []
must_not:
- decide equality by tolerance
- admit a float on the wire
- yield NAN in place of a failed conversion
exactness:
  mode: exact_only_with_named_diagnostic_escape
  exact_constructor_required: false
  approximate_modes_allowed: true
laws:
- 'Canonical spelling law: one value has exactly one string form; a non-canonical
  spelling is refused rather than normalised, so string equality is value equality.'
- 'Wire law: an exact value crosses the wire as a string, never as a JSON number.'
- 'Refusal law: a lossy read that cannot be represented returns None, never NAN.
  NAN compares false against everything, so a lost value would read as a value that
  disagrees.'
- 'Total order law: ordering is exact and total, so a sort is a decision.'
- 'Authority law: this contract confers no authority.'
forbidden_substrings:
- 'unwrap_or(f64::NAN)'
- ' as f64'
- 'EPSILON'
required_substrings:
- 'pub type Exact'
- 'pub fn to_canonical_string'
- 'pub fn parse_exact'
required_tests:
- one_value_has_exactly_one_spelling
- parsing_is_the_inverse_of_rendering
- a_non_canonical_spelling_is_refused_rather_than_normalised
- a_decimal_is_refused_because_it_is_not_exactly_representable
- a_zero_denominator_is_refused_rather_than_panicking
- exactness_holds_where_floating_point_would_not
- a_value_too_large_for_f64_approximates_to_none_not_nan
- ordering_is_total_and_exact
- a_big_value_survives_the_round_trip_without_loss
- the_wire_form_is_strings_and_never_json_numbers
- a_json_number_is_refused_on_the_wire
lean_obligations: []
