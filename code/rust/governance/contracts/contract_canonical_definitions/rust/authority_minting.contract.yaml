- 'seed_name: &str'
- 'certificate_hash: &str'
- CertifiedAuthority::certify
- authority_from_outcome_f13
- promote_authorized_local_result_v1
- pub fn mint_authority
- fn mint_authority
required_substrings:
- certificate_boundary
- pub use
required_tests:
- certify_checked_packet_seals_none_effect_evidence
lean_obligations: []
