schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:rust:core_certifiers:authority_minting:v1.2.0
title: AuthorityMintingCompatibility
status: deprecated_adapter
crate: core_certifiers
file: crates_rs/core_certifiers/src/authority_minting.rs
layer: 02_evidence
