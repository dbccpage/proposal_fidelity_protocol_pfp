- mub6_incomplete_atlas_support_is_not_curvature
- mub6_c3_atlas_coherence_candidate_records_missing_bridge
- mub6_d2_c3_analysis_classifies_atlas_coherence_gaps
- mub6_run_reports_missing_basis_gluing_not_theorem
lean_obligations:
- 'MUB-DDA-1: C0/C1/C2 support analysis separates missing support from curvature'
- 'MUB-DDA-2: support-realization defects require C3 atlas coherence'
- 'MUB-DDA-3: full MUB(6) authority is blocked without C3 atlas coherence'
- 'MUB-DDA-4: classwise obstruction evidence requires basis-gluing obligations'
- 'MUB-DDA-5: synthetic functional replay is diagnostic evidence, not representation-layer or geometry derivation'
- 'MUB-DDA-6: d2-to-C3 analysis records each missing atlas coherence obligation as typed finite evidence'
notes:
- "This file contract covers the MUB-specific C0 -> C1 -> C2 replay and the licensed C3 escalation path in core_discrete_deformation_algebra::mub_cochain. It intentionally separates a support-realization defect from curvature: a declared face with a missing boundary edge is an atlas support problem, not a computed Gamma2 theorem."
- "The report may carry a synthetic Phi1/Gamma2 replay packet through core_functional, but it must keep C3 atlas cover, transport-square commutation, wall transport, ZeroRel preservation, terminalizer preservation, and basis gluing as proof obligations before any complete MUB(6) authority claim."