title: MubCochainObstructionReplay
status: draft
crate: core_wdp
file: crates_rs/core_wdp/src/ddc/mub_cochain.rs
layer: 01_primitives
role: finite_mub_cochain_obstruction_replay
authority_effect: diagnostic_only
customer_claim_allowed: false
runtime_enforcement: true
owns:
- mub6_cochain_obstruction_replay
- mub_support_realization_defect_classifier
- mub6_c3_atlas_coherence_gate
- mub_synthetic_functional_replay_packet
- mub_higher_cn_escalation_report
does_not_own:
- complete_mub6_no_go_theorem
- basis_gluing_authority
- exhaustive_triple_cover_generation
- hilbert_space_derivation
- repeatable_engagement_geometry
- evaluator_policy
- full_authority_terminalization
may_call:
- core_functional::phi1
- core_functional::gamma2
- core_policy::trichotomy
must_not:
- treat missing C2 face support as curvature
- promote a classwise wall obstruction to full MUB(6) authority
- run basis gluing before C3 atlas coherence
- treat synthetic Phi1/Gamma2 replay as actual MUB(6) geometry
- erase ZeroRel or terminalizer preservation obligations across atlas transport
- claim a complete MUB(6) no-go theorem from pinned triple data
exactness:
  mode: bounded_i64_checked
  approximate_modes_allowed: false
  overflow_behavior: typed_refusal
forbidden_substrings:
- "complete MUB(6) no-go"
- "full MUB(6) authority"
required_substrings:
- pub enum MubTarget
- pub enum MubAtlasNode
