- SupportDefectRequiresC3
- NoFullAuthorityWithoutC3
- ClasswiseObstructionRequiresBasisGluing
- D2C3AtlasCoherence
- C3DefectClassification
- SyntheticExactObstructionPacket
- MUB.CochainObstruction.mub6_support_realization_defect_requires_higher_coherence
- MUB.CochainObstruction.mub6_no_full_authority_without_c3_atlas_coherence
- MUB.CochainObstruction.mub6_classwise_obstruction_requires_basis_gluing
required_tests:
- mub6_complete_triangle_support_has_d1d0_zero
- mub6_reversed_declared_edge_support_is_orientation_safe
