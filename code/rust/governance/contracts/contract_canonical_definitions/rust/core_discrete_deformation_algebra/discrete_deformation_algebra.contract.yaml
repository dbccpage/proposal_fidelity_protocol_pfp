lean_obligations:
- 'L-DDA-1: boundary_merge boundary(L1 + L2) = boundary(L1) + boundary(L2)'
- 'L-DDA-2: boundary_reverse boundary(-L) = -boundary(L)'
- 'L-DDA-3: boundary_scale boundary(n * L) = n * boundary(L)'
- 'L-DDA-4: Lambda license requires positive FiniteDiagnostic obstruction'
- 'L-DDA-5: operator proposals carry no acceptance authority'
- 'L-DDA-6: Gamma2 visibility requires declared C2 support'
- 'L-DDA-7: Xi is usable only under primary diagnostic equality'
- 'L-DDA-8: trace/domain validation requires realized finite carrier structure'
- 'L-DDA-9: primitive difference d0 maps C0 potentials to C1 edge cochains'
- 'L-DDA-10: exact primitive differences have zero d1 closure defect and Gamma2'
- 'L-DDA-11: adding an exact d0 gauge shadow preserves C2 closure defect'
- 'L-DDA-12: Q1 irreducibility requires positive Phi1 residual'
- 'L-DDA-13: Q1 dual witness must saturate the same Phi1 value'
- 'L-DDA-14: positive quotient evidence is diagnostic evidence, not authority to solve or promote'
- 'L-DDA-15: Born normalization requires positive nonzero L1 sector mass'
- 'L-DDA-16: Born squared-norm probabilities equal direct L1 normalization'
- 'L-DDA-17: conditional Hilbert/Born re-encoding does not create or modify obstruction diagnostics'
- 'L-DDA-18: Xi cannot override changed Phi1/Gamma2 primary diagnostics'
- 'L-DDA-19: Xi tie-break requires strict Xi improvement after primary tie'
- 'L-DDA-20: finite Lambda step requires positive before obstruction'
- 'L-DDA-21: finite Lambda step requires resolved after diagnostic'
- 'L-DDA-22: finite Lambda step requires non-destructive preservation witness'
- 'L-DDA-23: observer passivity refuses Phi1 creation'
- 'L-DDA-24: observer passivity refuses Gamma2 creation'
- 'L-DDA-25: passive observer shadows are componentwise non-increasing diagnostics'
- 'L-DDA-26: cross-term obstruction evidence requires an involution witness'
- 'L-DDA-27: cross-term obstruction evidence requires repair invariance'
- 'L-DDA-28: cross-term obstruction evidence requires non-coboundary positive L1 mass'
- 'L-DDA-29: typed cross-term evidence yields a CrossTermDiagnostic distinct from Phi1/Gamma2; it cannot mint a FiniteDiagnostic, and is not a representation-layer, geometry, or authority derivation'
- 'L-DDA-30: AI lift proposals require proof-carrying finite Lambda certificates'
- 'L-DDA-31: AI proposal acceptance delegates to the finite Lambda certificate validity gate'
- 'L-DDA-32: accepted AI proposal diagnostics are exactly the certificate after diagnostic'
- 'L-DDA-33: finite-window scans compute C0 -> C1 primitive differences only over declared local edges'
- 'L-DDA-34: finite-window scans compute L1 tension and Gamma2 only from declared local C1/C2 support'
- 'L-DDA-35: finite-window scans report the window Gamma2 total but refuse to mint a FiniteDiagnostic from a scalar quotient receipt (MissingProofCarryingCertificate); this crate has no proof-carrying quotient Phi1 path'
- 'L-DDA-36: gauge-only quotient certificates cannot produce finite-window obstruction diagnostics'
- 'L-DDA-37: representation-layer-only claim packets carry no authority'
- 'L-DDA-38: typed refusals terminalize claim packets without granting positive authority'
- 'L-DDA-39: claim authority requires descent to primitive difference or structure plus an authoritative terminal status'
- 'L-DDA-40: primitive terminal packets translate conservatively into ontology claim packets'
- 'L-DDA-41: repaired primitive packets with descent have ontology claim authority'
- 'L-DDA-42: primitive refused and budget-unknown packets terminalize as typed refusals'
- 'L-DDA-43: open no-rule primitive packets do not gain ontology authority'
- 'L-DDA-44: a chained finite Lambda ledger requires every non-final row to pass require_descent_step and the final row to pass require_valid'
- 'L-DDA-45: a chained finite Lambda ledger requires step[i].after = step[i+1].before, matching initial / terminal endpoints, and equal resolved endpoints when empty'
notes:
- "This contract enforces the Rust exact algebraic shadow of the Lean Lambda surface operations and the finite C0 -> C1 -> C2 diagnostic spine. Lean owns edge-valued boundary theorems, ontology-to-primitive bridge theorems, and FOC proof obligations. This crate owns checked same-face scalar operations, a declared oriented triangle boundary projection into C1, canonical edge-boundary merging, primitive differences from C0 potentials, C2 closure-defect/Gamma2 shadows, finite-window C0 -> C1 -> C2 scans, finite-window quotient diagnostic bridges, L1 edge tension, declared-scalar Q1 irreducibility consistency checks, PaperFOC005 finite Lambda step preservation certificates, observer passivity shadow certificates, PaperQF001 Xi hierarchy certificates, PaperQF002 Born-normalization redundancy certificates, Pub010 cross-term involution obstruction certificates, Paper015 proof-carrying AI proposal gates, PaperFOC000c claim-packet authority boundaries, and a non-authoritative diagnostic license gate. Cross-domain evidence is recorded in paper000c_claim_packet_evidence.md."
- "PaperFOC003-Paper015 alignment: the crate may accept replayed quotient certificates and typed refusals, but it must not perform evaluator acceptance, quotient minimization, dual-witness synthesis, Xi ranking, observer authority creation, cross-term promotion without witnesses, AI lift acceptance without proof-carrying finite certificates, representation-only claim authority, trace-density representation, Hilbert-space derivation, Born-rule ontology, quantum-measurement derivation, or domain-trace certification."
