- destructive_carrier_mutation
- evaluator_policy
- quotient_minimization
- trace_density_lifts
- observer_authority_creation
- primal_dual_quotient_solver
- born_rule_ontology
- hilbert_space_derivation
- quantum_measurement_derivation
- repeatable_engagement_geometry
may_call:
must_not:
- compute geometry dynamically
- accept Lambda steps without preservation witness
- accept final Lambda steps whose after diagnostic remains obstructed
- accept intermediate Lambda steps that increase Phi1 or Gamma2
- compute Phi1 quotient minimizers
- synthesize dual quotient witnesses
- derive Hilbert space from L1 weights
- derive Born-rule ontology
- create obstruction during Born normalization
- allow observer shadows to increase Phi1 or Gamma2
- compute Gamma2 from raw carriers
- scan undeclared finite-window edges or faces as local evidence
- rank candidates by Xi
- allow Xi to override Phi1 or Gamma2
- accept or promote operator proposals
- promote cross-term evidence without involution, repair-invariance, and non-coboundary witnesses
- treat cross-term diagnostics as representation-layer, geometry, or authority derivations
- accept AI lift proposals without proof-carrying finite Lambda certificates
- grant authority to representation-layer-only claim packets
- treat typed refusal as positive authority
exactness:
  mode: bounded_i64_checked
  exact_constructor_required: true
  approximate_modes_allowed: false
  overflow_behavior: typed_refusal
