    authority_layer: Evidence
    replay_certificates:
    - schema_hash
  capabilities:
    forbidden:
    - RuntimeMutation
    - Terminalization
    - CertificateSigning
    required: []
rust_binding:
  crate: core_replay
  module: run_folder
  symbols:
  - RunTrigger
  - RunMode
  - RunManifestV1
  - RunReceiptV1
  - RunFolderError
  - RunFolder
  - sanitize_task_slug
  - generate_run_folder_name
