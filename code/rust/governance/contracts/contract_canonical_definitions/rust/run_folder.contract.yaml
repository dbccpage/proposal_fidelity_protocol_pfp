schema_version: core.contract.v1
contract_id: urn:core:execution:run_folder:v1.0.0
title: Run folder manifests and byte verification
kind: execution_contract
status: mathematical_wip
layer: 06_execution
role: Replay
descriptor:
  authority_effect: evidence_only
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
  constitution:
    contract_dependencies: []
