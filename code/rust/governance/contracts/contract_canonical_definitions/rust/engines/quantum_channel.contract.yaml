schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:qm:quantum_channel:file:v1.1.0
crate: engines
file: crates_rs/engines/src/quantum/quantum_channel.rs
role: cptp_channel_adapter
status: active_provisional
authority_effect: none
customer_claim_allowed: false
runtime_enforcement: required
owns:
  - validated_kraus_cptp_channel_construction
  - checked_channel_application
  - checked_channel_composition
does_not_own:
  - authority
  - process_matrix_claims
  - born_theorem
  - qm_derivation
may_call:
  - engines::quantum::density_matrix
  - engines::quantum::packed_hermitian
must_not:
  - panic in production paths
  - unwrap density validation in checked paths
  - compose incompatible channels by assertion
  - mint authority
  - certify physical realization
exactness:
  numeric_mode: f64_diagnostic_or_checked_numeric
  exact_certificate_allowed: false
  cptp_validation_required: true
forbidden_substrings_checked_paths:
  - "unwrap()"
  - "expect("
  - "assert_eq!"
  - "panic!"
forbidden_substrings:
  - "CertifiedAuthority"
  - "ExactRepair"
  - "AuthorityEffect::Authorize"
required_substrings:
  - "apply_checked"
  - "compose_checked"
  - "Result<"
required_tests:
  - kraus_channel_checks_trace_preservation
  - apply_checked_preserves_trace_one
  - compose_checked_rejects_dimension_mismatch
  - checked_paths_do_not_panic
lean_obligations:
  - QM-D10 CPTP application preserves PSD and trace but mints no authority
