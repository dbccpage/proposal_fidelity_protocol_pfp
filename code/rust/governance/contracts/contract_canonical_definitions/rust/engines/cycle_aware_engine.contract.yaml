schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:engine:cycle_aware_engine:file:v1.0.0
crate: engines
file: crates_rs/engines/src/cycle_aware.rs
role: cycle_aware_traversal_engine
status: active_provisional
authority_effect: none
customer_claim_allowed: false
runtime_enforcement: required
owns:
  - cycle_aware_graph_traversal
  - cycle_detection_and_pruning
does_not_own:
  - infinite_loop_solver
  - authority
may_call:
  - core
must_not:
  - claim infinite cycle resolution
  - mint authority
exactness:
  numeric_mode: integer_graph_traversal
  exact_certificate_allowed: false
forbidden_substrings:
  - "CertifiedAuthority"
  - "AuthorityEffect::Authorize"
required_substrings:
  - "AuthorityEffect::None"
required_tests:
  - test_cycle_aware_traversal
