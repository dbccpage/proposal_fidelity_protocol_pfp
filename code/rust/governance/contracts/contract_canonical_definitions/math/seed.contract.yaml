schema_version: core.contract.v1
contract_id: urn:core:math:seed:v1.0.0
title: Seed
kind: math_contract
status: mathematical_wip
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: seed
  ascii_symbol: seed
  symbol: seed
  notation: seed
  domain:
  - 'carrier: instance of seed'
  codomain:
    description: Mathematical object declared by Seed (structural shell).
requirements:
  required_structures:
  - Carrier for seed must be finite/explicit where claimed
  - Object kind and domain/codomain (or equivalent) must be declared
  - Operations, if any, must preserve declared structure
  - No authority effect may be self-assigned by the structure
laws:
- Seed is a pure mathematical structure (AuthorityEffect none)
- All declared required_structures must hold for a valid instance
- 'Replay is deterministic: no external state, no randomness, no wall-clock'
- This contract does not mint customer claims or GlobalGreen
rust_binding:
  crate: core_id_run
  module: seed
  symbols:
  - Seed
  # try_new rejects a missing name and a cochain whose matrix/vector lengths
  # do not match the declared dims. Seed has no authority field and no
  # non-determinism gate; those negatives stay unnamed. PROVED/GlobalGreen
  # is doctrinal.
  required_tests:
  - try_new_rejects_ill_typed_d0_length
  - try_new_rejects_empty_name
negative_tests:
- Artifact claiming Seed without required structures must be rejected
- Empty or ill-typed carrier for seed must be rejected
- Artifact claiming authority or admissibility must be rejected
- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected
- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: 'Mathematical seed for diagnostic and entropy generators. Nonclaim fence: does not claim PROVED; does not claim
    GlobalGreen; does not claim HoTT/Univalence discharge from this contract alone.'
  non_role:
  - Authority minting or GlobalGreen discharge
  - Customer-facing claims or product guarantees
  - Full encyclopedia mechanization of seed (deferred)
  - HoTT/Univalence theorem discharge from this contract alone
  - Runtime enforcement as proof of mathematical truth
nomos_debate_NOT_CANONICAL:
  banner: "NON-CANONICAL DEBATE ONLY — not contract law; not enforced as obligations; AuthorityEffect None"
  not_part_of_contract_law: true
  authority_effect: none
  potential_defects:
  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: G_MATH_BLOCK
    severity: medium
    claim_class: "[STANDARD]"
    detail: "Missing or not detected field gate G_MATH_BLOCK"
    recommendation: "Repair under meth-level math re-review (ADR-007); not GlobalGreen."
  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: G_REQUIRED_STRUCTURES
    severity: medium
    claim_class: "[STANDARD]"
    detail: "Missing or not detected field gate G_REQUIRED_STRUCTURES"
    recommendation: "Repair under meth-level math re-review (ADR-007); not GlobalGreen."
  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: G_LAWS_OR_REQUIREMENTS
    severity: medium
    claim_class: "[STANDARD]"
    detail: "Missing or not detected field gate G_LAWS_OR_REQUIREMENTS"
    recommendation: "Repair under meth-level math re-review (ADR-007); not GlobalGreen."
  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: G_NEGATIVE_TESTS
    severity: medium
    claim_class: "[STANDARD]"
    detail: "Missing or not detected field gate G_NEGATIVE_TESTS"
    recommendation: "Repair under meth-level math re-review (ADR-007); not GlobalGreen."
  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: DEV-THEATER
    severity: high
    claim_class: "[STANDARD]"
    detail: "non_role is empty list"
    recommendation: "Repair under meth-level math re-review (ADR-007); not GlobalGreen."

  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: STATUS_VS_CONTENT
    severity: low
    claim_class: "[STANDARD]"
    detail: "DEEP Stage-1: status='active' while structural residuals remain"
    recommendation: "Repair under meth-level math re-review (ADR-007/007a); not GlobalGreen."
    pass: stage1_deep_has_rs
  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: METH_STRUCTURAL_REPAIR
    severity: info
    claim_class: "[STANDARD]"
    detail: "Meth-level structural repair applied: ensure descriptor.authority_effect=none + customer_claim_allowed=false; create math block; set math.object_kind; set math.domain; set math.codomain; create requirements; set required_structures; set laws; set negative_tests; set doctrine.non_role (anti-theater); demote status active -> mathematical_wip (structural repair); add overclaim nonclaim fence to doctrine.summary. Not PROVED; not GlobalGreen; human re-review still required for math depth."
    recommendation: "Continue meth re-review for object-specific laws; code follows YAML (ADR-007a)."
    pass: stage1_meth_repair_has_rs
  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: MATH-OVERCLAIM
    severity: high
    claim_class: "[STANDARD]"
    detail: "DEEP Stage-1: PROVED/GlobalGreen language without nearby nonclaim"
    recommendation: "Repair under meth-level math re-review (ADR-007/007a); not GlobalGreen."
    pass: stage1_deep_has_rs
  - reviewer: panepistimion-math-prof
    role: MATH_CANONICAL_REVIEW
    code: METH_OVERCLAIM_FENCE
    severity: info
    claim_class: "[SCOPE FENCE]"
    detail: "Explicit nonclaim fence: does not claim PROVED/GlobalGreen/HoTT discharge."
    recommendation: "Vocabulary may remain; never mint proof status from YAML alone."
