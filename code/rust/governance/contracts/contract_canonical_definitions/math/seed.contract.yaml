    code_behavior: "Seed is an ID-calculus obstruction cochain seed (c0/c1/c2 dims, d0/d1 over Q, residual q) with fixtures triangle_wall/two_simplex/exact_repair."
    detail: >
      rust_binding crate=core_id_run module=seed symbol=Seed resolves to a live file.
      Code object is domain-specific (finite cochain residual seed), not a general
      algebraic seed type. Structural demo only; no PROVED / GlobalGreen.
    delta: YAML_OVERCLAIMS
