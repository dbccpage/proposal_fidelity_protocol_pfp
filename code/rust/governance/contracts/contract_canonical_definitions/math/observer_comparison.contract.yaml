  - comparison_packet_rejects_cross_carrier_without_transport
  - comparison_packet_rejects_identical_observers
  - comparison_packet_refuses_laundering_attempts
  - comparison_packet_refuses_hidden_distinction_recovery
  - comparison_packet_refuses_customer_claim
negative_tests:
- Artifact claiming ObserverComparisonPacket without required structures must be rejected
- Empty or ill-typed carrier for observer_comparison must be rejected
- Artifact claiming authority or admissibility must be rejected
- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected
- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: "Diagnostic packet for comparing two declared observer-visible quotients over a shared source quotient\
    \ and carrier. Agreement, disagreement, and incomparability remain observer-scoped evidence only.\n Nonclaim:\
    \ this contract does not claim HoTT/Univalence discharge, PROVED status, or GlobalGreen."
  non_role:
  - terminal_authority_minting
  - observer_independent_truth
  - hidden_distinction_recovery
  - comparison_laundering
  - customer_claim
  laws:
  - comparison requires shared source quotient hash unless explicit transport exists
  - comparison requires shared carrier hash unless explicit transport exists
  - comparison replay hash must be nonzero
  - observer agreement does not raise the evidence ceiling
  - observer disagreement does not prove global inconsistency by itself
  - incomparable observer quotients require refusal or transport, not silent promotion
  - attempted authority promotion emits ComparisonLaunderingRefused
  - comparison status maps to observer-comparison residual kind without authority promotion
  - conservative hash-derived comparison may emit Agreement only for matching equivalence-relation hashes
  - conservative hash-derived comparison must emit Incomparable for nonmatching equivalence-relation hashes
