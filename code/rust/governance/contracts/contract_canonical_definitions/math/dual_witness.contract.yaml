    claim_class: '[CODE_DEMO_RUST]'
    file: engine/crates_rs/core_types/src/dual_witness.rs
    yaml_law: Hahn-Banach-style dual certificate ||x|| >= |y(x)| when ||y||* <= 1 over general normed V
    code_behavior: 'DualWitness is a display-only f64 view of VerifiedExactPhi1 (phi vector, dual_value, is_circulation/is_bounded
      inherited, not recomputed). No general dual-norm certificate construction or evaluation pairing API.

