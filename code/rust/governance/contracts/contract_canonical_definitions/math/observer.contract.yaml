    must_not_self_assign: true
math:
  object_kind: observer
  ascii_symbol: observer
  symbol: observer
  notation: observer
  domain:
  - 'carrier: instance of observer'
  codomain:
    description: Mathematical object declared by Observer (structural shell).
requirements:
  required_structures:
  - Carrier for observer must be finite/explicit where claimed
  - Object kind and domain/codomain (or equivalent) must be declared
  - Operations, if any, must preserve declared structure
  - No authority effect may be self-assigned by the structure
laws:
- Observer is a pure mathematical structure (AuthorityEffect none)
- All declared required_structures must hold for a valid instance
- 'Replay is deterministic: no external state, no randomness, no wall-clock'
- This contract does not mint customer claims or GlobalGreen
rust_binding:
  crate: core_types
  module: observer
  symbols:
  - Observer
  required_tests:
  - an_unset_replay_is_refused_for_each_law
  - one_replay_cannot_witness_two_laws
  - repair_compat_and_lossy_phi_cannot_share_a_replay
  - an_observer_id_must_be_canonical
  - a_malformed_observer_id_is_refused_on_the_wire
  - an_unset_replay_cannot_deserialize_as_verified
negative_tests:
- Artifact claiming Observer without required structures must be rejected
- Empty or ill-typed carrier for observer must be rejected
- Artifact claiming authority or admissibility must be rejected
- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected
- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: 'Mathematical definition of a single cochain observer. Nonclaim: this contract does not claim HoTT/Univalence
    discharge, PROVED status, or GlobalGreen.'
  non_role:
  - Authority minting or GlobalGreen discharge
  - Customer-facing claims or product assurances
  - Full encyclopedia mechanization of observer (deferred)
  - HoTT/Univalence theorem discharge from this contract alone
  - Runtime enforcement as proof of mathematical truth
