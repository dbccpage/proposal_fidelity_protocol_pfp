- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: 'Tertiary representative-alignment diagnostic. Nonclaim: this contract does not claim HoTT/Univalence
    discharge, PROVED status, or GlobalGreen.'
  symbol: Ξ
  ascii_symbol: Xi
  formula: Ξ = ||ρ(h₁*) - ρ(φ*)||_tr
  1. Contract metadata:
    title: Ξ representative-alignment diagnostic
    version: 0.1.0
    object_type: tertiary_diagnostic
  2. Mathematical object / functional role:
    role: Tertiary representative-alignment diagnostic.
    purpose: Compares deterministic density lifts of tied optimal primal residual and dual witness.
    non_role:
    - Does not measure obstruction magnitude.
    - Does not replace Φ₁.
    - Does not replace Γ₂.
    - Does not classify policy admissibility.
    - Does not issue certificates.
    - Does not terminalize.
    - Does not produce customer-facing claims.
  3. Domain and codomain:
    domain: 'Deterministic h₁* and φ* after Φ₁ and Γ₂ have been computed, with Φ₁ and Γ₂ tied under the declared
      comparison mode if Ξ is used to decide.

      '
    codomain: nonnegative trace-distance scalar under declared normalization convention
  4. Required structures:
    required:
    - Φ₁ result
    - Γ₂ result
    - deterministic TieR for h₁*
    - deterministic dual tie policy for φ*
    - 'saturation verification: <φ*, h₁*> = Φ₁'
    - density lift ρ
    - trace-distance definition
    - trace-distance normalization convention
  5. Definition:
    formula: Ξ = ||ρ(h₁*) - ρ(φ*)||_tr
    exact_repair_case: Ξ = 0 when Φ₁ = 0.
    density_lift: 'ρ(v) is the declared conditional density lift. Zero-mass cases are undefined except through the
      Φ₁ = 0 rule, where Ξ is forced to 0.

      '
    replayability_condition: 'Without deterministic TieR for h₁* and deterministic dual tie policy for φ*, Ξ is
      not a replayable functional value.

      '
    trace_distance_convention:
      required: true
      allowed:
      - half_normalized_range_0_1
      - unhalved_range_0_2
  6. Laws and invariants:
    scale_invariant: ρ(λv) = ρ(v) for nonzero scalar λ under the declared scalar/sign/phase convention.
    magnitude_blind: Ξ forgets obstruction magnitude.
    nonnegativity: Ξ >= 0.
    boundedness: Bounded according to declared trace-distance convention.
    hierarchy: Ξ cannot override Φ₁ or Γ₂.
    tie_only: Ξ may decide only among candidates after Φ₁ and Γ₂ are tied under declared mode.
    saturation_required: Ξ is admissible as a diagnostic only when primal-dual saturation is replayed.
  7. Equality / equivalence rules:
    scalar_equality: Exact/tolerance comparison follows declared comparison mode.
    density_equality: Depends on declared density-lift and trace-distance convention.
    phase_equivalence: Global sign/phase changes of state vectors must not change ρ.
  8. Replay / determinism requirements:
    requirements:
    - TieR replay for h₁*.
    - Dual tie policy replay for φ*.
    - Saturation replay.
    - Density lift replay.
    - Trace-distance replay.
    - Normalization convention is hash-bound or schema-bound.
    - Approximate trace distance must be labeled approximate and cannot masquerade as exact.
  9. Relationship to other Core primitives:
    relationships:
      Phi1: Ξ is zero when Φ₁ = 0 and cannot override Φ₁.
      Gamma2: Ξ cannot override Γ₂.
      R: Ξ depends on the deterministic residual selected by R/TieR.
      EvaluationHierarchy: Ξ is the third lexicographic key only.
      Trichotomy: Ξ does not change ExactRepair / StabilizedSurvivor / OpenObstruction classification.
  10. Rust descriptor shape:
    sketch: "pub struct XiDescriptor {\n    pub phi1_result_hash: String,\n    pub gamma2_result_hash: String,\n\
      \    pub primal_tie_policy_hash: String,\n    pub dual_tie_policy_hash: String,\n    pub density_lift_definition_hash:\
      \ String,\n    pub trace_distance_definition_hash: String,\n    pub trace_distance_convention: TraceDistanceConvention,\n\
      \    pub comparison_mode_hash: String,\n}\n\npub enum TraceDistanceConvention {\n    HalfNormalizedRangeZeroToOne,\n\
      \    UnhalvedRangeZeroToTwo,\n}\n"
  11. Negative definition tests:
    tests:
    - Ξ improves but Φ₁ worsens.
    - Ξ improves but Γ₂ worsens.
    - Ξ used when Φ₁ and Γ₂ are not tied.
    - Ξ computed without deterministic TieR.
    - Ξ computed without deterministic dual tie policy.
    - Saturation identity fails.
    - Trace norm replaced by entrywise matrix norm without declaring approximation.
    - Zero-mass density lift used outside Φ₁ = 0 rule.
    - Trace-distance normalization convention omitted.
    - Ξ interpreted as obstruction magnitude.
    - Ξ interpreted as observer-independent truth.
  12. Open questions / WIP status:
    wip:
    - Trace norm normalization convention.
    - Density lift behavior for signed/weighted domains.
    - Exact scalar field and phase convention for density lift.
    - Whether approximate numerical trace distance is allowed outside display/debug mode.
