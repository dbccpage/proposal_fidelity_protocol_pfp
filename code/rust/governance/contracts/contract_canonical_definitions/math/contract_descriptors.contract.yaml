requirements:
  required_structures:
  - Carrier for contract_descriptors must be finite/explicit where claimed
  - Object kind and domain/codomain (or equivalent) must be declared
  - Operations, if any, must preserve declared structure
  - No authority effect may be self-assigned by the structure
laws:
- ContractDescriptors is a pure mathematical structure (AuthorityEffect none)
- All declared required_structures must hold for a valid instance
- 'Replay is deterministic: no external state, no randomness, no wall-clock'
- This contract does not mint customer claims or GlobalGreen
rust_binding:
  crate: core_contracts
  module: contract_descriptors
  symbols:
  - ContractDescriptors
  - PrimitiveContractDescriptor
  - PrimitiveContractBinding
  - FunctionalContractBinding
  - CORE_PRIMITIVE_CONTRACTS
  - CORE_PRIMITIVE_CONTRACT_BINDINGS
  - FUNCTIONAL_CONTRACT_BINDINGS
  - contract_by_id
  - binding_by_descriptor_id
  - primitive_binding_by_contract_urn
  - primitive_binding_by_canonical_file
  - primitive_dependency_contract_urns
  - functional_boundary_dependency_contract_urns
  - functional_dependency_contract_urns
  - functional_binding_by_contract_urn
  - functional_binding_by_canonical_file
  - functional_binding_by_rust_surface
  required_tests:
  - primitive_descriptors_have_complete_doctrine_fields
  - contract_by_id_rejects_unknown_and_empty_ids
  - all_contracts_are_inert_wip_definitions
negative_tests:
- Artifact claiming ContractDescriptors without required structures must be rejected
- Empty or ill-typed carrier for contract_descriptors must be rejected
- Artifact claiming authority or admissibility must be rejected
- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected
- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: "Mathematical description of primitive contract descriptor fields and their explicit bindings to canonical\
    \ YAML contract artifacts, plus the module-level contract registry for the core_functional crate. This metadata\
    \ is inert: it records the contract surface and does not execute functionals, terminalize results, certify authority,\
    \ or permit customer-facing claims.\n Nonclaim: this contract does not claim HoTT/Univalence discharge, PROVED\
    \ status, or GlobalGreen."
  non_role:
  - functional_execution
  - terminal_authority_minting
  - customer_claim
  - runtime_enforcement
  registry_invariants:
  - primitive descriptor_id values are unique
  - primitive canonical_contract_urn values are unique
  - primitive canonical_file values are unique
  - primitive binding order mirrors primitive descriptor order
  - primitive canonical_contract_urn and canonical_file lookups round-trip to registered bindings
  - primitive dependency descriptor IDs resolve to canonical contract URNs
  - primitive descriptors are topologically ordered by dependency
  - functional boundary dependency closure emits primitive and non-self functional contract URNs
  - functional boundary dependency closure preserves primitive then topological functional registry order
  - functional contract_urn values are unique
  - functional canonical_file values are unique
  - functional rust_binding symbols are unique within each contract
  - functional rust module plus symbol pairs are globally unique
  - functional rust module plus symbol lookups round-trip to registered contracts
  - functional rust modules name existing core_functional source files
  - every public core_functional module has a functional contract binding
  - functional contract descriptor dependencies include production core_functional module imports
  - functional binding dependency_contract_urns mirror canonical descriptor dependencies
  - functional contract descriptor dependencies resolve to primitive or functional registry entries
  - functional contract descriptor dependencies are non-self and duplicate-free
  - functional contract bindings are topologically ordered by functional descriptor dependency
  - functional rust_binding symbols resolve through their declared public module paths
