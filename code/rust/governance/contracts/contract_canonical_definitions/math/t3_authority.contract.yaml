schema_version: core.contract.v1
contract_id: urn:core:math:t3_authority:v1.0.0
title: T3Authority
kind: math_contract
status: mathematical_wip
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: t3_authority
  ascii_symbol: t3_authority
  symbol: t3_authority
  notation: t3_authority
  domain:
  - 'carrier: instance of t3_authority'
  codomain:
    description: Mathematical object declared by T3Authority (structural shell).
requirements:
  required_structures:
  - Carrier for t3_authority must be finite/explicit where claimed
  - Object kind and domain/codomain (or equivalent) must be declared
  - Operations, if any, must preserve declared structure
  - No authority effect may be self-assigned by the structure
laws:
- T3Authority is a pure mathematical structure (AuthorityEffect none)
- All declared required_structures must hold for a valid instance
- 'Replay is deterministic: no external state, no randomness, no wall-clock'
- This contract does not mint customer claims or GlobalGreen
rust_binding:
  crate: core_replay
  module: t3_authority
  symbols:
  - T3Authority
  # Rejected and inconclusive packets produce no DescentWitness. T3Authority
  # is a marker; AUTH-023 mints on admitted replay, so "claiming authority"
  # is not a reject path on this type. Non-determinism has no gate.
  # PROVED/GlobalGreen is doctrinal.
  required_tests:
  - auth_023_rejected_replay_creates_no_witness
  - auth_023_inconclusive_replay_creates_no_witness
negative_tests:
- Artifact claiming T3Authority without required structures must be rejected
- Empty or ill-typed carrier for t3_authority must be rejected
- Artifact claiming authority or admissibility must be rejected
- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected
- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: 'T3 level authority rules and mathematical verification. Nonclaim: this contract does not claim
    HoTT/Univalence discharge, PROVED status, or GlobalGreen.'
  non_role:
  - Authority minting or GlobalGreen discharge
  - Customer-facing claims or product guarantees
  - Full encyclopedia mechanization of t3_authority (deferred)
  - HoTT/Univalence theorem discharge from this contract alone
  - Runtime enforcement as proof of mathematical truth
