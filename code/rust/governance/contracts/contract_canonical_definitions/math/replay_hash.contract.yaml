  codomain:
    description: Mathematical object declared by ReplayHash (structural shell).
requirements:
  required_structures:
  - Carrier for replay_hash must be finite/explicit where claimed
  - Object kind and domain/codomain (or equivalent) must be declared
  - Operations, if any, must preserve declared structure
  - No authority effect may be self-assigned by the structure
laws:
- ReplayHash is a pure mathematical structure (AuthorityEffect none)
- All declared required_structures must hold for a valid instance
- 'Replay is deterministic: no external state, no randomness, no wall-clock'
- This contract does not mint customer claims or GlobalGreen
rust_binding:
  crate: core_replay
  module: replay_hash
  symbols:
  - ReplayHash
  # Empty scope/hash and ill-typed serde payloads are the implemented
  # mechanical negatives on ScopedReplayHash. The re-exported
  # linear_algebra::proof::ReplayHash still accepts any 32 bytes.
  # Authority/PROVED/GlobalGreen stay unnamed. Non-determinism has no API.
  required_tests:
  - scoped_replay_hash_requires_scope
  - scoped_replay_hash_rejects_empty_hash
  - deserialization_rejects_invalid_scoped_replay_hashes
negative_tests:
- Artifact claiming ReplayHash without required structures must be rejected
- Empty or ill-typed carrier for replay_hash must be rejected
- Artifact claiming authority or admissibility must be rejected
- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected
- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: 'Deterministic replay hashing functions. Nonclaim: this contract does not claim HoTT/Univalence
    discharge, PROVED status, or GlobalGreen.'
  non_role:
  - Authority minting or GlobalGreen discharge
  - Customer-facing claims or product guarantees
  - Full encyclopedia mechanization of replay_hash (deferred)
  - HoTT/Univalence theorem discharge from this contract alone
  - Runtime enforcement as proof of mathematical truth
