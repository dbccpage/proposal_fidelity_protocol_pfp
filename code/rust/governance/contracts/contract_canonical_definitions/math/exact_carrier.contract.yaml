math:
  object_kind: finite_exact_cochain_carrier
  symbol: 'C• : C⁰ --d₀→ C¹ --d₁→ C² with d₁∘d₀ = 0'
  ascii_symbol: exact_carrier
  notation: finite cochain complex over exact scalar arithmetic
  domain:
  - finite free modules C^k (often as BasicMatrix storage of ranks ≥ 0)
  - boundary/coboundary maps d_k of degree +1 (or chain convention -1, fixed per instance)
  - exact scalar domain (prefer rationals; no float authority)
  codomain:
    description: A finite cochain (or chain) complex carrier whose successive maps compose to zero exactly
      (d∘d = 0), enabling exact cycle/boundary bookkeeping. Not a general abstract category; not continuum
      analysis.
requirements:
  required_structures:
  - Finite ranks for each degree present
  - Declared differential maps with composable shapes
  - Exact identity d_{k+1} ∘ d_k = 0 verified at construction when claimed exact
  - Content-addressable matrix/hash identity when carrier manifests are used
  - No authority effect self-assignment
laws:
- 'Exactness of differential: d∘d = 0 holds exactly on the carrier (construction refuse on fail).'
- 'Finiteness: each C^k is finite-rank free (ranks in ℕ₀).'
- 'Degree discipline: differentials shift degree by exactly one (sign convention fixed per instance).'
- 'Cycles: ker(d_k) is the cycle module at degree k; boundaries im(d_{k-1}) ⊆ ker(d_k).'
- Homology is quotient bookkeeping H_k = ker/im — definitional, not a theorem discharge here.
- 'Authority law: no PROVED/GlobalGreen/HoTT from this contract alone.'
replay:
  requirements:
  - No external state
  - No randomness
  - No wall-clock dependence
  - Exact scalar arithmetic for d∘d checks
relationships:
- urn:core:math:chain_complex:v0.1.0 — related chain presentation
- urn:core:math:cochain_complex:v0.1.0 — dual cochain presentation
- urn:core:math:basic_matrix:v1.0.0 — finite rectangular storage of maps
- urn:core:math:boundary:v0.1.0 — boundary elements
- urn:core:math:cycle:v0.1.0 — cycle elements
