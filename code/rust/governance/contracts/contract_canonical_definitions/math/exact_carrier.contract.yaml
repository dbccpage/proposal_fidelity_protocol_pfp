  - matrix_content_hash
  # One test per mechanically-checkable negative_test, in declaration order.
  # There is no float constructor and ranks are usize (always finite); those
  # negatives stay unnamed rather than faked. PROVED/GlobalGreen unnamed.
  required_tests:
  - maps_with_non_composable_shapes_must_be_rejected
  - cochain_relation_enforced
negative_tests:
- Maps with non-composable shapes must be rejected
- Construction claiming exactness when d∘d ≠ 0 must fail
- Floating-point approximate zero used as exact d∘d witness must be rejected for this object
- Infinite-rank claims under this finite carrier contract must be rejected
- Artifact claiming PROVED/GlobalGreen/HoTT from this contract alone must be rejected
