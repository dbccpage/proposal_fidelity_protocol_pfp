schema_version: core.contract.v1
contract_id: urn:core:math:lift_certificate:v1.0.0
title: LiftCertificate
kind: math_contract
status: mathematical_wip
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: lift_certificate
  ascii_symbol: lift_certificate
  symbol: lift_certificate
  notation: lift_certificate
  domain:
  - 'carrier: instance of lift_certificate'
  codomain:
    description: Mathematical object declared by LiftCertificate (structural shell).
requirements:
  required_structures:
  - Carrier for lift_certificate must be finite/explicit where claimed
  - Object kind and domain/codomain (or equivalent) must be declared
  - Operations, if any, must preserve declared structure
  - No authority effect may be self-assigned by the structure
laws:
- LiftCertificate is a pure mathematical structure (AuthorityEffect none)
- All declared required_structures must hold for a valid instance
- 'Replay is deterministic: no external state, no randomness, no wall-clock'
- This contract does not mint customer claims or GlobalGreen
rust_binding:
  crate: core_lifts
  module: certificate
  symbols:
  - LiftCertificate
  # lift_gate now refuses length-mismatched carriers (ill-typed). Missing-structure
  # envelopes, authority-claim artifacts, and non-deterministic construction have
  # no reject path and stay unnamed. PROVED/GlobalGreen is doctrinal.
  required_tests:
  - lift_gate_rejects_ill_typed_carrier
  - lift_gate_rejects_q_length_mismatch
negative_tests:
- Artifact claiming LiftCertificate without required structures must be rejected
- Empty or ill-typed carrier for lift_certificate must be rejected
- Artifact claiming authority or admissibility must be rejected
- Artifact claiming PROVED/GlobalGreen from this contract alone must be rejected
- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: 'Verified lift certificate algebraic structure. Nonclaim: this contract does not claim HoTT/Univalence
    discharge, PROVED status, or GlobalGreen.'
  non_role:
  - Authority minting or GlobalGreen discharge
  - Customer-facing claims or product guarantees
  - Full encyclopedia mechanization of lift_certificate (deferred)
  - HoTT/Univalence theorem discharge from this contract alone
  - Runtime enforcement as proof of mathematical truth
nomos_debate_NOT_CANONICAL:
  banner: "NON-CANONICAL DEBATE ONLY — not contract law; AuthorityEffect none; never promote from this block alone"
  not_part_of_contract_law: true
  authority_effect: none
  potential_defects:
