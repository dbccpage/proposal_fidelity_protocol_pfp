schema_version: core.contract.v1
contract_id: urn:core:evidence:counterfeit_detection:v1.0.0
title: CounterfeitDetection
kind: evidence_contract
status: mathematical_wip
layer: 02_evidence
role: CounterfeitDetector
descriptor:
  authority_effect: fact_only
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts:
    - CheckedPacket
    - ClosureCertificate
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
  constitution:
    contract_dependencies:
    - CheckedPacket
    - ClosureCertificate
    emits: EvidenceEnvelope
    authority_layer: Evidence
    replay_certificates:
    - schema_hash
  constraints:
    checker_boundary_required: true
    mutation_forbidden: true
    typed_output_required: true
doctrine:
  summary: 'CounterfeitDetection implements the Exactness Fraud Criterion:
    exact packets claiming ExactRepair status must have zero obstruction mass and zero closure defect.'
  non_role:
  - self_certification
  authority_ladder:
    sequence:
    - Generated
    - Checked
    - Verified

rust_binding:
  crate: core_certifiers
  module: counterfeit_detection
  symbols:
  - ToleranceProfile
  - CounterfeitReason
  - CounterfeitVerdict

relationships:
  extends:
    - "urn:core:constitution:base_evidence_contract:v1.0.0"
