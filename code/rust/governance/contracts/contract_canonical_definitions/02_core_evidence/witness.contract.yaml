schema_version: core.contract.v1
contract_id: urn:core:evidence:witness:v1.0.0
title: Witness
kind: evidence_contract
status: mathematical_wip
layer: 02_evidence
role: Witness
descriptor:
  authority_effect: evidence_only
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: &id001
    - TraceArtifact
    - ReplayKernel
    - CertificateKernel
    - MeasurementKernel
    - GlobalContractTaxonomy
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
  constitution:
    contract_dependencies: *id001
    emits: EvidenceEnvelope
    authority_layer: Evidence
    replay_certificates:
    - schema_hash
  capabilities:
    forbidden:
    - CertificateSigning
    - PolicyInterpretation
    - Terminalization
    required: []
doctrine:
  summary: 'Witness supplies inspectable, canonicalized, replayable evidence. WitnessEnvelope and

    WitnessVerificationResult are EvidenceOnly until promoted by a declared verification,

    certificate, or replay boundary. Witness does not verify itself, certify, decide, authorize,

    terminalize, license, mutate, or execute.

    '
  non_role: &id002
  - certification
  - self_verification
  - evaluation
  - policy_interpretation
  - terminal_mapping
  - execution
  - transition_authorization
  - action_licensing
  - authority_upgrade
  - state_mutation
  authority_defaults:
    witness_envelope: EvidenceOnly
    witness_verification_result: EvidenceOnly
    verified_witness_fact: FactOnly only through declared verifier, CertificateKernel, ReplayVerifier,
      or validation boundary.
  structural_representation:
    raw:
      struct_name: WitnessEnvelope
      fields:
      - name: witness_id
        type: WitnessId
      - name: subject_ref
        type: BoundaryRef
      - name: claim_type
        type: ClaimType
      - name: source_artifacts
        type: Vec<ArtifactRef>
      - name: canonical_form
        type: CanonicalForm
      - name: canonical_hash
        type: Hash256
      - name: replay_refs
        type: Vec<ReplayRef>
      - name: certificate_refs
        type: Vec<CertificateId>
      - name: authority_effect
        type: AuthorityEffect
        default: EvidenceOnly
    verification_result:
      struct_name: WitnessVerificationResult
      fields:
      - name: witness_id
        type: WitnessId
      - name: verifier_id
        type: VerifierId
      - name: status
        type: WitnessVerificationStatus
      - name: result_hash
        type: Hash256
      - name: certificate_ref
        type: Option<CertificateId>
      - name: authority_effect
        type: AuthorityEffect
        default: EvidenceOnly
    enums:
    - name: WitnessVerificationStatus
      variants:
      - Verified
      - Failed
      - Indeterminate
      - Inapplicable
  flow: 'Raw / Trace / Measurement / Solver / Analysis

    -> WitnessEnvelope

    -> WitnessVerifier / ReplayVerifier / CertificateKernel

    -> verified evidence reference or FactEnvelope

    -> Evaluator / Policy

    -> TerminalMapper

    -> LicensingBoundary

    -> Engine

    -> Trace / Ledger

    '
  forbidden_implementation_tokens:
    scope: behavior, not substring
    tokens:
    - execute(
    - terminalize(
    - mutate_state
    - authorize_transition
    - license_transition
    - self_certify
    - compute_phi
    - rank_candidates
    - score_candidate
  required_tests:
  - witness_authority_effect_defaults_to_evidence_only
  - witness_does_not_verify_itself
  - witness_does_not_seal_certificate
  - witness_does_not_emit_action_license
  - witness_does_not_authorize_transition
  - witness_does_not_execute
  - witness_canonical_hash_stable
  - witness_requires_source_artifacts
  - witness_rejects_self_attestation
  - verified_witness_may_support_factonly_only_through_boundary
  canonical_invariant: 'Witness supplies evidence only. It cannot verify itself, certify, decide, license,
    authorize,

    mutate, or execute.

    '
  legacy_metadata:
    name: Witness
    source_file: non-math/02_evidence/witness_contract.md
    active: true
    machine_authority: true
    role: Typed attestation record binding a claim to computational evidence
    version: '2.0'
    classification: evidence
    effect_class: none
    depends_on: *id001
    forbidden_authority: *id002
    primary_output_family: EvidenceEnvelope
    domain_output_kind: WitnessEnvelope
    referenced_output_families:
    - FactEnvelope
    - EvidenceEnvelope
    - Record
