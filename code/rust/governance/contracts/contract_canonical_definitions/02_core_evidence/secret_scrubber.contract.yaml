schema_version: core.contract.v1
contract_id: urn:core:evidence:secret_scrubber:v1.0.0
title: SecretScrubber
kind: evidence_contract
status: active
layer: 02_evidence
role: Trace
descriptor:
  authority_effect: evidence_only
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
  constitution:
    contract_dependencies: []
    emits: EvidenceEnvelope
    authority_layer: Evidence
    replay_certificates:
    - schema_hash
  constraints:
    immutable_after_emit: true
    mutation_forbidden: true
doctrine:
  summary: Bounded credential redaction applied to trace payloads BEFORE sealing.
    Ordering is load-bearing - event_sha256 is taken over event content, so a
    payload scrubbed after sealing would leave a hash that no longer matches
    itself and the chain would fail replay. Redacts known vendor key prefixes,
    Bearer header values, and the value side of named secret environment
    variables. Reduces the blast radius of an accidental capture; it does NOT
    claim the output is free of secrets and is not a confidentiality boundary.
  non_role:
  - Confidentiality guarantee over arbitrary payloads.
  - Post-seal mutation of any trace event.
rust_binding:
  crate: core_replay
  module: secret_scrubber
  symbols:
  - SecretScrubber
  - ScrubReport
