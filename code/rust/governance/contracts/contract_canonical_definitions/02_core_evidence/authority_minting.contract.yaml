schema_version: core.contract.v1
contract_id: urn:core:evidence:authority_minting:v1.0.0
title: AuthorityMinting
kind: evidence_contract
status: deprecated
layer: 02_evidence
role: AuthInterface
descriptor:
  authority_effect: none
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  capabilities:
    forbidden:
    - CertificateSigning
    - Terminalization
  dependencies:
    contracts:
    - CheckedPacket
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
  constitution:
    contract_dependencies:
    - CheckedPacket
    emits: EvidenceEnvelope
    authority_layer: Evidence
    replay_certificates:
    - schema_hash
  constraints:
    checker_boundary_required: true
    mutation_forbidden: true
    typed_output_required: true
doctrine:
  summary: 'AuthorityMinting is a deprecated module name retained only as an evidence-preserving
    re-export of CertificateBoundary. It cannot construct CertifiedAuthority or an authorized
    local result. String-based minting remains strictly forbidden.'
  non_role:
  - free_minting
  - string_based_authorization
  - terminalization
  - promotion
  authority_ladder:
    sequence:
    - Generated
    - Checked
    - EvidenceCertificate
    law: 'Checked-packet certification retains authority_effect none; promotion is separate.'

rust_binding:
  crate: core_certifiers
  module: authority_minting
  symbols:
  - AuthorityVerdict
  - certify_checked_packet

relationships:
  extends:
    - "urn:core:constitution:base_evidence_contract:v1.0.0"
