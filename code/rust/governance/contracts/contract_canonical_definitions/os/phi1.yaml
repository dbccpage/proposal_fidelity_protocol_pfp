description: >
  Phi1([omega]) = min_alpha ||omega - d0 alpha||_{1,w}: the exact weighted-l1 distance from a C^1
  cochain omega to the coboundary space im(d0), certified by an LP primal-dual pair
  (ExactPhi1Certificate: achiever alpha + primal residual + im(d0)-annihilating dual witness, with
  reported value = weighted primal-residual norm = dual pairing). Phi1 is the quantitative
  refinement of the cochain Zero predicate: Phi1 = 0 iff omega is a coboundary. Exact over
  BigRational. Computed in the calculate layer (core_functional); it mints no authority.

lean_anchor:
