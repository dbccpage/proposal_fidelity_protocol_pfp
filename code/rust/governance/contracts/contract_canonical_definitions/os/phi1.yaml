lean_obligations:
  - id: "PHI1-L0"
    theorem: "Phi1 is well-defined as the minimum of the achievable weighted-l1 residual family: the value is unique."
    lean_name: "CoreCore.isPhi1_unique"
    status: "proved_in_lean"
    axioms: "[propext, Classical.choice, Quot.sound]"
  - id: "PHI1-L1"
    theorem: "Phi1 >= 0 (weights >= 0)."
    lean_name: "CoreCore.isPhi1_nonneg"
    status: "proved_in_lean"
    axioms: "[propext, Classical.choice, Quot.sound]"
  - id: "PHI1-L2"
    theorem: "Phi1 descends to the residual quotient C^1/im(d0): the value depends only on the class [omega] (the projection observable descends -- Paper 001), via class-invariance of the residual family."
    lean_name: "CoreCore.isPhi1_descends"
    status: "proved_in_lean"
    axioms: "[propext, Classical.choice, Quot.sound]"
  - id: "PHI1-L3"
    theorem: "Phi1 = 0 iff omega is a coboundary (weights > 0), i.e. iff (cochainDifference C).Zero omega -- ties Phi1 to CPD-L1."
    lean_name: "CoreCore.isPhi1_zero_iff_cochain_zero"
    status: "proved_in_lean"
    axioms: "[propext, Classical.choice, Quot.sound]"
  - id: "PHI1-L4"
    theorem: "A verified ExactPhi1Certificate's primal-dual data witnesses IsPhi1: the im(d0)-annihilating dual witness gives the weak-duality lower bound, so reported value = min."
    lean_name: "CoreCore.Phi1Certificate.isMinimum_of_certificate"
    lean_source: "lean4/original_lean_20260809/phi1_primal_dual_certificate.lean"
    lean_source_sha256: "f9a23f807e1d71b8e805868b6be2795db51a7d0d8bdb6fc69101cdbc99047223"
    status: "proved_in_lean_generic"
    prior_status: "rust_verified (lean_name rust_verified_not_yet_in_lean)"
    axioms: "[propext, Classical.choice, Quot.sound]"
    scope: >
      Certificate => minimum only, stated generically. For any Fintype index E and any map
      d : A -> (E -> Q): if dualPair phi (d b) = 0 for every b, |phi e| <= w e for every e, and
      dualPair phi (omega - d alpha) = wl1 w (omega - d alpha), then wl1 w (omega - d alpha) lies in
      {wl1 w (omega - d b) | b} and is a lower bound for it. The one inequality is dualPair_le_wl1
      (<phi, r> <= sum_e w_e |r_e| when |phi| <= w). Not attainment; not minimum => certificate.
    pending: >
      Instantiating E := Fin C.c1_dim, A := Fin C.c0_dim -> Q, d := C.d0 gives
      CoreCore.IsPhi1 C w omega (wl1 w (omega - C.d0 alpha)) by definitional unfolding. That
      corollary (isPhi1_of_certificate) is not committed; the source file records it as an
      obligation. It was checked only in the 2026-09-29 scratch replay of lean_anchor.file.
    replay: >
      2026-09-29: the committed bytes (sha above) compile standalone with Lean 4.34.0 +
      Mathlib v4.34.0 (lake env lean, exit 0). The file is not a root of any Lake package in
      this repository.
    note: "Verified Rust-side (unchanged): the verifier checks primal residual = omega - d0 alpha, dual annihilates im(d0), and value = weighted primal norm = dual pairing (LP strong duality)."

notes:
  - "Phi1 is the quantitative refinement of image membership: Phi1=0 recovers the cochain Zero predicate (CPD-L1)."
  - "Exactness in the Rust certificate path is BigRational (theorem-grade); the Lean anchor is generic over the cochain rationals (Fin n -> Q)."
  - "Do not claim authority, operads, or physics from Phi1 -- it is a diagnostic quotient-distance value."
