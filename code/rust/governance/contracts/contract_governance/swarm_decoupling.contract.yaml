schema_version: core.contract.v2
contract_id: "urn:core:governance:swarm_decoupling:v2.0.0"
title: "Generic Base Swarm Runtime Decoupling Policy"
kind: "policy_contract"
layer: "00_constitution"
role: "Policy"
status: active
council_owner: "L3_logos_nomos"

descriptor:
  authority_effect: None
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  clean_architecture_layer: domain
  dependencies:
    contracts: []
    lean4_theorems: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: ["REFUSAL_INVALID_ARGUMENTS", "REFUSAL_GATE_FAILED", "REFUSAL_INVARIANT_BREACH"]

doctrine:
  summary: >-
    Enforces that adversary.stage remains pure generic execution, while specific swarms reside in isolated packages.
  invariants:
    - "adversary.stage must never contain character lore or domain dialectics."
    - "Swarm execution emits its versioned sealed bundle inventory (currently five physical files for Adversary) to _ic/<agency>/<swarm>/runs/<task_key>/."
  non_roles:
    - "authority_source"
    - "promotion_granter"
    - "implicit_coercion"
  required_negative_capabilities:
    - no_self_certification
    - no_implicit_authority_upgrade
    - no_undeclared_state_transition

specification:
  algebraic_structure:
    carrier_type: "PolicyCarrier"
    operations:
      []
  ports:
    input_packet: "urn:core:packet:work_packet:v1.0.0"
    output_packet: "urn:core:packet:swarm_run_receipt:v1.0.0"
    error_type: "Refusal"
  verification:
    fitness_test: null
    lean4_file: null
