schema_version: core.contract.v1
contract_id: urn:core:evidence:closure_certificate:v1.0.0
title: ClosureCertificate
kind: evidence_contract
status: mathematical_wip
layer: 02_evidence
role: CertificateKernel
descriptor:
  authority_effect: fact_only
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts:
    - CertificateKernel
    - ReplayKernel
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
  constitution:
    contract_dependencies:
    - CertificateKernel
    - ReplayKernel
    emits: FactEnvelope
    authority_layer: Fact
    replay_certificates:
    - schema_hash
  constraints:
    checker_boundary_required: true
    mutation_forbidden: true
    typed_output_required: true
doctrine:
  summary: 'ClosureCertificate attests the closure status of a quotient class under Gamma2.
    It supports an exact constructor from verified rational Gamma2, and diagnostic approximate modes.'
  non_role:
  - self_certification
  authority_ladder:
    sequence:
    - Generated
    - Checked
    - Certified

rust_binding:
  crate: core_certifiers
  module: closure_certificate
  symbols:
  - ClosureStatus
  - ClosureCertificate
  - ClosureCertificateError

relationships:
  extends:
    - "urn:core:constitution:base_evidence_contract:v1.0.0"
