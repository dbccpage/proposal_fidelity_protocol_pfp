# AuthorityEffect: None
# =============================================================================
# COMPILE-TIME ENFORCED. The `structure:` block below is read by
# pfp_runtime/build.rs, which generates an exhaustive destructure
# of the named Rust type plus a serde conformance test. Adding, removing or
