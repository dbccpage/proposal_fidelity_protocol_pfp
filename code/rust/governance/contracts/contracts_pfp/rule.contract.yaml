schema_version: core.contract.v2
contract_id: "urn:core:packet:symbol_game:rule:v1.0.0"
title: "Oriented Rewrite Rule"
kind: "packet_contract"
layer: "40_packets"
role: "PacketSpecification"
status: active
council_owner: "L3_logos_techne"

descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: domain
  refusals:
    may_emit: ["FW-UNKNOWN-FIELD", "FW-DUPLICATE-KEY"]

doctrine:
  summary: >-
    One oriented rewrite rule of a finite presentation.
  invariants:
    - "name is unique within a presentation; a duplicate makes path replay ambiguous."
    - "lhs is non-empty; an empty left-hand side matches everywhere and terminates nowhere."
  non_roles:
    - "authority_source"
    - "promotion_granter"
  required_negative_capabilities:
    - no_self_certification
    - no_implicit_authority_upgrade

structure:
  rust_crate: pfp_runtime
  rust_module: rewriting
  rust_type: "Rule"
  form: struct
  serde:
    deny_unknown_fields: true
  fields:
    - name: name
      rust_type: "String"
    - name: lhs
      rust_type: "String"
    - name: rhs
      rust_type: "String"
