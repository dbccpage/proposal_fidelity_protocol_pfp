schema_version: core.contract.v2
contract_id: "urn:core:packet:symbol_game:py_decoding_receipt:v1.0.0"
title: "Decoding Receipt (Python)"
kind: "packet_contract"
layer: "40_packets"
role: "PacketSpecification"
status: active
council_owner: "L3_logos_techne"

descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: domain
  refusals:
    may_emit: ["FW-UNKNOWN-FIELD", "FW-DUPLICATE-KEY"]

doctrine:
  summary: >-
    What constrained a run, and what the emission actually contained.
  invariants:
    - "Only GRAMMAR is exact; a bounded logit bias is a strong bias and must not be reported as a mask."
    - "An unknown provider resolves DOWN to UNCONSTRAINED, never upward."
    - "mode is what the run APPLIED; capability is what the provider could impose. Deriving mode from the provider name let the receipt claim exactness for a grammar that was never sent."
  non_roles:
    - "authority_source"
    - "promotion_granter"
  required_negative_capabilities:
    - no_self_certification
    - no_implicit_authority_upgrade

structure:
  language: python
  python_module: pfp.domain.carrier_decoding
  python_type: "DecodingReceipt"
  form: dataclass
  fields:
    - name: provider
    - name: mode
    - name: capability
    - name: violations
