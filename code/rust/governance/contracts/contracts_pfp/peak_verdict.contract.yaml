schema_version: core.contract.v2
contract_id: "urn:core:packet:symbol_game:peak_verdict:v1.0.0"
title: "Critical Peak Verdict"
kind: "packet_contract"
layer: "40_packets"
role: "PacketSpecification"
status: active
council_owner: "L3_logos_techne"

descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: domain
  refusals:
    may_emit: ["FW-UNKNOWN-FIELD", "FW-DUPLICATE-KEY"]

doctrine:
  summary: >-
    What a peak claim actually supports, as decided by the host.
  invariants:
    - "NotJoinable is emitted only when both reachable sets CLOSED, carried as
       ExhaustionBasis::ClosedReachableSets. The earlier wording named a
       termination witness, and that was the wrong price: termination is what
       Newman's lemma needs to lift local confluence to confluence of a system,
       a claim this module never makes. Joinability of one pair needs closure."
    - "BoundedWithUnjoinedPeak asserts nothing about confluence."
    - "Every variant is relative to the presentation it was decided under, and
       this packet does not carry one. A verdict read off the wire alone is not
       a host guarantee -- see PeakEvaluation, which carries the provenance."
  non_roles:
    - "authority_source"
    - "promotion_granter"
  required_negative_capabilities:
    - no_self_certification
    - no_implicit_authority_upgrade

structure:
  rust_crate: pfp_runtime
  rust_module: rewriting
  rust_type: "PeakVerdict"
  form: enum
  variants:
    - NeedsEvidence
    - Joined
    - BoundedWithUnjoinedPeak
    - NotJoinable
