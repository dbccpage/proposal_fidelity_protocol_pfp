schema_version: core.contract.v2
contract_id: "urn:core:packet:symbol_game:critical_pair:v1.0.0"
title: "Host-Derived Critical Pair"
kind: "packet_contract"
layer: "40_packets"
role: "PacketSpecification"
status: active
council_owner: "L3_logos_techne"

descriptor:
  authority_effect: None
  evidence_ceiling: LocalReplay
  runtime_enforcement: true
  clean_architecture_layer: domain
  refusals:
    may_emit: ["FW-UNKNOWN-FIELD", "FW-DUPLICATE-KEY"]

doctrine:
  summary: >-
    A critical pair produced by the host from two overlapping rule applications.
  invariants:
    - "Both endpoints are host-derived; this packet carries no producer testimony."
    - "Disjoint redexes are not critical pairs and are never emitted here."
  non_roles:
    - "authority_source"
    - "promotion_granter"
  required_negative_capabilities:
    - no_self_certification
    - no_implicit_authority_upgrade

structure:
  rust_crate: pfp_runtime
  rust_module: rewriting
  rust_type: "CriticalPair"
  form: struct
  serde:
    deny_unknown_fields: true
  fields:
    - name: source
      rust_type: "String"
    - name: left
      rust_type: "ReductionStep"
    - name: right
      rust_type: "ReductionStep"
    - name: left_endpoint
      rust_type: "String"
    - name: right_endpoint
      rust_type: "String"
