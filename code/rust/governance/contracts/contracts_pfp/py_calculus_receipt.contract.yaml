doctrine:
  summary: >-
    A whole run: the carrier it ran over, and every row's fate.
  invariants:
    - "declared_row_count is supplied by the caller, never defaulted to len(rows): a receipt that agrees with itself cannot detect a dropped row."
    - "Any unaccounted row refuses, whatever the surviving rows say."
  non_roles:
    - "authority_source"
    - "promotion_granter"
  required_negative_capabilities:
    - no_self_certification
    - no_implicit_authority_upgrade

structure:
  language: python
  python_module: pfp.domain.calculus_receipt
  python_type: "CalculusReceipt"
  form: dataclass
  fields:
    - name: carrier_digest
    - name: rows
    - name: declared_row_count
    - name: carrier_authored_by
