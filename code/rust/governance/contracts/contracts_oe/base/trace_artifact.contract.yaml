schema_version: core.contract.v1
contract_id: urn:core:evidence:trace_artifact:v1.0.0
title: TraceArtifact
kind: evidence_contract
status: mathematical_wip
layer: 02_evidence
role: Trace
descriptor:
  authority_effect: evidence_only
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: &id001
    - ReplayKernel
    - GlobalContractTaxonomy
    - ContractConstitution
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
  constitution:
    contract_dependencies: *id001
    emits: EvidenceEnvelope
    authority_layer: Evidence
    replay_certificates:
    - schema_hash
  constraints:
    immutable_after_emit: true
    mutation_forbidden: true
doctrine:
  summary: 'Trace records immutable causal event evidence. Trace artifacts and bundles are EvidenceOnly

    until checked. Checked traces may support FactOnly historical claims, but Trace does not

    execute, decide, certify, terminalize, license, authorize, mutate, repair, enrich post-hoc,

    or hide control flow.

    '
  non_role: &id002
  - execution_trigger
  - policy_rule
  - hidden_cache
  - post_hoc_enrichment
  - authority_upgrade
  - terminal_mapping
  - certificate_creation
  - transition_authorization
  - action_licensing
  - trace_driven_state_mutation
  - implicit_runtime_control
  authority_defaults:
    trace_artifact: EvidenceOnly
    trace_bundle: EvidenceOnly
    checked_trace_history_claim: FactOnly only after schema validation, hash verification, causal-chain
      validation, provenance verification, and replay/dependency checks where required.
  structural_representation:
    raw:
      struct_name: TraceArtifact
      fields:
      - name: trace_id
        type: TraceId
      - name: emitter_ref
        type: EmitterRef
      - name: event_kind
        type: TraceEventKind
      - name: input_boundary_refs
        type: Vec<BoundaryRef>
      - name: output_boundary_refs
        type: Vec<BoundaryRef>
      - name: parent_trace_refs
        type: Vec<TraceId>
      - name: artifact_hash
        type: Hash256
      - name: authority_effect
        type: AuthorityEffect
        default: EvidenceOnly
    checked:
      struct_name: CheckedTraceRecord
      fields:
      - name: trace_ref
        type: TraceId
      - name: schema_ref
        type: SchemaRef
      - name: checked_causal_chain_hash
        type: Hash256
      - name: replay_ref
        type: Option<ReplayRef>
      - name: authority_effect
        type: AuthorityEffect
        default: FactOnly
    records:
    - name: TruncatedLineageRecord
      authority_effect: EvidenceOnly
    - name: RetentionRecord
      authority_effect: EvidenceOnly
  flow: 'Licensed action / observed event

    -> TraceArtifact

    -> TraceBundle

    -> ReplayKernel / TraceValidator

    -> CheckedTraceRecord or EvidenceEnvelope

    -> Analysis / Audit

    '
  forbidden_implementation_tokens:
    scope: behavior, not substring
    tokens:
    - execute(
    - terminalize(
    - mutate_state
    - authorize_transition
    - license_transition
    - self_certify
    - compute_phi
    - rank_candidates
    - score_candidate
  required_tests:
  - trace_authority_effect_defaults_to_evidence_only
  - checked_trace_may_support_factonly_history_claim
  - trace_cannot_emit_decision_envelope
  - trace_cannot_emit_action_license
  - trace_cannot_authorize_transition
  - trace_cannot_execute
  - trace_does_not_create_certificates
  - trace_consumer_contract_required_for_runtime_interpretation
  - recomputed_replay_state_not_stored_in_trace_artifact
  canonical_invariant: 'Trace records immutable causal facts and controls nothing. Replay and checking
    can support

    history facts; Trace itself cannot decide, license, authorize, execute, mutate, or certify.

    '
  legacy_metadata:
    name: TraceArtifact
    source_file: non-math/02_evidence/trace_contract.md
    active: true
    machine_authority: true
    role: Immutable audit record and causal execution evidence
    version: '2.0'
    classification: evidence
    effect_class: none
    depends_on: *id001
    forbidden_authority: *id002
    primary_output_family: Record
    domain_output_kind: TraceArtifact
    referenced_output_families:
    - EvidenceEnvelope
    - FactEnvelope
    - Record

rust_binding:
  crate: core_types
  module: trace_artifact
  symbols:
  - TraceArtifact

relationships:
  extends:
    - "urn:core:constitution:base_evidence_contract:v1.0.0"
