    - "Law 2 (Terminal Absorption): No steps admitted after T."
    - "Law 3 (Refusal Absorption): After M, only C, Lambda, or T may follow."
    - "Law 4 (Lift Trigger): Structural lift Lambda requires license and trigger (ClosedResidual or DetectorInadequate)."
    - "Law 5 (Integration Requires Receipt): Step integration I requires verified step receipt."
    - "Law 6 (Descent Requires Loss Ledger): Scale descent D requires explicit LossLedger recording dropped dimensions and lost mass."
    - "Law 7 (Exact Repair Discharges): Exact repair E requires before-class ExactRepair and discharges to zero without crossing classes."
    - "Law 8 (Context Exposure Is Not Repair): Context exposure C changes carrier and never lowers Phi_1 or Gamma_2."
    - "Four-Axis Separation: DiagnosticClass != RoutingTerminal != ExtensionStatus != AuthorityStatus."
