laws:
- Signed simplex boundary sums obey boundary nilpotency.
- Symmetric central forces conserve total linear and angular momentum.
- Cayley evolution preserves rotation holonomies.
- Degenerate and unused vertices are refused.
- Each tetrahedral Gauss node sums its actual nonzero outward face fluxes; vertex relabeling preserves closure.
