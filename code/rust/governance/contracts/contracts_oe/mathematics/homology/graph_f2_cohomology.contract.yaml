  domain:
  - Finite irreflexive graphs, with explicit mask limits for the legacy carrier and bounded bitpacked dimensions
    for general graphs.
  codomain:
    description: Declared finite results of core_homology::graph_f2; exact and diagnostic routes retain their
      stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- A coboundary is the endpoint parity difference.
- Primitive preimages reproduce removable edge patterns.
- Cycle-space elements annihilate every coboundary; odd pairing with a supplied cycle certifies nonremovability.
- A forty-edge cycle has an independently replayable obstruction beyond the mask-width carrier.
- Bounded minimum Hamming quotient enumerates actual admitted repairs.
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
