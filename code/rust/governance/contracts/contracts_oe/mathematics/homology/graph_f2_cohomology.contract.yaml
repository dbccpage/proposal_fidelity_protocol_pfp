    Cycle-space elements annihilate every coboundary; odd pairing with a supplied cycle certifies nonremovability.;
    A forty-edge cycle has an independently replayable obstruction beyond the mask-width carrier.; Bounded
    minimum Hamming quotient enumerates actual admitted repairs..
