  crate: core_homology
  module: graph_f2
  symbols:
  - PatternCarrier
  - GraphCohomologyF2
  - pattern_pairing
  required_tests:
  - graphs_beyond_mask_width_have_replayable_cycle_obstructions
negative_tests:
- Self loops, invalid endpoints, out-of-carrier bits, empty assignment families and exhausted finite searches
  are refused.
doctrine:
