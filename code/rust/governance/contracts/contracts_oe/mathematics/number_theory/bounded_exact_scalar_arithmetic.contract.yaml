layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
relationships: []
math:
  object_kind: bounded_exact_scalar_arithmetic
  symbol: bounded_exact_scalar_arithmetic
  ascii_symbol: bounded_exact_scalar_arithmetic
  notation: Bounded Exact Scalar Arithmetic
  domain:
  - Canonical exact field or semiring values with explicit signed-power, polynomial-coefficient and iterator-term
    budgets.
  codomain:
    description: Declared finite results of core_number_theory::scalar; exact and diagnostic routes retain
      their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Signed powers use unsigned_abs so i64 minimum cannot overflow.
- Zero inverse, a broken nonzero field inverse and budget exhaustion have distinct typed errors.
- Integer polynomial evaluation delegates canonical polynomial arithmetic after bounded rational embedding.
- A bounded sum refuses an infinite iterator after its declared term allowance.
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: core_number_theory
  module: scalar
  symbols:
  - ScalarError
  - power
  - power_unsigned
  - inverse
  - divide
  - evaluate_integer_polynomial
  - sum_with_budget
  required_tests:
  - scalar_power_inverse_and_budget_refusals_are_distinct
  - embedded_polynomials_and_infinite_sums_use_canonical_bounded_math
negative_tests:
- Exponents above 2^20, coefficient counts above 1024, zero inverse and exhausted term budgets are typed refusals.
doctrine:
  summary: Signed powers use unsigned_abs so i64 minimum cannot overflow.; Zero inverse, a broken nonzero field
    inverse and budget exhaustion have distinct typed errors.; Integer polynomial evaluation delegates canonical
    polynomial arithmetic after bounded rational embedding.; A bounded sum refuses an infinite iterator after
    its declared term allowance..
  non_role:
  - No fusion-specific roots, positivity or quantum-dimension projection facade.
  - No operational authority.
  - PROVED, GlobalGreen, operational authority or human mathematics acceptance
wip:
- Executable finite laws remain local implementation evidence pending human mathematics review
- No mechanized theorem discharge or lifecycle acceptance is asserted
