  ascii_symbol: ordered_cyclotomic_signs_and_relations
  notation: Exact ordered cyclotomic signs and minimal relations
  domain:
  - Canonical cyclotomic fields at the standard real place; exact minimal polynomial field-degree budget128;
    explicit CM coordinate presentations at conductors4,5,8,12,24
  codomain:
    description: Declared finite results of core_number_theory::cyclotomic_ordered; exact and diagnostic routes
      retain their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Nonreal scalars refuse an ordered sign
- Exact Sturm isolation/refinement chooses the standard real embedding and decides nonzero real signs
- The first rational dependence gives a monic minimal polynomial
- The mixed sqrt2+sqrt3 relation x^4-10x^2+1 annihilates its actual CM element
- Signs distinguish arbitrarily small rational values without floating point
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: core_number_theory
  module: cyclotomic_ordered
  symbols:
  - standard_real_sign
  - element_minimal_polynomial
  - CyclotomicRealRoot
  - FieldElementFPlus
  - FieldElementF
  required_tests:
  - cyclotomic_ordered::ordered_sign_tests::exact_real_signs_and_first_relations_replay_mixed_quadratic_controls
  - cyclotomic_ordered::tests::test_sturm_root_isolation_all_conductors
negative_tests:
- cyclotomic_ordered::ordered_sign_tests::exact_real_signs_and_first_relations_replay_mixed_quadratic_controls
doctrine:
  summary: Nonreal scalars refuse an ordered sign; Exact Sturm isolation/refinement chooses the standard real
    embedding and decides nonzero real signs; The first rational dependence gives a monic minimal polynomial;
    The mixed sqrt2+sqrt3 relation x^4-10x^2+1 annihilates its actual CM element; Signs distinguish arbitrarily
    small rational values without floating point.
  non_role:
  - A real place is declared; signs at other embeddings need explicit Galois transport rather than a conductor-only
    verdict
  - PROVED, GlobalGreen, operational authority or human mathematics acceptance
wip:
- Executable finite laws remain local implementation evidence pending human mathematics review
- No mechanized theorem discharge or lifecycle acceptance is asserted
