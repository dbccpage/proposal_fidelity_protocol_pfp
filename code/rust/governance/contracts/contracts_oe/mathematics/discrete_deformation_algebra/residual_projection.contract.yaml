- Non-deterministic or external-state-dependent construction must be rejected
doctrine:
  summary: 'Selects a canonical minimal-norm representative of a Q¹ class. Nonclaim fence: does not claim PROVED; does not
    claim GlobalGreen; does not claim HoTT/Univalence discharge from this contract alone.'
  symbol: R
  ascii_symbol: ResidualProjection
  formula: R(x) = x - d₀α*
  operator_class_symbol: R
  1. Contract metadata:
    title: Residual projection
    version: 0.1.0
    object_type: canonical_representative_operator
  2. Mathematical object / functional role:
    role: Selects a canonical minimal-norm representative of a Q¹ class.
    purpose: Turns a relation-valued optimization into a replayable operator only when a deterministic tie policy is declared.
    non_role:
    - Does not change the Q¹ class.
    - Does not repair by itself.
    - Does not classify policy admissibility.
    - Does not issue certificates.
    - Does not terminalize.
    - Does not produce customer-facing claims.
  3. Domain and codomain:
    domain: x ∈ C¹ with B¹ and Φ₁ optimization problem
    codomain: canonical residual representative in the same Q¹ class
    representative_selector: R is a section-like representative selector for Q¹ classes when TieR is deterministic.
  4. Required structures:
    required:
    - valid cochain layer
    - B¹ exact repair space
    - Φ₁ optimization problem
    - weighted norm profile
    - deterministic TieR
    - quotient class preservation witness
    optional:
    - α* witness
    - primal optimization transcript
    - dual witness
    - saturation witness
  5. Definition:
    formula: R(x)=x-d₀α* where α* solves min_α ||x-d₀α||_{1,w}.
    sign_convention: Minus convention for minimization; compatible with E plus convention via α↦-α.
    relation_without_tie: Without TieR, R is relation-valued over all optimal residuals.
    deterministic_operator: With TieR, R is a function.
    canonical_residual: R(x) is the selected Φ₁-minimizing representative of [x].
  6. Laws and invariants:
    class_preservation: '[R(x)] = [x] in Q¹.'
    minimality: '||R(x)||_{1,w}=Φ₁([x]).'
    gamma2_preservation: 'Γ₂(R(x)) = Γ₂(x) since d₁d₀ = 0; coboundary moves leave d₁x strictly invariant (DDC-R-02).'
    diagnostic_class_preservation: 'R preserves the three-way diagnostic class: ExactRepair, ClosedResidual, or ActiveClosureFailure.'
    carrier_unchanged: 'R leaves the carrier strictly unchanged.'
    adequate_detector_required: 'R requires an adequate detector witness.'
    cycle_coordinate_registration: 'R retains b₁ = |E| - |V| + c coordinates outside the spanning forest, one per independent cycle (DDC-R-06).'
    exact_dual_certification: 'Phi_1 is certified by a spanning-forest potential phi and a dual circulation flow y (d₀^T y = 0, |y_e| <= w_e) closing the duality gap exactly: <y, x> = Phi_1([x]).'
    idempotence: R(R(x))=R(x) when TieR is deterministic.
    exact_absorption: R ∘ E_β = R for every exact repair action E_β under the same layer and deterministic TieR.
    non_commutation_warning: E_β ∘ R need not equal R unless E_β is trivial on representatives.
    relation_warning: Without TieR, laws hold for the optimal residual set, not for a single deterministic output.
  7. Equality / equivalence rules:
    representative_equality: R outputs compare as C¹ vectors under fixed basis.
    relation_equality: Without TieR, equality is equality of optimal residual sets.
    tie_policy_equality: Different TieR policies may select different canonical representatives with the same Φ₁ value.
    quotient_equality: All R outputs remain in the original Q¹ class.
  8. Replay / determinism requirements:
    requirements:
    - TieR hash.
    - Optimization replay or exact solve artifact.
    - α* witness if exported.
    - Dual circulation witness y closing duality gap.
    - Quotient class witness.
    - Layer hash.
    - B¹ hash.
    - Weight profile hash.
    - Tolerance profile if approximate.
    - Dual feasibility/saturation replay if dual witness is claimed.
  9. Relationship to other Core primitives:
    relationships:
      operator_class: R belongs to operator class R.
      not_M: R is not M when it preserves quotient class, minimality, and Γ₂.
      E: 'R absorbs prior exact repair: R∘E=R.'
      Q1: R selects a representative of a Q¹ class; it is not itself a quotient class.
      Phi1: R realizes the Φ₁ minimal norm.
      Gamma2: R strictly preserves Γ₂.
      Xi: Ξ depends on deterministic h₁*=R(x) when used.
      TieR: TieR is required to make R replayable as an operator.
  10. Rust descriptor shape:
    sketch: "pub struct ResidualProjectionDescriptor {\n    pub layer_hash: String,\n    pub b1_hash: String,\n    pub phi1_problem_hash: String,\n    pub weight_profile_hash: String,\n    pub tie_policy_hash: String,\n    pub alpha_witness_hash: Option<String>,\n    pub optimization_artifact_hash: Option<String>,\n    pub dual_witness_hash: Option<String>,\n    pub tolerance_profile_hash: Option<String>,\n}\n"
  11. Negative definition tests:
    tests:
    - R claimed without tie policy.
    - R changes quotient class.
    - R changes Γ₂ or diagnostic class (ResidualProjectionChangedClosure).
    - R changes carrier (FixedCarrierOpChangedCarrier).
    - R output not minimal.
    - R used as deterministic when multiple optima exist.
    - R claimed without Φ₁ optimization problem.
    - Different TieR policies silently mixed.
    - E∘R incorrectly assumed equal to R.
    - Approximate optimization treated as exact without tolerance profile.
    - R mislabeled as M despite quotient preservation and minimality.
    - R admitted despite missing minimality witness or missing dual certificate.
  12. Open questions / WIP status:
    wip:
    - Canonical TieR registry.
    - Exact LP certificate interface.
    - TieR equivalence and versioning.
    - Approximate optimization admissibility boundaries.
