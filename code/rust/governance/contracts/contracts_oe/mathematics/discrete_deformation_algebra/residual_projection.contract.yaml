    RESIDUAL_PROJECTION_CONTRACT:
      symbol: R
      ascii_symbol: ResidualProjection
      operator_class_symbol: R
      formula: R(x)=x-d₀α*
      status: mathematical_definition_wip
      authority_effect: none
      customer_claim_allowed: false
      domain: x∈C¹ with B¹/Φ₁ problem
      codomain: canonical representative in [x]
      required_structures:
      - valid layer
      - Φ₁ problem
      - B¹
      - weighted norm
      - TieR
      - quotient preservation
      definition: minimal-norm representative selected by deterministic tie policy
      laws:
      - class preserving
      - minimal (realizes Φ₁)
      - preserves Γ₂ and three-way diagnostic class (DDC-R-02)
      - carrier unchanged
      - requires adequate detector
      - idempotent with TieR
      - R∘E=R
      - E∘R not generally R
      forbidden_interpretations:
      - deterministic without TieR
      - mutation
      - changing Γ₂ or diagnostic class
      - policy decision
      - quotient class itself
      - repair by itself
      relationships:
      - operator class R
      - not M when class-preserving, minimal, and Γ₂-preserving
      - realizes Φ₁
      - preserves Γ₂
      - feeds Ξ as h₁*
      negative_tests:
      - missing TieR
      - class changed
      - Γ₂ changed (ResidualProjectionChangedClosure)
      - carrier changed (FixedCarrierOpChangedCarrier)
      - not minimal
      - multiple optima unhandled
      - TieR policies mixed
      - approximate treated as exact
      open_questions:
      - TieR registry
      - exact LP certificate interface
      - TieR versioning
