negative_tests:
- interval::reciprocal_laws::signed_reciprocal_division_and_zero_crossing_refusals
doctrine:
  summary: Reciprocal endpoints reverse monotonically for either sign; Division encloses all endpoint products
    with exact rationals; Zero crossing and forged reversed endpoints refuse.
  non_role:
