schema_version: core.contract.v1
contract_id: urn:core:math:modular_tensor_category:v0.1.0
title: Modular Tensor Category Contract
kind: math_contract
status: exact_rational_classifier_implemented
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: braided_fusion_category
  symbol: 'MTC: a ribbon fusion category with invertible S~'
  ascii_symbol: modular_tensor_category
  notation: 'S~_{ab} = sum_c N_{a b*}^c d_c theta_c / (theta_a theta_b), T = diag(theta)'
  domain:
  - 'braiding: R-symbols R^{ab}_c satisfying both hexagon equations'
  - 's_matrix: the unnormalised S~ = D S'
  - 't_matrix: T_{aa} = theta_a'
  - 'fusion_rules: N_{ab}^c, reproduced by the Verlinde formula'
  codomain:
    description: 'A ribbon fusion category whose S~ is invertible, together with its exact in-field modular data.'
requirements:
  required_structures:
  - S~ must be invertible (full rank)
  - Fusion coefficients must satisfy the Verlinde formula
  - S~ S~^dagger = D^2 I, S~^2 = D^2 C and (S~ T)^3 = p_+ S~^2
laws:
- S~ is symmetric and invertible
- 'N_{ab}^c = (1/D^2) sum_x S~_{ax} S~_{bx} conj(S~_{cx}) / S~_{0x}'
- 'S~^2 = D^2 C and S~ conj(S~)^T = D^2 I'
- '(S~ T)^3 = p_+ S~^2 with p_+ = sum_a d_a^2 theta_a (this replaces the former statement (ST)^3 = S^2, which holds only for the c-normalised T e^{-2 pi i c/24} and the normalised S = S~ / D)'
- 'Gauss-Milgram: p_+ / D = exp(2 pi i c / 8), read exactly as p_+^2 / D^2 = a root of unity of the field'
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Exact field arithmetic only; no floating point and no tolerance
relationships:
- urn:core:math:braided_fusion_category:v0.1.0 serves as Underlying braided (ribbon) fusion category with R-symbols and hexagon equations
- urn:core:math:fusion_category:v0.1.0 serves as F-symbols and the pentagon equation
- urn:core:math:modular_data:v0.1.0 serves as The exact modular relations, Gauss-Milgram and ground-state counts
- urn:core:math:monoidal_category:v0.1.0 serves as The monoidal structure whose associator is the F-symbol array
- urn:core:math:associator_witness:v0.1.0 serves as The associator as an invertible F-matrix
- urn:core:math:unitor_witness:v0.1.0 serves as The unit constraints: F-symbols with a unit leg are 1 in the normalised gauge
negative_tests:
- Not a braided fusion category
- S-matrix incorrectly computed
- S-matrix is degenerate (not invertible)
- Verlinde formula is violated
- (S~ T)^3 != p_+ S~^2
rust_binding:
  crate: core_fusion_categories
  module: modular
  symbols:
  - ModularData
  - ModularDefect
  required_tests:
  - a_symmetric_braiding_gives_a_degenerate_s_matrix_and_is_refused
  - the_verlinde_formula_fails_on_a_perturbed_s_matrix
  - fibonacci_modular_data_and_central_charge_are_exact
  - ising_modular_data_central_charge_and_ground_states_are_exact
  - the_toric_code_is_modular_with_the_pinned_s_matrix_and_four_to_the_g_ground_states
doctrine:
  summary: A modular tensor category (MTC) is a non-degenerate ribbon fusion category. Its modular data (S~, T) satisfy the exact relations above in the coefficient field; the normalised SL_2(Z) relations follow after dividing by D and the c-dependent phase, which are not in general field elements.
  non_role:
  - Does not implement general ribbon categories without modularity
  - Does not handle infinite-rank categories
  - Does not provide physical lattice models
wip:
- Classification of MTCs by rank
- Super-modular categories
- Witt group of MTCs
- The normalised SL_2(Z) representation is not built; only the in-field relations are checked
- Lean counterparts are not written
