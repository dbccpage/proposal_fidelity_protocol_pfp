laws:
- The q-Racah formula constructs actual F and R data for every declared level.
- Every returned level replays pentagon, both hexagons, quantum dimensions and ribbon balance.
- The unnormalised modular data satisfy Verlinde and Gauss-Milgram with central charge 3k/(k+2) modulo four.
- The admitted nonorthonormal field gauge has exact positive metrics obeying F dagger G_left F = G_right.
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: core_fusion_categories
  module: su2_level
  symbols:
  - su2_level
  - associator_metrics
  - MAX_LEVEL
  required_tests:
  - racah_formula_replays_pentagon_hexagons_and_verlinde_through_maximum_level
  - level_three_has_actual_fibonacci_subcategory_and_nonorthonormal_gauge
  - unsupported_field_and_unbounded_level_are_typed_refusals
negative_tests:
- Level zero, level seven and a field lacking the required roots are typed refusals.
- Tampering with an associator causes exact law replay to fail.
doctrine:
  summary: The q-Racah formula constructs actual F and R data for every declared level.; Every returned level
