    satisfy Verlinde and Gauss-Milgram with central charge 3k/(k+2) modulo four.; The admitted nonorthonormal
    field gauge has exact positive metrics obeying F dagger G_left F = G_right..
  non_role:
  - The gauge is not claimed orthonormal in its ordinary coordinates.
  - No unsupported square-root extension or generic level beyond the declared exact work bounds.
  - No operational authority.
  - PROVED, GlobalGreen, operational authority or human mathematics acceptance
wip:
- Executable finite laws remain local implementation evidence pending human mathematics review
- No mechanized theorem discharge or lifecycle acceptance is asserted
