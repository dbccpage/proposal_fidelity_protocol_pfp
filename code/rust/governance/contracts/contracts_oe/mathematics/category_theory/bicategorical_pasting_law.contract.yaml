math:
  object_kind: bicategorical_pasting_law
  symbol: 'D: top_path => bottom_path (pasting of 2-cells)'
  ascii_symbol: bicategorical_pasting_law
  notation: 'D: top_path => bottom_path (pasting of 2-cells)'
  domain:
  - 'zero_cells: sequence of objects A_0, ..., A_n'
  - 'top_path: sequence of 1-cells forming top boundary'
  - 'bottom_path: sequence of 1-cells forming bottom boundary'
  - 'two_cells: filling 2-cells for each region'
  - 'composite: resulting composite 2-cell from top to bottom'
  - 'evaluation_witness: proof that two evaluation orders agree'
  codomain:
    description: 'A pasting diagram witness consisting of 0-cells, boundary 1-cells (top and bottom paths), interior 2-cells, and the resulting composite 2-cell, together with a proof that different evaluation orders yield the same composite.

      '
requirements:
  required_structures:
  - Top and bottom paths are well-formed sequences of composable 1-cells
  - Each region has a valid 2-cell from the top 1-cell to the bottom 1-cell
  - Two different evaluation orders produce the same composite 2-cell
  - Interchange law holds for all involved compositions
  - Artifact hash is deterministically computed
laws:
- Top and bottom paths share the same source and target 0-cells
- Each region between consecutive 0-cells has a valid 2-cell
- Any two valid evaluation orders yield the same composite 2-cell
- Horizontal and vertical compositions satisfy the interchange law
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Compositions from canonical bicategory structure
  - Rechecking must reproduce evaluation_witness_hash
relationships:
- urn:math:contract:Bicategory:v0.1.0 serves as Ambient bicategory providing 0-cells, 1-cells, 2-cells, and compositions
- urn:math:contract:AssociatorWitness:v0.1.0 serves as Coherence isomorphisms for re-bracketing compositions
- urn:math:contract:NaturalTransformation:v1.0.0 serves as 2-cells as natural transformations in enriched settings
negative_tests:
- Top and bottom paths with different endpoints must be rejected
- Region without a filling 2-cell must be rejected
- Compositions violating interchange law must be rejected
- Different evaluation orders yielding different composites must be rejected
- Artifact claiming authority must be rejected
doctrine:
  summary: The bicategorical pasting law states that in a bicategory, any pasting diagram of 2-cells (a planar arrangement of 2-morphisms sharing boundaries) has a unique composite 2-cell. The composite is independent of the order in which binary horizontal and vertical compositions are performed. This is guaranteed by the interchange law, associator and unitor coherence (pentagon and triangle axioms). A pasting law witness records a specific pasting diagram, its boundary 1-cells, the constituent 2-cells, and the resulting composite.
  non_role:
  - Full bicategory construction (separate contract)
  - Strict 2-category pasting (trivially holds, no witness needed)
  - 3-categorical pasting (Gray categories, separate concern)
  - Automated pasting diagram parsing
wip:
- How to handle non-planar pasting diagrams?
- Should the contract support pasting in strict 2-categories (trivial case)?
- How to efficiently represent large pasting diagrams?
- Relationship to string diagrams and graphical calculus?
- Currently handles planar pasting diagrams with explicit region filling
- Power's pasting theorem provides the theoretical foundation
- String diagram representation may be more efficient for large diagrams
- Connection to Joyal-Street graphical calculus is structural
