schema_version: core.contract.v1
contract_id: urn:core:math:composition_table:v0.1.0
title: Composition Table Contract
kind: math_contract
status: exact_rational_classifier_implemented
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: finite_table
  symbol: 'T = {(f, g, g compose f) : cod(f) = dom(g)}'
  ascii_symbol: composition_table
  notation: 'T = {(f, g, g compose f) : cod(f) = dom(g)}'
  domain:
  - 'category: the finite category whose composition is tabulated'
  - 'entries: set of triples (f, g, h) with cod(f) = dom(g) and g compose f = h'
  - 'morphism_set: the finite set of all morphisms in the category'
  codomain:
    description: 'The carrier is a finite set of triples (f, g, h) where f and g are composable morphisms and h = g compose f is their composite.

      '
requirements:
  required_structures:
  - Every composable pair must have an entry in the table
  - No composable pair may appear in multiple entries
  - Composition derived from the table must be associative
  - Identity morphisms must act as left and right units
  - Same table data always produces the same validation outcome
laws:
- For every composable pair (f, g), there exists exactly one entry (f, g, h) in T
- No composable pair (f, g) appears in more than one entry
- 'For all composable triples: T(T(f,g), h) = T(f, T(g,h))'
- 'For all f and the identity id on cod(f): T(f, id) = f'
- 'For all f and the identity id on dom(f): T(id, f) = f'
- 'For (f, g, h) in T: dom(h) = dom(f) and cod(h) = cod(g)'
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Table entries sorted canonically by (f, g) before hashing
  - Validators and computation functions are content-addressed
relationships:
- urn:math:contract:Category:v0.1.0 serves as Provides the finite category structure
- urn:math:contract:Morphism:v0.1.0 serves as Defines the morphisms in the composition table
- urn:math:contract:CompositionLaw:v0.1.0 serves as Defines the abstract composition law this table implements
negative_tests:
- category_id does not resolve
- A composable pair has no entry
- A composable pair has multiple conflicting entries
- Table-derived composition fails associativity
- Identity morphism does not act as unit
doctrine:
  summary: A CompositionTable is an explicit finite table encoding the composition law of a finite category. Each entry (f, g, h) in the table records that the composition g compose f = h, where cod(f) = dom(g). The table must be complete (every composable pair has an entry), consistent (each pair maps to a unique composite), and associative (the composition derived from the table satisfies (h compose g) compose f = h compose (g compose f)). This is the concrete data representation of the abstract CompositionLaw contract.
  non_role:
  - This contract does not handle infinite categories (use CompositionLaw with function representation)
  - This contract does not define the morphisms themselves (see Morphism contract)
  - This contract does not handle enriched or higher composition
wip:
- What is the maximum practical table size before switching to function representation?
- Should the table support lazy validation for very large finite categories?
- How to handle categories where the morphism set is finite but very large?
- This is the concrete data representation of the abstract CompositionLaw
- For categories with > ~10^6 morphisms, table representation becomes impractical
- The table is the primary input for graph-based categorical computation
rust_binding:
  crate: core_category_theory
  module: finite_category_validation
  symbols:
    - validate_finite_category
    - check_composition_totality
    - check_composition_closure
    - check_composition_boundaries
    - check_associativity
  required_tests:
    - valid_category_passes_all_units
    - missing_composition_is_typed_violation
    - noncomposable_composition_fails
    - associativity_failure_is_detected
