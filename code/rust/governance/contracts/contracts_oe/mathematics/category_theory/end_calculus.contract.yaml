schema_version: core.contract.v1
contract_id: urn:core:math:end_calculus:v0.1.0
title: End Calculus Contract
kind: math_contract
status: exact_rational_classifier_implemented
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: computational_calculus
  symbol: ∫_c F(c,c)
  ascii_symbol: end_calculus
  notation: ∫_c F(c,c)
  domain:
  - 'categories: Category instances involved'
  - 'bifunctors: Bifunctors F: C^op × C → D'
  - 'end_expression: ∫_c F(c,c) formula'
  codomain:
    description: 'End formulas over bifunctors F: C^op × C → D, producing universal wedges satisfying dinaturality conditions

      '
requirements:
  required_structures:
  - All bifunctors must be well-defined functors
  - Dinaturality conditions must be satisfied
  - End computation must follow standard formulas
  - Artifact hash must be deterministic SHA-256
laws:
- 'For each f: c → c'' in C, the diagram F(c,c) → F(c,c'') → F(c'',c'') equals F(c,c) → F(c'',c) → F(c'',c'')

  '
- 'End ∫_c F(c,c) is universal among all wedges satisfying dinaturality

  '
- ∫_c ∫_d F(c,d) ≃ ∫_{(c,d)} F(c,d)
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Validators are content-addressed
  - Computation functions are content-addressed
relationships:
- urn:math:contract:Category:v1.0.0 serves as Provides underlying category structures
- urn:math:contract:Functor:v1.0.0 serves as Provides bifunctor definitions
- urn:math:contract:NaturalTransformation:v1.0.0 serves as Natural transformations computed as ends
negative_tests:
- Invalid bifunctors must be rejected
- Dinaturality failure must be rejected
- Incorrect computation must be rejected
doctrine:
  summary: End calculus is the systematic use of ends and their properties to compute and manipulate categorical constructions. End calculus provides computational tools for natural transformations, limits, and representation theory.
  non_role:
  - Does not provide enriched end calculus
  - Does not handle ∞-categorical end calculus
  - Does not support weighted ends
wip:
- Enriched end calculus
- ∞-categorical end calculus
- Weighted ends
- Contract version 0.1.0 covers basic end calculus
- Future versions will add enriched and ∞-categorical variants
- Weighted ends require monoidal category infrastructure
rust_binding:
  crate: core_category_theory
  module: limits_colimits::end
  symbols:
    - End
  required_tests:
    - validate_ok
    - validate_rejects_empty
