schema_version: core.contract.v1
contract_id: urn:core:math:presentable_category:v0.1.0
title: Presentable Category Contract
kind: math_contract
status: exact_rational_classifier_implemented
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: infinity_category
  symbol: C ∈ Pr^L, C ≃ Ind_κ(C^κ)
  ascii_symbol: presentable_category
  notation: C ∈ Pr^L, C ≃ Ind_κ(C^κ)
  domain:
  - 'infinity_category: underlying ∞-category structure'
  - 'cardinal_kappa: regular cardinal for accessibility'
  - 'compact_generators: small set of κ-compact generating objects'
  codomain:
    description: Presentable ∞-category with accessibility data
requirements:
  required_structures:
  - Category has all small colimits
  - Category is κ-accessible
  - All generators are κ-compact
  - Generators generate under κ-filtered colimits
laws:
- C has all small colimits
- C is κ-accessible for some regular cardinal κ
- C is generated under κ-filtered colimits by κ-compact objects
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Validators are content-addressed
relationships:
- urn:math:contract:InfinityCategory:v0.1.0 serves as Provides underlying ∞-category
  structure
- urn:math:contract:Cardinal:v0.1.0 serves as Defines regular cardinals for accessibility
negative_tests:
- infinity_category_id does not resolve
- Some small colimit doesn't exist
- No generating set of compact objects
- Some generator is not κ-compact
doctrine:
  summary: A presentable ∞-category is a cocomplete ∞-category that is accessible
    (generated by a small set of κ-compact objects for some regular cardinal κ). Equivalently,
    it is a localization of a presheaf ∞-category. The contract validates the accessibility
    and cocompleteness requirements.
  non_role:
  - Does not implement the full Pr^L structure
  - Does not handle adjoint functor theorem automatically
  - Does not compute specific localizations
wip:
- 'Pr^L: ∞-category of presentable categories with colimit-preserving functors'
- 'Adjoint functor theorem: left adjoints between presentable categories are colimit-preserving'
- Stable presentable categories form Pr^L_st
- 'Localization of presheaf categories: equivalence with presentable categories'
- Computation of κ-filtered colimits
- Version 0.1.0 focuses on core validation requirements
- Future versions may add Pr^L structure
- Consider adding stable presentable category subtype
- May need to refine compact object testing algorithms
rust_binding:
  crate: core_higher_category_theory
  module: compactly_generated
  symbols:
  - CompactlyGeneratedCategory
  - CompactObject
  - FilteredDiagram
  required_tests:
  - test_compactly_generated_category_positive_verification
  - test_kill_mut_p3_06_compact_factorization_violation
