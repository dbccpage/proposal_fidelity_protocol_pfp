schema_version: core.contract.v1
contract_id: urn:core:math:functor:v0.1.0
title: Functor Contract
kind: math_contract
status: exact_rational_classifier_implemented
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: functor
  symbol: 'F: C → D'
  ascii_symbol: functor
  notation: 'F: C → D'
  domain:
  - 'object_map: function from Ob(C) to Ob(D)'
  - 'morphism_map: function from Mor(C) to Mor(D)'
  codomain:
    description: A pair of maps (F₀, F₁) where F₀ maps objects and F₁ maps morphisms
requirements:
  required_structures:
  - source_category_id must resolve to a valid Category artifact
  - target_category_id must resolve to a valid Category artifact
  - Every object in C must have an image in D
  - Every morphism in C must have an image in D
  - 'For all f: A → B in C, F(f): F(A) → F(B) in D'
  - F(id_A) = id_{F(A)} for all objects A
  - F(g ∘ f) = F(g) ∘ F(f) for all composable pairs
laws:
- F(id_A) = id_{F(A)} for all objects A in C
- F(g ∘ f) = F(g) ∘ F(f) for all composable f, g in C
- dom(F(f)) = F(dom(f)) for all morphisms f in C
- cod(F(f)) = F(cod(f)) for all morphisms f in C
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Mappings serialized in canonical order
  - Validators and computation functions are content-addressed
relationships:
- urn:math:contract:Category:v1.0.0 serves as Source and target categories
negative_tests:
- source_category_id does not resolve to valid Category
- target_category_id does not resolve to valid Category
- An object in C has no image in D
- F(f) does not have domain F(dom(f))
- F(id_A) ≠ id_{F(A)} for some object A
- F(g ∘ f) ≠ F(g) ∘ F(f) for some composable pair
doctrine:
  summary: 'A Functor F: C → D is a structure-preserving map between categories.  It maps objects to objects and morphisms to morphisms, preserving identities and composition.  The contract validates the functor axioms.'
  non_role:
  - Contravariant functors (modeled as functors C^op → D)
  - Profunctors or bifunctors (separate contracts)
  - Higher functors (∞-categories)
  - Lax or oplax functors (separate contracts)
wip:
- 'How to model contravariant functors? Current approach: functors C^op → D'
- What FactEnvelope types for functor properties (full, faithful, essentially surjective)?
- How to represent functor categories and natural transformations?
- Should we include profunctors or keep them as separate contract?
- Currently targets covariant functors between categories
- ContravariantFunctor trait exists but not yet integrated into contract
- Functor composition is specified but needs integration with NaturalTransformation contract
- FactEnvelope for 'is full', 'is faithful', 'is essentially surjective', 'is an equivalence' needs standardization
rust_binding:
  crate: core_category_theory
  module: cat_functor
  symbols:
    - CatFunctor
  required_tests:
    - composition_law_missing_mapping_is_violation
    - declared_finite_functor_identity_law
