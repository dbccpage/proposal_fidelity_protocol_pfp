schema_version: core.contract.v1
contract_id: urn:core:math:grothendieck_fibration:v0.1.0
title: Grothendieck Fibration Contract
kind: math_contract
status: exact_rational_classifier_implemented
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: ShapeOnly
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: category-theoretic-structure
  symbol: 'p: E → B (Grothendieck fibration)'
  ascii_symbol: grothendieck_fibration
  notation: 'p: E → B (Grothendieck fibration)'
  domain:
  - 'total_category: Category E (total category)'
  - 'base_category: Category B (base category)'
  - 'projection: Functor p: E → B'
  - 'cleavage: Choice of cartesian lifts (for split fibrations)'
  codomain:
    description: 'Functor p: E → B with cartesian lifts'
requirements:
  required_structures:
  - 'p: E → B must be a functor'
  - Every morphism in B must have cartesian lifts
  - If split, cleavage must be coherent
  - Artifact hash must be deterministic SHA-256
laws:
- 'p: E → B is a functor'
- 'For all f: b → b'' in B and e'' in E_b'', there exists a cartesian lift f̃: f*(e'') → e'' over f'
- Cartesian lifts satisfy the universal property
- For split fibrations, cleavage satisfies coherence (composition and identity)
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Validators and computation functions are content-addressed
relationships:
- urn:math:contract:Category:v1.0.0 serves as Defines total and base categories E and B
- 'urn:math:contract:Functor:v1.0.0 serves as Defines projection functor p: E → B'
- 'urn:math:contract:Pseudofunctor:v0.1.0 serves as Defines reindexing pseudofunctor f*: E_b'' → E_b'
negative_tests:
- Projection is not a functor
- Cartesian lifts do not exist for some morphism
- Claimed split fibration has incoherent cleavage
doctrine:
  summary: 'A Grothendieck fibration is a functor p: E → B such that every morphism in B has a cartesian lift starting at any object above its codomain. Grothendieck fibrations provide the classical foundation for indexed category theory and stacks.'
  non_role:
  - Does not handle opfibrations (dual concept)
  - Does not handle bifibrations (both fibration and opfibration)
  - Does not handle internal fibrations in 2-categories
  - Does not handle fibrations of bicategories
wip:
- Opfibrations and bifibrations
- Internal fibrations in 2-categories
- Fibrations of bicategories
- Current implementation focuses on classical Grothendieck fibrations
- Split fibrations have been prioritized for initial implementation
- Grothendieck construction (∫_B F) is the canonical construction method
- Future versions may extend to bicategorical and internal settings
rust_binding:
  crate: core_category_theory
  module: category::fibered_category
  symbols:
    - FiberedCategoryShell
  required_tests:
    - validate_ok
    - validate_rejects_empty
