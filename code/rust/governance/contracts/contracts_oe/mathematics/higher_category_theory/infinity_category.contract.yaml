schema_version: core.contract.v1
contract_id: urn:core:math:infinity_category:v0.1.0
title: Infinity Category Contract
kind: math_contract
status: exact_rational_classifier_implemented
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
math:
  object_kind: infinity_category
  symbol: 'C : (∞,1)-Cat, or C_∞ for the ∞-category'
  ascii_symbol: infinity_category
  notation: 'C : (∞,1)-Cat, or C_∞ for the ∞-category'
  domain:
  - 'model_type: one of {quasicategory, segal_space, segal_category, simplicial_category, relative_category}'
  - 'presentation_data: model-specific data structure'
  codomain:
    description: Model-dependent presentation of an (∞,1)-category. For quasicategory, a simplicial set with the inner horn filling property. For Kan complex, a simplicial set where all horns have fillers. Higher cells are invertible up to coherent homotopy.
requirements:
  required_structures:
  - presentation_data must be well-formed for the chosen model_type
  - For quasicategories, all inner horns must have fillers
  - Underlying simplicial set satisfies all 5 simplicial identities
  - Artifact hash is deterministically content-addressed over model_type and presentation_data
laws:
- 'For quasicategories: every inner horn Λ^n_k → X (0 < k < n) admits a filler Δ^n → X'
- 'Kan complexes: every horn Λ^n_k → X (0 <= k <= n) admits a filler'
- Composition is associative up to coherent higher homotopy
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Simplices and data serialized in canonical order
  - Validators and computation functions are content-addressed
relationships:
- urn:core:math:simplicial_set:v0.1.0 serves as Provides simplicial set structure for quasicategory model
- urn:core:math:quasi_category:v0.1.0 serves as Dedicated quasi-category specialization
- urn:core:math:stable_infinity_category:v0.1.0 serves as Stable specialization
rust_binding:
  crate: core_higher_category_theory
  module: simplicial_set
  symbols:
  - SimplicialSet
  - Simplex
  - Horn
  - KanComplexValidator
  - QuasiCategoryValidator
  required_tests:
  - test_simplicial_set_and_quasi_category_positive_verification
  - test_kill_mut_p3_03_simplicial_identity_violation
  - test_kill_mut_p3_04_quasi_category_inner_horn_filling_violation
lean4_binding:
  module: HigherCategoryTheory.SimplicialSet
  symbols:
  - SimplicialSet
  - HornData
  - HornFiller
  - IsKanComplex
  - IsQuasiCategory
  - kan_complex_is_quasi_category
negative_tests:
- Invalid model_type not recognized
- Presentation data doesn't match model type
- Inner horn has no filler (MUT-P3-04)
- Simplicial identity violated (MUT-P3-03)
doctrine:
  summary: An InfinityCategory (∞-category or (∞,1)-category) has objects, morphisms, 2-morphisms, and higher morphisms of all dimensions, where all k-morphisms for k >= 2 are invertible up to higher morphisms. The contract validates the ∞-categorical structure via the quasicategory model.
  non_role:
  - (∞,n)-categories with non-invertible cells beyond dimension 1
  - Concrete continuous spaces
wip:
  - Quillen equivalence of models
  - Homotopy hypothesis for ∞-groupoids
