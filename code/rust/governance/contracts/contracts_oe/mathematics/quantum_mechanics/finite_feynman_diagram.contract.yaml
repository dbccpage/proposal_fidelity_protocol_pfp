  - wick_pairings
  - phi4_vacuum_diagrams
  required_tests:
  - wick_pairings_count_is_the_double_factorial
  - vacuum_symmetry_factors_and_connected_sums_match_phi4_coefficients
negative_tests:
- Odd leg counts, reused or missing half-edges, malformed valences and materialization/permutation budget excess
  are refused.
