  - windows_to_exceed
  - concatenated_threshold
  - concatenated_repair_scaling
  required_tests:
  - conditional_concatenation_has_a_fixed_threshold_and_double_exponential_decay
negative_tests:
- Negative rates, nonpositive C, rates above the admitted threshold, level excess and rational bit growth are
  refused.
doctrine:
  summary: The recurrence gives rho_k >= max(0,rho_0+k(lambda-mu-epsilon)).; A positive persistent gap forces
