laws:
- The recurrence gives rho_k >= max(0,rho_0+k(lambda-mu-epsilon)).
- A positive persistent gap forces strict threshold crossing at the exact integer floor formula; a nonpositive
  gap does not yield that conclusion.
- The concatenation threshold is 1/C and exact upper iterates obey p_l=(C p_0)^(2^l)/C.
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
