  notation: Finite exact ket and bra evaluation
  domain:
  - Nonzero bounded finite Q(i) vectors in a fixed ordered basis
  codomain:
    description: Declared finite results of core_quantum_physics::quantum_state; exact and diagnostic routes
      retain their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Inner product is conjugate symmetric
- Bra evaluation is conjugate linear in the left argument and linear in the right
- Every admitted ket has strictly positive real squared norm
- Zero and incompatible lengths return typed errors
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
