  crate: core_quantum_physics
  module: quantum_state
  symbols:
  - RayVector::try_new
  - RayVector::inner
  - RayVector::norm_sq
  required_tests:
  - quantum_state::tests::exact_ket_bra_sesquilinear_positive_norm_and_typed_refusals
negative_tests:
- quantum_state::tests::exact_ket_bra_sesquilinear_positive_norm_and_typed_refusals
doctrine:
  summary: Inner product is conjugate symmetric; Bra evaluation is conjugate linear in the left argument and
    linear in the right; Every admitted ket has strictly positive real squared norm; Zero and incompatible
    lengths return typed errors.
  non_role:
  - Does not represent abstract artifact hash protocols or an infinite-dimensional ket space
  - PROVED, GlobalGreen, operational authority or human mathematics acceptance
