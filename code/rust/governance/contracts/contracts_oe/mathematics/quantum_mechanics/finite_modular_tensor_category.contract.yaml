  crate: core_quantum_physics
  module: modular_tensor_category
  symbols:
  - ModularTensorCategory
  required_tests:
  - modular_data_reproduce_toric_and_ising_ground_state_counts
negative_tests:
- Nonmodular ribbon data and exhausted exact work are refused.
- Scattering S matrices are not used as modular data.
