laws:
- Unnormalised S satisfies S squared = D squared times charge conjugation and S S dagger = D squared I.
- The modular relation, Verlinde fusion coefficients and Gauss-Milgram phase are exact.
- The toric genus-two degeneracy is sixteen and the Ising genus-two degeneracy is ten.
