laws:
- Projection is normalized squared modulus and is invariant across a declared phase orbit
- Rows with at most one nonzero entry descend through the zero-extended quotient
- A mixing row has a replayable phase-equivalent pair whose images separate
- Gaussian lifts independently reproject; primes3mod4 of odd valuation obstruct a lift
- Lift nonexistence is distinct from factorization or construction budget refusal
