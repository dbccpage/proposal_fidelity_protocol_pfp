  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Associativity, coassociativity, both unit and counit laws, and both Frobenius equations are replayed.
- Copying has special scalar one and is commutative and dagger.
- M2 is noncommutative with special scalar two; the cyclic group algebra on three elements has special scalar
  three.
- Inverting the actual trace Gram matrix yields the exact dual-basis coproduct.
