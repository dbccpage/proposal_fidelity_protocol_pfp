laws:
- Exact primal upper and dual lower bounds certify only when their gap is zero
- Trace-zero and all-Hermitian repair spaces retain their distinct dual divergence constraints
- Diagonal lifts replay the shared exact quotient-L1 witnesses in full operator coordinates
- Unsupported flattened axes refuse before map allocation; actual empty graph/cochain carriers retain zero
