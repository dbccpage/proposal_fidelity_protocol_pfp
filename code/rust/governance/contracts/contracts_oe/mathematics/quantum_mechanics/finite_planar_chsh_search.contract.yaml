  - generate_unit_vectors
  - FinitePlanarMaximum
  required_tests:
  - measurement_exact_laws::finite_planar_search_replays_its_declared_class_and_refuses_incomplete_search
negative_tests:
- measurement_exact_laws::finite_planar_search_replays_its_declared_class_and_refuses_incomplete_search
doctrine:
  summary: Every direction is real of unit squared norm; CHSH is evaluated exactly and every allowed strategy
    is enumerated; The returned finite maximum has a replayable strategy and actual candidate count; Axes attain2
    and conductor8 quadratic controls attain2sqrt2.
