laws:
- Tensor composition preserves identities, interchange and associativity
- Complex Hermitian product effects span the joint Hermitian carrier
- Real rebit product effects miss the computed J tensor J direction
- I/4 plus or minus J tensor J/8 are positive trace-one states invisible to all local product effects and separated
  by a joint projector
