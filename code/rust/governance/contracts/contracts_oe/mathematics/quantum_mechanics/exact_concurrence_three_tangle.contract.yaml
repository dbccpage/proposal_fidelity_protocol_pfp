  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Mixed concurrence uses eigenvalues of rho tilde-rho through an exact PSD Gram
- Werner threshold and W pair concurrence equal their analytic rational values
- Cayley hyperdeterminant three-tangle distinguishes GHZ from W
- Complex spin-flip coherences are retained
- Diagnostic pure-state separability refuses nonfinite or negative decision tolerances while retaining product
  and Bell controls and the valid zero threshold
replay:
