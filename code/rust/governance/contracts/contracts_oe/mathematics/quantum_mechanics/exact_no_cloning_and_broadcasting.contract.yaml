laws:
- Cloning obstruction is t(1-t), invariant under global phase
- A family has no obstructing pair exactly when distinct rays are orthogonal
- Broadcastability is decided by exact pairwise commutation
- Universal N-to-M single-copy bound uses arbitrary-precision rational arithmetic
