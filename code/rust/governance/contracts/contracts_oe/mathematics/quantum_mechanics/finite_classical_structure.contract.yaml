requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Delta equals sum_b (b tensor b) b dagger and epsilon equals sum_b b dagger.
- The maps form a special commutative dagger Frobenius algebra.
- Copyable coalgebra points satisfy Delta(v)=v tensor v and epsilon(v)=1; zero is excluded.
- Mutual unbiasedness is exactly |inner(b,c)| squared = 1/d for every cross-basis pair.
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: core_quantum_physics
  module: classical_structure
  symbols:
  - ClassicalStructure
  required_tests:
  - rational_rotated_basis_is_a_classical_structure_with_only_basis_points_copyable
  - complex_rational_unbiased_basis_is_complementary
negative_tests:
- Incomplete or nonorthonormal bases and mismatched dimensions are refused.
- Zero is not a classical point despite satisfying the copying equation alone.
