  domain:
  - Dense periodic lattice operators with declared Clifford family and dimension<=128
  - Exact momentum corner carriers with 1..=64 spatial dimensions, period>=3 and explicit periodic/antiperiodic
    twists
  - Exact cyclotomic symbols require the declared conductor 2*period<=1024
  codomain:
    description: Declared finite results of core_quantum_physics::lattice_dirac_doubling; exact and diagnostic
      routes retain their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Naive zero species are exactly the available sine-zero corners, including boundary parity
- Wilson zeros additionally satisfy mass+2r(number of pi components)=0
- Exact momentum kernel counts match independent dense elimination for small carriers
- Corner chirality is (-1) to the number of pi components and the even-period full corner sum is zero
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
