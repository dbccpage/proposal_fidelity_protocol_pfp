  crate: core_quantum_physics
  module: lattice_dirac_doubling
  symbols:
  - LatticeDirac
  - LatticeMomentumSpectrum
  - LatticeError
  - LatticeDirac::naive_operator
  - LatticeDirac::wilson_operator
  - LatticeMomentumSpectrum::naive_species_count
  - LatticeMomentumSpectrum::wilson_species_count
  - LatticeMomentumSpectrum::symbol_data
  required_tests:
  - the_naive_lattice_operator_doubles_and_a_wilson_term_removes_the_doublers
  - exact_lattice_momentum_corners_match_dense_kernels_and_wilson_species
  - malformed_lattice_declarations_are_refused
negative_tests:
- Wrong momentum/conductor shape and oversized dense carriers are refused
- A Wilson term removes massless periodic doublers while breaking chirality; even-period antiperiodic axes
  have no sine-zero corner
doctrine:
  summary: Naive zero species are exactly the available sine-zero corners, including boundary parity; Wilson
    zeros additionally satisfy mass+2r(number of pi components)=0; Exact momentum kernel counts match independent
    dense elimination for small carriers; Corner chirality is (-1) to the number of pi components and the even-period
    full corner sum is zero.
  non_role:
