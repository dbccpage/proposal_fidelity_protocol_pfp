  - Exact arithmetic and explicit finite carrier validation
  - A typed refusal for unsupported or exhausted computations
laws:
- S=(I+iK)(I-iK)^-1 is independently verified unitary
- With T=(S-I)/(2i), T-T dagger=2i T dagger T
- K=1 fixes the outgoing-wave convention S=i
replay:
  requirements:
  - No external state
  - No randomness
  - No time-dependent data
  - Exact independent witness replay where a witness is returned
relationships: []
rust_binding:
  crate: core_quantum_physics
  module: s_matrix
  symbols:
  - SMatrix
  - ScatteringError
  required_tests:
  - cayley_scalar_pins_the_scattering_sign_convention
  - coupled_channels_are_unitary_and_obey_the_optical_theorem
  - malformed_and_nonphysical_scattering_inputs_are_refused
negative_tests:
- Reject empty, rectangular, non-Hermitian reaction matrices and nonunitary candidates
doctrine:
  summary: Finite Scattering S Matrix on a declared finite carrier.
  non_role:
  - PROVED, GlobalGreen, or operational authority
  - Continuum or infinite-carrier completion claims
wip:
- Executable finite checks are local evidence; no theorem-prover discharge is asserted.
