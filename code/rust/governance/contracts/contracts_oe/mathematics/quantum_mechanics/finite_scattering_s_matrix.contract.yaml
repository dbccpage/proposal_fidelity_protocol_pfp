  domain:
  - A nonempty Hermitian reaction matrix K over Q(i), with at most MAX_SCATTERING_CHANNELS=128 channels
  codomain:
    description: Exact finite constructions implemented by core_quantum_physics::s_matrix; results remain
      scoped to the declared carrier and budgets.
requirements:
