laws:
- Signed shared Hermitian eigenpairs reconstruct a trace-one PSD input
- Malformed dimensions and nonfinite/tolerance arithmetic refuse
- Canonical purification entropy is S(rho), with no EoP optimization claim
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
