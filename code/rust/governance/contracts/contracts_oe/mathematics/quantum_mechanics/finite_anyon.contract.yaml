requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- The dual, quantum dimension and twist are read from the same checked category.
- An anyon is abelian exactly when its fusion product with its dual is the unit with multiplicity one and has
  no other channels; signed spherical dimensions do not alter this test.
- The Ising sigma object has dimension squared two and its exact ribbon twist.
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: core_quantum_physics
  module: anyon
  symbols:
  - Anyon
  required_tests:
  - ising_charge_has_nonabelian_dimension_and_exact_twist
  - signed_spherical_dimension_does_not_change_charge_invertibility
negative_tests:
- Out-of-range charges are refused.
- Construction cannot confer operational authority.
- An invertible Z2 charge with spherical dimension minus one remains abelian.
