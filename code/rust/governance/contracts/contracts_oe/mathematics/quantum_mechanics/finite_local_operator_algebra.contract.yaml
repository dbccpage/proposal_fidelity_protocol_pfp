  - pauli_local_algebra_commutant_is_the_complement_region
  - oversized_algebra_constraint_packets_refuse_before_dense_materialization
negative_tests:
- Ragged, rectangular, carrier-mismatched and over-budget generators are refused.
- Dense center and commutant constraint packets above canonical storage or scalar-operation budgets refuse
  before materialization.
