  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- The retained independent basis contains the identity and is closed under multiplication and dagger.
- The commutant is the simultaneous commutator kernel; the center is its intersection with the algebra.
- The even two-mode Majorana algebra has dimension eight and center and commutant dimension two.
- A local Pauli tensor algebra has the complementary tensor algebra as commutant.
