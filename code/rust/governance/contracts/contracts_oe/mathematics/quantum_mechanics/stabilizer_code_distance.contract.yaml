  notation: Exact Stabilizer Codes, States and Coding Bounds
  domain:
  - Finite symplectic F2 Pauli data, with separate phase-free code and signed pure-state carriers.
  - Declared finite weight-search and enumeration bounds.
  codomain:
    description: Declared finite results of core_quantum_physics::stabilizer_code_distance; exact and diagnostic
