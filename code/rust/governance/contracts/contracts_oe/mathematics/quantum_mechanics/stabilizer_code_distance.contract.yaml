    A signed pure stabilizer state rejects minus identity and has subset entropy rank(restriction_A(G))-|A|,
    equivalently |A|-rank(the stabilizers wholly supported in A).; Stabilizer and normalizer enumerators obey
    the quantum MacWilliams transform; Singleton and conditional nondegenerate Hamming bounds are exact..
