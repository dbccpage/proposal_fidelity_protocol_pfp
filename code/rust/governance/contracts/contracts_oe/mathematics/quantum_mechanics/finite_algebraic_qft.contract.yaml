  crate: core_quantum_physics
  module: algebraic_qft
  symbols:
  - AlgebraicQft
  required_tests:
  - finite_tensor_net_obeys_isotony_locality_and_complement_duality
negative_tests:
- Incomplete region families, mismatched carriers, region budget excess and real locality defects are not accepted.
doctrine:
