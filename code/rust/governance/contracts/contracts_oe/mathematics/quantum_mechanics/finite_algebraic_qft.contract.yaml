  notation: Exact Finite Local Operator Nets
  domain:
  - A complete finite subset-indexed family of local star algebras on one common exact Hilbert carrier, with
    at most four parties.
  codomain:
    description: Declared finite results of core_quantum_physics::algebraic_qft; exact and diagnostic routes
      retain their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Every region inclusion is checked for isotony.
- Every disjoint pair is checked for operator locality.
- Optional complement duality compares each local commutant with the complementary-region algebra.
- Finite tensor-product qubit nets satisfy all three laws; overlapping site assignments yield an actual locality
  defect.
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
