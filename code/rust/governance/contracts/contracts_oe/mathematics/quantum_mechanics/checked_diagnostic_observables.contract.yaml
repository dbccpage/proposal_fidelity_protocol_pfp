schema_version: core.contract.v1
contract_id: urn:core:math:checked_diagnostic_observables:v0.1.0
title: Checked numerical observable diagnostics
kind: math_contract
status: mathematical_wip
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
relationships: []
math:
  object_kind: checked_diagnostic_observables
  symbol: checked_diagnostic_observables
  ascii_symbol: checked_diagnostic_observables
  notation: Checked numerical observable diagnostics
  domain:
  - Bounded finite f64 matrices; finite nonnegative construction tolerance; expectation operations use fixed
    default Hermiticity replay and a scaled default realness threshold
  codomain:
    description: Declared finite results of core_quantum_physics::observable; exact and diagnostic routes
      retain their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Public storage is rechecked before dependent matrix products
- NaN/Inf, invalid tolerances and preallocation dimension overflow refuse
- A loose construction tolerance never relaxes operation Hermiticity replay or permits imaginary expectation
  values to be truncated
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: core_quantum_physics
  module: observable
  symbols:
  - Observable::try_new
  - Observable::expectation_value_state
  - Observable::expectation_value_density
  required_tests:
  - states_channels_exact_tests::diagnostic_faces_refuse_nan_tolerances_and_invalid_public_storage
  - quantum_channel::tests::depolarizing_channel_applies_to_a_diagonal_state_with_trace_one
  - observable::tests::an_expectation_with_an_imaginary_part_is_refused_not_truncated
negative_tests:
- states_channels_exact_tests::diagnostic_faces_refuse_nan_tolerances_and_invalid_public_storage
- observable::tests::an_expectation_with_an_imaginary_part_is_refused_not_truncated
doctrine:
  summary: Public storage is rechecked before dependent matrix products; NaN/Inf, invalid tolerances and preallocation
    dimension overflow refuse; A loose construction tolerance never relaxes operation Hermiticity replay or
    permits imaginary expectation values to be truncated.
  non_role:
  - Diagnostic tolerance-based observations never create exact or theorem authority
  - PROVED, GlobalGreen, operational authority or human mathematics acceptance
wip:
- Executable finite laws remain local implementation evidence pending human mathematics review
- No mechanized theorem discharge or lifecycle acceptance is asserted
