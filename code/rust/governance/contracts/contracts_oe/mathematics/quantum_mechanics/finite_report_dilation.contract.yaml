laws:
- Dilation count is a factorial product determined by report fibers.
- A permutation has a square root iff each even-cycle length occurs with even multiplicity.
- For scale4k^2 the scaled toggle has four Gaussian-rational unitary interpolants; a nonsquare scale refuses
  rational interpolation.
