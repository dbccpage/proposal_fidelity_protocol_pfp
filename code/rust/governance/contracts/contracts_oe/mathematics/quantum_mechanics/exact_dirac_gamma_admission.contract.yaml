  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Slash(p)^2=(p.p)I and exact kernel rank determines plane-wave solution dimension
- The four-gamma trace is dimension times (eta_mu_nu eta_rho_sigma-eta_mu_rho eta_nu_sigma+eta_mu_sigma eta_nu_rho)
- On-shell projectors are complementary idempotents
- The spin vector action is a real BasicMatrix computed through the canonical Clifford normalizer
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: core_quantum_physics
  module: dirac_gamma_admission
  symbols:
  - CliffordFamily
  - DiracError
  - CliffordFamily::slash
  - CliffordFamily::solution_dimension
  - CliffordFamily::vector_action
  - CliffordFamily::four_gamma_trace
  - CliffordFamily::energy_projectors
  - boost_half_parameters
  required_tests:
  - the_dirac_operator_squares_to_the_klein_gordon_operator
  - plane_wave_solutions_exist_exactly_on_the_mass_shell
  - spin_elements_carry_solutions_at_p_to_solutions_at_l_p
  - four_gamma_traces_and_on_shell_energy_projectors_replay_the_metric
negative_tests:
- Singular/non-normalizing spin elements, off-mass-shell and zero-mass projector requests are refused
- Rational half-rapidity obstruction returns its exact square class
doctrine:
  summary: Slash(p)^2=(p.p)I and exact kernel rank determines plane-wave solution dimension; The four-gamma
    trace is dimension times (eta_mu_nu eta_rho_sigma-eta_mu_rho eta_nu_sigma+eta_mu_sigma eta_nu_rho); On-shell
    projectors are complementary idempotents; The spin vector action is a real BasicMatrix computed through
    the canonical Clifford normalizer.
  non_role:
  - No PDE solution, continuum dynamics or approximate irrational spin lift
  - Covariant slash projectors do not by themselves select a vacuum
  - PROVED, GlobalGreen, operational authority or human mathematics acceptance
wip:
