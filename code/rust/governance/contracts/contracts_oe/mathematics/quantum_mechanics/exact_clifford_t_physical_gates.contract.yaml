negative_tests:
- states_channels_exact_tests::diagnostic_faces_refuse_nan_tolerances_and_invalid_public_storage
doctrine:
  summary: Unitary admission replays U*U=I; H^2=I and T^8=I exactly; H on the control followed by CNOT produces
    a Bell ray with exact phases.
