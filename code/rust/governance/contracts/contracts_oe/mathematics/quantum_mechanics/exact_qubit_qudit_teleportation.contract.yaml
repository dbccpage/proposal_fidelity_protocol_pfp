  crate: core_quantum_physics
  module: teleportation
  symbols:
  - Teleportation::exact
  - teleport_qudit
  required_tests:
  - states_channels_exact_tests::exact_teleportation_computes_all_complex_qubit_and_qudit_branches
negative_tests:
- states_channels_exact_tests::exact_teleportation_computes_all_complex_qubit_and_qudit_branches
doctrine:
  summary: Every Bell branch probability is computed from projection; Every corrected branch has the input
    ray projector; All qubit probabilities are 1/4; qudit probabilities are 1/d^2; Wrong root order and invalid
    dimensions are refused.
  non_role:
  - No classical outcome flag or fidelity constant substitutes for the branch computation
  - PROVED, GlobalGreen, operational authority or human mathematics acceptance
wip:
- Executable finite laws remain local implementation evidence pending human mathematics review
- No mechanized theorem discharge or lifecycle acceptance is asserted
