  notation: Exact computed Bell-measurement teleportation branches
  domain:
  - Nonzero finite qubit rays over Q(i), or qudit rays d=2..32 in an exact field with a supplied primitive
    unit root
  codomain:
    description: Declared finite results of core_quantum_physics::teleportation; exact and diagnostic routes
      retain their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- Every Bell branch probability is computed from projection
- Every corrected branch has the input ray projector
- All qubit probabilities are 1/4; qudit probabilities are 1/d^2
- Wrong root order and invalid dimensions are refused
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
