  notation: Exact Finite Path Sums and Gaussian Integrals
  domain:
  - Declared finite time-sliced semiring kernels.
  - A positive-definite rational Gaussian precision matrix on at most eight coordinates, with bounded moment
    and perturbation order.
  codomain:
    description: Declared finite results of core_quantum_physics::path_integral; exact and diagnostic routes
      retain their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- The finite partition value is the trace of the actual transfer product.
- Positive definiteness is certified by exact LDL and covariance is the canonical exact inverse.
- Moments satisfy Isserlis recurrence over actual covariance entries.
- Zero-dimensional phi4 partition, log-partition and two-point formal series reproduce the exact Wick and connected
  coefficients.
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: core_quantum_physics
  module: path_integral
  symbols:
  - PathIntegral
  - GaussianMeasure
  required_tests:
  - gaussian_moments_and_phi4_integrals_match_exact_wick_coefficients
  - finite_chain_partition_is_the_trace_of_the_transfer_product
negative_tests:
- Indefinite or singular precision, carrier mismatch and moment/series resource excess are refused.
doctrine:
  summary: The finite partition value is the trace of the actual transfer product.; Positive definiteness is
