kind: math_contract
status: mathematical_wip
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
relationships: []
math:
  object_kind: bounded_stabilizer_energy_width
  symbol: bounded_stabilizer_energy_width
  ascii_symbol: bounded_stabilizer_energy_width
  notation: Exact Bounded Stabilizer Energy Representation
  domain:
  - Declared commuting Pauli Hamiltonians with 1..=8 qubits and at most 24 terms
  - Nonnegative rational input weights have i64 wire limbs; exact energy sums use arbitrary-precision rationals
  - SOLVED energy retains the established reduced i64 numerator and positive i64 denominator output carrier
  codomain:
    description: Declared finite results of pfp_runtime::stabilizer; exact and diagnostic routes
      retain their stated arithmetic, limits and refusals.
requirements:
  required_structures:
  - Declared finite carriers, basis order, dimensions and coefficient domain
  - Exact arithmetic on the exact face; an explicitly diagnostic numerical face if declared
  - Unsupported inputs and exhausted computations return their declared refusal
laws:
- The bounded exhaustive assignment search compares exact rational energies without overflow
- Only the final minimum is checked for output representability; large discarded assignments do not refuse
  a representable minimum
- A final minimum outside either i64 wire limb returns UNKNOWN with ENERGY_WIDTH_EXCEEDED
- The certificate checker compares signed i64 claims through exact arbitrary-precision rationals
replay:
  requirements:
  - No external state
  - No time-dependent data
  - Deterministic mathematical replay on identical inputs
  - Independent operator or witness replay where a certificate is returned
rust_binding:
  crate: pfp_runtime
  module: stabilizer
  symbols:
  - MAX_QUBITS
  - MAX_TERMS
  - StabilizerOutcome
  - StabilizerCheckResult
  - solve
  - check
  required_tests:
  - maximum_i64_weights_accumulate_exactly_and_refuse_only_unrepresentable_minima
  - test_single_qubit_trivial_solve
  - test_bell_stabilizer_solve
  - test_noncommuting_pair_out_of_scope
negative_tests:
- Two forced i64::MAX penalties and coprime large-denominator sums return the width refusal
- A single forced i64::MAX penalty remains SOLVED with exact boundary value and degeneracy
- A zero minimum remains SOLVED despite an alternative penalty of twice i64::MAX
- A forged i64::MIN certificate yields an energy mismatch without arithmetic overflow
doctrine:
  summary: The bounded exhaustive assignment search compares exact rational energies without overflow; Only
    the final minimum is checked for output representability; large discarded assignments do not refuse a representable
    minimum; A final minimum outside either i64 wire limb returns UNKNOWN with ENERGY_WIDTH_EXCEEDED; The certificate
    checker compares signed i64 claims through exact arbitrary-precision rationals.
  non_role:
  - No unbounded stabilizer search or extension to noncommuting Hamiltonians
  - No promise that every exact minimum fits the existing output carrier
  - No conversion to floating-point energy or widening of the external wire API
  - PROVED, GlobalGreen, operational authority or human mathematics acceptance
wip:
- Executable finite laws remain local implementation evidence pending human mathematics review
- No mechanized theorem discharge or lifecycle acceptance is asserted
