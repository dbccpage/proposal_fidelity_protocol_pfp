doctrine:
  summary: 'A FiberSequence is the sequence F → E → B arising from a fibration p: E → B, where F is the fiber over a basepoint. The contract validates the fibration, the fiber inclusion, and supports extraction of the long exact sequence in homotopy.'
wip:
- status: wip
  notes:
  - The contract is closely related to Fibration; it adds explicit basepoints and fiber inclusion.
  - Puppe sequences (iterated fiber sequences) extend this.
  - Cofiber sequences (dual to fiber sequences) are separate.
