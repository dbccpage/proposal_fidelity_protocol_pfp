contract_id: urn:core:math:tree_gauge_fixing:v0.1.0
title: Tree Gauge Fixing and Holonomy Verdict Contract
kind: math_contract
status: active
layer: math
descriptor:
  authority_effect: none
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
