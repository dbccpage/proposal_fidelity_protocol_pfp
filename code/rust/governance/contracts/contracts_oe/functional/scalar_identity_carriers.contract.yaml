schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:rust:core_functional:scalar_identity_carriers:file:v1.0.0
title: Rational scalar helpers and typed identity carriers
status: active_provisional
crate: core_kernel
file: crates_rs/core_kernel/src/evidence.rs
layer: functional
role: scalar_conversion_and_identity_carriers
authority_effect: none
evidence_ceiling: LocalReplay
customer_claim_allowed: false
runtime_enforcement: true
owns:
  - rational_reduction_and_sign_normalization
  - zero_denominator_refusal_in_checked_access
  - exact_zero_comparison
  - display_conversion_underflow_and_overflow_refusal
does_not_own:
  - cryptographic_hash_computation
  - authenticity_of_caller_supplied_identity_labels
  - primal_dual_certificate_verification
  - actor_licensing_or_task_completion
may_call: []
must_not:
  - represent_two_fourths_as_one
  - treat_nonzero_underflow_as_exact_zero
  - promote_a_digest_carrier_or_scalar_tag_to_authority
exactness:
  mode: exact_rational_with_separate_display_conversion
  exact_constructor_required: false
  approximate_modes_allowed: false
forbidden_substrings: []
required_substrings:
  - "pub fn try_new("
  - "pub fn as_big_rational("
  - "pub fn to_f64_diagnostic("
required_tests:
  - "hashes::contract_tests::rational_value_rejects_zero_denominator"
  - "hashes::contract_tests::rational_values_normalize_signs_and_common_factors"
  - "hashes::underflow_tests::subfloor_positive_refuses_to_project_rather_than_reading_as_zero"
  - "hashes::underflow_tests::genuine_zero_still_projects_and_reports_zero"
  - "hashes::underflow_tests::subfloor_interval_refuses_and_is_not_exactly_zero"
  - "hashes::underflow_tests::interval_is_exactly_zero_only_when_both_endpoints_are"
lean_obligations: []
relationships:
  extends:
    - urn:core:constitution:base_file_contract:file:v1.0.0
