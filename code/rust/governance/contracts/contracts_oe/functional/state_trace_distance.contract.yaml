  - "distinguishability::tests::admitted_inputs_do_not_authorize_exceeding_the_difference_solver_budget"
  - "distinguishability::tests::near_unit_vector_slack_is_recorded_without_renormalizing"
  - "distinguishability::tests::independent_rational_fixtures_cover_mixed_complex_and_degenerate_states"
  - "distinguishability::tests::selected_policy_rejects_nonfinite_or_vacuous_state_tolerances"
  - "distinguishability::tests::matrix_shape_empty_and_dimension_refusals_preserve_the_native_mechanism"
  - "distinguishability::tests::every_input_triangle_and_imaginary_component_remains_checked"
  - "distinguishability::tests::trace_mismatch_is_not_normalized_into_an_admitted_state"
  - "distinguishability::tests::positive_diagonal_does_not_hide_a_negative_eigenvalue"
  - "distinguishability::tests::approximate_admission_retains_negativity_and_does_not_clamp_distance"
  - "distinguishability::tests::vector_dimension_limits_precede_dense_allocation_and_nonfinite_admission"
  - "distinguishability::tests::all_pure_vector_components_are_checked_before_norm_arithmetic"
  - "distinguishability::tests::finite_overflowing_vector_norm_is_a_typed_arithmetic_refusal"
  - "distinguishability::tests::zero_and_unnormalized_vectors_are_not_silently_repaired"
  - "distinguishability::tests::nonzero_outer_products_cannot_disappear_under_floating_underflow"
  - "distinguishability::tests::original_pure_vectors_norms_and_complex_phases_are_retained"
  - "distinguishability::tests::both_admissions_must_match_the_selected_numerical_policy"
  - "distinguishability::tests::mismatched_dimensions_refuse_instead_of_truncating_or_panicking"
  - "distinguishability::tests::a_nonzero_half_eigenvalue_cannot_be_reported_as_zero_distance"
  - "distinguishability::tests::result_retains_all_contributions_and_owns_its_original_inputs"
  - "distinguishability::tests::exhausted_native_spectral_budget_cannot_become_state_admission"
