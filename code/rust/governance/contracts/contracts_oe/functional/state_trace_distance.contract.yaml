schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:rust:core_functional:state_trace_distance:file:v1.0.0
title: Bounded numerical density admission and trace distance with retained inputs
status: active_provisional
crate: core_functional
file: crates_rs/core_functional/src/distinguishability.rs
layer: functional
role: immutable_approximate_state_trace_distance_diagnostic
authority_effect: none
evidence_ceiling: LocalReplay
customer_claim_allowed: false
runtime_enforcement: true
owns:
  - explicit_spectral_policy_and_state_tolerance_in_EPSILON_through_1e_minus_8
  - exact_representational_Hermitian_symmetry_via_checked_spectral_kernel
  - observed_trace_within_selected_tolerance_of_one
  - computed_eigenvalues_at_least_minus_selected_state_tolerance
  - recorded_negative_eigenvalue_magnitude_without_modifying_inputs
  - bounded_finite_pure_vector_admission_before_dense_outer_product_allocation
  - refusal_of_nonunit_norm_and_unrepresentable_nonzero_outer_products
  - original_pure_vector_norm_matrix_and_spectral_evidence
  - matching_selected_policy_and_dimensions_before_difference_allocation
  - half_absolute_contribution_of_every_difference_eigenvalue
  - compensated_sum_with_direct_overflow_and_rounding_witnesses
  - retained_left_right_and_difference_presentations
  - no_overlapping_vector_truncation_probability_clamp_or_authority_promotion
does_not_own:
