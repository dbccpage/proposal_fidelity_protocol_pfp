  - discard_complex_phases_or_eigenvalue_contributions
  - silently_normalize_vectors_or_clamp_near_density_distance_to_one
  - replace_a_nonzero_underflowed_contribution_with_zero
  - accept_other_policy_admissions_or_truncate_mismatched_dimensions
  - expose_mutable_checked_data_or_unchecked_deserialization
exactness:
  mode: bounded_floating_representation_diagnostic_with_explicit_admission_slack
  exact_constructor_required: false
  approximate_modes_allowed: true
forbidden_substrings: []
required_substrings:
  - "pub struct DistinguishabilityFunctional"
  - "pub struct DensityAdmission"
  - "pub struct TraceDistanceDiagnostic"
  - "DistinguishabilityError::NegativeEigenvalue"
  - "DistinguishabilityError::PolicyBinding"
  - "DistinguishabilityError::ContributionUnderflow"
  - "let matrix = left.matrix() - right.matrix();"
  - "checked_trace_contributions(difference.eigenvalues())?"
  - "let corrected = contribution - compensation;"
required_tests:
