  - automatic_normalization_symmetrization_or_positivity_repair
  - primary_obstruction_score_or_candidate_selection
  - legacy_general_matrix_path_triangle_API_compatibility
  - Xi_lift_or_saturation_semantics
  - source_native_binary_request_carrier_or_actor_authentication
  - workload_completion_release_or_council_decisions
  - HTTP_provider_ingress_limits_or_arbitrary_code_execution
may_call:
