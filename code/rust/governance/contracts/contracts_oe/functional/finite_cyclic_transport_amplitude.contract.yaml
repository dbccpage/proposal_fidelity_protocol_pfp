schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:rust:core_functional:finite_cyclic_transport_amplitude:file:v1.0.0
title: Bounded exact finite cyclic transport amplitude
status: active_provisional
crate: core_functional
file: crates_rs/core_functional/src/transport_amplitude.rs
layer: functional
role: immutable_exact_finite_cyclic_transport_amplitude
authority_effect: none
evidence_ceiling: LocalReplay
customer_claim_allowed: false
runtime_enforcement: true
owns:
  - dimension_and_step_bounded_exact_rational_weighted_cyclic_transport
  - explicitly_oriented_column_vector_shift_matrix
