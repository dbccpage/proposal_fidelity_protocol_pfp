  - "transport_amplitude::tests::cyclic_shift_wraps_instead_of_nilpotently_ending"
  - "transport_amplitude::tests::weighted_shift_operator_matches_path_amplitude"
  - "transport_amplitude::tests::unreachable_endpoint_is_exact_zero"
  - "transport_amplitude::tests::zero_steps_is_identity"
  - "transport_amplitude::tests::invalid_inputs_are_typed_refusals"
  - "transport_amplitude::tests::unreduced_rationals_are_canonicalized_before_arithmetic"
lean_obligations: []
relationships:
  extends:
    - urn:core:constitution:base_file_contract:file:v1.0.0
