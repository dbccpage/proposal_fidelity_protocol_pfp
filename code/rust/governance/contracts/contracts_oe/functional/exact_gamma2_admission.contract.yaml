schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:rust:core_functional:exact_gamma2_admission:file:v1.0.0
title: Exact rational Gamma2 admission and complete presentation evidence
status: active_provisional
crate: core_functional
file: crates_rs/core_functional/src/gamma2.rs
layer: functional
role: finite_exact_closure_defect_measurement
authority_effect: none
evidence_ceiling: LocalReplay
customer_claim_allowed: false
runtime_enforcement: true
owns:
  - rectangular_declared_complex_and_residual_admission
  - zero_denominator_refusal_before_all_rational_arithmetic
  - canonical_signed_and_unreduced_rational_inputs
  - exact_chain_law_before_quotient_interpretation
  - explicit_raw_versus_quotient_result_types
  - unweighted_C2_L1_coboundary_evaluation
  - complete_validated_complex_retained_with_each_exact_result
  - fail_closed_unknown_and_duplicate_complex_wire_fields
does_not_own:
  - physical_or_mathematical_authority
  - carrier_basis_or_actor_identity_authentication
  - request_size_or_integer_bit_size_limits
  - weighted_norm_or_tolerance_semantics
  - evaluation_hierarchy_or_Phi1_selection_policy
  - untrusted_Gamma2Artifact_claim_or_hash_authentication
  - arbitrary_legacy_Python_mirror_API_parity
may_call:
  - exact_rational_arithmetic
must_not:
  - treat_a_shape_deserialized_artifact_as_checked_evidence
  - truncate_a_residual_or_matrix_row_silently
  - turn_a_non_chain_into_quotient_evidence
  - erase_d1_when_equal_scalar_results_are_retained
  - treat_absent_C2_as_a_declared_zero_dimensional_C2
exactness:
  mode: exact_finite_rational_unweighted_closure_defect
  exact_constructor_required: true
  approximate_modes_allowed: false
forbidden_substrings: []
required_substrings:
  - "fn validate_rationals"
  - "ExactGamma2Error::ZeroDenominator"
  - "complex.validate()?"
  - "pub fn complex(&self) -> &ExactCochainComplexQ"
  - "Untrusted descriptive artifact"
required_tests:
  - gamma2::tests::test_exact_gamma2_checks_cochain_identity_and_value
  - gamma2::tests::test_exact_gamma2_rejects_nonzero_d1_d0
  - gamma2::tests::rejects_missing_complex2
  - gamma2::tests::struct_literal_complex_cannot_bypass_the_chain_law
  - gamma2::tests::short_residual_refuses_instead_of_truncating_to_zero
  - gamma2::tests::untrusted_artifact_claim_cannot_replace_exact_gamma2_recomputation
  - gamma2::tests::every_declared_matrix_dimension_has_a_decisive_shape_refusal
  - gamma2::tests::zero_denominators_are_refused_before_even_vacuous_arithmetic
  - gamma2::tests::signed_unreduced_inputs_are_canonicalized_and_bind_the_complete_complex
  - gamma2::tests::distinct_closure_maps_do_not_collapse_to_identical_zero_evidence
  - gamma2::tests::empty_middle_space_does_not_expand_unstored_outer_coordinates
  - gamma2::tests::raw_closure_is_not_quotient_evidence_and_ragged_maps_are_refused
  - gamma2::tests::l20a1_gamma2_vanishes_on_a_nonzero_coboundary
  - gamma2::tests::l20a_gamma2_descends_to_the_quotient
  - gamma2::tests::l20a3_gamma2_is_positive_on_a_non_closed_residual
  - gamma2::tests::l20a2_survivor_winding_cochain_is_closed
  - gamma2::tests::l20a_p0_dependency_gamma2_refuses_non_exact_complex
  - gamma2::seal_tests::untrusted_payload_violating_the_chain_law_fails_to_deserialize
  - gamma2::seal_tests::valid_payload_still_round_trips_through_the_seal
  - gamma2::seal_tests::unknown_or_duplicate_wire_fields_cannot_be_silently_ignored
  - gamma2::seal_tests::wire_denominator_refusal_is_not_mistaken_for_chain_law_evidence
  - gamma2::seal_tests::explicit_complex2_wire_cannot_ignore_unsupported_structure_claims
lean_obligations: []
relationships:
  extends:
    - urn:core:constitution:base_file_contract:file:v1.0.0
