schema_version: core.file_contract.v1
kind: rust_file_contract
contract_id: urn:core:rust:core_functional:finite_graph_aggregation:file:v1.0.0
title: Exact finite graph aggregation with explicit counterexamples and loss accounting
status: active_provisional
crate: core_functional
file: crates_rs/core_functional/src/aggregation.rs
layer: functional
role: immutable_declared_graph_partition_diagnostic
authority_effect: none
evidence_ceiling: LocalReplay
customer_claim_allowed: false
runtime_enforcement: true
owns:
  - checked_finite_edge_endpoints_and_dense_onto_partition
  - canonical_exact_rational_block_averages
  - retained_fine_values_edges_and_individual_defects
  - explicit_collapsed_edge_indices_and_surviving_multigraph_edges
  - retained_grid_and_contiguous_block_construction_identity
  - exact_observed_decreased_unchanged_or_increased_scalar_comparison
  - no_authority_promotion
does_not_own:
  - universal_coarse_graining_monotonicity_theorem
  - primary_obstruction_scores_or_candidate_ranking
  - workload_terminal_verdicts_or_actor_licensing
  - authenticated_carrier_or_native_binary_identity
  - ingress_byte_or_integer_bit_limits
  - legacy_float_API_or_simple_coarse_grid_parity
may_call: []
must_not:
  - ignore_supplied_edges_and_invent_a_chain
  - merge_parallel_edges_or_erase_collapsed_fine_defects
  - hide_a_counterexample_with_tolerance_or_a_default_true_flag
  - drop_leftover_vertices_or_invalid_partition_blocks
  - silently_infer_open_or_periodic_grid_boundary
  - expose_unchecked_result_construction_or_deserialization
exactness:
  mode: exact_finite_rational_graph_arithmetic
  exact_constructor_required: true
  approximate_modes_allowed: false
forbidden_substrings: []
required_substrings:
  - "pub struct AggregationMonotonicity"
  - "AggregationError::BlockLabel"
  - "AggregationError::GridEmptyAxis"
  - "std::cmp::Ordering::Greater => DefectComparison::Increased"
  - "collapsed_edge_indices.push(fine_edge_index)"
required_tests:
  - "aggregation::tests::collapsed_edges_preserve_fine_evidence_and_do_not_invent_a_chain"
  - "aggregation::tests::arbitrary_averaging_has_a_decisive_monotonicity_counterexample"
  - "aggregation::tests::parallel_reversed_and_self_loop_edges_retain_their_actual_multiplicity"
  - "aggregation::tests::noncontiguous_unequal_blocks_use_the_declared_partition_and_exact_averages"
  - "aggregation::tests::invalid_labels_and_edge_endpoints_are_typed_refusals_before_indexing"
  - "aggregation::tests::missing_extra_and_invalid_rational_values_cannot_enter_even_edgeless_results"
  - "aggregation::tests::block_sizes_leftovers_grid_shapes_and_overflow_are_distinct_refusals"
  - "aggregation::tests::grid_open_and_periodic_boundaries_are_explicit_not_inferred"
  - "aggregation::tests::grid_block_projection_keeps_crossing_parallel_edges_and_collapsed_edge_ledger"
  - "aggregation::tests::signed_unreduced_input_is_canonical_immutable_and_has_no_terminal_claim"
  - "aggregation::tests::empty_graph_and_singleton_periodic_loops_are_explicit_degenerate_data"
  - "aggregation::tests::empty_axis_refusal_and_grid_origin_do_not_disappear_in_zero_evidence"
lean_obligations: []
relationships:
  extends:
    - urn:core:constitution:base_file_contract:file:v1.0.0
