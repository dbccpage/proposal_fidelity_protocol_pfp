schema_version: core.contract.v1
contract_id: urn:core:evidence:append_log:v1.0.0
title: AppendLog
kind: evidence_contract
status: active
layer: 02_evidence
role: Trace
descriptor:
  authority_effect: evidence_only
  evidence_ceiling: LocalReplay
  runtime_enforcement: false
  customer_claim_allowed: false
  dependencies:
    contracts: []
    proof_obligations: []
  terminals:
    may_emit: []
    may_support: []
  refusals:
    may_emit: []
  operator_classes:
    may_support: []
    must_not_self_assign: true
  constitution:
    contract_dependencies: []
    emits: EvidenceEnvelope
    authority_layer: Evidence
    replay_certificates:
    - schema_hash
  constraints:
    immutable_after_emit: true
    mutation_forbidden: true
doctrine:
  summary: Append-only hash-chained JSONL decision log. Each record seals
    sequence, parent digest, and payload under SHA-256; open replays and
    verifies the ENTIRE chain before returning, refusing tampered, truncated,
    reordered, or blank-padded files as typed violations. Records are only
    ever appended (fsync before acknowledge); existing bytes are never
    rewritten. Appending a record is diagnostic evidence only and mints no
    authority. Carrier for the M1 Stripe webhook claim/complete idempotency
    ledger (PKT-20260722-M1-EPOCH3).
  non_role: []
rust_binding:
  crate: core_replay
  module: append_log
  symbols:
  - AppendLogV1
  - AppendLogRecordV1
  - AppendLogError

relationships:
  extends:
    - "urn:core:constitution:base_evidence_contract:v1.0.0"
