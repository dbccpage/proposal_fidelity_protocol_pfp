[package]
autotests = false
name = "core_epk"
version.workspace = true
edition = "2021"
description = "Evaluated Path Kernels (LGGR I, II, III, IV, V, and VI: exact path composition, completion reflection, soundness check, Gram probing, and detector adequacy)."
authors = ["Sentinel Contributors"]
license.workspace = true

[dependencies]
blake3 = "1.8"
core_policy = { path = "../core_policy" }
core_holonomy = { path = "../core_holonomy" }
core_homology = { path = "../core_homology" }
num-bigint = { version = "0.4", features = ["serde"] }
num-rational = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
core_types = { path = "../core_types" }
core_functional = { path = "../core_functional" }
core_replay = { path = "../core_replay" }
core_linear_algebra = { package = "linear_algebra", path = "../core_linear_algebra" }

[dev-dependencies]
core_kernel = { path = "../core_kernel" }

