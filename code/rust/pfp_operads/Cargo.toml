[package]
name = "pfp_operads"
version = "0.8.0"
license.workspace = true
edition = "2021"
description = "The operad host for PFP workflows: typed terms over the canon, a law battery, the failure ledger and the records the host writes for it, the seed a run loads from it, stored workflow turns judged into ledger records, the reply checks of the full-slot and pre-mining workflows, candidates the host runs itself, bounded repair of a supplied patch on a working copy, and the host side of the workflow families (prompts, sealed-value guard, exact checks, verdict)"

[dependencies]
core_operad_canon = { path = "../core_operad_canon" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
regex = "1.10"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "pfp_operad"
path = "src/bin/pfp_operad.rs"

