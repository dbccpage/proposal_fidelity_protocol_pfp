[package]
name = "pfp_operads"
version = "0.4.0"
license.workspace = true
edition = "2021"
description = "The operad host for PFP workflows: typed terms over the canon, a law battery, the failure ledger and the records the host writes for it, and the reply checks of the full-slot and pre-mining workflows"

[dependencies]
core_operad_canon = { path = "../core_operad_canon" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
num-bigint = "0.4"
regex = "1.10"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "pfp_operad"
path = "src/bin/pfp_operad.rs"

[[test]]
name = "laws"
path = "tests/laws.rs"

[[test]]
name = "ledger"
path = "tests/ledger.rs"

[[test]]
name = "host"
path = "tests/host.rs"

[[test]]
name = "envelope"
path = "tests/envelope.rs"

[[test]]
name = "judge"
path = "tests/judge.rs"

[[test]]
name = "mining"
path = "tests/mining.rs"

[[test]]
name = "grounding"
path = "tests/grounding.rs"

[[test]]
name = "learning"
path = "tests/learning.rs"
