[package]
name = "pfp_operads"
version.workspace = true
license.workspace = true
edition = "2021"
description = "The operad host for PFP workflows: typed terms over the canon, a behavioural law battery, and the failure ledger"

[dependencies]
core_operad_canon = { path = "../core_operad_canon" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "pfp_operad"
path = "src/bin/pfp_operad.rs"

[[test]]
name = "laws"
path = "tests/laws.rs"

[[test]]
name = "ledger"
path = "tests/ledger.rs"

[[test]]
name = "host"
path = "tests/host.rs"
