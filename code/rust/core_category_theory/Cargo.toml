[package]
autotests = false
name = "core_category_theory"
version.workspace = true
license.workspace = true
edition = "2021"

[lib]
# Canonical entry: hierarchical shells + legacy finite records (legacy_adjunction / legacy_monad).
# `src/mod.rs` is a stale dual entry and does not declare legacy modules — do not point here.
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
num-rational = "0.4"
num-traits = "0.2"

