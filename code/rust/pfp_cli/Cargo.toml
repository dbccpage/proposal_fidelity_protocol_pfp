[package]
name = "pfp-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Offline, read-only checks for prompts and model replies, plus tamper-evident packets (Proposal Fidelity Protocol)"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/dbccpage/proposal_fidelity_protocol_pfp"
readme = "README.md"
keywords = ["prompt", "llm", "lint", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]

# Standalone on purpose: the engine workspace next door pulls in heavy crates.
# This crate needs only the detector pharmacy, so it builds fast, ships small,
# and its library compiles for wasm32.
[workspace]

[lib]
name = "pfp_cli"
path = "src/lib.rs"

[[bin]]
name = "pfp"
path = "src/main.rs"

[dependencies]
core_prompt_civilization = { path = "../core_prompt_civilization" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
