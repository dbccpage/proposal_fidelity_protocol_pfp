[package]
autotests = false
name = "core_contracts"
version.workspace = true
edition = "2021"
description = "Law/contract traits and generated bindings for the engine workspace"
authors = ["Sentinel Contributors"]
license.workspace = true
# Build-time contract gate: validates the v1 corpus firewall/identity before compiling.
build = "build.rs"

[dependencies]
syn = { version = "2.0.119", features = ["full"] }
core_types = { path = "../core_types" }
# NOTE (SG-LAYER-001 / PO-LAYER): core_contracts MUST NOT depend on
# core_replay. Contracts are governance law; replay is verification machinery.
# Shared trace vocabulary (TraceArtifact, VoidTrace) lives in the foundation
# crate core_types::trace_artifact. Re-adding an core_replay edge here
# re-inverts the layer order and must be refused.
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
sha2 = "0.10"
blake3 = { version = "1.8.3", features = ["serde"] }
erased-serde = "0.4"
thiserror = "2"

[build-dependencies]
syn = { version = "2.0.119", features = ["full"] }
core_types = { path = "../core_types" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"


[dev-dependencies]
num-rational = "0.4"
num-bigint = "0.4"
linear_algebra = { path = "../core_linear_algebra" }
core_solvers = { path = "../core_solvers" }
core_policy = { path = "../core_policy" }
core_kernel = { path = "../core_kernel" }
core_functional = { path = "../core_functional" }
# Parse declared module items; comments/strings are not Rust bindings.
# This already-locked parser is used offline, not installed as a tool.
syn = { version = "2.0.119", features = ["full"] }

[[bin]]
name = "core_contract_binding_audit"
path = "src/core_contract_binding_audit.rs"

[[bin]]
name = "validate_architecture"
path = "src/validate_architecture.rs"

