[package]
autotests = false
name = "pfp_runtime"
version.workspace = true
edition = "2021"
description = "Symbol Game round loop: candidate packets, host round records, frontier state, and exact domain adapters"
authors = ["Sentinel Contributors"]
license.workspace = true

[dependencies]
linear_algebra = { path = "../core_linear_algebra" }
core_kernel = { path = "../core_kernel" }
core_operad_theory = { path = "../core_operad_theory" }
core_prompt_civilization = { path = "../core_prompt_civilization" }
core_wdp = { path = "../core_wdp" }
core_functional = { path = "../core_functional" }
core_quantum_physics = { path = "../core_quantum_physics" }
core_homology = { path = "../core_homology" }
core_holonomy = { path = "../core_holonomy" }
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
unicode-normalization = "0.1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ryu = "1.0"
blake3 = "1.8"
serde_yaml = "0.9"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[[bin]]
name = "symgam"
path = "src/main.rs"

