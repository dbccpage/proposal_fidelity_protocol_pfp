[package]
autotests = false
name = "core_quantum_physics"
version.workspace = true
edition = "2021"
description = "Exact finite quantum physics: states, operators, channels, measurements, correlations and dynamics (AuthorityEffect None)"
license.workspace = true

[dependencies]
core_policy = { path = "../core_policy" }
core_certifiers = { path = "../core_certifiers" }
core_holonomy = { path = "../core_holonomy" }
linear_algebra = { path = "../core_linear_algebra" }
core_homology = { path = "../core_homology" }
core_functional = { path = "../core_functional" }
core_solvers = { path = "../core_solvers" }
core_number_theory = { path = "../core_number_theory" }
core_finite_probability = { path = "../core_finite_probability" }
core_fusion_categories = { path = "../core_fusion_categories" }
core_kernel = { path = "../core_kernel" }
core_combinatorics = { path = "../core_combinatorics" }
core_category_theory = { path = "../core_category_theory" }
core_lie_theory = { path = "../core_lie_theory" }
core_majorana = { path = "../core_majorana" }
core_general_relativity = { path = "../core_general_relativity" }
constants = { path = "../constants" }
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
num-integer = "0.1"
serde = { version = "1.0", features = ["derive"] }
num-complex = { version = "0.4.6", features = ["serde"] }
nalgebra = { version = "0.33", features = ["serde-serialize"] }
thiserror = "2"
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }

[dev-dependencies]
serde_json = { version = "1.0", features = ["arbitrary_precision", "raw_value"] }
proptest = "1.5"

[[bin]]
name = "emit_pfp_workpads"
path = "src/bin/emit_pfp_workpads.rs"

[[test]]
name = "qddc"
path = "../tests/core_quantum_physics/qddc.rs"

