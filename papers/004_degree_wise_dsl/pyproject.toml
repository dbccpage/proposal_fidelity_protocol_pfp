[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-009-degree-wise-dsl"
version = "2.1.0"
description = "Degree-Wise Obstruction Calculus and Symbolic DSL: Graded Cochain Complexes, Degree Separation, and Local-Global Gate Non-Factorization"
authors = [{ name = "Jeremy H. Carroll" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "nbclient>=0.7.0",
    "nbformat>=5.7.0",
    "pymupdf>=1.23.0",
]

[tool.mypy]
python_version = "3.12"
mypy_path = ["code"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pytest.*", "nbclient.*", "nbformat.*", "pymupdf.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
