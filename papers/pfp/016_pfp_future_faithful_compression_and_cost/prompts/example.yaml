    "terminals": [
      "t"
    ],
    "transitions": {
      "r": {
        "direct": [
          "5",
          "t"
        ],
        "next": [
          "1",
          "s"
        ],
        "loop": [
          "1",
          "r"
        ]
      },
      "s": {
        "finish": [
          "1",
          "t"
        ]
      },
      "t": {}
    },
    "question": "Submit a terminating route and its exact minimum operating cost.",
    "binding": "Costs are decoded as exact Fractions. Replay the submitted route and compare its claimed price with independent simple-path enumeration."
