[package]
name = "pfp_sign_graph"
version = "0.1.0"
edition = "2021"
authors = ["Jeremy H. Carroll"]
description = "Self-contained exact finite sign holonomy and Z2 gauge certification solver for PFP Paper 002"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
num-rational = "0.4"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[[bin]]
name = "solve_sign_graph"
path = "src/bin/solve_sign_graph.rs"

[lib]
name = "pfp_sign_graph"
path = "src/lib.rs"
