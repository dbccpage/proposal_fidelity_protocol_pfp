[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfp-v-practitioners-guide"
version = "0.1.0"
description = "Companion code for PFP V: A Practitioner's Guide to Checked Proposals"
readme = "README.md"
authors = [{ name = "Jeremy H. Carroll" }]
license = { file = "LICENSE-CODE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff==0.14.13",
]

[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
