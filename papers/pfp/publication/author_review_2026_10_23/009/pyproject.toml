[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-009-reviewing-claims"
version = "0.1.0"
description = "Reviewing claims against code and evidence: a review protocol with worked examples"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Jeremy H. Carroll" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "ruff>=0.9", "mypy>=1.0"]
notebooks = ["nbclient>=0.8.0", "nbformat>=5.9.0", "ipykernel>=6.0.0"]

[tool.setuptools]
package-dir = { "" = "code" }
py-modules = ["triangle_cycle_sum", "review_counts"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
files = ["code/triangle_cycle_sum.py", "code/review_counts.py"]
warn_unused_ignores = true
