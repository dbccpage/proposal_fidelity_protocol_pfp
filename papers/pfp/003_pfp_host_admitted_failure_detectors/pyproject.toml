[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfp-003-host-admitted-failure-detectors"
version = "0.1.0"
description = "PFP III: Admitting Failure Detectors and Testing Their Effects (package code and tests)"
authors = [{ name = "Jeremy H. Carroll" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff==0.14.13",
]

[tool.setuptools]
package-dir = {"" = "code"}

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "-ra -q --import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["code"]
mypy_path = "code"
warn_unused_configs = true
