[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfp-x-host-checking-finite-algebraic-challenges"
version = "0.1.0"
description = "PFP X: exact host checking of model verdicts on small finite algebraic challenges"
authors = [{ name = "Jeremy H. Carroll" }]
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff==0.14.13",
    "mypy==1.19.1",
]

[tool.setuptools]
packages = []
py-modules = ["holonomy"]
package-dir = {"" = "code"}

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["code"]
mypy_path = "code"
explicit_package_bases = true
