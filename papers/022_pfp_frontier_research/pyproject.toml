[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-020-symbol-game-frontier-research"
version = "0.1.0"
description = "Multi-agent evaluation tournaments and adaptive noise mitigation in the Symbol Game"
authors = [{ name = "Jeremy H. Carroll" }]
license = { text = "PolyForm-Noncommercial-1.0.0" }
readme = "README.md"
requires-python = "==3.12.*"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
addopts = "-q --strict-markers --import-mode=importlib"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools]
packages = []
