<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">Alpha execution and declared Symbol Game host adapter</title>
  <desc id="desc">An Alpha source program supplies a token, admits data, imposes a distinction, and admits a form and instance. The Alpha host observes separation and replays six events. In a separate maintenance script, two invoked repairs each emit two events and a satisfied checkpoint emits zero. A dashed declared mapping translates a separation observation into a one-edge claim on a Symbol Game board. Three red refusal paths show an arity error, missing adapter, and self-edge invariant violation. A separate three-cycle has initial Phi one equal to three and reaches zero only after replacing claims.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8fb}.title{font:700 29px system-ui,Segoe UI,sans-serif;fill:#14243d}.sub{font:16px system-ui,Segoe UI,sans-serif;fill:#3e506e}.head{font:700 19px system-ui,Segoe UI,sans-serif;fill:#172843}.body{font:15px system-ui,Segoe UI,sans-serif;fill:#253750}.mono{font:15px Consolas,monospace;fill:#152b47}.tiny{font:13px system-ui,Segoe UI,sans-serif;fill:#415472}.blue{fill:#e9f3ff;stroke:#4d83bb;stroke-width:2}.green{fill:#e9f8ef;stroke:#47a16d;stroke-width:2}.amber{fill:#fff4e4;stroke:#cc9742;stroke-width:2}.red{fill:#fff0f1;stroke:#c9525b;stroke-width:2}.line{stroke:#356496;stroke-width:3;fill:none}.dash{stroke:#aa7430;stroke-width:3;stroke-dasharray:9 6;fill:none}.refuse{stroke:#c9525b;stroke-width:2;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#356496" stroke-width="2"/></marker>
    <marker id="amberarrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#aa7430" stroke-width="2"/></marker>
  </defs>
  <rect class="bg" width="1200" height="670"/>
  <text class="title" x="35" y="50">From Alpha events to a checked host proposal</text>
  <text class="sub" x="35" y="78">Real interpreter and governor runs; the cross-system interpretation is explicitly declared.</text>

  <rect class="blue" x="35" y="110" width="318" height="300" rx="15"/>
  <text class="head" x="56" y="145">1 · Alpha 0.2 source</text>
  <text class="mono" x="56" y="184">supply &lt;a&gt;</text>
  <text class="tiny" x="56" y="207">event; admitted data = 0</text>
  <text class="mono" x="56" y="244">admit datum a &lt;a&gt;</text>
  <text class="mono" x="56" y="269">admit datum b &lt;ab&gt;</text>
  <text class="mono" x="56" y="294">impose a b</text>
  <text class="tiny" x="56" y="319">demand does not separate by itself</text>
  <text class="mono" x="56" y="355">admit form seen 1</text>
  <text class="mono" x="56" y="380">admit instance seen a</text>

  <path class="line" d="M355 257 H392" marker-end="url(#arrow)"/>
  <rect class="blue" x="400" y="110" width="340" height="300" rx="15"/>
  <text class="head" x="421" y="145">2 · Alpha host observations</text>
  <text class="mono" x="421" y="185">check collapsed a b</text>
  <text class="tiny" x="421" y="209">true before the distinguishing instance</text>
  <text class="mono" x="421" y="250">check separate a b</text>
  <text class="tiny" x="421" y="274">true after admission</text>
  <text class="mono" x="421" y="315">replay</text>
  <text class="tiny" x="421" y="340">2 data · 1 form · 6 events</text>
  <text class="tiny" x="421" y="363">checks add diagnostics, no events</text>
  <text class="tiny" x="421" y="393">other script: maintenance emits 2 + 2 + 0</text>

  <path class="dash" d="M742 257 H783" marker-end="url(#amberarrow)"/>
  <text class="tiny" x="745" y="235">declared map</text>
  <rect class="amber" x="790" y="110" width="375" height="300" rx="15"/>
  <text class="head" x="811" y="145">3 · Symbol Game host board</text>
  <text class="body" x="811" y="184">Gate: source SHA-256 + replay +</text>
  <text class="body" x="811" y="208">named diagnostic + interpretation</text>
  <text class="mono" x="811" y="255">separate(a,b) ↦ edge(a,b)=1</text>
  <text class="tiny" x="811" y="281">this mapping is a teaching convention</text>
  <text class="mono" x="811" y="329">ASSERT · VERIFY</text>
  <text class="body" x="811" y="358">one-edge Φ₁ = 0 on this board</text>

  <rect class="red" x="35" y="450" width="350" height="135" rx="13"/>
  <text class="head" x="55" y="485">Alpha refusal</text>
  <text class="body" x="55" y="516">binary form + one argument → line 4</text>
  <text class="body" x="55" y="541">no successful replay summary</text>
  <path class="refuse" d="M195 449 V411"/>

  <rect class="red" x="425" y="450" width="350" height="135" rx="13"/>
  <text class="head" x="445" y="485">Adapter refusal</text>
  <text class="body" x="445" y="516">source changed or mapping absent</text>
  <text class="body" x="445" y="541">no edge claim is sent to host</text>
  <path class="refuse" d="M600 449 V411"/>

  <rect class="red" x="815" y="450" width="350" height="135" rx="13"/>
  <text class="head" x="835" y="485">Host refusal / other board</text>
  <text class="body" x="835" y="516">self-edge → InvariantViolation</text>
  <text class="body" x="835" y="541">3-cycle Φ₁: 3 → CUT → 0</text>
  <path class="refuse" d="M990 449 V411"/>

  <text class="sub" x="35" y="628">Finite execution ≠ semantic bridge ≠ production Omega decision. Each arrow needs its own contract and receipt.</text>
</svg>
