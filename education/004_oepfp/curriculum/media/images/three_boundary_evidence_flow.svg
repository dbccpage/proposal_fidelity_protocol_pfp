<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
  <title id="title">Genesis, Symbol Game, and Engine evidence boundaries</title>
  <desc id="desc">Three separate source panels feed a comparison and target replay ledger. Dashed lines are comparisons, not derivations. A lower bar lists the evidence fields required for any bridge.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8fb}.heading{font:700 30px system-ui,Segoe UI,sans-serif;fill:#17243b}.sub{font:16px system-ui,Segoe UI,sans-serif;fill:#42536c}.panel{stroke-width:2}.ph{font:700 23px system-ui,Segoe UI,sans-serif;fill:#17243b}.body{font:16px system-ui,Segoe UI,sans-serif;fill:#25334a}.small{font:14px system-ui,Segoe UI,sans-serif;fill:#40516a}.tag{font:700 13px system-ui,Segoe UI,sans-serif}.dash{stroke:#65758f;stroke-width:2;stroke-dasharray:7 7;fill:none}.solid{stroke:#244d83;stroke-width:2.5;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#244d83" stroke-width="2"/></marker>
  </defs>
  <rect class="bg" width="1120" height="610"/>
  <text class="heading" x="45" y="55">One lesson, three evidence boundaries</text>
  <text class="sub" x="45" y="85">A comparison requires a named source and a target check at every arrow.</text>
  <rect class="panel" x="45" y="122" rx="17" width="315" height="260" fill="#fff4e5" stroke="#db9e42"/>
  <rect class="panel" x="402" y="122" rx="17" width="315" height="260" fill="#e8f4ff" stroke="#5c9bd4"/>
  <rect class="panel" x="759" y="122" rx="17" width="315" height="260" fill="#e8f7ef" stroke="#5caa7b"/>
  <text class="ph" x="68" y="162">Genesis</text>
  <text class="small" x="68" y="190">Native derivation source</text>
  <text class="body" x="68" y="235">Name the theorem or receipt.</text>
  <text class="body" x="68" y="264">Pin its exact revision.</text>
  <text class="body" x="68" y="293">Keep its hypotheses.</text>
  <text class="tag" x="68" y="352" fill="#965c08">NATIVE CLAIM: EXACT SCOPE ONLY</text>
  <text class="ph" x="425" y="162">Symbol Game</text>
  <text class="small" x="425" y="190">Finite research model</text>
  <text class="body" x="425" y="235">Declare carrier and maps.</text>
  <text class="body" x="425" y="264">Compute or prove locally.</text>
  <text class="body" x="425" y="293">Record open bridges.</text>
  <text class="tag" x="425" y="352" fill="#216396">RESEARCH: OPEN OBSTRUCTION</text>
  <text class="ph" x="782" y="162">Engine</text>
  <text class="small" x="782" y="190">Concrete host implementation</text>
  <text class="body" x="782" y="235">Recompute target predicates.</text>
  <text class="body" x="782" y="264">Refuse invalid proposals.</text>
  <text class="body" x="782" y="293">Retain the replay receipt.</text>
  <text class="tag" x="782" y="352" fill="#24764c">LOCAL CHECK: NO AUTHORITY</text>
  <path class="dash" d="M360 251 H400"/><path class="dash" d="M717 251 H757"/>
  <text class="small" x="456" y="426">Dashed links mean comparison, never automatic theorem transfer.</text>
  <path class="solid" d="M559 442 V470" marker-end="url(#arrow)"/>
  <rect x="45" y="480" rx="15" width="1029" height="98" fill="#172f53"/>
  <text x="70" y="515" style="font:700 19px system-ui,Segoe UI,sans-serif;fill:#fff">Before any bridge: preserve the evidence record</text>
  <text x="70" y="547" style="font:16px system-ui,Segoe UI,sans-serif;fill:#e5efff">source bytes + assumptions + typed map + target checker + loss ledger + claim ceiling</text>
</svg>
