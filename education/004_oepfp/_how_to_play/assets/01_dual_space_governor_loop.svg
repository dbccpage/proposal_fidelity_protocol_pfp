<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-llm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2"/>
      <stop offset="100%" stop-color="#357abd"/>
    </linearGradient>
    <linearGradient id="grad-gate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#d68910"/>
    </linearGradient>
    <linearGradient id="grad-gov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27ae60"/>
      <stop offset="100%" stop-color="#1e8449"/>
    </linearGradient>
    <linearGradient id="grad-rec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e44ad"/>
      <stop offset="100%" stop-color="#6c3483"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2c3e50"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#27ae60"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc" rx="12"/>
  <rect x="20" y="20" width="920" height="440" fill="none" stroke="#e2e8f0" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="480" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">
    The Dual-Space Architecture &amp; Discrete Host Governor Loop
  </text>
  <text x="480" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Separation of Unconstrained Generation (Continuous Space) from Deterministic Replay (Discrete Host)
  </text>

  <!-- Layer 1: Continuous LLM Proposer Box -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="220" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="220" height="45" rx="10" fill="url(#grad-llm)"/>
    <rect y="35" width="220" height="10" fill="url(#grad-llm)"/>
    <text x="110" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
      Continuous Proposer
    </text>
    <text x="110" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
      LLM / Solver / Human
    </text>
    <text x="20" y="100" font-family="monospace" font-size="11" fill="#475569">• Autoregressive Softmax</text>
    <text x="20" y="122" font-family="monospace" font-size="11" fill="#475569">• Unconstrained CoT</text>
    <text x="20" y="144" font-family="monospace" font-size="11" fill="#475569">• Generates candidate turns:</text>
    <rect x="20" y="155" width="180" height="50" rx="6" fill="#f1f5f9"/>
    <text x="30" y="174" font-family="monospace" font-size="10" fill="#0f172a">{"move": "CUT",</text>
    <text x="30" y="190" font-family="monospace" font-size="10" fill="#0f172a"> "proposed_claims": ...}</text>
    <text x="110" y="225" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b" text-anchor="middle">
      Layer 1 / Layer 2
    </text>
  </g>

  <!-- Connection: LLM -> Packet Firewall -->
  <path d="M 280 230 L 350 230" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="315" y="218" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">
    RFC 8785
  </text>
  <text x="315" y="246" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
    Proposal
  </text>

  <!-- Middle: Packet Firewall & Gate -->
  <g transform="translate(360, 150)" filter="url(#shadow)">
    <rect width="180" height="160" rx="10" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/>
    <rect width="180" height="35" rx="10" fill="url(#grad-gate)"/>
    <rect y="25" width="180" height="10" fill="url(#grad-gate)"/>
    <text x="90" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">
      FW-CARRIER &amp; MOVE
    </text>
    <text x="15" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Valid Move Vocabulary?</text>
    <text x="15" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Edges in Pinned E?</text>
    <text x="15" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• Carrier Domain Sealed?</text>
    <rect x="15" y="112" width="150" height="28" rx="5" fill="#fef3c7"/>
    <text x="90" y="130" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#b45309" text-anchor="middle">
      No Smuggled Edges
    </text>
  </g>

  <!-- Connection: Firewall -> Governor -->
  <path d="M 540 230 L 610 230" fill="none" stroke="#2c3e50" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="575" y="220" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">
    Admitted
  </text>

  <!-- Right: Discrete Host Governor -->
  <g transform="translate(620, 110)" filter="url(#shadow)">
    <rect width="270" height="240" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <rect width="270" height="45" rx="10" fill="url(#grad-gov)"/>
    <rect y="35" width="270" height="10" fill="url(#grad-gov)"/>
    <text x="135" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
      Discrete Host Governor (L3)
    </text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">1. Strict Lyapunov Descent Gate</text>
    <text x="35" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Φ₁(S') &lt; Φ₁(S) (Strict Monotonicity)</text>
    <text x="20" y="115" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">2. Turn Fuel Counter (Fuel - 1)</text>
    <text x="35" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Finite Operational Closure Bound</text>
    <text x="20" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">3. Invariant Ledger Updates</text>
    <text x="35" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Append-only Invariants &amp; History</text>
    <text x="20" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#15803d">4. Terminal Verification Oracle</text>
    <text x="35" y="225" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Φ₁ == 0 → Certified Terminal Receipt</text>
  </g>

  <!-- Feedback Return Arrow: Governor -> LLM (Rollback / Admitted) -->
  <path d="M 755 350 L 755 410 L 170 410 L 170 340" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <rect x="360" y="396" width="240" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="480" y="413" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">
    Refusal / Rollback Feedback (Zero Data-Loss)
  </text>

  <!-- Terminal Certified Outflow Arrow -->
  <path d="M 890 230 L 930 230" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <circle cx="940" cy="230" r="10" fill="#27ae60"/>
  <text x="940" y="234" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
</svg>
