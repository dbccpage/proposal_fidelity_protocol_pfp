<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <filter id="shadow-tr" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-tr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-tr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-tr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="#f8fafc" rx="12"/>
  <rect x="20" y="20" width="920" height="440" fill="none" stroke="#e2e8f0" stroke-width="2" rx="8"/>

  <!-- Title -->
  <text x="480" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="middle">
    Canonical 3-Cycle Triangle: Holonomy Defect &amp; Chord Repair
  </text>
  <text x="480" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">
    Standard Educational Board: Vertices V = {0, 1, 2} and Carrier Edges E = {0→1, 1→2, 2→0}
  </text>

  <!-- Left: Defective State (Phi_1 = 6) -->
  <g transform="translate(60, 95)" filter="url(#shadow-tr)">
    <rect width="380" height="340" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <rect width="380" height="38" rx="10" fill="#fee2e2"/>
    <rect y="28" width="380" height="10" fill="#fee2e2"/>
    <text x="190" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">
      Initial Defective State: Φ₁ = 6 (Unbalanced)
    </text>

    <!-- Triangle Vertices: V0 (190, 80), V1 (310, 260), V2 (70, 260) -->
    <!-- Edge 0->1 -->
    <path d="M 200 95 L 295 240" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-tr-red)"/>
    <rect x="260" y="150" width="65" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="292" y="167" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">c(0→1)=2</text>

    <!-- Edge 1->2 -->
    <path d="M 290 265 L 90 265" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-tr-red)"/>
    <rect x="155" y="278" width="65" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="187" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">c(1→2)=1</text>

    <!-- Edge 2->0 -->
    <path d="M 85 240 L 180 95" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-tr-red)"/>
    <rect x="55" y="150" width="65" height="26" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
    <text x="87" y="167" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">c(2→0)=3</text>

    <!-- Vertex 0 -->
    <circle cx="190" cy="80" r="18" fill="#1e293b"/>
    <text x="190" y="86" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>

    <!-- Vertex 1 -->
    <circle cx="310" cy="260" r="18" fill="#1e293b"/>
    <text x="310" y="266" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

    <!-- Vertex 2 -->
    <circle cx="70" cy="260" r="18" fill="#1e293b"/>
    <text x="70" y="266" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

    <!-- Center Holonomy Defect Badge -->
    <circle cx="190" cy="200" r="30" fill="#dc2626" opacity="0.15"/>
    <circle cx="190" cy="200" r="24" fill="#ef4444"/>
    <text x="190" y="197" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Φ₁</text>
    <text x="190" y="211" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>

    <text x="190" y="325" font-family="monospace" font-size="11" fill="#7f1d1d" text-anchor="middle">
      Circulation = 2 + 1 + 3 = 6 ≠ 0
    </text>
  </g>

  <!-- Arrow between left and right -->
  <path d="M 460 260 L 500 260" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-tr-blue)"/>
  <rect x="445" y="210" width="70" height="38" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="480" y="226" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">CUT Move</text>
  <text x="480" y="240" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="middle">2→0: -3</text>

  <!-- Right: Repaired State (Phi_1 = 0) -->
  <g transform="translate(520, 95)" filter="url(#shadow-tr)">
    <rect width="380" height="340" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <rect width="380" height="38" rx="10" fill="#dcfce7"/>
    <rect y="28" width="380" height="10" fill="#dcfce7"/>
    <text x="190" y="25" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">
      Terminal Certified State: Φ₁ = 0 (Balanced)
    </text>

    <!-- Edge 0->1 -->
    <path d="M 200 95 L 295 240" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-tr-green)"/>
    <rect x="260" y="150" width="65" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="292" y="167" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">c(0→1)=2</text>

    <!-- Edge 1->2 -->
    <path d="M 290 265 L 90 265" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-tr-green)"/>
    <rect x="155" y="278" width="65" height="26" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
    <text x="187" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">c(1→2)=1</text>

    <!-- Edge 2->0 (Repaired) -->
    <path d="M 85 240 L 180 95" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="6,3" marker-end="url(#arrow-tr-blue)"/>
    <rect x="50" y="150" width="75" height="26" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="87" y="167" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1d4ed8" text-anchor="middle">c(2→0)= -3</text>

    <!-- Vertex 0 -->
    <circle cx="190" cy="80" r="18" fill="#1e293b"/>
    <text x="190" y="86" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>

    <!-- Vertex 1 -->
    <circle cx="310" cy="260" r="18" fill="#1e293b"/>
    <text x="310" y="266" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

    <!-- Vertex 2 -->
    <circle cx="70" cy="260" r="18" fill="#1e293b"/>
    <text x="70" y="266" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

    <!-- Center Balanced Badge -->
    <circle cx="190" cy="200" r="30" fill="#16a34a" opacity="0.15"/>
    <circle cx="190" cy="200" r="24" fill="#22c55e"/>
    <text x="190" y="197" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Φ₁</text>
    <text x="190" y="211" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>

    <text x="190" y="325" font-family="monospace" font-size="11" fill="#14532d" text-anchor="middle">
      Circulation = 2 + 1 + (-3) = 0 ✓
    </text>
  </g>
</svg>
