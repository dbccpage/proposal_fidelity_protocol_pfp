  OLLAMA_LOCAL_001: "codegemma:2b"
  OLLAMA_LOCAL_002: "gemma3:1b"
  OLLAMA_LOCAL_003: "llama3.2:latest"
  OLLAMA_LOCAL_004: "gemma3:4b"
  NVIDIA_NEMOTRON_70B: "nvidia/llama-3.1-nemotron-70b-instruct"
  NVIDIA_NEMOTRON_340B: "nvidia/nemotron-4-340b-instruct"
  GROQ_LLAMA3_70B: "groq/llama3-70b-8192"
  CEREBRAS_LLAMA3_1_70B: "cerebras/llama3.1-70b"
  ANTHROPIC_MODEL_001: "claude-sonnet-4.6"
  ANTHROPIC_MODEL_002: "claude-opus-4.6"
  ANTHROPIC_MODEL_003: "claude-haiku-4.5"
  GEMINI_MODEL_001: "gemini-3-pro"
  GEMINI_MODEL_002: "gemini-3-flash"
  GEMINI_MODEL_003: "gemini-2.5-flash"

