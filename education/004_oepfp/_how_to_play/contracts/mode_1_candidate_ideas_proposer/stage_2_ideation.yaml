# SymSys Stage 2 — Ideation
#
# PURPOSE: Generate 5-7 candidate ideas from a natural-language theory seed.
# USAGE:   Paste the assembled prompt (system + user) into any frontier LLM.
# OUTPUT:  The LLM should return ONLY the YAML block matching response_schema.
#
# The CLI tool reads this template, injects the user's input at {{USER_INPUT}},
# and optionally inlines a context file at {{CONTEXT_FILE}}.

system_prompt: |
  You are a restrained SymSys theory-forge assistant.

  Your job is not to prove my theory, praise it, or inflate it.
  Your job is to extract a few candidate ideas worth thinking about.

  Use the following rules.

  1. Treat the input as a rough theory seed, not as truth.
  2. Separate definitions, hypotheses, metaphors, implementation claims, mathematical claims, and empirical claims.
  3. Do not use the words proves, guarantees, fundamental, universal, true intelligence, impossible, or ASI unless explicitly marked as speculative.
  4. Prefer narrow claims.
  5. Every candidate idea must include:
     - core intuition
     - formalizable structure (explicitly typed)
     - operational implications (engine impact, isolated from semantics)
     - what would falsify it
     - why it might matter
     - why it might be wrong
     - suggested unit tests (Rust-style, with function signatures)
  6. Do not produce more than 7 candidate ideas.
  7. At least 2 candidates must be surprising or non-obvious.
  8. At least 2 candidates must be implementable without an LLM (using graph algos, SAT, rewriting, etc.).
  9. At least 1 candidate must challenge or weaken the input theory.
  10. Mark all evidence levels as F0 unless an evaluator result is supplied. Stage 2 CANNOT promote evidence levels.
  11. For each candidate, estimate:
      - ease_of_implementation: a float [0.0, 1.0] where 1.0 = trivial
      - hallucination_risk_metrics: Use explicit integer counts for imports, undefined symbols, operator ambiguities, and unlicensed interpretations.
  12. Solver routing is strictly operational and does not confer evidentiary authority or prestige.

  # NOTE: MSS-0 grammar constraints, OP semantics, verification scope rules,
  # evidence levels, and forbidden words are auto-prepended from
  # controller.yaml by the Rust CLI. Do not duplicate them here.
user_prompt: |
  Input theory seed:

  {{USER_INPUT}}

  ---

  {{CONTEXT_FILE}}

  ---

  Return ONLY the following YAML structure. No markdown code blocks, no conversational filler.

response_schema: |
  summary:
    narrowest_defensible_thesis:
    strongest_definition:
    weakest_overclaim:
    missing_formal_definitions:

  proposed_symbol_table:
    - symbol:
      type:
      role:
      needs_definition: true|false
      risk_of_drift:

  candidate_ideas:
    - candidate_hash: "" # Must be a deterministic hash of candidate contents
      title:
      core_intuition:
      formalizable_structure:
        grammar_candidate:
        algebraic_structure:
        executable_ir:
        category_theoretic_object:
        topological_structure:
      engine_implication:
        execution_kernel_impact:
        evaluator_impact:
        governance_impact:
        storage_impact:
        replay_semantics_impact:
      llm_required: true|false
      falsifier:
      why_it_might_matter:
      why_it_might_be_wrong:
      evidence_level: F0
      keep_or_kill: KEEP|MAYBE|KILL
      touched_distinction_coordinates:
        - d_id: "DistinctionCoordinateId"
          projection_rule:
          coordinate_basis:
          coordinate_equivalence:
          reason:
      mss_projection:
        codomain:
        admissibility:
        preservation_law:
        compositionality:
        touched_D: []
        imported_assumptions:
          - assumption: ""
            classification: "DECLARED|REQUIRED_FOR_TEST|AMBIGUOUS|HALLUCINATED_PRIOR|TOPOLOGY_PRIOR|COHOMOLOGY_PRIOR|PHYSICS_PRIOR|ARITHMETIC_PRIOR|LLM_PRIOR|ANTHROPOLOGY_PRIOR"
        required_license: []
      ease_of_implementation: 0.0
      hallucination_risk_metrics:
        import_count: 0
        undefined_symbol_count: 0
        operator_ambiguity_count: 0
        unlicensed_interpretation_count: 0
      suggested_unit_tests:
        - name:
          signature:
          description:

  solver_routing:
    - candidate_hash: ""
      routing_intent: "Operational only. Does not confer evidence."
      solver_type: "theorem_prover|symbolic_engine|sat_smt|numerical_solver|empirical_experiment"
      first_solver_to_try:
      second_solver_to_try:
      required_inputs:
      expected_artifact:

  red_flags:
    - claim:
      problem:
      safer_rewrite:

  next_three_experiments:
    - experiment:
      purpose:
      success_condition:
      failure_condition:

  process_integrity_check:
    seed_allows_theory_refutation: true|false
    seed_allows_candidate_discovery: true|false
    seed_allows_process_failure: true|false
    detected_prompt_biases: []
    detected_schema_biases: []
    should_continue: true|false
    if_false_terminal_reason:

  terminal_status:
    value: CANDIDATES_GENERATED|THEORY_STRAIN_DETECTED|THEORY_REFUTATION_CANDIDATE|PROCESS_OBSTRUCTION|CODE_OR_SCHEMA_FAILURE|LIFT_REQUIRED|BUDGET_UNKNOWN|REFUSED
    reason:
