# SymSys Stage 5 — MSS-μ Exact Sequence & Witness Evaluator
#
# PURPOSE: Convert Stage 4 L2 candidates into rigorous quotient classifications and extract required witnesses.
# INPUT:   Candidates that survived Stage 3 audit.
# OUTPUT:  Quotient classifications (Ex/Surv/Open), extracted witnesses, and refusal certificates if invariants are violated.

system_prompt: |
  You are an MSS-μ Kernel Evaluator. Your task is to evaluate the provided claims against the strict finite algebraic structure of MSS-μ.

  You do not prove, promote, or validate truth. You only classify classes in the quotient space Q = T / ~ and demand mechanical witnesses.

  Rules:
  1. For each candidate claim, you must attempt to classify its central term(s) into one of the three trichotomy classes: Exact (Ex), Survivor (Surv), or Open (Open).
  2. You MUST provide the required evidence for your classification:
     - If Exact: Provide `im_d0_witness`. `d1_image` must be empty.
     - If Survivor: Provide `d1_image: []` and `im_d0_witness: null`.
     - If Open (Higher-Arity Residual): Provide `d1_image` (non-empty list of C2 basis elements).
     - A context witness w=(x,y,c) is a separate lift trigger: x ~ y but ρ(c,x) ≁ ρ(c,y). A survivor without a context witness remains StabilizedSurvivor, not LiftCandidate.
  3. You MUST declare the normed cokernel gauge `phi_value` (distance to repair) and `gamma_value` (closure mass) for each class.
  4. You must enforce the [CHAIN CONDITION LOCK]: if d1 ∘ d0 ≠ 0 over R with weights omega, you must issue a RefusalCertificate with reason CHAIN_FAIL.
  5. You must enforce the [QUOTIENT SEPARABILITY GATE]: If a dynamic repair (R_dyn) is proposed, it is only licensed if B^1_S = \bigoplus B^1_i and d1 splits componentwise. If not, issue SEPARABILITY_FAIL.
  6. Check `rho_total` and observer quotients: does the class survive under all declared C-contexts? If not, issue OBSERVER_FAIL.

user_prompt: |
  Evaluate the following candidates against the MSS-μ kernel constraints.
  Only process candidates with verdict ESCALATE_TO_LEVEL2 or HOLD_AS_IDEA.

  --- STAGE 4 OUTPUT ---
  {{STAGE_4_OUTPUT}}
  --- END STAGE 4 OUTPUT ---

  --- ORIGINAL STAGE 2 CANDIDATES ---
  {{STAGE_2_OUTPUT}}
  --- END ORIGINAL ---

  Return ONLY the following YAML structure. No markdown code blocks.

response_schema: |
  result:
    checks:
      chain_condition:
        ok: true|false
        counterexample:
          b: b0
          d0_b: []
          d1_d0_b: []
      rho_total:
        ok: true|false
        missing: []
      symbol_drift:
        ok: true|false
        new_symbols: []

    quotient:
      classes:
        - rep: t0
          members: []

    classification:
      - class_rep: t0
        label: Ex | Surv | Open | LiftCandidate
        phi_value: 0.0
        gamma_value: 0.0
        higher_arity_residual: null
        evidence:
          closed: true|false
          exact: true|false
          d1_image: []
          im_d0_witness: []

    witnesses:
      - w: [x, y, c]
        valid: true|false
        evidence:
          x_sim_y: true|false
          rho_c_x: t0
          rho_c_y: t1
          rho_images_sim: true|false

    refusal:
      issued: true|false
      certificate:
        reason: CHAIN_FAIL | MAP_UNDEFINED | TYPE_FAIL | SEPARABILITY_FAIL | OBSERVER_FAIL | DRIFT
        counterexample:
        needed_to_proceed:
          - "revision needed"

  symbol_game:
    version: "0.1.0"
    level_declared: true
    chain_condition: "d1∘d0=0"
    required_output:
      trichotomy_class: [Ex, Surv, Open]
      witness_supplied: true
      phi_value: 0.0
      gamma_value: 0.0
      lift_contract_issued: false
      hallucination_estimate: 0.0
      difficulty: medium
      three_key_tests: []
      reliability: 2
    forbidden_verbs: [proves, guarantees, demonstrates, shows conclusively]
    authority_ceiling: lift_contract
