<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%" style="background:#0d1117; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="470" y="38" text-anchor="middle" fill="#f0f6fc" font-size="20" font-weight="700" letter-spacing="1">MINIMAL SYMBOL GAME S(N) AS AN LLM L₁-GAUGE GOVERNOR</text>
  <text x="470" y="62" text-anchor="middle" fill="#8b949e" font-size="13">Constraining Continuous Attention Softmax Space into Discrete Simplicial Obstruction Regimes</text>

  <!-- Left: Soft Continuous LLM Space -->
  <rect x="40" y="95" width="250" height="340" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5" />
  <rect x="40" y="95" width="250" height="35" rx="10" fill="#241a1c" />
  <text x="165" y="118" text-anchor="middle" fill="#ff7b72" font-size="14" font-weight="700">CONTINUOUS LLM SPACE</text>

  <text x="60" y="160" fill="#c9d1d9" font-size="12">• <tspan fill="#ff7b72" font-weight="600">Softmax Logits:</tspan> Continuous ℝᵈ</text>
  <text x="60" y="190" fill="#c9d1d9" font-size="12">• <tspan fill="#ff7b72" font-weight="600">Norm Regime:</tspan> L₂ Smeared</text>
  <text x="60" y="220" fill="#c9d1d9" font-size="12">• <tspan fill="#ff7b72" font-weight="600">Failure Mode:</tspan> Hallucination</text>
  <text x="60" y="250" fill="#c9d1d9" font-size="12">• <tspan fill="#ff7b72" font-weight="600">Distinction:</tspan> Unbounded drift</text>
  <text x="60" y="280" fill="#c9d1d9" font-size="12">• <tspan fill="#ff7b72" font-weight="600">Diagonal:</tspan> Admits self-loops</text>
  
  <rect x="60" y="320" width="210" height="85" rx="6" fill="#0d1117" stroke="#30363d" />
  <text x="165" y="348" text-anchor="middle" fill="#8b949e" font-size="11">Unconstrained</text>
  <text x="165" y="368" text-anchor="middle" fill="#ff7b72" font-size="13" font-weight="600">Soft Attention Leakage</text>

  <!-- Projector Arrow -->
  <line x1="290" y1="265" x2="350" y2="265" stroke="#58a6ff" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="320" y="250" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="700">Projector</text>
  <text x="320" y="295" text-anchor="middle" fill="#79c0ff" font-size="11">P_A</text>

  <!-- Center: Minimal Symbol Game S(N) -->
  <rect x="350" y="95" width="280" height="340" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2" />
  <rect x="350" y="95" width="280" height="35" rx="10" fill="#1f242c" />
  <text x="490" y="118" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">SYMBOL GAME S(N) GOVERNOR</text>

  <!-- S(N) Rules inside -->
  <g transform="translate(365, 145)">
    <rect x="0" y="0" width="250" height="48" rx="5" fill="#0d1117" stroke="#58a6ff" />
    <text x="125" y="20" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="700">1. Strict Irreflexivity</text>
    <text x="125" y="36" text-anchor="middle" fill="#8b949e" font-size="10">¬&lt;ara&gt; (Diagonal Excision)</text>
  </g>

  <g transform="translate(365, 205)">
    <rect x="0" y="0" width="250" height="48" rx="5" fill="#0d1117" stroke="#58a6ff" />
    <text x="125" y="20" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="700">2. Fixed-Point-Free Swap σ</text>
    <text x="125" y="36" text-anchor="middle" fill="#8b949e" font-size="10">2-Witness Lemma s(Rn) = 2</text>
  </g>

  <g transform="translate(365, 265)">
    <rect x="0" y="0" width="250" height="48" rx="5" fill="#0d1117" stroke="#58a6ff" />
    <text x="125" y="20" text-anchor="middle" fill="#f0f6fc" font-size="11" font-weight="700">3. Survivor Witness Ledger</text>
    <text x="125" y="36" text-anchor="middle" fill="#8b949e" font-size="10">w = (x, y, d, qx, qy, reason)</text>
  </g>

  <g transform="translate(365, 325)">
    <rect x="0" y="0" width="250" height="48" rx="5" fill="#0d1117" stroke="#3fb950" />
    <text x="125" y="20" text-anchor="middle" fill="#56d364" font-size="11" font-weight="700">4. Idempotence Check</text>
    <text x="125" y="36" text-anchor="middle" fill="#8b949e" font-size="10">P_A ∘ P_A = P_A (Zero Drift)</text>
  </g>

  <!-- Retractor Arrow -->
  <line x1="630" y1="265" x2="690" y2="265" stroke="#3fb950" stroke-width="3" marker-end="url(#arrow-green)" />
  <text x="660" y="250" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="700">Retractor</text>
  <text x="660" y="295" text-anchor="middle" fill="#56d364" font-size="11">R_A</text>

  <!-- Right: Certified Output Regime -->
  <rect x="690" y="95" width="210" height="340" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5" />
  <rect x="690" y="95" width="210" height="35" rx="10" fill="#1b271e" />
  <text x="795" y="118" text-anchor="middle" fill="#56d364" font-size="14" font-weight="700">DISCRETE L₁ OUTPUT</text>

  <text x="705" y="160" fill="#c9d1d9" font-size="12">• <tspan fill="#56d364" font-weight="600">Simplicial Chains:</tspan> ℤ-valued</text>
  <text x="705" y="195" fill="#c9d1d9" font-size="12">• <tspan fill="#56d364" font-weight="600">Obstruction:</tspan> Exact cochain</text>
  <text x="705" y="230" fill="#c9d1d9" font-size="12">• <tspan fill="#56d364" font-weight="600">Receipts:</tspan> Deterministic</text>
  <text x="705" y="265" fill="#c9d1d9" font-size="12">• <tspan fill="#56d364" font-weight="600">Stokes Check:</tspan> ∂² = 0</text>

  <rect x="705" y="320" width="180" height="85" rx="6" fill="#0d1117" stroke="#3fb950" />
  <text x="795" y="348" text-anchor="middle" fill="#8b949e" font-size="11">Governed Output</text>
  <text x="795" y="368" text-anchor="middle" fill="#56d364" font-size="13" font-weight="600">Zero Hallucination</text>
</svg>
