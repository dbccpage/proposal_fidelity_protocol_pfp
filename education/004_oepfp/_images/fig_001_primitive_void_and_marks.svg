<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="960" height="540" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="40" y="36" width="880" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Category Badge -->
  <rect x="56" y="48" width="130" height="24" rx="6" fill="#0284c7" />
  <text x="121" y="64" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">FOUNDATIONS</text>
  
  <text x="198" y="65" fill="#f8fafc" font-size="18" font-weight="700">01. Primitive Void &lt;&gt; and Irreflexive Marks</text>
  <text x="56" y="96" fill="#94a3b8" font-size="13" font-weight="400">Stage 0 Substrate: Void is an unfillable hole; distinctness requires carrier size &gt;= 2.</text>

  <!-- Main Content Area -->
  <g transform="translate(40, 126)">

    <rect x="40" y="30" width="220" height="260" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="150" y="70" fill="#38bdf8" font-size="20" font-weight="700" text-anchor="middle">&lt;&gt; VOID</text>
    <circle cx="150" cy="150" r="50" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="150" y="156" fill="#f87171" font-size="14" font-weight="600" text-anchor="middle">Unfillable Hole</text>
    <text x="150" y="240" fill="#94a3b8" font-size="12" text-anchor="middle">Zero Interior Tolerance</text>
    <text x="150" y="260" fill="#64748b" font-size="11" text-anchor="middle">Wire Token: op&lt;&gt;</text>

    <!-- Arrow -->
    <path d="M 280 160 L 340 160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" />
    <text x="310" y="150" fill="#38bdf8" font-size="12" text-anchor="middle">distinction</text>

    <rect x="360" y="30" width="480" height="260" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="600" y="70" fill="#34d399" font-size="20" font-weight="700" text-anchor="middle">Primitive Difference a != b</text>
    <circle cx="480" cy="150" r="30" fill="#0284c7" />
    <text x="480" y="156" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">a</text>
    <circle cx="720" cy="150" r="30" fill="#059669" />
    <text x="720" y="156" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">b</text>
    <path d="M 520 150 L 680 150" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,5"/>
    <text x="600" y="140" fill="#f59e0b" font-size="14" font-weight="700" text-anchor="middle">a &gt; b (Native Arrow)</text>
    <text x="600" y="240" fill="#94a3b8" font-size="13" text-anchor="middle">Lean 4 Theorem: irrefl_witness_ne (Carrier >= 2)</text>
    <text x="600" y="262" fill="#64748b" font-size="12" text-anchor="middle">No self-relation: not(x R x) prevents collapsed identity</text>
    
  </g>

  <!-- Footer -->
  <line x1="40" y1="502" x2="920" y2="502" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="514" fill="#64748b" font-size="11">MSS-N &amp; S(n) Tower Architecture • Canonical Educational Series</text>
  <text x="904" y="514" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">AuthorityEffect: None</text>
</svg>
