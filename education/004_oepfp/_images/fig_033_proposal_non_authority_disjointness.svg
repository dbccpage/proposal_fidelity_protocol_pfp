<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="960" height="540" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="40" y="36" width="880" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Category Badge -->
  <rect x="56" y="48" width="130" height="24" rx="6" fill="#0284c7" />
  <text x="121" y="64" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AUTHORITY CALCULUS</text>
  
  <text x="198" y="65" fill="#f8fafc" font-size="18" font-weight="700">33. Theorem 1: Proposal Non-Authority (Gamma cap T_S = empty)</text>
  <text x="56" y="96" fill="#94a3b8" font-size="13" font-weight="400">Strict type boundary: Statistical neural token generators cannot mint terminal authority.</text>

  <!-- Main Content Area -->
  <g transform="translate(40, 126)">

    <!-- Generative Proposal Space -->
    <ellipse cx="260" cy="150" rx="180" ry="110" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text x="260" y="90" fill="#fb7185" font-size="18" font-weight="700" text-anchor="middle">Generative Proposal Space Gamma</text>
    <text x="260" y="120" fill="#94a3b8" font-size="12" text-anchor="middle">LLM Autoregressive Samples P_theta(gamma | x)</text>
    <text x="260" y="145" fill="#fca5a5" font-size="12" text-anchor="middle">Untrusted tokens, chain-of-thought, rhetorical proofs</text>
    <text x="260" y="170" fill="#ef4444" font-size="14" font-weight="700" text-anchor="middle">AuthorityEffect: None</text>

    <!-- Disjoint Barrier -->
    <line x1="470" y1="40" x2="470" y2="260" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,6"/>
    <rect x="430" y="130" width="80" height="40" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="470" y="155" fill="#fbbf24" font-size="16" font-weight="800" text-anchor="middle">CAP = 0</text>

    <!-- Terminal Authority Space -->
    <ellipse cx="680" cy="150" rx="180" ry="110" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="680" y="90" fill="#34d399" font-size="18" font-weight="700" text-anchor="middle">Terminal Authority Space T_S</text>
    <text x="680" y="120" fill="#94a3b8" font-size="12" text-anchor="middle">Host-Verified Proof Objects (Lean 4, Exact LP)</text>
    <text x="680" y="145" fill="#6ee7b7" font-size="12" text-anchor="middle">Deterministic state transition receipts</text>
    <text x="680" y="170" fill="#10b981" font-size="14" font-weight="700" text-anchor="middle">Machine-Checked Ground Truth</text>
    
  </g>

  <!-- Footer -->
  <line x1="40" y1="502" x2="920" y2="502" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="514" fill="#64748b" font-size="11">MSS-N &amp; S(n) Tower Architecture • Canonical Educational Series</text>
  <text x="904" y="514" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">AuthorityEffect: None</text>
</svg>
