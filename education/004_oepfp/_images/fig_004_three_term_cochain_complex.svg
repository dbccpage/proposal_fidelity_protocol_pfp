<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="960" height="540" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="40" y="36" width="880" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Category Badge -->
  <rect x="56" y="48" width="130" height="24" rx="6" fill="#0284c7" />
  <text x="121" y="64" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">COCHAINS</text>
  
  <text x="198" y="65" fill="#f8fafc" font-size="18" font-weight="700">04. Three-Term Cochain Complex C0 -&gt; C1 -&gt; C2</text>
  <text x="56" y="96" fill="#94a3b8" font-size="13" font-weight="400">Exact sequence with nilpotence d1 o d0 = 0 enforcing boundary-of-boundary closure.</text>

  <!-- Main Content Area -->
  <g transform="translate(40, 126)">

    <rect x="50" y="60" width="180" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="140" y="105" fill="#38bdf8" font-size="24" font-weight="800" text-anchor="middle">C^0</text>
    <text x="140" y="140" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">0-Cochains</text>
    <text x="140" y="170" fill="#94a3b8" font-size="12" text-anchor="middle">Vertex Potentials</text>
    <text x="140" y="195" fill="#64748b" font-size="11" text-anchor="middle">phi: V -&gt; Q</text>

    <!-- Arrow d0 -->
    <path d="M 245 150 L 335 150" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="330,144 345,150 330,156" fill="#38bdf8"/>
    <text x="290" y="135" fill="#38bdf8" font-size="16" font-weight="700" text-anchor="middle">d_0</text>

    <rect x="350" y="60" width="180" height="180" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="440" y="105" fill="#34d399" font-size="24" font-weight="800" text-anchor="middle">C^1</text>
    <text x="440" y="140" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">1-Cochains</text>
    <text x="440" y="170" fill="#94a3b8" font-size="12" text-anchor="middle">Edge Currents</text>
    <text x="440" y="195" fill="#64748b" font-size="11" text-anchor="middle">w: E -&gt; Q</text>

    <!-- Arrow d1 -->
    <path d="M 545 150 L 635 150" stroke="#34d399" stroke-width="3"/>
    <polygon points="630,144 645,150 630,156" fill="#34d399"/>
    <text x="590" y="135" fill="#34d399" font-size="16" font-weight="700" text-anchor="middle">d_1</text>

    <rect x="650" y="60" width="180" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="740" y="105" fill="#fbbf24" font-size="24" font-weight="800" text-anchor="middle">C^2</text>
    <text x="740" y="140" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">2-Cochains</text>
    <text x="740" y="170" fill="#94a3b8" font-size="12" text-anchor="middle">Face Curvatures</text>
    <text x="740" y="195" fill="#64748b" font-size="11" text-anchor="middle">c: F -&gt; Q</text>

    <!-- Invariant Box -->
    <rect x="250" y="270" width="380" height="40" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="440" y="295" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">Fundamental Nilpotence: d_1 o d_0 = 0</text>
    
  </g>

  <!-- Footer -->
  <line x1="40" y1="502" x2="920" y2="502" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="514" fill="#64748b" font-size="11">MSS-N &amp; S(n) Tower Architecture • Canonical Educational Series</text>
  <text x="904" y="514" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">AuthorityEffect: None</text>
</svg>
