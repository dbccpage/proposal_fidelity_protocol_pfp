<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="960" height="540" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="40" y="36" width="880" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Category Badge -->
  <rect x="56" y="48" width="130" height="24" rx="6" fill="#0284c7" />
  <text x="121" y="64" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">HORIZON</text>
  
  <text x="198" y="65" fill="#f8fafc" font-size="18" font-weight="700">44. MSS-15 Red-Blue-Green Master Horizon Trichotomy</text>
  <text x="56" y="96" fill="#94a3b8" font-size="13" font-weight="400">Orthogonal terminal states: Refusal (Red), Pending (Blue), and Certified (Green).</text>

  <!-- Main Content Area -->
  <g transform="translate(40, 126)">

    <!-- Red Terminal -->
    <rect x="50" y="40" width="240" height="230" rx="14" fill="url(#roseBox)"/>
    <text x="170" y="80" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">RED: REFUSAL</text>
    <text x="170" y="110" fill="#ffe4e6" font-size="13" font-weight="600" text-anchor="middle">Proof of Obstruction</text>
    <text x="170" y="150" fill="#fecdd3" font-size="12" text-anchor="middle">Defect [c] != [0] in Q^1</text>
    <text x="170" y="175" fill="#fecdd3" font-size="12" text-anchor="middle">Invariant violation proved</text>
    <text x="170" y="200" fill="#fff1f2" font-size="12" font-weight="700" text-anchor="middle">Deterministic Halting</text>
    <text x="170" y="240" fill="#ffe4e6" font-size="11" text-anchor="middle">Discipline, not failure</text>

    <!-- Blue Terminal -->
    <rect x="320" y="40" width="240" height="230" rx="14" fill="url(#cyanBox)"/>
    <text x="440" y="80" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">BLUE: PENDING</text>
    <text x="440" y="110" fill="#e0f2fe" font-size="13" font-weight="600" text-anchor="middle">Budget Exhausted</text>
    <text x="440" y="150" fill="#bae6fd" font-size="12" text-anchor="middle">B_step or B_depth reached</text>
    <text x="440" y="175" fill="#bae6fd" font-size="12" text-anchor="middle">No contradiction proved</text>
    <text x="440" y="200" fill="#f0f9ff" font-size="12" font-weight="700" text-anchor="middle">Awaiting Up-Lift</text>
    <text x="440" y="240" fill="#e0f2fe" font-size="11" text-anchor="middle">Context expansion eligible</text>

    <!-- Green Terminal -->
    <rect x="590" y="40" width="240" height="230" rx="14" fill="url(#emeraldBox)"/>
    <text x="710" y="80" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">GREEN: CERTIFIED</text>
    <text x="710" y="110" fill="#d1fae5" font-size="13" font-weight="600" text-anchor="middle">Exact Quotient Zero</text>
    <text x="710" y="150" fill="#a7f3d0" font-size="12" text-anchor="middle">[c] = [0] in Q^1 verified</text>
    <text x="710" y="175" fill="#a7f3d0" font-size="12" text-anchor="middle">Exact dual witness in Q</text>
    <text x="710" y="200" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">Lean 4 Checked</text>
    <text x="710" y="240" fill="#d1fae5" font-size="11" text-anchor="middle">Terminal transition admitted</text>
    
  </g>

  <!-- Footer -->
  <line x1="40" y1="502" x2="920" y2="502" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="514" fill="#64748b" font-size="11">MSS-N &amp; S(n) Tower Architecture • Canonical Educational Series</text>
  <text x="904" y="514" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">AuthorityEffect: None</text>
</svg>
