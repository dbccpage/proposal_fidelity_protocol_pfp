<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="960" height="540" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="40" y="36" width="880" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Category Badge -->
  <rect x="56" y="48" width="130" height="24" rx="6" fill="#0284c7" />
  <text x="121" y="64" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AUTOPOIESIS</text>
  
  <text x="198" y="65" fill="#f8fafc" font-size="18" font-weight="700">42. Autopoietic Incompleteness and Mandatory GODEL_BREAK</text>
  <text x="56" y="96" fill="#94a3b8" font-size="13" font-weight="400">Axiom G4: Immediate loud termination upon detecting diagonal self-reference undecidability.</text>

  <!-- Main Content Area -->
  <g transform="translate(40, 126)">

    <rect x="50" y="30" width="780" height="250" rx="16" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <circle cx="200" cy="150" r="70" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="130" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">System State S_k</text>
    <text x="200" y="155" fill="#94a3b8" font-size="12" text-anchor="middle">Self-Application</text>
    <text x="200" y="175" fill="#f59e0b" font-size="13" font-weight="700" text-anchor="middle">S_k OP S_k</text>

    <!-- Circular Arrow for loop -->
    <path d="M 280 150 Q 380 70 480 150" fill="none" stroke="#f43f5e" stroke-width="3"/>
    <text x="380" y="95" fill="#fb7185" font-size="13" font-weight="700" text-anchor="middle">Diagonal Subst Diag(x)</text>

    <!-- Godel Break Interceptor -->
    <rect x="500" y="90" width="280" height="120" rx="12" fill="url(#roseBox)"/>
    <text x="640" y="130" fill="#ffffff" font-size="18" font-weight="800" text-anchor="middle">GODEL_BREAK</text>
    <text x="640" y="155" fill="#ffe4e6" font-size="12" text-anchor="middle">Loud Terminalization</text>
    <text x="640" y="175" fill="#fecdd3" font-size="11" text-anchor="middle">Prevents infinite self-critique loop</text>

    <text x="440" y="260" fill="#94a3b8" font-size="12" text-anchor="middle">The Anomalon is defined as the non-vanishing cohomological defect H^1(U, F_self) != 0</text>
    
  </g>

  <!-- Footer -->
  <line x1="40" y1="502" x2="920" y2="502" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="514" fill="#64748b" font-size="11">MSS-N &amp; S(n) Tower Architecture • Canonical Educational Series</text>
  <text x="904" y="514" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">AuthorityEffect: None</text>
</svg>
