<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="960" height="540" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="40" y="36" width="880" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Category Badge -->
  <rect x="56" y="48" width="130" height="24" rx="6" fill="#0284c7" />
  <text x="121" y="64" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">HODGE THEORY</text>
  
  <text x="198" y="65" fill="#f8fafc" font-size="18" font-weight="700">06. Discrete Hodge Decomposition of 1-Cochains</text>
  <text x="56" y="96" fill="#94a3b8" font-size="13" font-weight="400">Orthogonal direct sum: C1 = im(d0) + H1 + im(d1*). Only im(d0) can be repaired.</text>

  <!-- Main Content Area -->
  <g transform="translate(40, 126)">

    <rect x="50" y="40" width="780" height="230" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Exact Subspace -->
    <rect x="80" y="70" width="220" height="170" rx="10" fill="url(#cyanBox)"/>
    <text x="190" y="110" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">im(d_0)</text>
    <text x="190" y="135" fill="#e0f2fe" font-size="13" font-weight="600" text-anchor="middle">Exact Boundaries</text>
    <text x="190" y="170" fill="#bae6fd" font-size="12" text-anchor="middle">Reparable via gauge</text>
    <text x="190" y="195" fill="#f0f9ff" font-size="11" font-weight="700" text-anchor="middle">[x] = [0] in Q^1</text>

    <!-- Harmonic Subspace -->
    <rect x="330" y="70" width="220" height="170" rx="10" fill="url(#roseBox)"/>
    <text x="440" y="110" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">H^1 (Harmonic)</text>
    <text x="440" y="135" fill="#ffe4e6" font-size="13" font-weight="600" text-anchor="middle">Topological Holes</text>
    <text x="440" y="170" fill="#fecdd3" font-size="12" text-anchor="middle">Non-reparable residue</text>
    <text x="440" y="195" fill="#fff1f2" font-size="11" font-weight="700" text-anchor="middle">The Anomalon</text>

    <!-- Coexact Subspace -->
    <rect x="580" y="70" width="220" height="170" rx="10" fill="url(#purpleBox)"/>
    <text x="690" y="110" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">im(d_1^*)</text>
    <text x="690" y="135" fill="#f3e8ff" font-size="13" font-weight="600" text-anchor="middle">Coexact Flux</text>
    <text x="690" y="170" fill="#e9d5ff" font-size="12" text-anchor="middle">Face curl divergence</text>
    <text x="690" y="195" fill="#faf5ff" font-size="11" font-weight="700" text-anchor="middle">Delta_1 Laplacians</text>

    <!-- Orthogonality Signs -->
    <text x="315" y="160" fill="#f59e0b" font-size="20" font-weight="700" text-anchor="middle">_|_</text>
    <text x="565" y="160" fill="#f59e0b" font-size="20" font-weight="700" text-anchor="middle">_|_</text>
    <text x="440" y="290" fill="#94a3b8" font-size="13" text-anchor="middle">Inner Product: &lt;im(d_0), H^1&gt; = 0,  &lt;H^1, im(d_1*)&gt; = 0,  &lt;im(d_0), im(d_1*)&gt; = 0</text>
    
  </g>

  <!-- Footer -->
  <line x1="40" y1="502" x2="920" y2="502" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="514" fill="#64748b" font-size="11">MSS-N &amp; S(n) Tower Architecture • Canonical Educational Series</text>
  <text x="904" y="514" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">AuthorityEffect: None</text>
</svg>
