<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" style="background-color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="roseBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="amberBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
  </pattern>
  <rect width="960" height="540" fill="url(#grid)" />

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="500" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="40" y="36" width="880" height="76" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Category Badge -->
  <rect x="56" y="48" width="130" height="24" rx="6" fill="#0284c7" />
  <text x="121" y="64" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">RIGIDITY</text>
  
  <text x="198" y="65" fill="#f8fafc" font-size="18" font-weight="700">02. Directed Cut D2 vs Symmetric Link S2</text>
  <text x="56" y="96" fill="#94a3b8" font-size="13" font-weight="400">Rigidity theorem: Aut(D2) = {id} breaks symmetry and anchors directional time/causality.</text>

  <!-- Main Content Area -->
  <g transform="translate(40, 126)">

    <rect x="40" y="30" width="370" height="260" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="225" y="65" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">Directed Cut D2 (Rigid)</text>
    <circle cx="120" cy="140" r="26" fill="#0284c7"/><text x="120" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">0</text>
    <circle cx="330" cy="140" r="26" fill="#0369a1"/><text x="330" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <line x1="150" y1="140" x2="300" y2="140" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="295,134 307,140 295,146" fill="#38bdf8"/>
    <text x="225" y="210" fill="#34d399" font-size="14" font-weight="600" text-anchor="middle">Aut(D2) = {id} (Trivial Group)</text>
    <text x="225" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">Asymmetry prevents node swap</text>

    <rect x="470" y="30" width="370" height="260" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="655" y="65" fill="#fb7185" font-size="18" font-weight="700" text-anchor="middle">Symmetric Link S2 (Permutable)</text>
    <circle cx="550" cy="140" r="26" fill="#be123c"/><text x="550" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">0</text>
    <circle cx="760" cy="140" r="26" fill="#be123c"/><text x="760" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <line x1="580" y1="140" x2="730" y2="140" stroke="#f43f5e" stroke-width="3"/>
    <text x="655" y="210" fill="#f43f5e" font-size="14" font-weight="600" text-anchor="middle">Aut(S2) = Z2 (Non-Trivial Swap)</text>
    <text x="655" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">Permutation creates identity ambiguity</text>
    
  </g>

  <!-- Footer -->
  <line x1="40" y1="502" x2="920" y2="502" stroke="#1e293b" stroke-width="1"/>
  <text x="56" y="514" fill="#64748b" font-size="11">MSS-N &amp; S(n) Tower Architecture • Canonical Educational Series</text>
  <text x="904" y="514" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="end">AuthorityEffect: None</text>
</svg>
