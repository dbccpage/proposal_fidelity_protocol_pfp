<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="colourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow1" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="url(#bgGrad1)" rx="16"/>

  <text x="550" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    OEWAS V3: Colored Multicategory &amp; Operadic Hierarchy
  </text>
  <text x="550" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Agents hold Licenses; Skills are Primitive Operations; Meta-Skills are Operadic Trees in Cat_Col
  </text>

  <!-- Layer 1: Agent & License -->
  <g transform="translate(60, 110)">
    <rect width="280" height="530" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow1)"/>
    <rect x="15" y="15" width="250" height="40" fill="url(#agentGrad)" rx="8"/>
    <text x="140" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">1. AGENT LAYER</text>

    <rect x="25" y="75" width="230" height="130" fill="#0f172a" stroke="#475569" stroke-dasharray="4" rx="8"/>
    <text x="140" y="100" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Agent License</text>
    <text x="40" y="130" fill="#cbd5e1" font-family="monospace" font-size="12">• agent_id: "thanatos"</text>
    <text x="40" y="155" fill="#cbd5e1" font-family="monospace" font-size="12">• ceiling: L3_Logos</text>
    <text x="40" y="180" fill="#cbd5e1" font-family="monospace" font-size="12">• authorized_ops: Σ_ops</text>

    <rect x="25" y="230" width="230" height="280" fill="#0f172a" stroke="#334155" rx="8"/>
    <text x="140" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Execution Context</text>
    <text x="40" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• CorrelationId</text>
    <text x="40" y="325" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• CausationId</text>
    <text x="40" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• IdempotencyKey</text>
    <text x="40" y="395" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Dispatches Terms to:</text>
    <text x="40" y="425" fill="#38bdf8" font-family="monospace" font-size="11">HigherOperadAdapter</text>
    <text x="40" y="450" fill="#38bdf8" font-family="monospace" font-size="11">.authorize_term(t)</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <line x1="345" y1="280" x2="410" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="377" y="270" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">invokes</text>

  <!-- Layer 2: Skills / Primitive Operations -->
  <g transform="translate(415, 110)">
    <rect width="290" height="530" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow1)"/>
    <rect x="15" y="15" width="260" height="40" fill="url(#skillGrad)" rx="8"/>
    <text x="145" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">2. SKILL / OPERATION LAYER</text>

    <!-- Operation 1 -->
    <rect x="20" y="75" width="250" height="190" fill="#0f172a" stroke="#10b981" stroke-width="1.2" rx="8"/>
    <text x="145" y="100" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">OperationV3: audit_code</text>
    <rect x="35" y="115" width="95" height="25" fill="url(#colourGrad)" rx="4"/>
    <text x="82" y="132" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">in: Code</text>
    <text x="145" y="132" fill="#94a3b8" font-family="sans-serif" font-size="14">→</text>
    <rect x="160" y="115" width="95" height="25" fill="url(#colourGrad)" rx="4"/>
    <text x="207" y="132" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">out: Audit</text>
    <text x="35" y="165" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• AuthorityEffect: None</text>
    <text x="35" y="185" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Lifecycle: Admitted</text>
    <text x="35" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Residual: verified</text>
    <text x="35" y="240" fill="#38bdf8" font-family="monospace" font-size="11">Operands: [op_ast, op_sec]</text>

    <!-- Operation 2 -->
    <rect x="20" y="285" width="250" height="225" fill="#0f172a" stroke="#10b981" stroke-width="1.2" rx="8"/>
    <text x="145" y="310" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">OperationV3: verify_proof</text>
    <rect x="35" y="325" width="95" height="25" fill="url(#colourGrad)" rx="4"/>
    <text x="82" y="342" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">in: Proof, Code</text>
    <text x="145" y="342" fill="#94a3b8" font-family="sans-serif" font-size="14">→</text>
    <rect x="160" y="325" width="95" height="25" fill="url(#colourGrad)" rx="4"/>
    <text x="207" y="342" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">out: Receipt</text>
    <text x="35" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• AuthorityEffect: None</text>
    <text x="35" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Ceiling: Subagent</text>
    <text x="35" y="425" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CapabilitySliceV3:</text>
    <text x="35" y="445" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Groups related operations under</text>
    <text x="35" y="465" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">canonical skill domain aggregate</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <line x1="710" y1="280" x2="775" y2="280" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow1)"/>
  <text x="742" y="270" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">composes</text>

  <!-- Layer 3: Meta-Skills / Operad Trees -->
  <g transform="translate(780, 110)">
    <rect width="270" height="530" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow1)"/>
    <rect x="15" y="15" width="240" height="40" fill="url(#metaGrad)" rx="8"/>
    <text x="135" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">3. META-SKILL / OPERAD</text>

    <rect x="20" y="75" width="230" height="435" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2" rx="8"/>
    <text x="135" y="105" fill="#c084fc" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">CompositionV3: γ(f; g₁)</text>

    <circle cx="135" cy="155" r="22" fill="#7c3aed" stroke="#c084fc" stroke-width="1.5"/>
    <text x="135" y="160" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">Root (f)</text>

    <line x1="135" y1="177" x2="85" y2="240" stroke="#a855f7" stroke-width="2"/>
    <line x1="135" y1="177" x2="185" y2="240" stroke="#a855f7" stroke-width="2"/>

    <circle cx="85" cy="255" r="18" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
    <text x="85" y="260" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">g₁</text>

    <circle cx="185" cy="255" r="18" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
    <text x="185" y="260" fill="#ffffff" font-family="monospace" font-size="11" text-anchor="middle">g₂</text>

    <rect x="30" y="300" width="210" height="195" fill="#1e293b" rx="6"/>
    <text x="135" y="325" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Operadic Boundary Typing</text>
    <text x="40" y="355" fill="#94a3b8" font-family="monospace" font-size="11">• Slot 0: Code → Audit</text>
    <text x="40" y="380" fill="#94a3b8" font-family="monospace" font-size="11">• Slot 1: Audit → Receipt</text>
    <text x="40" y="415" fill="#fbbf24" font-family="monospace" font-size="11">Total: Code → Receipt</text>
    <text x="40" y="445" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Strict operadic soundness:</text>
    <text x="40" y="465" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Outputs snap to inputs with</text>
    <text x="40" y="485" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">identical Color &amp; Schema.</text>
  </g>
</svg>