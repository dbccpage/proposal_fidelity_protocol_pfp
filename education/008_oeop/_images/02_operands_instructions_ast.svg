<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="astGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="opGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="fenceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="url(#bgGrad2)" rx="16"/>

  <text x="550" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    OEWAS V3: Operands, Instructions &amp; Lossless AST Spans
  </text>
  <text x="550" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    CommonMark Source Document decomposed into Byte Spans, Structured Operands, and Validated Operations
  </text>

  <!-- Left: Raw Markdown Source Document -->
  <g transform="translate(50, 110)">
    <rect width="320" height="530" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow2)"/>
    <rect x="15" y="15" width="290" height="35" fill="url(#astGrad)" rx="6"/>
    <text x="160" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">SkillDocumentV3 (UTF-8 Bytes)</text>

    <!-- Leaf 1: Prose -->
    <rect x="20" y="65" width="280" height="60" fill="#1e293b" stroke="#475569" rx="6"/>
    <text x="35" y="90" fill="#e2e8f0" font-family="monospace" font-size="12"># Skill: Blackrod Guard</text>
    <text x="35" y="110" fill="#94a3b8" font-family="sans-serif" font-size="11">Span: [0, 42) • Prose Block</text>

    <!-- Leaf 2: oewas.operand.v3 Fence -->
    <rect x="20" y="140" width="280" height="120" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="35" y="165" fill="#fbbf24" font-family="monospace" font-size="12">```oewas.operand.v3</text>
    <text x="35" y="185" fill="#cbd5e1" font-family="monospace" font-size="11">operand_id: op_audit_1</text>
    <text x="35" y="205" fill="#cbd5e1" font-family="monospace" font-size="11">kind: instruction</text>
    <text x="35" y="225" fill="#cbd5e1" font-family="monospace" font-size="11">body: "enforce clean arch"</text>
    <text x="35" y="245" fill="#fbbf24" font-family="monospace" font-size="12">```</text>

    <!-- Leaf 3: Prose -->
    <rect x="20" y="275" width="280" height="50" fill="#1e293b" stroke="#475569" rx="6"/>
    <text x="35" y="305" fill="#94a3b8" font-family="sans-serif" font-size="11">Span: [180, 245) • Intermediate Prose</text>

    <!-- Leaf 4: oewas.operation.v3 Fence -->
    <rect x="20" y="340" width="280" height="170" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="6"/>
    <text x="35" y="365" fill="#34d399" font-family="monospace" font-size="12">```oewas.operation.v3</text>
    <text x="35" y="385" fill="#cbd5e1" font-family="monospace" font-size="11">operation_id: blackrod:guard</text>
    <text x="35" y="405" fill="#cbd5e1" font-family="monospace" font-size="11">inputs: [in: Code]</text>
    <text x="35" y="425" fill="#cbd5e1" font-family="monospace" font-size="11">output: out: Audit</text>
    <text x="35" y="445" fill="#cbd5e1" font-family="monospace" font-size="11">operand_refs: [op_audit_1]</text>
    <text x="35" y="465" fill="#cbd5e1" font-family="monospace" font-size="11">authority_ceiling: None</text>
    <text x="35" y="495" fill="#34d399" font-family="monospace" font-size="12">```</text>
  </g>

  <!-- Flow Arrows Middle -->
  <line x1="380" y1="200" x2="430" y2="200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="380" y1="420" x2="430" y2="420" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Middle: Domain Model Breakdown -->
  <g transform="translate(440, 110)">
    <rect width="280" height="530" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow2)"/>
    <rect x="15" y="15" width="250" height="35" fill="url(#fenceGrad)" rx="6"/>
    <text x="140" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Structured Operands</text>

    <!-- Operand Object -->
    <rect x="15" y="65" width="250" height="210" fill="#1e293b" stroke="#f59e0b" rx="8"/>
    <text x="140" y="90" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">InstructionOperand</text>
    <text x="25" y="120" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• operand_id: "op_audit_1"</text>
    <text x="25" y="145" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• instruction_body: "..."</text>
    <text x="25" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• dependencies: ()</text>
    <text x="25" y="195" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• observations: [obs_1]</text>
    <text x="25" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-style="italic">Holds invariant rule logic</text>
    <text x="25" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-style="italic">for LLM context injection</text>

    <!-- Artifact Operand Ref -->
    <rect x="15" y="295" width="250" height="215" fill="#1e293b" stroke="#38bdf8" rx="8"/>
    <text x="140" y="320" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">ArtifactOperandRef</text>
    <text x="25" y="350" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• artifact_uri: "repo://..."</text>
    <text x="25" y="375" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• content_digest: sha256</text>
    <text x="25" y="400" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• schema_ref: "schema:v3"</text>
    <text x="25" y="435" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-style="italic">Runtime artifact binding with</text>
    <text x="25" y="455" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-style="italic">cryptographic integrity proof</text>
  </g>

  <!-- Flow Arrows Right -->
  <line x1="730" y1="310" x2="780" y2="310" stroke="#10b981" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Right: Synthesized OperationV3 -->
  <g transform="translate(790, 110)">
    <rect width="260" height="530" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow2)"/>
    <rect x="15" y="15" width="230" height="35" fill="url(#opGrad)" rx="6"/>
    <text x="130" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">OperationV3 (Executable)</text>

    <rect x="15" y="65" width="230" height="445" fill="#1e293b" stroke="#10b981" rx="8"/>
    <text x="130" y="95" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Atomic Operad Morphism</text>

    <text x="25" y="130" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Typed Ports:</text>
    <text x="25" y="150" fill="#94a3b8" font-family="monospace" font-size="10">• in: PortSpecV3 (Code)</text>
    <text x="25" y="170" fill="#94a3b8" font-family="monospace" font-size="10">• out: PortSpecV3 (Audit)</text>

    <text x="25" y="205" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Bound Operands:</text>
    <text x="25" y="225" fill="#94a3b8" font-family="monospace" font-size="10">• [op_audit_1]</text>

    <text x="25" y="260" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Lifecycle Facets (5D):</text>
    <text x="25" y="280" fill="#94a3b8" font-family="sans-serif" font-size="10">• Declaration: Declared</text>
    <text x="25" y="300" fill="#94a3b8" font-family="sans-serif" font-size="10">• Schema: Bound</text>
    <text x="25" y="320" fill="#94a3b8" font-family="sans-serif" font-size="10">• Executor: Bound</text>
    <text x="25" y="340" fill="#94a3b8" font-family="sans-serif" font-size="10">• Validation: Validated</text>
    <text x="25" y="360" fill="#94a3b8" font-family="sans-serif" font-size="10">• Admission: Admitted</text>

    <text x="25" y="395" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Authority Firewall:</text>
    <text x="25" y="415" fill="#94a3b8" font-family="sans-serif" font-size="10">• Effect: None</text>
    <text x="25" y="435" fill="#94a3b8" font-family="sans-serif" font-size="10">• Ceiling: None</text>
    <text x="25" y="465" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Status: Verified</text>
  </g>
</svg>