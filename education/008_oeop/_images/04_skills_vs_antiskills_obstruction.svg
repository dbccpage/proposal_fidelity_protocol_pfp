<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="skillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="antiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="gateGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow-green4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="url(#bgGrad4)" rx="16"/>

  <text x="550" y="45" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    OEWAS V3: Skills vs. Anti-Skills &amp; Obstruction Refutation Geometry
  </text>
  <text x="550" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Dual Operadic Dynamic: Constructive Generators create claims; Anti-Skills construct Obstruction Certificates
  </text>

  <!-- Left: Constructive Skills -->
  <g transform="translate(50, 110)">
    <rect width="320" height="530" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow4)"/>
    <rect x="15" y="15" width="290" height="35" fill="url(#skillGrad)" rx="6"/>
    <text x="160" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">CONSTRUCTIVE SKILLS (+)</text>

    <!-- Skill 1 -->
    <rect x="20" y="65" width="280" height="135" fill="#1e293b" stroke="#10b981" rx="8"/>
    <text x="35" y="90" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">techne-code-rust-dev</text>
    <text x="35" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11">Morphism: Spec → Code</text>
    <text x="35" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11">• Generates implementation</text>
    <text x="35" y="160" fill="#94a3b8" font-family="sans-serif" font-size="11">• Emits candidate artifact</text>
    <text x="35" y="180" fill="#fbbf24" font-family="monospace" font-size="10">Claim: "Compiles &amp; passes tests"</text>

    <!-- Skill 2 -->
    <rect x="20" y="215" width="280" height="135" fill="#1e293b" stroke="#10b981" rx="8"/>
    <text x="35" y="240" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">panepistimion-lean-export</text>
    <text x="35" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="11">Morphism: LakeModule → Proof</text>
    <text x="35" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">• Extracts minimal Lean snippet</text>
    <text x="35" y="310" fill="#94a3b8" font-family="sans-serif" font-size="11">• Emits formal verification term</text>
    <text x="35" y="330" fill="#fbbf24" font-family="monospace" font-size="10">Claim: "Checked by Lean4 kernel"</text>

    <!-- Skill 3 -->
    <rect x="20" y="365" width="280" height="145" fill="#1e293b" stroke="#10b981" rx="8"/>
    <text x="35" y="390" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">paper-package-techne</text>
    <text x="35" y="415" fill="#cbd5e1" font-family="sans-serif" font-size="11">Morphism: PaperFolder → Package</text>
    <text x="35" y="440" fill="#94a3b8" font-family="sans-serif" font-size="11">• Assembles repo package</text>
    <text x="35" y="460" fill="#94a3b8" font-family="sans-serif" font-size="11">• Builds public export zip</text>
    <text x="35" y="490" fill="#38bdf8" font-family="monospace" font-size="11">Emits: ClaimCandidate(C)</text>
  </g>

  <!-- Flow to Middle -->
  <line x1="380" y1="360" x2="435" y2="360" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green4)"/>
  <text x="407" y="350" fill="#10b981" font-family="sans-serif" font-size="10" text-anchor="middle">Candidate</text>

  <!-- Middle: Obstruction Arena & Refutation Gate -->
  <g transform="translate(440, 110)">
    <rect width="250" height="530" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow4)"/>
    <rect x="15" y="15" width="220" height="35" fill="url(#gateGrad4)" rx="6"/>
    <text x="125" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">OBSTRUCTION ARENA</text>

    <rect x="15" y="65" width="220" height="210" fill="#1e293b" stroke="#f59e0b" rx="8"/>
    <text x="125" y="90" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Refutation Test</text>
    <text x="25" y="120" fill="#cbd5e1" font-family="sans-serif" font-size="11">Anti-Skills execute adversarial</text>
    <text x="25" y="140" fill="#cbd5e1" font-family="sans-serif" font-size="11">falsification operators:</text>
    <text x="25" y="170" fill="#f87171" font-family="monospace" font-size="10">1. Semantic lies</text>
    <text x="25" y="190" fill="#f87171" font-family="monospace" font-size="10">2. Toy proof overclaims</text>
    <text x="25" y="210" fill="#f87171" font-family="monospace" font-size="10">3. Uncontracted APIs</text>
    <text x="25" y="230" fill="#f87171" font-family="monospace" font-size="10">4. Authority smuggling</text>

    <!-- Verdict -->
    <rect x="15" y="295" width="220" height="215" fill="#1e293b" rx="8"/>
    <text x="125" y="320" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Gate Decision</text>

    <rect x="25" y="340" width="190" height="60" fill="#450a0a" stroke="#ef4444" rx="6"/>
    <text x="120" y="365" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">OBSTRUCTION DETECTED</text>
    <text x="120" y="385" fill="#f87171" font-family="sans-serif" font-size="10" text-anchor="middle">Blocks admission &amp; PR</text>

    <rect x="25" y="415" width="190" height="60" fill="#064e3b" stroke="#10b981" rx="6"/>
    <text x="120" y="440" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">NO OBSTRUCTION (Clean)</text>
    <text x="120" y="460" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Admitted to EstateCatalog</text>
  </g>

  <!-- Flow to Right -->
  <line x1="700" y1="360" x2="745" y2="360" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red4)"/>
  <text x="722" y="350" fill="#ef4444" font-family="sans-serif" font-size="10" text-anchor="middle">Audited by</text>

  <!-- Right: Anti-Skills (Obstruction Hunters) -->
  <g transform="translate(750, 110)">
    <rect width="300" height="530" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="12" filter="url(#shadow4)"/>
    <rect x="15" y="15" width="270" height="35" fill="url(#antiGrad)" rx="6"/>
    <text x="150" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">ANTI-SKILLS / ADVERSARIES (-)</text>

    <!-- Anti-Skill 1 -->
    <rect x="20" y="65" width="260" height="135" fill="#1e293b" stroke="#ef4444" rx="8"/>
    <text x="35" y="90" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">thanatos-anti-dime</text>
    <text x="35" y="115" fill="#cbd5e1" font-family="sans-serif" font-size="11">Morphism: Claim → Refutation</text>
    <text x="35" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11">• Excises LLM slop &amp; overclaims</text>
    <text x="35" y="160" fill="#94a3b8" font-family="sans-serif" font-size="11">• Falsifies toy proof generalization</text>
    <text x="35" y="180" fill="#f87171" font-family="monospace" font-size="10">Emits: ObsCert(HypeDetected)</text>

    <!-- Anti-Skill 2 -->
    <rect x="20" y="215" width="260" height="135" fill="#1e293b" stroke="#ef4444" rx="8"/>
    <text x="35" y="240" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">nomos-law-compliance-hunter</text>
    <text x="35" y="265" fill="#cbd5e1" font-family="sans-serif" font-size="11">Morphism: Code → Audit</text>
    <text x="35" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">• Detects uncontracted interfaces</text>
    <text x="35" y="310" fill="#94a3b8" font-family="sans-serif" font-size="11">• Enforces Nomos governance law</text>
    <text x="35" y="330" font-family="monospace" font-size="10" fill="#f87171">Emits: ObsCert(UncontractedAPI)</text>

    <!-- Anti-Skill 3 -->
    <rect x="20" y="365" width="260" height="145" fill="#1e293b" stroke="#ef4444" rx="8"/>
    <text x="35" y="390" fill="#f87171" font-family="monospace" font-size="12" font-weight="700">paper-adversary</text>
    <text x="35" y="415" fill="#cbd5e1" font-family="sans-serif" font-size="11">Morphism: Paper → Audit</text>
    <text x="35" y="440" fill="#94a3b8" font-family="sans-serif" font-size="11">• Adversarial red-team referee</text>
    <text x="35" y="460" fill="#94a3b8" font-family="sans-serif" font-size="11">• Challenges claims &amp; bounds</text>
    <text x="35" y="490" fill="#ef4444" font-family="monospace" font-size="11">Emits: ObstructionCertificate</text>
  </g>
</svg>