<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ctrlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="domGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="infGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad0)" rx="16"/>

  <!-- Title -->
  <text x="600" y="40" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    OEWAS V3: Clean Architecture &amp; Composition Root Layering
  </text>
  <text x="600" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Strict Inward Dependency Flow with Isolated Composition Root (Zero-Shim Rule)
  </text>

  <!-- 1. Controllers Layer (Top Left) -->
  <g transform="translate(40, 90)">
    <rect width="450" height="210" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" rx="10" filter="url(#shadow)"/>
    <rect x="15" y="12" width="420" height="30" fill="url(#ctrlGrad)" rx="6"/>
    <text x="225" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">CONTROLLERS LAYER</text>

    <!-- Router -->
    <rect x="25" y="55" width="220" height="55" fill="#0f172a" stroke="#475569" rx="6"/>
    <text x="135" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FastAPI APIRouter</text>
    <text x="135" y="98" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">/api/oewas/v3</text>

    <!-- Wire DTOs -->
    <rect x="270" y="55" width="155" height="135" fill="#0f172a" stroke="#475569" rx="6"/>
    <text x="347" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Pydantic Wire DTOs</text>
    <text x="280" y="105" fill="#94a3b8" font-family="monospace" font-size="10">• CompileCatalogReq</text>
    <text x="280" y="125" fill="#94a3b8" font-family="monospace" font-size="10">• VerifyCatalogReq</text>
    <text x="280" y="145" fill="#94a3b8" font-family="monospace" font-size="10">• CompileProjReq</text>
    <text x="280" y="165" fill="#94a3b8" font-family="monospace" font-size="10">• ValidateWfReq</text>

    <!-- Facade -->
    <rect x="25" y="135" width="220" height="55" fill="#0f172a" stroke="#38bdf8" rx="6"/>
    <text x="135" y="158" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OewasApiV3 Python Facade</text>
    <text x="135" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Result[SuccessDTO, ApiErrorDTO]</text>

    <line x1="135" y1="110" x2="135" y2="130" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- 2. Infrastructure Layer (Top Right) -->
  <g transform="translate(520, 90)">
    <rect width="640" height="210" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="10" filter="url(#shadow)"/>
    <rect x="15" y="12" width="610" height="30" fill="url(#infGrad)" rx="6"/>
    <text x="320" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">INFRASTRUCTURE LAYER (Outward Adapters)</text>

    <!-- Adapter 1: Parser -->
    <rect x="25" y="55" width="135" height="60" fill="#0f172a" stroke="#475569" rx="6"/>
    <text x="92" y="80" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CommonMark Parser</text>
    <text x="92" y="100" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Lossless Byte Spans</text>

    <!-- Adapter 2: SQLite UoW -->
    <rect x="175" y="55" width="135" height="60" fill="#0f172a" stroke="#475569" rx="6"/>
    <text x="242" y="80" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SqliteUnitOfWork</text>
    <text x="242" y="100" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">WAL Mode / Journal</text>

    <!-- Adapter 3: Higher Operad -->
    <rect x="325" y="55" width="135" height="60" fill="#0f172a" stroke="#475569" rx="6"/>
    <text x="392" y="80" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HigherOperadAdapter</text>
    <text x="392" y="100" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Anti-Corruption ACL</text>

    <!-- Adapter 4: FS & Legacy -->
    <rect x="475" y="55" width="140" height="60" fill="#0f172a" stroke="#475569" rx="6"/>
    <text x="545" y="80" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">FS &amp; Legacy Reader</text>
    <text x="545" y="100" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Estate Source Ports</text>

    <!-- Bootstrap Composition Root -->
    <rect x="175" y="130" width="440" height="65" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
    <text x="395" y="153" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">OewasContainer (Composition Root / bootstrap.py)</text>
    <text x="395" y="173" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Sole location allowed to instantiate adapters &amp; inject into handlers</text>
  </g>

  <!-- 3. Application Layer (Middle) -->
  <g transform="translate(40, 330)">
    <rect width="1120" height="230" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" rx="10" filter="url(#shadow)"/>
    <rect x="15" y="12" width="1090" height="30" fill="url(#appGrad)" rx="6"/>
    <text x="560" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">APPLICATION LAYER (Use Cases &amp; Inward Ports)</text>

    <!-- Command Handlers -->
    <rect x="25" y="55" width="280" height="155" fill="#0f172a" stroke="#a78bfa" rx="6"/>
    <text x="165" y="80" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Command Handlers (Railway)</text>
    <text x="40" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">• CompileCatalogHandler</text>
    <text x="40" y="125" fill="#cbd5e1" font-family="monospace" font-size="10">• VerifyCatalogHandler</text>
    <text x="40" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">• CompileProjectionHandler</text>
    <text x="40" y="165" fill="#cbd5e1" font-family="monospace" font-size="10">• CompileLicensedTermHandler</text>

    <!-- Query Handlers -->
    <rect x="325" y="55" width="240" height="155" fill="#0f172a" stroke="#a78bfa" rx="6"/>
    <text x="445" y="80" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Query Handlers</text>
    <text x="340" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">• GetCatalogHandler</text>
    <text x="340" y="125" fill="#cbd5e1" font-family="monospace" font-size="10">• ValidateWorkflowsHandler</text>
    <text x="340" y="150" fill="#94a3b8" font-family="sans-serif" font-size="10">(DFS Directed Cycle Detection)</text>

    <!-- Inward Ports & DTOs -->
    <rect x="585" y="55" width="510" height="155" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/>
    <text x="840" y="80" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Inward Ports &amp; Pure Application DTOs</text>
    <text x="600" y="105" fill="#94a3b8" font-family="sans-serif" font-size="10">Ports: <tspan fill="#e2e8f0" font-family="monospace">EstateSourcePort, SkillDocumentParserPort, OewasUnitOfWorkPort, StrictOperadPort</tspan></text>
    <text x="600" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10">DTOs: <tspan fill="#e2e8f0" font-family="monospace">CompileCatalogCommand, GetCatalogQuery, ApiErrorDTO, SuccessDTOs</tspan></text>
    <text x="600" y="160" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-style="italic">Defines inward contracts. Zero dependencies on database, web framework, or file systems.</text>
  </g>

  <!-- Flow Arrows: Controllers -> Application -->
  <line x1="160" y1="300" x2="160" y2="380" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="220" y1="300" x2="400" y2="380" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Flow Arrows: Commands/Queries -> Ports -->
  <line x1="305" y1="450" x2="580" y2="450" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="565" y1="450" x2="580" y2="450" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Flow Arrows: Bootstrap -> Inward Ports & Adapters -->
  <path d="M 830 200 L 830 380" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- 4. Domain Layer (Bottom) -->
  <g transform="translate(40, 590)">
    <rect width="1120" height="180" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="10" filter="url(#shadow)"/>
    <rect x="15" y="12" width="1090" height="30" fill="url(#domGrad)" rx="6"/>
    <text x="560" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">PURE DOMAIN LAYER (Zero Outer Dependencies)</text>

    <!-- Aggregate Roots -->
    <rect x="25" y="55" width="250" height="105" fill="#1e293b" stroke="#10b981" rx="6"/>
    <text x="150" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Aggregate Roots</text>
    <text x="40" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">• SkillDocumentV3</text>
    <text x="40" y="125" fill="#cbd5e1" font-family="monospace" font-size="10">• EstateCatalogV3</text>

    <!-- Entities -->
    <rect x="295" y="55" width="250" height="105" fill="#1e293b" stroke="#10b981" rx="6"/>
    <text x="420" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Entities &amp; Slices</text>
    <text x="310" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">• OperationV3 (Ports, Ops)</text>
    <text x="310" y="125" fill="#cbd5e1" font-family="monospace" font-size="10">• CompositionV3 (γ tree)</text>
    <text x="310" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">• CapabilitySliceV3</text>

    <!-- Value Objects -->
    <rect x="565" y="55" width="270" height="105" fill="#1e293b" stroke="#10b981" rx="6"/>
    <text x="700" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Pure Value Objects</text>
    <text x="580" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">• ContentDigest (sha256)</text>
    <text x="580" y="125" fill="#cbd5e1" font-family="monospace" font-size="10">• SourceByteSpan [start, end)</text>
    <text x="580" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">• AuthorityEffect, Lifecycle</text>

    <!-- Events & Errors -->
    <rect x="855" y="55" width="240" height="105" fill="#1e293b" stroke="#10b981" rx="6"/>
    <text x="975" y="80" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Domain Events &amp; Errors</text>
    <text x="870" y="105" fill="#cbd5e1" font-family="monospace" font-size="10">• CatalogCompiledV3</text>
    <text x="870" y="125" fill="#cbd5e1" font-family="monospace" font-size="10">• EstateCapturedV3</text>
    <text x="870" y="145" fill="#cbd5e1" font-family="monospace" font-size="10">• DomainInvariantError</text>
  </g>

  <!-- Flow Arrows: Application -> Domain -->
  <line x1="680" y1="560" x2="160" y2="640" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="750" y1="560" x2="420" y2="640" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="840" y1="560" x2="700" y2="640" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="930" y1="560" x2="975" y2="640" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
</svg>