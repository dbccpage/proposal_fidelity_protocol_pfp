messages:
- role: user
  content: "Consider a cellular sheaf cochain complex C^0(X; F) -> C^1(X; F) over\
    \ a 1D cell complex X with 6 vertices and 6 directed 1-cells e1..e6.\nThe coefficient\
    \ sheaf F assigns the normed space (R^3, ||\xB7||_1) to each cell with identity\
    \ restriction maps.\nGiven section s \u2208 C^0(X; F):\ns(u1) = (1, 0, 0)^T, s(u2)\
    \ = (0, 1, 0)^T, s(u3) = (0, 0, 1)^T,\ns(x12) = s(x23) = s(x31) = (0, 0, 0)^T.\n\
    \nThe coboundary d0: C^0 -> C^1 is (d0 s)_e = s(target(e)) - s(source(e)).\nEdges\
    \ e1 (x12->u1) and e6 (x31->u1) yield d0 s = (1, 0, 0)^T.\nEdges e2 (x12->u2)\
    \ and e3 (x23->u2) yield d0 s = (0, 1, 0)^T.\nEdges e4 (x23->u3) and e5 (x31->u3)\
    \ yield d0 s = (0, 0, 1)^T.\n\nThree cochain sub-evaluators C1, C2, C3 apply coordinate\
    \ deletion maps:\nC1 deletes index 0 on {e1, e6}.\nC2 deletes index 1 on {e2,\
    \ e3}.\nC3 deletes index 2 on {e4, e5}.\n\nEvaluate:\n- observed_tallies: {\"\
    C1\": J^C1, \"C2\": J^C2, \"C3\": J^C3} where J^alpha = sum_{e \u2208 E_alpha}\
    \ ||pi_alpha (d0 s)_e||_1.\n- all_green: true if all J^alpha == 0 else false.\n\
    - raw_global_defect_I: sum_{k=1..6} ||(d0 s)_ek||_1.\n- visibility_gap_lambda:\
    \ raw_global_defect_I - max(J^C1, J^C2, J^C3).\n- recovery_modulus_exists: whether\
    \ \u2203 f: R_+ -> R_+ s.t. I(lambda * s) <= f(max J(lambda * s)) for all lambda\
    \ > 0.\n\nOutput JSON:\n{\n  \"answer\": {\n    \"observed_tallies\": {\"C1\"\
    : integer, \"C2\": integer, \"C3\": integer},\n    \"all_green\": boolean,\n \
    \   \"raw_global_defect_I\": integer,\n    \"visibility_gap_lambda\": integer,\n\
    \    \"recovery_modulus_exists\": boolean\n  }\n}"
