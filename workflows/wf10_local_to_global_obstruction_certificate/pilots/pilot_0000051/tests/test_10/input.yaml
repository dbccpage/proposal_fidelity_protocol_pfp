messages:
- role: user
  content: "[Axiomatic Operator Specification]\nLet G = (V, E) be a directed nerve\
    \ with 6 vertices {u1, u2, u3, x12, x23, x31} and 6 edges e1..e6:\ne1: x12 ->\
    \ u1, e2: x12 -> u2, e3: x23 -> u2, e4: x23 -> u3, e5: x31 -> u3, e6: x31 -> u1.\n\
    Fibers are R^3 equipped with the l1 norm ||v||_1 = |v0| + |v1| + |v2|.\nSection\
    \ s: s(u1)=(1,0,0)^T, s(u2)=(0,1,0)^T, s(u3)=(0,0,1)^T, s(x12)=s(x23)=s(x31)=(0,0,0)^T.\n\
    Coboundary operator (d0 s)_e = s(target) - s(source).\n\nObservers:\n- C1 observes\
    \ edges {e1, e6} via pi_0 deleting index 0: (v0, v1, v2) -> (v1, v2).\n- C2 observes\
    \ edges {e2, e3} via pi_1 deleting index 1: (v0, v1, v2) -> (v0, v2).\n- C3 observes\
    \ edges {e4, e5} via pi_2 deleting index 2: (v0, v1, v2) -> (v0, v1).\n\nEvaluate:\n\
    1. Observed tallies J^C1, J^C2, J^C3 (sum of l1 norms of projected coboundary\
    \ on observed edges).\n2. all_green: whether all observed tallies equal 0.\n3.\
    \ raw_global_defect_I: sum of l1 norms across all 6 edges.\n4. visibility_gap_lambda:\
    \ raw_global_defect_I - max(J).\n5. recovery_modulus_exists: whether there exists\
    \ a modulus bounding global defect by observed defect under positive scalings\
    \ s_lambda = lambda * s.\n\nReturn JSON:\n{\n  \"answer\": {\n    \"observed_tallies\"\
    : {\"C1\": integer, \"C2\": integer, \"C3\": integer},\n    \"all_green\": boolean,\n\
    \    \"raw_global_defect_I\": integer,\n    \"visibility_gap_lambda\": integer,\n\
    \    \"recovery_modulus_exists\": boolean\n  }\n}"
