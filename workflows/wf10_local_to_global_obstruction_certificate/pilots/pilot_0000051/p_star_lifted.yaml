guidance:
  rules:
  - rule_id: rule_name_the_checker_field
    name: Exact Checker Field Naming
    statement: In projection_obstruction, the checker evaluates the top-level 'answer'
      field containing 'observed_tallies' (mapping C1, C2, C3 to integers), 'all_green'
      (bool), 'raw_global_defect_I' (int), 'visibility_gap_lambda' (int), and 'recovery_modulus_exists'
      (bool).
  - rule_id: rule_carrier_is_the_whole_task
    name: Carrier Is Whole Task
    statement: The declared 3 patches, 3 overlaps, 6 covering edges, R^3 l1 fibers,
      and 3 coordinate-deletion observers define the complete mathematical carrier.
      Do not import continuous manifolds or unlicensed infinite-dimensional Hilbert
      spaces.
  - rule_id: rule_request_structural_lift
    name: Explicit Structural Lift Request Protocol
    statement: 'If a non-exact obstruction cannot be trivialized within the declared
      finite carrier capacity, halt and explicitly declare a structural lift request
      (''request_structural_lift: true'') under the licensed context contract rather
      than inventing false exactness.'
  - rule_id: rule_ddc_structural_lift_granted
    name: Structural Lift Granted (DDC-LIFT-PO000-001)
    statement: "Under DDC Structural Lift license contract DDC-LIFT-PO000-001, carrier\
      \ capacity is officially extended to the quotient cochain complex C^\u2022(X;\
      \ F) / ker(Pi). Operational licenses are explicitly granted for the quotient\
      \ coboundary operator d0, exact rational l1 fiber norms ||\xB7||_1, and the\
      \ certification of visibility gap Lambda = 6 and absence of a recovery modulus\
      \ under positive scalings. Complete the derivation in the lifted regime."
  antibodies:
  - antibody_id: AB_INTERMEDIATE_WITNESS
    failure_class: heuristic_shortcut
    target_pattern: ungrounded_composite_answer
    description: Verify the intermediate edge coboundary vectors (d0 s)_e and their
      projected norms under each observer's coordinate deletion matrix before stating
      aggregate tallies.
  antipatterns: []
  helpful_patterns:
  - pattern_id: HP_RESPONSE_ANSWER_SLOT
    name: Response Answer Slot
    description: Deliver the final computed obstruction metrics in the top-level 'answer'
      field.
