user_prompt: "Consider a covering diagram with 3 open patches {u1, u2, u3} and 3 pairwise\
  \ overlaps {x12, x23, x31}.\nThe 6 directed covering edges are:\n  e1: x12 -> u1\n\
  \  e2: x12 -> u2\n  e3: x23 -> u2\n  e4: x23 -> u3\n  e5: x31 -> u3\n  e6: x31 ->\
  \ u1\nAll edge fibers are R^3 equipped with the l1 norm ||v||_1 = |v_0| + |v_1|\
  \ + |v_2|.\nAll restriction maps are the 3x3 identity matrix I_3.\n\nThe diagram\
  \ carries a section s with values:\n  s(u1) = (1, 0, 0)^T\n  s(u2) = (0, 1, 0)^T\n\
  \  s(u3) = (0, 0, 1)^T\n  s(x12) = (0, 0, 0)^T\n  s(x23) = (0, 0, 0)^T\n  s(x31)\
  \ = (0, 0, 0)^T\n\nEach edge defect is the coboundary (d0 s)_e = s(target) - s(source).\n\
  Three local observers {C1, C2, C3} observe the diagram:\n  - C1 watches edges {e1,\
  \ e6} through projection pi_0: R^3 -> R^2 deleting coordinate 0: (v0, v1, v2)^T\
  \ |-> (v1, v2)^T.\n  - C2 watches edges {e2, e3} through projection pi_1: R^3 ->\
  \ R^2 deleting coordinate 1: (v0, v1, v2)^T |-> (v0, v2)^T.\n  - C3 watches edges\
  \ {e4, e5} through projection pi_2: R^3 -> R^2 deleting coordinate 2: (v0, v1, v2)^T\
  \ |-> (v0, v1)^T.\nOn each watched edge, an observer observes the l1 norm of the\
  \ projected defect. An observer's local tally J^alpha is the sum of its observed\
  \ edge values.\n\nCompute:\n1. The observed local tallies J = {\"C1\": J^C1, \"\
  C2\": J^C2, \"C3\": J^C3}.\n2. Whether All-Green holds (all J^alpha == 0).\n3. The\
  \ total global raw defect norm I(s) = sum_{k=1..6} ||(d0 s)_ek||_1.\n4. The visibility\
  \ gap Lambda = I(s) - max_alpha J^alpha.\n5. Whether there exists a recovery modulus\
  \ function f: R_+ -> R_+ such that I(s_lambda) <= f(max_alpha J^alpha(s_lambda))\
  \ for all positive scalings s_lambda = lambda * s.\n\n[DDC STRUCTURAL LIFT CONTRACT\
  \ GRANTED: DDC-LIFT-PO000-001]\nCarrier capacity is officially extended to the quotient\
  \ cochain complex C^\u2022(X; F) / ker(Pi).\nOperational licenses are explicitly\
  \ granted for the coboundary operator d0, the exact l1 norm ||\xB7||_1, and the\
  \ derivation of visibility gap Lambda = 6 and non-existence of recovery modulus.\n\
  Derive the exact certificates and return the JSON answer."
