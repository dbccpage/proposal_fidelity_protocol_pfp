# Dimension register: every dimension that may change what Adversary and PFP return for a problem.
#
# This is an inventory with a triage column, not a priced matrix. The count is the point: write a
# dimension down when it is thought of, give it a bucket and a reason, and move it later. A
# dimension in a bucket other than phase1 is not forgotten; it is parked with its reason.
#
# Fields: id; group; what; levels (examples); n (number of levels, 0 when continuous or open);
# bucket; cost (what it takes to test); owner (who sets the value); why (the reason for the bucket).
# Outcomes are listed apart, under `outcomes`, and are not counted as dimensions.
#
# Later systems (OEWAS, OECOGOPS, OEEIS and others) add a group each; see `later_systems`.
# AuthorityEffect: None.

schema: pfp.dimension-register.v1
authority_effect: None
status: draft

vocabulary:
  buckets:
    phase1: varied or sampled in the first pilots (design.md section 10)
    constant: held fixed on purpose; the held value is recorded with every run
    next: worth testing once phase 1 has a result
    later: plausible, not yet worth the cost or the attention
    who_cares: no stated reason it would change an outcome of interest
    too_expensive: needs money, time or infrastructure we do not have
    too_hard: cannot be controlled, or its meaning is not yet clear
    unassessed: named, not yet looked at
  costs:
    free: no model call
    cents: model calls costing cents
    dollars: model calls costing dollars
    infra: needs infrastructure not built
    human: needs human time
  owners: [task, pfp, adversary, gate, immune, model, decoding, weights, environment, analysis, human, accounting, later]

dimensions:
  - {id: dossier_carrier_alphabet, group: rewrites, what: "reversible carrier token alphabet inside the unchanged SPK-001 wrapper", levels: "compact JSON, indented JSON, reordered JSON, emoji tokens, Egyptian glyph tokens", n: 5, bucket: phase1, cost: free, owner: pfp, why: "Matched carrier blocks separate representation effects from changed mathematical problems."}
  - {id: witness_multiplicity, group: task, what: "whether multiple different proposals can pass the same exact predicate", levels: "unique solution, multiple minimum witnesses, affine certificate family", n: 3, bucket: phase1, cost: free, owner: gate, why: "Strict types should preserve alternative valid graph repairs, spins and primal-dual certificates."}
  - {id: claim_scope_boundary, group: task, what: "structure actually supplied by a finite carrier", levels: "valid chain, declared topology mismatch, chain law failure, missing cup product carrier", n: 4, bucket: phase1, cost: free, owner: gate, why: "A matrix certificate cannot establish a missing multiplication law or an incompatible topology."}
  - {id: schema_enforcement_location, group: pfp_template, what: "where response typing is enforced", levels: "prompt schema plus host gate, provider constrained decoder plus host gate", n: 2, bucket: next, cost: free, owner: pfp, why: "The dossier campaign measures prompt-schema behavior; it does not claim that a schema in prose constrains token generation."}
  # ---- task_input: what comes in, the part that cannot be held constant --------------------
  - {id: task_family, group: task_input, what: "kind of problem", levels: "exact linear algebra, graph facts, graph repair, refusal", n: 4, bucket: phase1, cost: free, owner: task, why: "The main driver of whether any arm helps; each family has an exact checker."}
  - {id: difficulty_rung, group: task_input, what: "size of the instance", levels: "rungs 1 to 5 set by matrix order, graph order or step count", n: 5, bucket: phase1, cost: free, owner: task, why: "Plain text has to start failing somewhere; the rung finds where."}
  - {id: item_sample, group: task_input, what: "which items within a family and rung", levels: "many distinct generated instances", n: 0, bucket: phase1, cost: free, owner: task, why: "This sample stands in for wording, misreading and perturbation that we choose not to track one by one."}
  - {id: missing_premise, group: task_input, what: "an item whose right outcome is a typed refusal", levels: "answerable, unanswerable", n: 2, bucket: phase1, cost: free, owner: task, why: "Tests bluffing, the cheapest way to count vacuity."}
  - {id: problem_size_measure, group: task_input, what: "the number behind a rung", levels: "matrix order, vertex count, elimination steps", n: 0, bucket: constant, cost: free, owner: task, why: "Fixed by the rung table and recorded per item."}
  - {id: input_length_tokens, group: task_input, what: "length of the incoming text", levels: "tens to thousands of tokens", n: 0, bucket: next, cost: free, owner: task, why: "Longer inputs may favour structure; it follows from the rung and is not yet varied on its own."}
  - {id: input_surface_form, group: task_input, what: "how the problem is written", levels: "prose, LaTeX, table, code", n: 4, bucket: later, cost: free, owner: task, why: "Plausible effect on small models; needs its own items."}
  - {id: input_language, group: task_input, what: "natural language of the problem", levels: "English, others", n: 0, bucket: who_cares, cost: cents, owner: task, why: "English only for now; translation is treated as a rewrite, not an input."}
  - {id: ambiguity_level, group: task_input, what: "how under-specified the question is", levels: "exact, one gap, several gaps", n: 3, bucket: next, cost: free, owner: task, why: "The refusal family covers only the extreme; graded items are needed."}
  - {id: hostile_content_in_input, group: task_input, what: "an instruction hidden in the context", levels: "none, direct, indirect", n: 3, bucket: next, cost: free, owner: task, why: "The role-segregation claim; needs injection items with checkers after the base ladder."}
  - {id: constraint_count, group: task_input, what: "number of constraints the answer must meet", levels: "0 to 6", n: 7, bucket: next, cost: free, owner: task, why: "Structure may help when constraints pile up."}
  - {id: constraint_conflict, group: task_input, what: "constraints that cannot all hold", levels: "consistent, conflicting", n: 2, bucket: later, cost: free, owner: task, why: "A refusal variant; wait for the base refusal result."}
  - {id: instruction_position, group: task_input, what: "where the instruction sits relative to context", levels: "before, after, between", n: 3, bucket: later, cost: free, owner: task, why: "Known to matter in the literature; low priority here."}
  - {id: answer_type, group: task_input, what: "shape of the answer", levels: "scalar, set, structure, proof", n: 4, bucket: constant, cost: free, owner: task, why: "Fixed per family by the answer line."}
  - {id: answer_length, group: task_input, what: "size of the expected answer", levels: "one number to a small structure", n: 0, bucket: constant, cost: free, owner: task, why: "Set by the item; max_tokens leaves room for it."}
  - {id: memorisation_risk, group: task_input, what: "chance the model has seen the item or its answer", levels: "generated, published", n: 0, bucket: too_hard, cost: infra, owner: task, why: "Cannot be measured from outside; generated instances lower it, published values raise it."}
  - {id: answer_leak_in_prompt, group: task_input, what: "expected value visible in the prompt", levels: "absent, present", n: 2, bucket: constant, cost: free, owner: task, why: "Held at absent by a leak test; an earlier pilot found passing runs that had been given the answer."}
  - {id: multi_part_question, group: task_input, what: "several sub-questions in one prompt", levels: "1 to 4 parts", n: 4, bucket: later, cost: free, owner: task, why: "Adds a coordination effect; wait for single-part results."}
  - {id: sub_question_dependency, group: task_input, what: "later parts need earlier answers", levels: "independent, chained", n: 2, bucket: later, cost: free, owner: task, why: "Relevant to stages; needs multi-part items first."}
  - {id: known_answer_availability, group: task_input, what: "whether the exact answer is known", levels: "known, open", n: 2, bucket: constant, cost: free, owner: task, why: "Phase 1 uses known answers only; open problems have no price to check."}
  - {id: numeric_precision, group: task_input, what: "kind of number the answer holds", levels: "exact rational, float", n: 2, bucket: constant, cost: free, owner: task, why: "Exact rationals only; floats would hide cancellation."}
  - {id: domain_vocabulary, group: task_input, what: "amount of jargon", levels: "plain, technical", n: 0, bucket: later, cost: free, owner: task, why: "May interact with antibody domains; no item set yet."}
  - {id: cohomology_defect_class, group: task_input, what: "exact vs closed non-exact vs curved boundary defect", levels: "exact boundary, closed non-exact (H1 != 0), curvature defect (Gamma_2 > 0)", n: 3, bucket: phase1, cost: free, owner: task, why: "Decides whether defect is locally gauge repairable, requires licensed lift, or forces typed refusal (Pilots 52-54)."}
  - {id: magma_associativity_type, group: task_input, what: "associativity property of finite binary operations", levels: "associative semigroup, non-associative bracket magma", n: 2, bucket: phase1, cost: free, owner: task, why: "Decides whether operation satisfies associativity or admits an executable non-associative witness triple (Pilot 55)."}
  - {id: task_mode_fidelity, group: task_input, what: "instruction demanding literal string extraction vs finite deductive reasoning", levels: "literal_extraction, finite_deduction", n: 2, bucket: phase1, cost: free, owner: task, why: "Models often conflate verbatim quote matching with deductive derivation (Pilot 48)."}
  - {id: variable_identifier_permutation, group: task_input, what: "invariance under renaming variables or permuting clause order", levels: "canonical, permuted", n: 2, bucket: phase1, cost: free, owner: task, why: "Tests whether reasoning relies on surface identifier conventions rather than semantic structure (Pilot 49)."}
  - {id: floating_point_approximation_risk, group: task_input, what: "catastrophic rounding drift in finite algebraic calculations", levels: "exact_modular, float_approximated", n: 2, bucket: phase1, cost: free, owner: task, why: "Floating point introduces non-zero residual drift on exact discrete fields (Pilot 50)."}

  # ---- pfp_template: the constant P* template and how it is dressed ---------------------------
  - {id: arm_template, group: pfp_template, what: "plain text, P* template, or P* plus extras", levels: "A0 to A4 in design.md", n: 5, bucket: phase1, cost: free, owner: pfp, why: "The central contrast of the whole experiment."}
  - {id: p_star_member, group: pfp_template, what: "which of the six P* family members", levels: "base, R1 carrier, R4 collision, R8 admission, wire, relational", n: 6, bucket: next, cost: free, owner: pfp, why: "Phase 1 uses the base member; the others are probes."}
  - {id: p_star_version, group: pfp_template, what: "revision of the template", levels: "pinned by hash", n: 1, bucket: constant, cost: free, owner: pfp, why: "A template change is a new version, never a silent edit."}
  - {id: representation, group: pfp_template, what: "how the prompt is written down", levels: "raw, structured, relational, symbolic, spans", n: 5, bucket: next, cost: free, owner: pfp, why: "Already compared on tokens and on a small screen; the ladder fixes the best one."}
  - {id: source_duplication, group: pfp_template, what: "whether the source text appears twice", levels: "once, twice", n: 2, bucket: next, cost: free, owner: pfp, why: "Tier 0 found the structured form repeats the source; the spans form does not."}
  - {id: legend_present, group: pfp_template, what: "whether the dialect legend is sent", levels: "absent, present", n: 2, bucket: next, cost: free, owner: pfp, why: "The legend was the largest fixed cost in Tier 0."}
  - {id: legend_wording, group: pfp_template, what: "text of the legend", levels: "short, long", n: 0, bucket: later, cost: free, owner: pfp, why: "Only matters once the legend is shown to help."}
  - {id: span_partition_granularity, group: pfp_template, what: "how finely text is split into roles", levels: "coarse to per-clause", n: 0, bucket: later, cost: free, owner: pfp, why: "A plausible lever; needs the base result first."}
  - {id: role_label_set, group: pfp_template, what: "labels given to spans", levels: "task, constraint, context, output, unresolved", n: 5, bucket: constant, cost: free, owner: pfp, why: "Part of the template."}
  - {id: field_order, group: pfp_template, what: "order of fields in the packet", levels: "permutations", n: 0, bucket: later, cost: free, owner: pfp, why: "Order effects are reported in the literature; cheap to test later."}
  - {id: wire_dialect, group: pfp_template, what: "wire syntax", levels: "mss-boundary-v1, sn-wire-v1, sn-wire-v2", n: 3, bucket: later, cost: free, owner: pfp, why: "Matters for the symbolic form only."}
  - {id: envelope_sealing, group: pfp_template, what: "sealed packet envelope with hashes", levels: "unsealed, sealed", n: 2, bucket: later, cost: free, owner: pfp, why: "Adds tokens; benefit is integrity, not accuracy."}
  - {id: response_schema_in_prompt, group: pfp_template, what: "reply schema sent in the prompt", levels: "absent, present", n: 2, bucket: next, cost: free, owner: pfp, why: "May raise parse rate; costs tokens."}
  - {id: batching_k, group: pfp_template, what: "items sharing one header", levels: "1 to 20", n: 0, bucket: later, cost: cents, owner: pfp, why: "Tier 0 says the legend never breaks even; low priority."}
  - {id: answer_channel, group: pfp_template, what: "the final ANSWER line convention", levels: "one canonical form", n: 1, bucket: constant, cost: free, owner: gate, why: "Same for every arm so the gate judges answers, not dressing."}
  - {id: canonicalisation, group: pfp_template, what: "canonical bytes for packets", levels: "RFC 8785 JSON", n: 1, bucket: constant, cost: free, owner: pfp, why: "Part of the template."}
  - {id: mode, group: pfp_template, what: "the twenty mode contracts", levels: "mode_01 to mode_20", n: 20, bucket: too_hard, cost: free, owner: pfp, why: "No stated hypothesis for why a mode should change an outcome on these items; revisit when one exists."}
  - {id: level, group: pfp_template, what: "the 121 curriculum levels", levels: "level_00 onward", n: 121, bucket: who_cares, cost: free, owner: pfp, why: "Teaching material, not an experimental factor."}
  - {id: policy_stamps, group: pfp_template, what: "policy fields stamped on packets", levels: "derived_under_policy values", n: 0, bucket: who_cares, cost: free, owner: pfp, why: "Provenance, not content."}
  - {id: prompt_token_budget, group: pfp_template, what: "limit on the assembled prompt", levels: "tokens", n: 0, bucket: later, cost: free, owner: pfp, why: "Needed for the longest rungs only."}
  - {id: symbol_only_wire_encoding, group: pfp_template, what: "symbol-only reversible glyph alphabet vs natural language prompt wrapping", levels: "prose_wrapper, symbolic_glyph_packet", n: 2, bucket: phase1, cost: free, owner: pfp, why: "Measures token efficiency and parse fidelity of symbol-only representations (Pilots 23, 26)."}

  # ---- rewrites: changes made to the text before the model sees it -----------------------------
  - {id: rewrite_count, group: rewrites, what: "number of rewrites applied", levels: "0, 1, 2", n: 3, bucket: phase1, cost: free, owner: pfp, why: "Tests whether a minor rewrite matters (H3)."}
  - {id: rewrite_kind_structural, group: rewrites, what: "span repartition, role swap, order permutation", levels: "three host ops", n: 3, bucket: phase1, cost: free, owner: pfp, why: "The minor, deterministic rewrites; one is chosen per run."}
  - {id: rewrite_kind_noise, group: rewrites, what: "typo, homoglyph, glyph substitution, whitespace and BOM, truncation, duplication", levels: "six host ops", n: 6, bucket: next, cost: free, owner: pfp, why: "Robustness probes; informative only after the base result."}
  - {id: rewrite_kind_schema_damage, group: rewrites, what: "drop a field, swap a type", levels: "two host ops", n: 2, bucket: next, cost: free, owner: pfp, why: "Tests whether the checker and the model notice damage."}
  - {id: rewrite_kind_encoding, group: rewrites, what: "wire encoding, relational SQL encoding", levels: "two host ops", n: 2, bucket: later, cost: free, owner: pfp, why: "Overlaps representation, which is compared directly."}
  - {id: rewrite_kind_model_made, group: rewrites, what: "model paraphrase, compression, translation", levels: "three model ops", n: 3, bucket: later, cost: cents, owner: pfp, why: "Adds calls and a second model's errors; test after host rewrites."}
  - {id: rewrite_kind_dspy, group: rewrites, what: "DSPy prompt optimisation", levels: "one op at about twenty calls", n: 1, bucket: too_expensive, cost: dollars, owner: pfp, why: "Twenty calls per row; revisit when a baseline gap justifies it."}
  - {id: rewrite_kind_egraph, group: rewrites, what: "e-graph saturation", levels: "one host op", n: 1, bucket: later, cost: free, owner: pfp, why: "Interesting, but its effect on a model's answer has no stated mechanism."}
  - {id: rewrite_kind_expansion, group: rewrites, what: "P to P* expansion and subprompt split", levels: "two host ops", n: 2, bucket: later, cost: cents, owner: pfp, why: "Multiplies calls; belongs with stage counts."}
  - {id: rewrite_order, group: rewrites, what: "order of ops in a chain", levels: "permutations", n: 0, bucket: later, cost: free, owner: pfp, why: "Only meaningful once single rewrites matter."}
  - {id: rewrite_strength, group: rewrites, what: "fraction of text changed", levels: "edit distance", n: 0, bucket: next, cost: free, owner: pfp, why: "Needed to define what 'minor' means."}
  - {id: rewrite_origin, group: rewrites, what: "made by host code or by a model", levels: "host, model", n: 2, bucket: next, cost: free, owner: pfp, why: "A host rewrite is replayable; a model rewrite is not."}
  - {id: rewrite_receipt_checked, group: rewrites, what: "byte-exact partition checked", levels: "checked", n: 1, bucket: constant, cost: free, owner: pfp, why: "A rewrite without a checked receipt is not used."}
  - {id: rewrite_chain_length_max, group: rewrites, what: "longest chain allowed", levels: "2 now", n: 0, bucket: constant, cost: free, owner: pfp, why: "Raising it multiplies rows; held at two."}

  # ---- stages: how many passes through the PFP pipeline ----------------------------------------
  - {id: stage_count, group: stages, what: "number of PFP stages run", levels: "1 to 8", n: 8, bucket: phase1, cost: cents, owner: pfp, why: "The dose-response curve (H2)."}
  - {id: stage_subset, group: stages, what: "which stages run when fewer than eight", levels: "subsets", n: 0, bucket: next, cost: cents, owner: pfp, why: "Stage count alone hides which stage matters."}
  - {id: stage_order, group: stages, what: "order of stages", levels: "permutations", n: 0, bucket: later, cost: cents, owner: pfp, why: "Order is part of the protocol; changing it needs a reason."}
  - {id: pass_count, group: stages, what: "repeat passes through the stages", levels: "1 to 5", n: 5, bucket: next, cost: dollars, owner: pfp, why: "Cost grows with passes; test after one pass is understood."}
  - {id: stage_executor, group: stages, what: "host or model per stage", levels: "stage 5 is host-evaluated", n: 2, bucket: constant, cost: free, owner: pfp, why: "Fixed by the stage definitions."}
  - {id: per_stage_token_budget, group: stages, what: "token limit per stage", levels: "tokens", n: 0, bucket: later, cost: cents, owner: pfp, why: "Needed once stages are costly."}
  - {id: repair_loop_limit, group: stages, what: "repair attempts after a failed check", levels: "0 to 3", n: 4, bucket: next, cost: dollars, owner: pfp, why: "A main cost driver; the bounded repair loop exists."}
  - {id: early_exit_rule, group: stages, what: "stop once the gate passes", levels: "on, off", n: 2, bucket: next, cost: free, owner: pfp, why: "Needed to measure cost to a certified answer; define before the arm comparison."}
  - {id: stage_failure_policy, group: stages, what: "what a failed stage does", levels: "refuse, retry, continue", n: 3, bucket: later, cost: cents, owner: pfp, why: "Defaults are fail-closed; variants are not yet motivated."}
  - {id: terminal_routing, group: stages, what: "routing terminals allowed", levels: "seven terminals", n: 7, bucket: constant, cost: free, owner: pfp, why: "Defined by the authority rules, not varied."}

  # ---- adversary: swarm composition ------------------------------------------------------------------
  - {id: adversary_specialisation, group: adversary, what: "which of the eight specialisations", levels: "base plus seven narrowings", n: 8, bucket: later, cost: free, owner: adversary, why: "They differ by ports and skills, which gate a run without changing its steps."}
  - {id: critique_rounds, group: adversary, what: "critique rounds per bout", levels: "1 to 10", n: 10, bucket: next, cost: dollars, owner: adversary, why: "Calls grow with rounds times candidates; test after the arm result."}
  - {id: candidate_budget, group: adversary, what: "candidates proposed per bout", levels: "1 to 5", n: 5, bucket: next, cost: dollars, owner: adversary, why: "Interacts with rounds on cost."}
  - {id: ablation_no_gauge_change, group: adversary, what: "disable the gauge break", levels: "on, off", n: 2, bucket: next, cost: dollars, owner: adversary, why: "A single-flag ablation; cheap once a bout runs."}
  - {id: ablation_no_carrier_split, group: adversary, what: "disable the carrier split", levels: "on, off", n: 2, bucket: next, cost: dollars, owner: adversary, why: "A single-flag ablation."}
  - {id: ablation_no_independent_witness, group: adversary, what: "critic is the proposer", levels: "on, off", n: 2, bucket: next, cost: dollars, owner: adversary, why: "Tests whether independence of the critic pays."}
  - {id: ablation_no_residual_ledger, group: adversary, what: "disable the residual ledger", levels: "on, off", n: 2, bucket: next, cost: dollars, owner: adversary, why: "Tests the debt measure directly."}
  - {id: ablation_no_authorization_boundary, group: adversary, what: "disable the authorisation boundary", levels: "on, off", n: 2, bucket: later, cost: dollars, owner: adversary, why: "A safety rail, not an accuracy lever."}
  - {id: seat_model_map, group: adversary, what: "which model plays each active seat", levels: "three seats by three models", n: 27, bucket: next, cost: dollars, owner: adversary, why: "Large space; sample it with a bandit, not a grid."}
  - {id: seat_failover_order, group: adversary, what: "order of failover models per seat", levels: "permutations of three", n: 6, bucket: who_cares, cost: cents, owner: adversary, why: "Affects reliability, not the claim."}
  - {id: act_set, group: adversary, what: "which of acts I to VII run", levels: "subsets", n: 0, bucket: later, cost: dollars, owner: adversary, why: "Act order is fixed in code; ablating one needs a code change."}
  - {id: scene_subset_and_order, group: adversary, what: "ten scenes, which and in what order", levels: "subsets, permutations", n: 0, bucket: who_cares, cost: dollars, owner: adversary, why: "A separate scene path; no stated link to the pilots."}
  - {id: gauge_break_trigger, group: adversary, what: "when a gauge break fires", levels: "obstruction plus stagnation", n: 2, bucket: later, cost: dollars, owner: adversary, why: "A condition of the problem, not a free choice."}
  - {id: carrier_family, group: adversary, what: "which optional carrier keys a problem supplies", levels: "about thirty-two combinations", n: 32, bucket: later, cost: dollars, owner: adversary, why: "Set by the problem family."}
  - {id: port_licence_set, group: adversary, what: "ports a swarm may use", levels: "2047 subsets", n: 2047, bucket: who_cares, cost: free, owner: adversary, why: "Ports gate a run; they do not change what it does."}
  - {id: terminal_subset, group: adversary, what: "terminals a swarm may end on", levels: "127 subsets", n: 127, bucket: who_cares, cost: free, owner: adversary, why: "Gates the end state; does not change the steps."}
  - {id: bout_budget_cap, group: adversary, what: "USD ceiling per bout", levels: "2.00 and 0.50 tiers", n: 0, bucket: constant, cost: free, owner: adversary, why: "Part of the protocol and of our spend rules."}
  - {id: fixture_or_live, group: adversary, what: "scripted transport or live models", levels: "fixture, live", n: 2, bucket: constant, cost: free, owner: adversary, why: "Harness tests use fixtures; results use live calls."}
  - {id: persona_play, group: adversary, what: "how the model plays a character", levels: "free text", n: 0, bucket: who_cares, cost: cents, owner: model, why: "The role definitions are constant; how a model plays them is not tracked."}
  - {id: role_definitions, group: adversary, what: "the panel role definitions", levels: "fixed text", n: 1, bucket: constant, cost: free, owner: adversary, why: "The role definitions are the constant half of the swarm; only how a model plays them varies, and that is not tracked."}
  - {id: panel_size, group: adversary, what: "number of seats in a bout", levels: "four active seats", n: 0, bucket: later, cost: dollars, owner: adversary, why: "Fixed by the swarm; changing it is a new swarm."}
  - {id: bout_wall_clock_cap, group: adversary, what: "time limit per bout", levels: "seconds", n: 0, bucket: constant, cost: free, owner: adversary, why: "Needed for the censoring rule."}

  # ---- gates: the certificate, held constant --------------------------------------------------------
  - {id: gate_set, group: gates, what: "which gates run", levels: "26 gate files", n: 26, bucket: constant, cost: free, owner: gate, why: "Held constant; the gate is the oracle."}
  - {id: gate_independence, group: gates, what: "checker independent of the proposer", levels: "independent", n: 1, bucket: constant, cost: free, owner: gate, why: "A checker that shares the proposer's code is a self-score."}
  - {id: certificate_strictness, group: gates, what: "exact or tolerant comparison", levels: "exact only", n: 1, bucket: constant, cost: free, owner: gate, why: "No tolerance; floats are rejected."}
  - {id: obligation_list, group: gates, what: "obligations an answer must discharge", levels: "per family", n: 0, bucket: constant, cost: free, owner: gate, why: "Fixed before the run; this is the price schedule."}
  - {id: partial_credit_policy, group: gates, what: "credit for partly right answers", levels: "none", n: 1, bucket: constant, cost: free, owner: gate, why: "A discount; not allowed."}
  - {id: gate_language, group: gates, what: "Rust or Python host check", levels: "rust, python", n: 2, bucket: later, cost: free, owner: gate, why: "Changes speed, not the verdict, if both are correct."}
  - {id: replay_pass, group: gates, what: "a second judging pass", levels: "on", n: 1, bucket: constant, cost: free, owner: gate, why: "The two verdicts must match."}
  - {id: negative_control_set, group: gates, what: "answers the gate must refuse", levels: "wrong, shuffled, empty, unmarked", n: 4, bucket: constant, cost: free, owner: gate, why: "A gate that accepts a control voids the run."}
  - {id: cheat_proposal_set, group: gates, what: "fixed set of cheating replies", levels: "seven kinds", n: 7, bucket: constant, cost: free, owner: gate, why: "A cheat that passes is a discount."}
  - {id: gate_time_limit, group: gates, what: "time allowed for a check", levels: "seconds", n: 0, bucket: later, cost: free, owner: gate, why: "Only matters for the hardest rungs."}
  - {id: scale_descent_loss_ledger, group: gates, what: "mandatory explicit LossLedger tracking dropped detail coordinates under carrier contraction", levels: "required_exact_ledger", n: 1, bucket: constant, cost: free, owner: gate, why: "Enforces Law 6 against silent degrees-of-freedom loss under coarse-graining projections (Pilot 51)."}
  - {id: structural_carrier_lift, group: gates, what: "licensed context extension contract required before attaching higher-dimensional cells", levels: "licensed_lift, unlicensed_refusal", n: 2, bucket: constant, cost: free, owner: gate, why: "Enforces Law 4; extending carrier capacity without valid authorization contract fails closed (Pilot 52)."}
  - {id: typed_refusal_curvature_gate, group: gates, what: "fail-closed halt and immutable typed refusal emission on curvature defect (Gamma_2 > 0)", levels: "required_typed_refusal", n: 1, bucket: constant, cost: free, owner: gate, why: "Enforces Law 3; ungrounded descent mutations on non-zero curvature are rejected (Pilot 53)."}
  - {id: exact_gauge_potential_repair, group: gates, what: "zero-residual gradient matching delta phi = omega with canonical gauge anchor", levels: "anchored_zero_residual", n: 1, bucket: constant, cost: free, owner: gate, why: "Verifies exact cochain defect discharge along acyclic line graphs (Pilot 54)."}
  - {id: associativity_witness_verification, group: gates, what: "deterministic execution of left/right bracket trees to verify non-associative counterexample triples", levels: "verified_divergence", n: 1, bucket: constant, cost: free, owner: gate, why: "Rejects ungrounded non-associativity claims unless the witness triple demonstrably diverges (Pilot 55)."}
  - {id: compiled_semantic_mutant_kill, group: gates, what: "mandatory execution and killing of compiled semantic mutants per pilot test suite", levels: "minimum_4_mutants_killed", n: 1, bucket: constant, cost: free, owner: gate, why: "Guarantees gate verifiers are sensitive to ground truth alterations and boundary corruptions (Pilots 22-55)."}
  - {id: tautological_flag_rejection, group: gates, what: "refusal of always-true verification fields that lack falsifiable evidence", levels: "rejected", n: 1, bucket: constant, cost: free, owner: gate, why: "Discovered in Paper 009 / Pilot 21 where adversary_caught_am was true in every historical record."}
  - {id: prompt_answer_leakage_fence, group: gates, what: "static audit ensuring prompt context or test identifiers do not contain the answer", levels: "audited_clean", n: 1, bucket: constant, cost: free, owner: gate, why: "Discovered in Paper 010 where 36 of 60 historical cases leaked the answer in identifiers."}
  - {id: torus_cycle_holonomy_flatness, group: gates, what: "distinguishing trivial flat, non-trivial flat, and non-flat lattice connections via cycle holonomies", levels: "flat_trivial, flat_nontrivial, non_flat", n: 3, bucket: constant, cost: free, owner: gate, why: "Checks ordered plaquette products and cycle holonomies over non-abelian groups (Paper 010)."}
  - {id: simplicial_euler_poincare_invariance, group: gates, what: "discrete Euler characteristic chi = V - E + F and Betti number conservation on simplicial complexes", levels: "exact_integer", n: 1, bucket: constant, cost: free, owner: gate, why: "Discovered in Quiz 13 / Pilot 19; protects topological invariants against miscounted faces."}
  - {id: regge_triangulation_curvature, group: gates, what: "deficit angle and discrete scalar curvature on Regge calculus triangulations", levels: "flat, deficit_positive, deficit_negative", n: 3, bucket: constant, cost: free, owner: gate, why: "Discovered in Quiz 14 / Pilot 20; discrete gravitational curvature invariants."}

  # ---- immune: antibodies and matching --------------------------------------------------------------
  - {id: antibodies_enabled, group: immune, what: "antibodies applied or not", levels: "off, on", n: 2, bucket: phase1, cost: cents, owner: immune, why: "The learning claim (H4)."}
  - {id: antibody_domain_granularity, group: immune, what: "how fine the antibody categories are", levels: "coarse to per-subdomain", n: 0, bucket: next, cost: free, owner: immune, why: "The fine-grained idea; needs a domain taxonomy first."}
  - {id: antibody_source, group: immune, what: "mined from failures or curated", levels: "mined, curated", n: 2, bucket: next, cost: cents, owner: immune, why: "Mined entries are candidates until a host check reproduces the defect."}
  - {id: antibody_status, group: immune, what: "candidate or admitted", levels: "candidate, admitted", n: 2, bucket: constant, cost: free, owner: immune, why: "Only admitted entries are applied; sightings never self-activate."}
  - {id: antibody_count, group: immune, what: "how many antibodies are applied", levels: "0 to N", n: 0, bucket: next, cost: cents, owner: immune, why: "Dose-response; too many may dilute the prompt."}
  - {id: antibody_text_length, group: immune, what: "size of each antibody", levels: "tokens", n: 0, bucket: later, cost: cents, owner: immune, why: "Costs tokens; matters after a gain is seen."}
  - {id: antibody_position, group: immune, what: "where it sits in the prompt", levels: "before, after, inline", n: 3, bucket: later, cost: cents, owner: immune, why: "Position effects are known; low priority."}
  - {id: inoculation_timing, group: immune, what: "before the first attempt or after a failure", levels: "early, late", n: 2, bucket: next, cost: cents, owner: immune, why: "Early inoculation is the stated aim."}
  - {id: router_features, group: immune, what: "how an incoming prompt is matched to a winning shape", levels: "keywords, embeddings, task family", n: 0, bucket: later, cost: cents, owner: immune, why: "Needs enough history of winners first."}
  - {id: router_threshold, group: immune, what: "how close a match must be", levels: "similarity", n: 0, bucket: later, cost: free, owner: immune, why: "Meaningful only with a router."}
  - {id: template_library_size, group: immune, what: "number of candidate templates", levels: "1 to N", n: 0, bucket: later, cost: free, owner: immune, why: "Meaningful only with a router."}
  - {id: train_heldout_split, group: immune, what: "which items train and which test", levels: "fixed before mining", n: 1, bucket: constant, cost: free, owner: analysis, why: "Otherwise gains are memory."}
  - {id: split_contamination, group: immune, what: "overlap between train and held-out items", levels: "none, some", n: 2, bucket: constant, cost: free, owner: analysis, why: "Checked by item hash; any overlap voids H4."}
  - {id: false_inoculation_rate, group: immune, what: "an antibody applied where it does not belong", levels: "rate", n: 0, bucket: later, cost: cents, owner: immune, why: "A cost of fine-grained matching; measure once matching exists."}
  - {id: antibody_conflict, group: immune, what: "antibodies that contradict each other", levels: "none, some", n: 2, bucket: later, cost: cents, owner: immune, why: "Appears only with many antibodies."}
  - {id: antibody_decay, group: immune, what: "retiring antibodies that stop helping", levels: "never, by use", n: 0, bucket: who_cares, cost: free, owner: immune, why: "A maintenance question, not an outcome question."}

  # ---- model: who answers -----------------------------------------------------------------------------
  - {id: model_tier, group: model, what: "size class of the answering model", levels: "free small, free mid, free large, DeepSeek V4 Flash", n: 4, bucket: phase1, cost: cents, owner: model, why: "The cheapest tier that pays the price is the cost story; free tiers first."}
  - {id: model_family, group: model, what: "vendor and architecture family", levels: "Llama, Mistral, Claude, GPT, Gemini, others", n: 0, bucket: next, cost: dollars, owner: model, why: "Effects may not transfer across families."}
  - {id: model_parameter_count, group: model, what: "parameters", levels: "1B to 1T", n: 0, bucket: next, cost: dollars, owner: model, why: "Tier is a coarse stand-in; size within a family is cleaner."}
  - {id: model_snapshot, group: model, what: "exact model version", levels: "id and date", n: 0, bucket: constant, cost: free, owner: model, why: "Recorded with every run; a new snapshot is a new model."}
  - {id: training_cutoff, group: model, what: "date the training data ends", levels: "dates", n: 0, bucket: too_hard, cost: free, owner: model, why: "Bears on contamination; rarely published in full."}
  - {id: quantisation, group: model, what: "weight precision", levels: "16-bit, 8-bit, 4-bit", n: 3, bucket: later, cost: infra, owner: model, why: "Hosted APIs hide it; matters for local models."}
  - {id: context_window, group: model, what: "tokens the model can read", levels: "thousands to a million", n: 0, bucket: who_cares, cost: free, owner: model, why: "Prompts here are far below every window."}
  - {id: reasoning_mode, group: model, what: "built-in step-by-step thinking", levels: "off, on", n: 2, bucket: next, cost: dollars, owner: model, why: "Can swamp structure effects and multiplies cost."}
  - {id: thinking_budget, group: model, what: "tokens allowed for hidden reasoning", levels: "tokens", n: 0, bucket: next, cost: dollars, owner: model, why: "Part of the same question as reasoning mode."}
  - {id: instruction_tuning, group: model, what: "base or instruction-tuned", levels: "base, tuned", n: 2, bucket: who_cares, cost: free, owner: model, why: "Hosted models used here are all tuned."}
  - {id: architecture_type, group: model, what: "dense or mixture of experts", levels: "dense, MoE", n: 2, bucket: who_cares, cost: free, owner: model, why: "No stated mechanism for our question."}
  - {id: tool_use_enabled, group: model, what: "calculator or code tools allowed", levels: "none", n: 1, bucket: constant, cost: free, owner: model, why: "No tools in phase 1; tools change what a model can do."}
  - {id: structured_output_support, group: model, what: "provider enforces a reply schema", levels: "no, yes", n: 2, bucket: later, cost: cents, owner: model, why: "A confound for the answer channel; later study."}
  - {id: logprobs_available, group: model, what: "token probabilities returned", levels: "no, yes", n: 2, bucket: later, cost: cents, owner: model, why: "Enables a confidence signal; some providers only."}
  - {id: logit_bias_available, group: model, what: "token biasing supported", levels: "no, yes", n: 2, bucket: later, cost: cents, owner: model, why: "Prerequisite for logit steering on hosted models."}
  - {id: provider_backend_routing, group: model, what: "which backend OpenRouter chose", levels: "varies per call", n: 0, bucket: too_hard, cost: free, owner: environment, why: "Not controlled; recorded per call."}
  - {id: system_prompt_support, group: model, what: "a system role is honoured", levels: "yes", n: 1, bucket: constant, cost: free, owner: model, why: "All chosen models take one."}
  - {id: safety_refusal_behaviour, group: model, what: "refuses some topics", levels: "varies", n: 0, bucket: who_cares, cost: free, owner: model, why: "Our items are mathematics; counted as unpaid if it occurs."}
  - {id: model_multilingual_ability, group: model, what: "quality outside English", levels: "varies", n: 0, bucket: who_cares, cost: free, owner: model, why: "The items are written in English, so ability outside English cannot affect them."}
  - {id: model_vendor, group: model, what: "who serves the model", levels: "Meta, Mistral, Anthropic, others", n: 0, bucket: later, cost: dollars, owner: model, why: "Part of family; kept to track billing differences."}

  # ---- decoding: sampling controls ----------------------------------------------------------------------
  - {id: temperature, group: decoding, what: "sampling temperature", levels: "0, provider default", n: 2, bucket: phase1, cost: cents, owner: decoding, why: "Cheap, and it decides whether replicates carry information."}
  - {id: top_p, group: decoding, what: "nucleus sampling cutoff", levels: "0.3 to 1", n: 0, bucket: later, cost: cents, owner: decoding, why: "Secondary to temperature."}
  - {id: top_k, group: decoding, what: "top-k cutoff", levels: "integers", n: 0, bucket: who_cares, cost: cents, owner: decoding, why: "Not offered by every provider."}
  - {id: seed, group: decoding, what: "random seed", levels: "integers", n: 0, bucket: too_hard, cost: free, owner: decoding, why: "Not honoured by all providers; recorded, not controlled."}
  - {id: max_tokens, group: decoding, what: "reply length limit", levels: "tokens", n: 0, bucket: constant, cost: free, owner: decoding, why: "Truncation confounded the first screen; fixed per family with room for the answer, truncation counted as unpaid."}
  - {id: stop_sequences, group: decoding, what: "strings that end a reply", levels: "none, ANSWER line", n: 2, bucket: later, cost: cents, owner: decoding, why: "Could cut cost; risks cutting the answer."}
  - {id: repetition_penalties, group: decoding, what: "frequency and presence penalties", levels: "numbers", n: 0, bucket: who_cares, cost: cents, owner: decoding, why: "No stated mechanism."}
  - {id: logit_bias_suppress, group: decoding, what: "suppress chosen tokens", levels: "off, on", n: 2, bucket: next, cost: cents, owner: decoding, why: "The cheap hosted form of logit play."}
  - {id: grammar_constrained_output, group: decoding, what: "constrain the reply to a grammar", levels: "off, on", n: 2, bucket: next, cost: cents, owner: decoding, why: "May raise parse rate and cut vacuity."}
  - {id: samples_per_item, group: decoding, what: "independent samples drawn per item", levels: "1 to 5", n: 5, bucket: later, cost: dollars, owner: decoding, why: "Self-consistency multiplies cost."}
  - {id: vote_rule, group: decoding, what: "how samples are combined", levels: "majority, certificate-first", n: 2, bucket: later, cost: free, owner: decoding, why: "Meaningful only with several samples."}
  - {id: beam_search, group: decoding, what: "beam decoding", levels: "width", n: 0, bucket: who_cares, cost: infra, owner: decoding, why: "Not offered on hosted chat APIs."}

  # ---- weights: open-weights only ---------------------------------------------------------------------------
  - {id: attention_head_ablation, group: weights, what: "zero chosen attention heads", levels: "layer and head sets", n: 0, bucket: too_expensive, cost: infra, owner: weights, why: "Needs an open-weights host that is not built."}
  - {id: attention_head_steering, group: weights, what: "scale or redirect chosen heads", levels: "layer and head sets", n: 0, bucket: too_expensive, cost: infra, owner: weights, why: "Needs the same host."}
  - {id: activation_steering, group: weights, what: "add a steering vector", levels: "vectors", n: 0, bucket: too_expensive, cost: infra, owner: weights, why: "Needs the same host and a method to find vectors."}
  - {id: kv_cache_mask, group: weights, what: "mask parts of the cache", levels: "span sets", n: 0, bucket: too_expensive, cost: infra, owner: weights, why: "Needs the same host."}
  - {id: fsm_logit_mask, group: weights, what: "grammar mask over the full vocabulary", levels: "grammars", n: 0, bucket: later, cost: infra, owner: weights, why: "The strongest enforcement of an answer channel; needs local decoding."}
  - {id: logit_lens, group: weights, what: "read intermediate logits", levels: "layers", n: 0, bucket: too_expensive, cost: infra, owner: weights, why: "Diagnostic, needs the host."}
  - {id: sae_features, group: weights, what: "sparse autoencoder features", levels: "feature sets", n: 0, bucket: too_hard, cost: infra, owner: weights, why: "Needs trained dictionaries and an interpretation we cannot yet check."}
  - {id: layer_skip, group: weights, what: "skip chosen layers", levels: "layer sets", n: 0, bucket: who_cares, cost: infra, owner: weights, why: "No stated link to the claim."}
  - {id: residual_patching, group: weights, what: "patch the residual stream", levels: "positions", n: 0, bucket: too_expensive, cost: infra, owner: weights, why: "Needs the host and paired runs."}
  - {id: finetune_on_antibodies, group: weights, what: "train a small adapter on mined failures", levels: "adapter configs", n: 0, bucket: too_expensive, cost: infra, owner: weights, why: "The long-run form of inoculation; needs a training setup."}
  - {id: local_hardware, group: weights, what: "GPU used for local models", levels: "one L40S to two H100", n: 0, bucket: too_expensive, cost: infra, owner: environment, why: "Rental prices and throughputs are assumptions."}

  # ---- environment: what the run happens inside ---------------------------------------------------------------
  - {id: network_latency, group: environment, what: "round-trip delay", levels: "milliseconds", n: 0, bucket: too_hard, cost: free, owner: environment, why: "Pollutes time comparisons; recorded per call and reported."}
  - {id: provider_error_rate, group: environment, what: "rate of failed calls", levels: "rate", n: 0, bucket: too_hard, cost: free, owner: environment, why: "Not controlled; typed in the record."}
  - {id: time_of_day_load, group: environment, what: "provider load at the time", levels: "hours", n: 0, bucket: too_hard, cost: free, owner: environment, why: "Cannot be controlled; timestamps are kept."}
  - {id: concurrency, group: environment, what: "calls in flight", levels: "1", n: 1, bucket: constant, cost: free, owner: environment, why: "One at a time, so we do not slam a provider."}
  - {id: retry_policy, group: environment, what: "retries after a failure", levels: "none", n: 1, bucket: constant, cost: free, owner: environment, why: "A failure that may have been billed is booked at worst case."}
  - {id: request_timeout, group: environment, what: "wait before giving up", levels: "seconds", n: 0, bucket: constant, cost: free, owner: environment, why: "Fixed per run and recorded, so a timeout is the same event in every arm."}
  - {id: price_snapshot_date, group: environment, what: "date of the price list", levels: "2026-10-06", n: 1, bucket: constant, cost: free, owner: environment, why: "Re-read before every run."}
  - {id: price_change_during_campaign, group: environment, what: "prices moving mid-campaign", levels: "none, some", n: 2, bucket: later, cost: free, owner: environment, why: "Matters only for long campaigns."}
  - {id: prompt_caching, group: environment, what: "provider caches repeated input", levels: "off, on", n: 2, bucket: next, cost: cents, owner: environment, why: "Cached input is far cheaper and can reorder the cost ranking; report both."}
  - {id: batch_api, group: environment, what: "slower batch pricing", levels: "off, on", n: 2, bucket: next, cost: cents, owner: environment, why: "A large price lever for unattended runs."}
  - {id: tokenizer_differences, group: environment, what: "each model counts tokens its own way", levels: "per model", n: 0, bucket: too_hard, cost: free, owner: environment, why: "Cost uses billed tokens; token comparisons across models are not exact."}
  - {id: repo_commit, group: environment, what: "code revision", levels: "commit hash", n: 0, bucket: constant, cost: free, owner: environment, why: "Recorded with every run."}
  - {id: credential_source, group: environment, what: "where the key came from", levels: "environment, checkout, main checkout", n: 3, bucket: constant, cost: free, owner: environment, why: "Recorded in the receipt; has no effect on the answer."}
  - {id: client_machine, group: environment, what: "the machine that runs the harness", levels: "one workstation", n: 1, bucket: who_cares, cost: free, owner: environment, why: "The harness is not the thing measured."}
  - {id: text_encoding, group: environment, what: "console and file encoding", levels: "UTF-8", n: 1, bucket: who_cares, cost: free, owner: environment, why: "A defect class, not a factor."}

  # ---- implementation: Python, Rust, the CPU and the platform under the checks -------------------
  - {id: python_version, group: implementation, what: "interpreter version", levels: "3.12 pinned", n: 1, bucket: constant, cost: free, owner: environment, why: "Newer interpreters lack wheels here; recorded with every run."}
  - {id: rust_profile, group: implementation, what: "debug or release build of the Rust host", levels: "debug, release", n: 2, bucket: constant, cost: free, owner: environment, why: "Verdict logic is integer and rational; speed differs, answers must not."}
  - {id: python_rust_parity, group: implementation, what: "the Python and Rust versions of a check agree", levels: "agree, disagree", n: 2, bucket: next, cost: free, owner: gate, why: "A disagreement is a defect in one of them; fixtures from one side are replayed on the other."}
  - {id: ffi_boundary_encoding, group: implementation, what: "how values cross Python to Rust", levels: "process JSON, C ABI", n: 2, bucket: next, cost: free, owner: gate, why: "A rational written as 1/1 instead of 1 has already been a defect class."}
  - {id: integer_width, group: implementation, what: "fixed-width integers against big integers", levels: "i64, u64, big", n: 3, bucket: next, cost: free, owner: gate, why: "Rust fixed widths can overflow where Python cannot; the high rungs make large entries."}
  - {id: rational_library, group: implementation, what: "fractions, sympy or Rust big rationals", levels: "three libraries", n: 3, bucket: later, cost: free, owner: gate, why: "All exact; differences would be defects, found by parity tests."}
  - {id: cpu_float_semantics, group: implementation, what: "float rounding, fused multiply-add, denormals, x87 against SSE", levels: "platform dependent", n: 0, bucket: who_cares, cost: free, owner: environment, why: "Exact rationals only, so float rounding never enters a verdict; floats appear in cost statistics only."}
  - {id: silent_data_corruption, group: implementation, what: "a bit flip or CPU erratum alters a result", levels: "rare", n: 0, bucket: too_hard, cost: infra, owner: environment, why: "Cannot be provoked or ruled out; the replay pass recomputes every verdict as a partial guard."}
  - {id: cpu_throttling, group: implementation, what: "frequency changes under heat or load", levels: "varies", n: 0, bucket: too_hard, cost: free, owner: environment, why: "Moves wall-clock time; cost in USD is unaffected."}
  - {id: cpu_model_and_flags, group: implementation, what: "instruction set extensions in use", levels: "AVX, AES and others", n: 0, bucket: who_cares, cost: free, owner: environment, why: "No stated route to a different verdict."}
  - {id: endianness, group: implementation, what: "byte order", levels: "little", n: 1, bucket: constant, cost: free, owner: environment, why: "One platform; canonical bytes are text."}
  - {id: thread_nondeterminism, group: implementation, what: "scheduling order of threads or tasks", levels: "single-threaded", n: 1, bucket: constant, cost: free, owner: environment, why: "Builds and checks run single-threaded; one call in flight."}
  - {id: hash_seed_randomisation, group: implementation, what: "Python hash seed changes set and dict order", levels: "random, pinned", n: 2, bucket: next, cost: free, owner: environment, why: "Iteration order can change which item a check sees first; sort or pin."}
  - {id: serialisation_ordering, group: implementation, what: "key order and set order when writing JSON", levels: "sorted", n: 1, bucket: constant, cost: free, owner: pfp, why: "Canonical bytes need sorted keys."}
  - {id: yaml_parser_traps, group: implementation, what: "PyYAML reads an unquoted colon as a mapping and a bare yes as a boolean", levels: "quoted, unquoted", n: 2, bucket: next, cost: free, owner: gate, why: "A rule exists because it has bitten before; item and spec files get a parse test."}
  - {id: unicode_normalisation, group: implementation, what: "NFC or NFD, byte-order mark, CRLF", levels: "forms", n: 0, bucket: later, cost: free, owner: gate, why: "Changes bytes, so hashes and exact matches; the type probes already include BOM and CRLF."}
  - {id: locale_and_collation, group: implementation, what: "sort order of text", levels: "C, UTF-8", n: 0, bucket: who_cares, cost: free, owner: environment, why: "Checks do not sort text for a verdict."}
  - {id: timezone_and_clock, group: implementation, what: "time zone and clock source", levels: "UTC, monotonic", n: 0, bucket: constant, cost: free, owner: environment, why: "Timestamps are UTC; elapsed time uses a monotonic clock."}
  - {id: recursion_and_stack_depth, group: implementation, what: "Python recursion limit, Rust stack size", levels: "limits", n: 0, bucket: next, cost: free, owner: gate, why: "The deepest rungs may exhaust a checker; that must be a typed refusal, not a crash."}
  - {id: memory_limit, group: implementation, what: "memory available to a check", levels: "megabytes", n: 0, bucket: later, cost: free, owner: environment, why: "Matters at the top rungs only."}
  - {id: dependency_versions, group: implementation, what: "pydantic, PyYAML, numpy and other libraries", levels: "pinned by lock file", n: 0, bucket: constant, cost: free, owner: environment, why: "Recorded with every run."}
  - {id: compiler_optimisation, group: implementation, what: "optimisation level of Rust builds", levels: "0 to 3", n: 4, bucket: who_cares, cost: free, owner: environment, why: "Verdict logic has no floating point to reorder."}
  - {id: filesystem_and_paths, group: implementation, what: "case sensitivity and path separators", levels: "Windows", n: 1, bucket: who_cares, cost: free, owner: environment, why: "One platform; a repo rule on lowercase names covers it."}
  - {id: async_and_gil, group: implementation, what: "Python threading model", levels: "not used", n: 1, bucket: who_cares, cost: free, owner: environment, why: "The harness makes one call at a time, so the threading model never decides an order."}
  - {id: random_module_use, group: implementation, what: "any use of random numbers in checks", levels: "none, seeded", n: 2, bucket: constant, cost: free, owner: gate, why: "Checks are deterministic; the plan shuffle seed is recorded."}
  - {id: canonical_json_duplicate_keys, group: implementation, what: "fail-closed rejection of duplicate JSON keys in candidate replies via RFC 8785 unique pairs hook", levels: "strict_rejection", n: 1, bucket: constant, cost: free, owner: gate, why: "Prevents parser confusion attacks where models emit conflicting duplicate keys (Pilots 22-55)."}
  - {id: zero_float_law_arithmetic, group: implementation, what: "strict adherence to exact integer or rational arithmetic in all verdict calculations", levels: "integers_and_fractions_only", n: 1, bucket: constant, cost: free, owner: gate, why: "Prevents floating point rounding errors from masking defects or creating false passes (Pilot 50)."}
  - {id: gauge_anchor_normalization, group: implementation, what: "pinning a canonical base-point potential (e.g. phi_0 = 0) to eliminate unanchored gauge orbit drift", levels: "anchored", n: 1, bucket: constant, cost: free, owner: gate, why: "Ensures unique, reproducible potential representation without gauge freedom ambiguity (Pilot 54)."}

  # ---- measurement: design choices that still shape results --------------------------------------------------
  - {id: replicate_count, group: measurement, what: "repeats of each cell", levels: "1 to 5", n: 5, bucket: phase1, cost: cents, owner: analysis, why: "Needed to separate noise from effect."}
  - {id: items_per_cell, group: measurement, what: "sample size", levels: "30 or more", n: 0, bucket: constant, cost: free, owner: analysis, why: "Set by the hypothesis thresholds."}
  - {id: paired_design, group: measurement, what: "same items in every arm", levels: "paired", n: 1, bucket: constant, cost: free, owner: analysis, why: "Pairing removes item difficulty."}
  - {id: alpha_level, group: measurement, what: "significance threshold", levels: "0.05", n: 1, bucket: constant, cost: free, owner: analysis, why: "Fixed before the run."}
  - {id: multiple_comparison_rule, group: measurement, what: "correction for many arms", levels: "none, Holm", n: 2, bucket: later, cost: free, owner: analysis, why: "Needed once many arms are compared."}
  - {id: halving_parameters, group: measurement, what: "successive halving settings", levels: "rounds, keep fraction", n: 0, bucket: later, cost: free, owner: analysis, why: "Needed when the arm space grows."}
  - {id: plan_shuffle_seed, group: measurement, what: "order of calls", levels: "one seed", n: 1, bucket: constant, cost: free, owner: analysis, why: "Recorded so a cap stop removes calls from every cell alike."}
  - {id: censoring_cap_per_item, group: measurement, what: "cost at which an unsolved item stops", levels: "USD", n: 0, bucket: constant, cost: free, owner: analysis, why: "Unpaid items cost their cap and stay in the denominator."}
  - {id: wall_clock_cap, group: measurement, what: "time at which an item stops", levels: "seconds", n: 0, bucket: constant, cost: free, owner: analysis, why: "Stops one slow arm swamping the comparison."}
  - {id: analysis_version, group: measurement, what: "the fixed analysis plan", levels: "version", n: 1, bucket: constant, cost: free, owner: analysis, why: "A change is a new version, never a quiet edit."}

  # ---- human: the social side ----------------------------------------------------------------------------------------
  - {id: proposer_identity, group: human, what: "who or what proposed the answer", levels: "model, human, noise", n: 3, bucket: constant, cost: free, owner: gate, why: "The gate is blind to it; every proposer faces the same price."}
  - {id: promotion_step, group: human, what: "a person promotes a candidate result", levels: "required", n: 1, bucket: constant, cost: human, owner: human, why: "The machine never promotes; significance is a human judgement."}
  - {id: debt_definition, group: human, what: "the owner's term for technical and spiritual debt", levels: "to be defined", n: 0, bucket: unassessed, cost: human, owner: human, why: "Proposed as open residuals plus uncertified claims; awaiting the owner."}
  - {id: social_acceptance, group: human, what: "whether others believe a result", levels: "not modelled", n: 0, bucket: too_hard, cost: human, owner: human, why: "Reasoning is social; the design fixes the price and does not model belief."}
  - {id: prompt_author_skill, group: human, what: "skill of whoever writes the task wording", levels: "varies", n: 0, bucket: who_cares, cost: human, owner: human, why: "Folded into the item sample."}

  # ---- accounting: what counts as cost --------------------------------------------------------------------------------------
  - {id: cost_metric, group: accounting, what: "unit of cost", levels: "USD, tokens, calls, seconds", n: 4, bucket: constant, cost: free, owner: accounting, why: "All four are recorded; USD is the headline."}
  - {id: verification_cost_counted, group: accounting, what: "cost of running the gate", levels: "counted", n: 1, bucket: constant, cost: free, owner: accounting, why: "A cheap answer that is costly to check is not cheap."}
  - {id: failed_run_cost_counted, group: accounting, what: "cost of unpaid and failed attempts", levels: "counted", n: 1, bucket: constant, cost: free, owner: accounting, why: "No discount for hiding failures."}
  - {id: antibody_mining_cost_counted, group: accounting, what: "cost of building antibodies", levels: "counted, amortised", n: 2, bucket: next, cost: cents, owner: accounting, why: "An upfront cost that later items should share."}
  - {id: amortisation_horizon, group: accounting, what: "items sharing a mined antibody or template", levels: "1 to N", n: 0, bucket: next, cost: free, owner: accounting, why: "Decides whether fixed costs ever pay back."}
  - {id: human_review_time, group: accounting, what: "person-time to check a result", levels: "minutes", n: 0, bucket: too_hard, cost: human, owner: human, why: "A real cost with no clean unit."}
  - {id: infrastructure_cost, group: accounting, what: "hosts, storage, build time", levels: "USD per month", n: 0, bucket: later, cost: free, owner: accounting, why: "Matters at deployment scale."}

  # ---- later_systems: placeholders, one group per system added later ----------------------------------------------------
  - {id: oewas_composition, group: later_systems, what: "OEWAS added to the swarm", levels: "not yet enumerated", n: 0, bucket: unassessed, cost: dollars, owner: later, why: "Added later; its own dimensions get their own group."}
  - {id: oecogops_composition, group: later_systems, what: "OECOGOPS added to the swarm", levels: "not yet enumerated", n: 0, bucket: unassessed, cost: dollars, owner: later, why: "Added later; its own dimensions get their own group."}
  - {id: oeeis_composition, group: later_systems, what: "OEEIS added to the swarm", levels: "not yet enumerated", n: 0, bucket: unassessed, cost: dollars, owner: later, why: "Added later; the antibody dimensions above are its first slice."}

outcomes:
  - {id: verified_correct, what: "every obligation discharged by the gate", kind: "0 or 1"}
  - {id: usd_per_item, what: "total USD for the item, all calls and stages", kind: "decimal"}
  - {id: tokens_in_out, what: "billed input and output tokens", kind: "integers"}
  - {id: calls, what: "model calls made", kind: "integer"}
  - {id: wall_seconds, what: "elapsed time to a certified answer or the cap", kind: "seconds"}
  - {id: residuals_open, what: "open residuals when the run ends", kind: "integer"}
  - {id: uncertified_claims, what: "assertions in the reply with no certificate", kind: "integer"}
  - {id: vacuous_reply, what: "no parseable ANSWER line", kind: "0 or 1"}
  - {id: bluff, what: "an answer given where the right outcome is a refusal", kind: "0 or 1"}
  - {id: censored, what: "the item hit its cost or time cap unpaid", kind: "0 or 1"}
  - {id: gate_replay_agrees, what: "the second judging pass gives the same verdict", kind: "0 or 1"}
  - {id: silent_coordinate_loss_violation, what: "coarse projection discarded degrees of freedom without LossLedger custody", kind: "0 or 1"}
  - {id: unlicensed_carrier_mutation_violation, what: "carrier capacity extended without valid licensed context extension contract", kind: "0 or 1"}
  - {id: ungrounded_mutation_on_curvature, what: "descent attempted on non-zero curvature defect without resolving curvature", kind: "0 or 1"}
  - {id: non_zero_residual_defect, what: "proposed gauge repair left a non-zero cochain residual", kind: "0 or 1"}
  - {id: unanchored_gauge_drift, what: "gauge potential failed to pin the canonical zero anchor", kind: "0 or 1"}
  - {id: false_obstruction_verdict, what: "falsely claimed obstruction on a valid or flat carrier", kind: "0 or 1"}
  - {id: invalid_witness_triple, what: "supplied witness failed to demonstrate the claimed algebraic defect", kind: "0 or 1"}
  - {id: semantic_mutants_killed, what: "count of compiled semantic mutants verified killed by the test suite", kind: "integer"}
