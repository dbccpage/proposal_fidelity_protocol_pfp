    folder: seed_n11
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: false
    title: Replay a terminating confluence example
    summary: |-
      Rules a=>b, a=>c, b=>d, c=>d join at d under additive rank; removing c=>d leaves unjoined peak.
    key_findings:
    - Rank decreases strictly along rewrite steps.
    - Incomplete ruleset leaves irreducible unjoined peak.
    declared_laws:
    - Abstract rewriting system
    - Termination metric
    - Local confluence
    expected_predicates:
    - complete_system_confluent
    - peak_unjoined_without_cd
    seed_sha256: a5b945af57a882d4e243fe180b0d0b4b299dba9cc69381de653636f73a167992
    seed_prompt: |
      Over alphabet {a,b,c,d}, declare rules a=>b, a=>c, b=>d, c=>d. Assign rank(a)=2, rank(b)=rank(c)=1, rank(d)=0 and extend rank additively to words. Replay both branches from a and verify their join at d. Explain the finite rule/overlap completeness obligation before asserting global unique normal forms. Repeat after removing c=>d.
    seed_text: |
