    seed_prompt: |
      For the B(2,2) matrix from DEMO-N07 compute the characteristic polynomial exactly and retain the matrix as the input witness. Audit a proposed rewrite claiming that this finite spectrum establishes a universal infinite-graph or analytic theorem. Identify the additional hypotheses and retain the finite computed result even when the broader claim is unsupported.
    seed_text: |
