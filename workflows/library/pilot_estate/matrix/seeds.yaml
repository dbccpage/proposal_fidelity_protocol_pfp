    seed_sha256: 83615dfb63afbae7caff0b41d496005084f161b96329bc41f900a32f57b3fc2f
    seed_prompt: |
      In a declared Genesis admission profile with two admitted data and no forms, compare AdmitForm(1); AdmitInst(0,[0]) with the reversed order. Retain each occurrence in the replay tape, including repeated supplies that leave the final regime unchanged. Check parent/source bindings and actual transition validity. If the decision budget ends before a required check, emit the declared unknown outcome rather than a negative mathematical claim.
