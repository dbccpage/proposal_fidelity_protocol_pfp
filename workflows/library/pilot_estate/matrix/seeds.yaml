seeds:
  DEMO-N00:
    seed_id: DEMO-N00
    folder: seed_n00
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: false
    title: Opaque seed and supply inertia
    summary: |-
      Replay Supply('a') without admission; verify regime unchanged and no forced successor.
    key_findings:
    - Supply without admission leaves native regime unchanged.
    - '''<>'' is not an admitted datum.'
    declared_laws:
    - Regime crosswalk
    - Zero supply inertia
    expected_predicates:
    - regime_unchanged
    - no_invented_instance
    - source_crosswalk_retained
    seed_sha256: 55be9e7f36c378fba4a91ad0a60481522f497405b02986510c43178c7838243b
    seed_prompt: |
      Use the native Genesis regime crosswalk at the stated source revision. Begin with zero admitted data, forms, instances, rules and requirements. Replay Supply("a") without any admission event. Report the before/after regime, the observation domain and whether any successor was forced. Keep the wire inscription "<>" separate from an admitted datum and from the empty word.
    seed_text: |
      Use the native Genesis regime crosswalk at the stated source revision. Begin with zero admitted data, forms, instances, rules and requirements. Replay Supply("a") without any admission event. Report the before/after regime, the observation domain and whether any successor was forced. Keep the wire inscription "<>" separate from an admitted datum and from the empty word.
  DEMO-N01:
    seed_id: DEMO-N01
    folder: seed_n01
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: false
    title: First admission with no relational capacity
    summary: |-
      Compare [Supply('a')] vs [Supply('a'), AdmitDatum('a')]; verify carrier size 1 and no edge.
    key_findings:
    - Explicit admission adds one datum.
    - No relational capacity or distinguishing context.
    declared_laws:
    - Datum admission profile
    - Permutation equivariance
    expected_predicates:
    - carrier_size_1
    - zero_judgment_forms
    - renaming_transport_invariant
    seed_sha256: 1d5140394ddeb6b220b1e7c140674b30391e5a97665dae5beefbdab43926651d
    seed_prompt: |
      Compare two event logs: [Supply("a")] and [Supply("a"), AdmitDatum("a")]. In the admitted case use a regime with no judgment forms, instances or rules. Compute carrier size and available distinguishing contexts. Repeat under the bijective renaming a->z. Do not manufacture an edge or a positive judgment.
    seed_text: |
      Compare two event logs: [Supply("a")] and [Supply("a"), AdmitDatum("a")]. In the admitted case use a regime with no judgment forms, instances or rules. Compute carrier size and available distinguishing contexts. Repeat under the bijective renaming a->z. Do not manufacture an edge or a positive judgment.
  DEMO-N02:
    seed_id: DEMO-N02
    folder: seed_n02
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: true
    title: Pair, edge, observation and witness counts
    summary: |-
      Decode '<ab>' under retained-pair vs directed-edge; test separation via edge vs tagged report; count occurrences vs endpoints.
    key_findings:
    - Retained pair does not intrinsically assert an edge.
    - Adding an edge does not resolve an observational collision.
    - Tagged report separates colliding points.
    - Occurrence count varies while endpoint support remains exactly 2.
    declared_laws:
    - Retained-pair profile
    - Directed-edge profile
    - Observation separation
    expected_predicates:
    - pair_distinct_from_edge
    - constant_q_collides
    - tagged_report_separates
    - endpoint_support_two
    seed_sha256: 9be53cea01624ad79c487fd60dd62b6241e075087d494a3d84fd8e569ff901ab
    seed_prompt: |
      Decode "<ab>" under an explicitly declared retained-pair profile and under a separately declared directed-edge profile. Give the decoder and do not equate the two meanings. For A={a,b}, let q(a)=q(b)=0 and require separation. Compare adding an edge with adding t(a)=0,t(b)=1 to the report (q,t). Also count one, two and three occurrences of the same a->b witness separately from the two distinct endpoints.
    seed_text: |
      Decode "<ab>" under an explicitly declared retained-pair profile and under a separately declared directed-edge profile. Give the decoder and do not equate the two meanings. For A={a,b}, let q(a)=q(b)=0 and require separation. Compare adding an edge with adding t(a)=0,t(b)=1 to the report (q,t). Also count one, two and three occurrences of the same a->b witness separately from the two distinct endpoints.
  DEMO-N03:
    seed_id: DEMO-N03
    folder: seed_n03
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: true
    title: Triangle cycle, supplied filling and retraction obstruction
    summary: |-
      Oriented triangle 1-cycle z=ab+bc+ca has H1 rank 1; supplying 2-cell f with boundary z kills H1; prove chain retraction is obstructed.
    key_findings:
    - Initial H1 has rank 1.
    - Supplied filling kills the homology class (H1 rank 0).
    - A chain-map retraction fixing the original chain complex cannot exist.
    declared_laws:
    - Simplicial chain complex over Z
    - Boundary operator nilpotence
    - Chain-map retraction invariance
    expected_predicates:
    - initial_h1_rank_1
    - boundary_z_zero
    - filled_h1_rank_0
    - chain_retraction_impossible
    seed_sha256: 882478aa4661212bd172e566e7306a04e162815a4e4ecac8b2c60e01fd23f5fb
    seed_prompt: |
      Declare three vertices a,b,c and oriented edges ab,bc,ca over the integers. Let partial_1(ab)=b-a, partial_1(bc)=c-b, partial_1(ca)=a-c and C2=0. Compute z=ab+bc+ca, its boundary and H1. Then explicitly supply a new 2-cell f with partial_2(f)=z. Verify nilpotence and the changed H1. Determine whether a chain-map retraction fixing the original chain complex can exist.
    seed_text: |
      Declare three vertices a,b,c and oriented edges ab,bc,ca over the integers. Let partial_1(ab)=b-a, partial_1(bc)=c-b, partial_1(ca)=a-c and C2=0. Compute z=ab+bc+ca, its boundary and H1. Then explicitly supply a new 2-cell f with partial_2(f)=z. Verify nilpotence and the changed H1. Determine whether a chain-map retraction fixing the original chain complex can exist.
  DEMO-N04:
    seed_id: DEMO-N04
    folder: seed_n04
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: false
    title: Face closure and signed orientation
    summary: |-
      Face-closed simplex [a,b,c] determines 1-skeleton; boundary [b,c]-[a,c]+[a,b] is zero; directed reachability is acyclic.
    key_findings:
    - 1-faces are determined by face closure.
    - Signed boundary is a cycle.
    - Increasing directed graph is acyclic; -[a,c] does not grant c->a traversal.
    declared_laws:
    - Simplicial face closure
    - Signed orientation
    - Directed reachability
    expected_predicates:
    - skeleton_determined
    - signed_boundary_cycle
    - reachability_acyclic
    seed_sha256: 9e0810843e66378033409c2c223e9a07c2cfd5c8940bf7b28c26937d8368f0be
    seed_prompt: |
      Declare the face-closed simplex [a,b,c] with a<b<c. Compute its 1-skeleton and the signed chain partial_2[a,b,c]=[b,c]-[a,c]+[a,b]. Verify its boundary is zero. Separately check directed reachability using only the increasing edges a->b, a->c, b->c. Compare the filled triangle with its unfilled 1-skeleton and state what the graph-only projection forgets.
    seed_text: |
      Declare the face-closed simplex [a,b,c] with a<b<c. Compute its 1-skeleton and the signed chain partial_2[a,b,c]=[b,c]-[a,c]+[a,b]. Verify its boundary is zero. Separately check directed reachability using only the increasing edges a->b, a->c, b->c. Compare the filled triangle with its unfilled 1-skeleton and state what the graph-only projection forgets.
  DEMO-N05:
    seed_id: DEMO-N05
    folder: seed_n05
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: false
    title: Exact metric admission
    summary: |-
      Exact rational Gram matrix certification: equilateral (1,1,1) det=3/4 (pass); invalid (1,1,9) det=-45/4 (refuse).
    key_findings:
    - Gram matrix positive-definiteness check.
    - Rational squared lengths do not imply rational angles.
    declared_laws:
    - Gram matrix semi-definiteness
    - Exact rational metric profile
    expected_predicates:
    - equilateral_det_positive
    - triangle_inequality_violation_refused
    seed_sha256: 1734868c9db7cad7b886c78eae920d1c824665bf73c719a2dad3d9d471d84e6b
    seed_prompt: |
      For a Euclidean triangle take squared lengths ab=1, ac=1, bc=1. Construct the exact rational Gram matrix at a and certify positive definiteness. Repeat with ab=1, ac=1, bc=9. Distinguish exact squared-length and cosine data from any angular deficit, which requires an actual certified enclosure.
    seed_text: |
      For a Euclidean triangle take squared lengths ab=1, ac=1, bc=1. Construct the exact rational Gram matrix at a and certify positive definiteness. Repeat with ab=1, ac=1, bc=9. Distinguish exact squared-length and cosine data from any angular deficit, which requires an actual certified enclosure.
  DEMO-N06:
    seed_id: DEMO-N06
    folder: seed_n06
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: true
    title: Typed inverse on the old image
    summary: |-
      P={a,b}, Q={a',b',z}; u(x)=x'; r_hat(a')=inl(a), r_hat(z)=inr(NON_DESCENT); check empty base total retraction impossibility.
    key_findings:
    - Old-image recovery r_hat(u(x))=inl(x) succeeds.
    - Foreign element z yields typed refusal inr(NON_DESCENT).
    - |-
      Descent is a pointwise property of the submitted value, not a global delta_n scalar.
    - Total map Q -> empty cannot exist, while typed refusal map does.
    declared_laws:
    - Finite map tower
    - Pointwise retraction r_hat
    - Typed refusal coproduct
    expected_predicates:
    - old_image_recovered
    - foreign_value_refused
    - empty_base_total_impossible
    seed_sha256: 73e79b8a7dac0ec07c39cb3e6cc168626d2c9a2de6fbde951e640e1f9a81e518
    seed_prompt: |
      Let P={a,b} and Q={a',b',z}. Supply u(a)=a', u(b)=b' and r_hat(a')=inl(a), r_hat(b')=inl(b), r_hat(z)=NON_DESCENT. Check every old and foreign value. Keep this syntax/set profile separate from chain-map preservation. Then consider P=empty and Q={z}: can a total map Q->P exist?
    seed_text: |
      Let P={a,b} and Q={a',b',z}. Supply u(a)=a', u(b)=b' and r_hat(a')=inl(a), r_hat(b')=inl(b), r_hat(z)=NON_DESCENT. Check every old and foreign value. Keep this syntax/set profile separate from chain-map preservation. Then consider P=empty and Q={z}: can a total map Q->P exist?
  DEMO-N07:
    seed_id: DEMO-N07
    folder: seed_n07
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: false
    title: Periodic points versus primitive orbit counts
    summary: |-
      Unweighted de Bruijn graph B(2,2): 8 directed edges, traces 2 and 4, one primitive period-2 orbit.
    key_findings:
    - Distinguish periodic fixed points from primitive orbit classes.
    - Trace counting formula.
    declared_laws:
    - Shift dynamics
    - Trace formula
    expected_predicates:
    - edges_count_8
    - tr_t_2
    - tr_t2_4
    - primitive_period_two_1
    seed_sha256: 38967e12305dfe97caf965c5d51ad71d2c50b1315749849bd125d4253aa7361c
    seed_prompt: |
      Construct the unweighted de Bruijn graph B(2,2) on 00,01,10,11. An edge shifts left and appends either 0 or 1. Compute the adjacency matrix, tr(T), tr(T^2), and primitive period-two orbits modulo cyclic rotation. Retain the difference between periodic points and primitive orbit classes.
    seed_text: |
      Construct the unweighted de Bruijn graph B(2,2) on 00,01,10,11. An edge shifts left and appends either 0 or 1. Compute the adjacency matrix, tr(T), tr(T^2), and primitive period-two orbits modulo cyclic rotation. Retain the difference between periodic points and primitive orbit classes.
  DEMO-N08:
    seed_id: DEMO-N08
    folder: seed_n08
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: true
    title: Exact primal/dual cochain certificate
    summary: |-
      Oriented triangle ab,bc,ca; c=(1,1,1); verify Phi1=3 via g=(0,0,0) and dual y=(1,1,1); check d0^T y=0 and |y_e|<=1; reject infeasible y=(3,0,0).
    key_findings:
    - Primal mass ||c - d0 g||_1 = 3 at g=(0,0,0).
    - 'Dual vector y=(1,1,1) is feasible: d0^T y = 0 and ||y||_inf <= 1.'
    - Zero duality gap certifies Phi1 = 3 exactly.
    - Infeasible y=(3,0,0) has pairing 3 but is rejected by feasibility check.
    - Adding a 2-cell while retaining d0 and c leaves Phi1 unchanged.
    declared_laws:
    - Discrete cochain complex
    - L1 primal-dual certificate
    - Boundary operator d0
    expected_predicates:
    - primal_value_3
    - dual_feasible
    - duality_gap_zero
    - infeasible_dual_refused
    seed_sha256: d026438a08ad838b47fcc652a50f4ba8f5d0a53bcfa3242dcb5e55bf8f1d1a92
    seed_prompt: |
      On the oriented triangle ab,bc,ca use c=(1,1,1), edge weights (1,1,1), and d0 g=(g_b-g_a,g_c-g_b,g_a-g_c). Certify Phi1=min_g ||c-d0g||_1 using g=(0,0,0) and dual y=(1,1,1). Check both feasibility conditions d0^T y=0 and |y_e|<=1 before comparing masses. Add a face while retaining this same d0 and c, then recompute Phi1.
    seed_text: |
      On the oriented triangle ab,bc,ca use c=(1,1,1), edge weights (1,1,1), and d0 g=(g_b-g_a,g_c-g_b,g_a-g_c). Certify Phi1=min_g ||c-d0g||_1 using g=(0,0,0) and dual y=(1,1,1). Check both feasibility conditions d0^T y=0 and |y_e|<=1 before comparing masses. Add a face while retaining this same d0 and c, then recompute Phi1.
  DEMO-N09:
    seed_id: DEMO-N09
    folder: seed_n09
    collection: demo_000_review_seeds
    category: mssn
    is_batch_1: false
    title: Dagger is a declared law, not an inverse
    summary: |-
      One-object category {1,p} with p*p=p; dagger(1)=1, dagger(p)=p; p is not invertible and p†p=p!=1.
    key_findings:
    - Dagger laws hold without invertibility.
    - Fixed points are permitted in dagger functors.
    declared_laws:
    - Dagger category axioms
    - Idempotent morphism
    expected_predicates:
    - dagger_axioms_hold
    - p_not_invertible
    - p_dagger_p_is_p
    seed_sha256: 2114cb537e63d4a356fb4851b05a6f70b2424d12cd53c928b752741206906db2
    seed_prompt: |
      Use the one-object category with arrows {1,p}, identity 1 and p*p=p. Declare dagger(1)=1 and dagger(p)=p. Check involutivity and reversal of composition. Then test whether p is invertible and whether p†p=1. State the difference between a dagger and a fixed-point-free sign-cancelling involution.
    seed_text: |
      Use the one-object category with arrows {1,p}, identity 1 and p*p=p. Declare dagger(1)=1 and dagger(p)=p. Check involutivity and reversal of composition. Then test whether p is invertible and whether p†p=1. State the difference between a dagger and a fixed-point-free sign-cancelling involution.
