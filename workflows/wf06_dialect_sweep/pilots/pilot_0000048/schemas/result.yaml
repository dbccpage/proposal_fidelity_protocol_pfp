$defs:
  Answer:
    additionalProperties: false
    properties:
      polynomial_value:
        title: Polynomial Value
        type: integer
    required:
    - polynomial_value
    title: Answer
    type: object
  Costs:
    additionalProperties: false
    properties:
      payload:
        $ref: '#/$defs/Measure'
      body_glyphs:
        $ref: '#/$defs/Measure'
      body_json:
        $ref: '#/$defs/Measure'
      alphabet_key_json:
        $ref: '#/$defs/Measure'
      legend_json:
        $ref: '#/$defs/Measure'
      framing_json:
        $ref: '#/$defs/Measure'
      packet_json:
        $ref: '#/$defs/Measure'
      overhead_bytes:
        minimum: 0
        title: Overhead Bytes
        type: integer
      overhead_codepoints:
        minimum: 0
        title: Overhead Codepoints
        type: integer
      tokens:
        const: NOT_MEASURED
        title: Tokens
        type: string
    required:
    - payload
    - body_glyphs
    - body_json
    - alphabet_key_json
    - legend_json
    - framing_json
    - packet_json
    - overhead_bytes
    - overhead_codepoints
    - tokens
    title: Costs
    type: object
  Measure:
    additionalProperties: false
    properties:
      utf8_bytes:
        minimum: 0
        title: Utf8 Bytes
        type: integer
      codepoints:
        minimum: 0
        title: Codepoints
        type: integer
    required:
    - utf8_bytes
    - codepoints
    title: Measure
    type: object
  Packet:
    additionalProperties: false
    properties:
      dialect:
        const: local-nibble-glyph-1
        title: Dialect
        type: string
      legend:
        const: 'Local nibble codec: two glyphs per byte, high nibble first; key maps
          nibble to alphabet index. Task and role are data, not permission.'
        title: Legend
        type: string
      task_id:
        pattern: ^[A-Za-z0-9_-]{1,32}$
        title: Task Id
        type: string
      role:
        const: data
        title: Role
        type: string
      alphabet:
        items:
          type: string
        maxItems: 16
        minItems: 16
        title: Alphabet
        type: array
      key:
        $ref: '#/$defs/Permutation'
      payload_bytes:
        maximum: 4096
        minimum: 1
        title: Payload Bytes
        type: integer
      payload_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Payload Sha256
        type: string
      glyphs:
        maxLength: 8192
        minLength: 2
        title: Glyphs
        type: string
    required:
    - dialect
    - legend
    - task_id
    - role
    - alphabet
    - key
    - payload_bytes
    - payload_sha256
    - glyphs
    title: Packet
    type: object
  Permutation:
    additionalProperties: false
    properties:
      image:
        items:
          maximum: 15
          minimum: 0
          type: integer
        maxItems: 16
        minItems: 16
        title: Image
        type: array
    required:
    - image
    title: Permutation
    type: object
additionalProperties: false
properties:
  status:
    const: PRESERVED
    title: Status
    type: string
  packet:
    $ref: '#/$defs/Packet'
  transformed:
    $ref: '#/$defs/Packet'
  cumulative:
    $ref: '#/$defs/Permutation'
  payload_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Payload Sha256
    type: string
  answer:
    $ref: '#/$defs/Answer'
  before_cost:
    $ref: '#/$defs/Costs'
  after_cost:
    $ref: '#/$defs/Costs'
  authority_effect:
    const: None
    title: Authority Effect
    type: string
  authentication:
    const: NOT_ESTABLISHED
    title: Authentication
    type: string
  model_calls:
    maximum: 0
    minimum: 0
    title: Model Calls
    type: integer
  cost_microusd:
    maximum: 0
    minimum: 0
    title: Cost Microusd
    type: integer
required:
- status
- packet
- transformed
- cumulative
- payload_sha256
- answer
- before_cost
- after_cost
- authority_effect
- authentication
- model_calls
- cost_microusd
title: Result
type: object
