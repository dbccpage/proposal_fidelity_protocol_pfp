$defs:
  Packet:
    additionalProperties: false
    properties:
      dialect:
        const: local-nibble-glyph-1
        title: Dialect
        type: string
      legend:
        const: 'Local nibble codec: two glyphs per byte, high nibble first; key maps
          nibble to alphabet index. Task and role are data, not permission.'
        title: Legend
        type: string
      task_id:
        pattern: ^[A-Za-z0-9_-]{1,32}$
        title: Task Id
        type: string
      role:
        const: data
        title: Role
        type: string
      alphabet:
        items:
          type: string
        maxItems: 16
        minItems: 16
        title: Alphabet
        type: array
      key:
        $ref: '#/$defs/Permutation'
      payload_bytes:
        maximum: 4096
        minimum: 1
        title: Payload Bytes
        type: integer
      payload_sha256:
        pattern: ^[0-9a-f]{64}$
        title: Payload Sha256
        type: string
      glyphs:
        maxLength: 8192
        minLength: 2
        title: Glyphs
        type: string
    required:
    - dialect
    - legend
    - task_id
    - role
    - alphabet
    - key
    - payload_bytes
    - payload_sha256
    - glyphs
    title: Packet
    type: object
  Permutation:
    additionalProperties: false
    properties:
      image:
        items:
          maximum: 15
          minimum: 0
          type: integer
        maxItems: 16
        minItems: 16
        title: Image
        type: array
    required:
    - image
    title: Permutation
    type: object
additionalProperties: false
properties:
  packet:
    $ref: '#/$defs/Packet'
  permutations:
    items:
      $ref: '#/$defs/Permutation'
    maxItems: 6
    title: Permutations
    type: array
  comparison:
    anyOf:
    - $ref: '#/$defs/Packet'
    - type: 'null'
required:
- packet
- permutations
- comparison
title: Job
type: object
