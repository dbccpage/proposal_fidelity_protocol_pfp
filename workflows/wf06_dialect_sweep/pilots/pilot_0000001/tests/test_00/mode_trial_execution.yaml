schema: pfp.mode-trial-execution.v1
authority_effect: None
pilot_id: pilot_0000001
mode_id: 2
mode_contract: omega_engine_education/pfp/infrastructure/yaml/modes/mode_02_packets_and_sealed_envelopes/contract.yaml
provider_calls: 0
target_spend_usd: 0.0
winning_condition_executed: true
execution_limit: Digest checks ran on the four-object packet. No model was called.
advantages:
- An edge flip changes the problem digest.
- Separate object digests localize a candidate-only edit.
- Span digests name which fact moved.
disadvantages:
- Whitespace and an edge flip are the same kind of digest failure.
- A resealed wrong answer passes the digest check.
- The seal is not the graph oracle.
variations:
- variation_id: honest_four_object_seal
  role: winning
  status: ACCEPTED
  claim_held: true
  failure_mode: null
  observation: Problem, candidate, and contract each have a digest, and the digests match the objects.
  evidence:
    digest_match: true
    edge_count: 4
- variation_id: bare_packet_misses_edge_flip
  role: disadvantage
  status: REJECTED
  claim_held: true
  failure_mode: Missing envelope metadata
  observation: A packet with no digest still parses after an edge is replaced. Custody has nothing to
    check.
  evidence:
    bare_has_receipt: false
    problem_digest_changed: true
- variation_id: single_seal_edge_flip
  role: advantage
  status: REJECTED
  claim_held: true
  failure_mode: null
  observation: Sealing the problem detects the edge flip because the digest changes.
  evidence:
    detected: true
- variation_id: single_seal_whitespace
  role: disadvantage
  status: REJECTED
  claim_held: true
  failure_mode: Digest mismatch (tampered payload)
  observation: A trailing note changes the digest in the same way an edge flip does. The seal does not
    classify the edit.
  evidence:
    whitespace_rejected: true
    same_digest_as_edge_flip: false
- variation_id: candidate_edit_is_localized
  role: advantage
  status: REJECTED
  claim_held: true
  failure_mode: null
  observation: A candidate-only edit leaves the problem digest intact and breaks the candidate digest.
  evidence:
    problem_intact: true
    candidate_detected: true
- variation_id: resealed_wrong_answer
  role: disadvantage
  status: REJECTED
  claim_held: true
  failure_mode: Digest-only acceptance of a false candidate
  observation: Minting a new receipt around edge_count 5 makes the three digests agree. The seal does
    not know the graph.
  evidence:
    digest_only_status: ACCEPTED
    oracle_status: REJECTED
- variation_id: span_seal_localizes_triangle
  role: advantage
  status: REJECTED
  claim_held: true
  failure_mode: null
  observation: Hashing each fact span reports the triangle span and leaves the bridge span.
  evidence:
    triangle_changed: true
    bridge_changed: false
