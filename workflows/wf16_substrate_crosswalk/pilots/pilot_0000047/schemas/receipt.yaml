$defs:
  ArtifactHashes:
    additionalProperties: false
    properties:
      diagnostic.txt:
        pattern: ^[0-9a-f]{64}$
        title: Diagnostic.Txt
        type: string
      input.bin:
        pattern: ^[0-9a-f]{64}$
        title: Input.Bin
        type: string
      result.json:
        pattern: ^[0-9a-f]{64}$
        title: Result.Json
        type: string
      result.yaml:
        pattern: ^[0-9a-f]{64}$
        title: Result.Yaml
        type: string
      stderr.txt:
        pattern: ^[0-9a-f]{64}$
        title: Stderr.Txt
        type: string
      stdout.txt:
        pattern: ^[0-9a-f]{64}$
        title: Stdout.Txt
        type: string
    required:
    - input.bin
    - result.json
    - result.yaml
    - stdout.txt
    - stderr.txt
    - diagnostic.txt
    title: ArtifactHashes
    type: object
additionalProperties: false
properties:
  artifact_sha256:
    $ref: '#/$defs/ArtifactHashes'
  checker_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Checker Sha256
    type: string
  code_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Code Sha256
    type: string
  core_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Core Sha256
    type: string
  cost_usd:
    const: '0'
    title: Cost Usd
    type: string
  experiment:
    const: pilot_0000047
    title: Experiment
    type: string
  input_bytes:
    minimum: 0
    title: Input Bytes
    type: integer
  input_complete:
    title: Input Complete
    type: boolean
  input_sha256:
    pattern: ^[0-9a-f]{64}$
    title: Input Sha256
    type: string
  model_calls:
    maximum: 0
    minimum: 0
    title: Model Calls
    type: integer
  status:
    enum:
    - PRESERVED
    - REJECTED
    title: Status
    type: string
required:
- experiment
- status
- input_complete
- input_bytes
- input_sha256
- code_sha256
- checker_sha256
- core_sha256
- model_calls
- cost_usd
- artifact_sha256
title: Receipt
type: object
