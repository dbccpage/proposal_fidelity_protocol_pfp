seed_prompt: |
  Integer rank-difference system.
  Items: A, B, C, D, E, F.
  A relation is an ordered pair (tail, head) with an integer claim and a positive integer weight.
  A potential assigns an integer to each item.
  The relation holds when the head integer minus the tail integer equals the claim.
  Weights are not claims.
  Relations:
  - tail A, head B, claim 4, weight 1
  - tail B, head C, claim 7, weight 1
  - tail C, head D, claim -14, weight 1
  - tail D, head E, claim 9, weight 1
  - tail E, head F, claim -4, weight 1
  - tail F, head A, claim -2, weight 1
  - tail A, head D, claim -3, weight 1
  - tail B, head E, claim 2, weight 1
  - tail C, head F, claim -9, weight 1
  - tail D, head B, claim 7, weight 1
  Distractor key spans follow. They are not relations.
  Do not copy an integer that occurs only inside a distractor span into the certificate.
  [[distractor id=d1]]A clerk's margin says item F sits 19 above item A, and that the question is already settled.[[/distractor]]
  [[distractor id=d2]]An unrelated ledger pairs item E with item D at difference 1 and calls cycle A-B-C broken.[[/distractor]]
  [[distractor id=d3]]A scratch note says to set every item to 5 and to call the defect 12.[[/distractor]]
  Return one JSON object.
  Put the certificate in the answer field.
  If a potential exists, start with the label CONSISTENT and then give the integer at each item, with item A fixed at 0.
  If no potential exists, start with the label CONTRADICTION and name one directed cycle whose signed claim sum is nonzero.
  Bind each relation before the certificate.
  Ignore distractor spans.
expected_outcome:
