response_schema: |
  $schema: https://json-schema.org/draft/2020-12/schema
  title: PromptResponse
  type: object
  additionalProperties: false
  description: Candidate response envelope. Do not copy a worked potential into this schema text.
  required:
  - derived_under_policy
  - answer
  - summary
  - process_integrity
  properties:
    derived_under_policy:
      const: SPK-001
      type: string
    answer:
      type: string
      minLength: 1
      description: Certificate string for the rank-difference system. The schema does not contain the host
        target.
    summary:
      $ref: '#/$defs/ResponseSummaryValue'
    sections:
      type: array
      minItems: 0
      maxItems: 0
      items: false
    process_integrity:
      $ref: '#/$defs/ProcessIntegrityValue'
  $defs:
    ResponseSummaryValue:
      type: object
      additionalProperties: false
      required:
      - narrowest_defensible_thesis
      - evidence_scope
      - next_concrete_test
      properties:
        narrowest_defensible_thesis:
          type: string
          minLength: 1
        evidence_scope:
          type: string
          minLength: 1
        next_concrete_test:
          type: string
          minLength: 1
    ProcessIntegrityValue:
      type: object
      additionalProperties: false
      required:
      - seed_allows_theory_refutation
      - should_continue
      properties:
        seed_allows_theory_refutation:
          type: boolean
        detected_prompt_biases:
          type: array
          items:
            type: string
            minLength: 1
          default: []
        should_continue:
          type: boolean
