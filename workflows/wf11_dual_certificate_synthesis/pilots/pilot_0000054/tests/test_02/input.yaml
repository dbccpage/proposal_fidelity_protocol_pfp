  complex_name: hollow_5simplex_b4_1
  description: Hollow 5-simplex boundary cell complex (boundary of 5-simplex S^4) with
    6 vertices, 15 edges, 20 faces, 15 tetrahedra, 6 4-simplices, b1 = 0, b2 = 0, b3
    = 0, b4 = 1.
  topology:
    vertex_count: 6
    edge_count: 15
    face_count: 20
    tetrahedron_count: 15
    pentachoron_count: 6
    pentachora:
    - id: p0
      vertices: [v0, v1, v2, v3, v4]
      weight: '1'
      flux_g: -1/6
    - id: p1
      vertices: [v0, v1, v2, v3, v5]
      weight: '1'
      flux_g: 1/6
    - id: p2
      vertices: [v0, v1, v2, v4, v5]
      weight: '1'
      flux_g: -1/6
    - id: p3
      vertices: [v0, v1, v3, v4, v5]
      weight: '1'
      flux_g: 1/6
    - id: p4
      vertices: [v0, v2, v3, v4, v5]
      weight: '1'
      flux_g: -1/6
    - id: p5
      vertices: [v1, v2, v3, v4, v5]
      weight: '1'
      flux_g: 1/6
  homology:
    b0: 1
    b1: 0
    b2: 0
    b3: 0
    b4: 1
    euler_characteristic: 2
    betti_formula: chi = 6 - 15 + 20 - 15 + 6 = 2 = 1 - 0 + 0 - 0 + 1
    fundamental_4_cycle: ['-1', '1', '-1', '1', '-1', '1']
  boundary_matrices:
