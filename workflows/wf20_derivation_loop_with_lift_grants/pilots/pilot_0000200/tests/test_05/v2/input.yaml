original_seed: "Derive defect-current conservation from microscopic residual dynamics\
  \ for PO035 \xA74. Start with i*d\u03C8/dt=H\u03C8 on a finite comparison graph,\
  \ an orthogonal projector P, residual r=(I-P)\u03C8 and local defect density \u03BD\
  _v=|r_v|\xB2. Do not prescribe a conserved Gaussian or choose flux after declaring\
  \ its divergence zero. Derive the local balance, identify source terms and sufficient\
  \ hypotheses for a conserved residual current, and give a counterexample to unconditional\
  \ conservation. Explain the additional estimates required for a continuum limit;\
  \ a central-difference truncation formula alone does not establish it.\nUse this\
  \ noncommuting exact fixture: H=[[0,1,0],[1,0,1],[0,1,0]], P=diag(1,0,0), \u03C8\
  =(1,i,1). Orient edges 0->1 and 1->2, with incidence -1 at source,+1 at target.\
  \ Return certificate residual and residual_derivative as 3 arrays [real,imag] of\
  \ rational strings; density_derivative, edge_flux and source as rational-string\
  \ vectors. Define edge_flux by the residual-only Schr\xF6dinger balance so B*edge_flux\
  \ is its density derivative; source is the additional term in the full projected\
  \ dynamics. Establish whether the total defect density is conserved on this fixture\
  \ and in your conditional theorem. The fixture must remain noncommuting even if\
  \ a commuting-projector lift is granted. Generate learning artifacts and request\
  \ needed lifts."
