original_seed: 'Derive a corrected causal refinement statement for PO035 §3, rather
  than just evaluating its envelope. On a pitch-a hypercubic comparison graph take
  an LR upper bound E_a(t,x)=min(1,C_a exp[-mu_a (||x||_1-a*v_hop(a)*t)/a]) for t>=0.
  State uniform assumptions, physical velocity/time scaling, limiting spatial norm,
  what the bound establishes outside the cone, and what remains unproved inside it.
  Analyze the null boundary under different rates of convergence of a*v_hop(a) to
  c. Determine whether causal order alone identifies the Minkowski metric or its scale.
  Give a derivation or a counterexample and corrected conditional theorem; do not
  silently assume isotropy or sharp propagation.

  For an independent exact counterexample witness use c=1,t=1,x=(1,1), dilation factor
  2. Separately evaluate the null envelope at t=1,x=(1,0), C_a=1/4,mu_a=1 with exactly
  matched physical speed c. Return a certificate with l1_radius, euclidean_radius_squared,
  interval_before, interval_after for the first point, null_envelope for the separate
  null point (rational strings), and cone_order_preserved (boolean). Address the analytical
  goal in derivation, not only these fixtures. Request any missing licenses. Generate
  useful rules, skills, antiskills, patterns and candidate antibodies from your attempt.'
