          x-slot: data
        should_continue:
          title: Should Continue
          type: boolean
          x-slot: data
      required:
      - seed_allows_theory_refutation
      - should_continue
      title: ProcessIntegrityValue
      type: object
    ResponseSectionValue:
      additionalProperties: false
      description: Rows validated against the packet response contract by validate_response.
      properties:
        name:
          maxLength: 240
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/@-]*$
          title: Name
          type: string
          x-slot: data
        rows:
          items:
            $ref: '#/$defs/JsonValue'
          title: Rows
          type: array
          x-slot: data
      required:
      - name
      - rows
      title: ResponseSectionValue
      type: object
    ResponseSummaryValue:
      additionalProperties: false
      properties:
        narrowest_defensible_thesis:
          minLength: 1
          pattern: \S
          title: Narrowest Defensible Thesis
          type: string
          x-slot: data
        evidence_scope:
          minLength: 1
          pattern: \S
          title: Evidence Scope
          type: string
          x-slot: data
        next_concrete_test:
          minLength: 1
          pattern: \S
          title: Next Concrete Test
          type: string
          x-slot: data
      required:
      - narrowest_defensible_thesis
      - evidence_scope
      - next_concrete_test
      title: ResponseSummaryValue
      type: object
  additionalProperties: false
  description: Actual model response. Descriptive strings and true|false placeholders
    belong only to the template.
  properties:
    derived_under_policy:
      const: SPK-001
      title: Derived Under Policy
      type: string
      x-slot: data
    summary:
      $ref: '#/$defs/ResponseSummaryValue'
      x-slot: data
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          name:
            const: po035_derivation
          rows:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                prompt_id: &id002
                  type: string
                  minLength: 1
                  maxLength: 900
                status:
                  enum:
                  - PROPOSAL
                  - TYPED_REFUSAL
                derivation:
                  type: object
                  additionalProperties: false
                  properties:
                    claim: *id002
                    assumptions:
                      type: array
                      items: *id002
                      minItems: 1
                      maxItems: 12
                    steps:
                      type: array
                      items: *id002
                      minItems: 1
                      maxItems: 12
                    open_obligations:
                      type: array
                      items: *id002
                      minItems: 1
                      maxItems: 12
                    limitations:
                      type: array
                      items: *id002
                      minItems: 1
                      maxItems: 12
                  required:
                  - claim
                  - assumptions
                  - steps
                  - open_obligations
                  - limitations
                certificate:
                  anyOf:
                  - type: object
                    additionalProperties: false
                    properties:
                      l1_radius: &id003
                        type: string
                        maxLength: 100
                        pattern: ^-?(0|[1-9][0-9]*)(/[1-9][0-9]*)?$
                      euclidean_radius_squared: *id003
                      interval_before: *id003
                      interval_after: *id003
                      null_envelope: *id003
                      cone_order_preserved:
                        type: boolean
                    required:
                    - l1_radius
                    - euclidean_radius_squared
                    - interval_before
                    - interval_after
                    - null_envelope
                    - cone_order_preserved
                  - type: 'null'
                requested_lifts:
                  type: array
                  maxItems: 8
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id: *id002
                      reason: *id002
                    required:
                    - id
                    - reason
                learning:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      kind:
                        enum:
                        - skill
                        - antiskill
                        - rule
                        - pattern
                        - antibody
                      text: *id002
                      failure_or_gain: *id002
                    required:
                    - kind
                    - text
                    - failure_or_gain
                  minItems: 1
                  maxItems: 15
              required:
              - prompt_id
              - status
              - derivation
              - certificate
              - requested_lifts
              - learning
            minItems: 1
            maxItems: 1
        required:
        - name
        - rows
      minItems: 1
      maxItems: 1
    process_integrity:
      $ref: '#/$defs/ProcessIntegrityValue'
      x-slot: data
  required:
  - derived_under_policy
  - summary
  - process_integrity
  - sections
