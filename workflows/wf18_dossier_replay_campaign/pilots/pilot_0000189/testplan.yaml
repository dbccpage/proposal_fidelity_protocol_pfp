  shared_by_all_tests: true
seed:
  path: seed.yaml
  seed_prompt: 'Minimize sum_i weights_i*abs(flux_i-(matrix*potential)_i). Supply
    any rational potential and dual satisfying transpose(matrix)*dual=0 and abs(dual_i)<=weights_i,
    with equal primal objective and dot(flux,dual). Report that exact objective. A
    nonzero gap is not a certificate.

    {"kind": "lp", "matrix": [[-1, 1, 0], [0, -1, 1], [1, 0, -1]], "flux": ["2/3",
    "-1", "4/3"], "weights": ["2", "3", "1"]}'
