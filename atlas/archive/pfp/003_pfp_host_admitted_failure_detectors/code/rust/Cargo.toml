[package]
name = "pfp_host_detector"
version = "0.1.0"
edition = "2021"
authors = ["Jeremy H. Carroll"]
description = "Standalone host state machine, two-signal decision table, and candidate phrase detectors for PFP Paper 003"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[[bin]]
name = "solve_host_detector"
path = "src/bin/solve_host_detector.rs"

[lib]
name = "pfp_host_detector"
path = "src/lib.rs"
