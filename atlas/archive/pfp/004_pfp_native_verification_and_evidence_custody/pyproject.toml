[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfp-iv-native-verification-finite-evidence"
version = "0.1.0"
description = "Companion code for PFP IV: Native Verification and the Custody of Finite Evidence"
readme = "README.md"
authors = [{ name = "Jeremy H. Carroll" }]
license = { file = "LICENSE-CODE" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "ruff==0.14.13",
]
# Only code/attention_entropy_kv_norm_benchmark.py and its test use these.
attention = [
    "numpy>=1.24",
    "torch>=2.0",
    "transformers>=4.40",
    "httpx>=0.27",
]

[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["code"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
