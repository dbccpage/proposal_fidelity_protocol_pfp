[package]
name = "pfp-native-sidecar-host"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately isolated from the repository's broad Rust workspace.
[workspace]

[dependencies]
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.dev]
debug = 0
incremental = false
